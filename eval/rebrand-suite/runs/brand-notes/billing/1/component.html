<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F4EFE6; }
  #component {
    box-sizing: border-box;
    width: 1280px;
    min-height: 720px;
    margin: 0 auto;
    padding: 64px 80px;
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component h1,
  #component h2,
  #component h3 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 600;
    margin: 0;
  }
  #component h1 { font-size: 40px; line-height: 1.2; margin-bottom: 40px; }
  #component h2 { font-size: 24px; line-height: 1.3; margin-bottom: 24px; }
  #component h3 { font-size: 20px; line-height: 1.3; margin-bottom: 8px; }
  #component .plan {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px;
    margin-bottom: 56px;
    background: #FBF8F2;
    border: 1px solid #1E2B24;
    border-radius: 4px;
  }
  #component .plan p { margin: 0; }
  #component .plan .seats { margin-top: 8px; }
  #component .button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: #C2410C;
    border: 2px solid #C2410C;
    border-radius: 4px;
    padding: 12px 24px;
    cursor: pointer;
  }
  #component .button:focus-visible { outline: 3px solid #1E2B24; outline-offset: 2px; }
  #component table { width: 100%; border-collapse: collapse; }
  #component th,
  #component td {
    text-align: left;
    padding: 16px;
    border-bottom: 1px solid #1E2B24;
  }
  #component th { border-bottom-width: 2px; font-weight: 600; }
  #component td.amount,
  #component th.amount { text-align: right; }
</style>
</head>
<body>
<div id="component">
  <h1>Billing</h1>

  <section class="plan" aria-labelledby="plan-title">
    <div>
      <h2 id="plan-title" style="margin-bottom:8px">Team plan</h2>
      <p>$24 per seat per month</p>
      <p class="seats">18 of 25 seats used</p>
    </div>
    <button type="button" class="button">Change Plan</button>
  </section>

  <section aria-labelledby="invoices-title">
    <h2 id="invoices-title">Invoices</h2>
    <table>
      <thead>
        <tr>
          <th scope="col">Date</th>
          <th scope="col" class="amount">Amount</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Oct 1, 2026</td><td class="amount">$432.00</td><td>Paid</td></tr>
        <tr><td>Sep 1, 2026</td><td class="amount">$432.00</td><td>Paid</td></tr>
        <tr><td>Aug 1, 2026</td><td class="amount">$408.00</td><td>Paid</td></tr>
        <tr><td>Jul 1, 2026</td><td class="amount">$408.00</td><td>Paid</td></tr>
      </tbody>
    </table>
  </section>
</div>
</body>
</html>
