<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Billing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4EFE6; }
  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 72px 120px 96px;
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component h1,
  #component h2 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 600;
    margin: 0;
    color: #1E2B24;
  }
  #component h1 {
    font-size: 36px;
    line-height: 1.2;
    padding-bottom: 32px;
    margin-bottom: 40px;
    border-bottom: 1px solid rgba(30, 43, 36, 0.18);
  }
  #component h2 {
    font-size: 22px;
    line-height: 1.3;
    margin-bottom: 24px;
  }

  .plan {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 48px;
    padding: 36px 40px;
    margin-bottom: 56px;
    background: #FBF8F2;
    border: 1px solid rgba(30, 43, 36, 0.18);
    border-left: 4px solid #C2410C;
    border-radius: 4px;
  }
  .plan-info { flex: 1; }
  .plan-name {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.2;
    margin: 0 0 4px;
  }
  .plan-price {
    margin: 0 0 24px;
    font-size: 17px;
    color: #1E2B24;
  }
  .seats { max-width: 420px; }
  .seats-label {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 500;
  }
  .bar {
    height: 8px;
    border-radius: 4px;
    background: rgba(194, 65, 12, 0.16);
    overflow: hidden;
  }
  .bar span {
    display: block;
    width: 72%;
    height: 100%;
    border-radius: 4px;
    background: #C2410C;
  }
  .btn {
    appearance: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #FBF8F2;
    background: #C2410C;
    border: 2px solid #C2410C;
    border-radius: 4px;
    padding: 12px 24px;
    cursor: pointer;
  }
  .btn:hover { background: #9A3412; border-color: #9A3412; }
  .btn:focus-visible { outline: 3px solid #1E2B24; outline-offset: 3px; }

  .invoices {
    background: #FBF8F2;
    border: 1px solid rgba(30, 43, 36, 0.18);
    border-radius: 4px;
    padding: 32px 40px 16px;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 16px 0; text-align: left; }
  th {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #1E2B24;
    border-bottom: 2px solid #1E2B24;
  }
  td { border-bottom: 1px solid rgba(30, 43, 36, 0.14); font-size: 16px; }
  tr:last-child td { border-bottom: 0; }
  th:nth-child(2), td:nth-child(2) { text-align: right; padding-right: 96px; width: 30%; font-variant-numeric: tabular-nums; }
  th:nth-child(3), td:nth-child(3) { width: 25%; }
  .status {
    display: inline-block;
    padding: 2px 12px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    color: #1E2B24;
    background: rgba(194, 65, 12, 0.1);
    border: 1px solid #C2410C;
  }
</style>
</head>
<body>
<div id="component">
  <h1>Billing</h1>

  <section class="plan" aria-label="Current plan">
    <div class="plan-info">
      <p class="plan-name">Team plan</p>
      <p class="plan-price">$24 per seat per month</p>
      <div class="seats">
        <p class="seats-label">18 of 25 seats used</p>
        <div class="bar" role="presentation"><span></span></div>
      </div>
    </div>
    <button class="btn" type="button">Change Plan</button>
  </section>

  <section class="invoices" aria-labelledby="invoices-title">
    <h2 id="invoices-title">Invoices</h2>
    <table>
      <thead>
        <tr><th scope="col">Date</th><th scope="col">Amount</th><th scope="col">Status</th></tr>
      </thead>
      <tbody>
        <tr><td>Oct 1, 2026</td><td>$432.00</td><td><span class="status">Paid</span></td></tr>
        <tr><td>Sep 1, 2026</td><td>$432.00</td><td><span class="status">Paid</span></td></tr>
        <tr><td>Aug 1, 2026</td><td>$408.00</td><td><span class="status">Paid</span></td></tr>
        <tr><td>Jul 1, 2026</td><td>$408.00</td><td><span class="status">Paid</span></td></tr>
      </tbody>
    </table>
  </section>
</div>
</body>
</html>
