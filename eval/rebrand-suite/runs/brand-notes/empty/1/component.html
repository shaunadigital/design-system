<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests · Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 96px 96px 120px;
    background: #F4EFE6;
    display: flex;
    flex-direction: column;
  }

  .page-heading {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.2;
    padding-bottom: 32px;
    border-bottom: 1px solid rgba(30, 43, 36, 0.16);
  }

  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-top: 112px;
  }

  .mark {
    width: 72px;
    height: 72px;
    margin-bottom: 40px;
  }

  .empty-title {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 24px;
    line-height: 1.3;
  }

  .empty-text {
    margin-top: 16px;
    max-width: 360px;
    font-size: 17px;
    line-height: 1.6;
    color: #1E2B24;
  }

  .actions {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .button {
    display: inline-block;
    padding: 16px 32px;
    background: #C2410C;
    color: #FBF8F2;
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.01em;
    text-decoration: none;
    border-radius: 4px;
  }
  .button:hover { background: #9A3412; }
  .button:focus-visible,
  .link:focus-visible {
    outline: 3px solid #C2410C;
    outline-offset: 4px;
  }

  .link {
    color: #C2410C;
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 5px;
  }
  .link:hover { text-decoration-thickness: 2px; }
</style>
</head>
<body>
  <div id="component">
    <h1 class="page-heading">Requests</h1>

    <main class="empty">
      <svg class="mark" viewBox="0 0 72 72" fill="none" aria-hidden="true">
        <circle cx="36" cy="36" r="35" stroke="#1E2B24" stroke-opacity="0.16"/>
        <path d="M20 38h9l3 5h8l3-5h9" stroke="#C2410C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 38l5-12h22l5 12v10a2 2 0 0 1-2 2H22a2 2 0 0 1-2-2V38z" stroke="#C2410C" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>

      <h2 class="empty-title">No requests yet</h2>
      <p class="empty-text">When your team asks for something, it shows up here.</p>

      <div class="actions">
        <a class="button" href="#">Create a Request</a>
        <a class="link" href="#">Import from a spreadsheet</a>
      </div>
    </main>
  </div>
</body>
</html>
