<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; }
  #component {
    width: 1280px;
    min-height: 720px;
    margin: 0 auto;
    padding: 24px 32px;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }
  #component h1 {
    margin: 0;
    padding-bottom: 12px;
    border-bottom: 1px solid #0B1416;
    font-family: "Unbounded", "Archivo", Arial, sans-serif;
    font-weight: 300;
    font-size: 20px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  #component .empty {
    max-width: 420px;
    margin: 120px auto 0;
    text-align: center;
  }
  #component h2 {
    margin: 0 0 6px;
    font-family: "Unbounded", "Archivo", Arial, sans-serif;
    font-weight: 300;
    font-size: 16px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  #component p { margin: 0 0 20px; font-size: 14px; }
  #component .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #component .btn {
    display: inline-block;
    padding: 9px 18px;
    background: #0263AC;
    color: #fff;
    border: 2px solid #0263AC;
    border-radius: 4px;
    font: inherit;
    font-weight: 600;
    text-decoration: none;
  }
  #component .btn:focus-visible,
  #component a.link:focus-visible { outline: 3px solid #0B1416; outline-offset: 2px; }
  #component a.link { color: #0263AC; text-decoration: underline; }
</style>
</head>
<body>
<div id="component">
  <h1>Requests</h1>
  <main class="empty">
    <h2>No requests yet</h2>
    <p>When your team asks for something, it shows up here.</p>
    <div class="actions">
      <a class="btn" href="#">Create a Request</a>
      <a class="link" href="#">Import from a spreadsheet</a>
    </div>
  </main>
</div>
</body>
</html>
