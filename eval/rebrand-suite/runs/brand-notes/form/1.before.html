<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New request – Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --line: rgba(11, 20, 22, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }

  #component {
    width: 1280px;
    min-height: 900px;
    margin: 0 auto;
    padding: 56px 80px 120px;
    background: #fff;
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 40px;
  }
  .brand {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }

  .page {
    width: 640px;
    margin: 104px auto 0;
  }

  h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 40px;
    line-height: 1.15;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .rule {
    width: 48px;
    height: 2px;
    background: var(--accent);
    margin: 32px 0 0;
  }

  form { margin: 56px 0 0; }

  .field { margin: 0 0 36px; }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }

  label {
    display: block;
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink);
  }

  input, select, textarea {
    display: block;
    width: 100%;
    margin: 0;
    padding: 0 16px;
    height: 52px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  textarea {
    height: 160px;
    padding: 14px 16px;
    resize: none;
    line-height: 1.6;
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 44px;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--ink) 50%),
      linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 22px) 22px, calc(100% - 16px) 22px;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
  }
  input:hover, select:hover, textarea:hover { border-color: rgba(11, 20, 22, 0.4); }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(2, 99, 172, 0.2);
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 16px;
    margin-top: 56px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
  }
  button {
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    height: 52px;
    padding: 0 32px;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-secondary {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-secondary:hover { border-color: var(--ink); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
  }
  .btn-primary:hover { background: #02548f; border-color: #02548f; }
  button:focus-visible {
    outline: 3px solid rgba(2, 99, 172, 0.35);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="component">
  <header class="topbar">
    <div class="brand">Harbor</div>
  </header>

  <main class="page">
    <h1>New request</h1>
    <div class="rule"></div>

    <form action="#">
      <div class="field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text">
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description"></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
        </div>
        <div class="field">
          <label for="assignee">Assignee</label>
          <select id="assignee" name="assignee">
            <option>Maya Chen</option>
            <option>Leo Park</option>
            <option>Ana Ruiz</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="due">Due date</label>
        <input id="due" name="due" type="date">
      </div>

      <div class="actions">
        <button type="button" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Create Request</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
