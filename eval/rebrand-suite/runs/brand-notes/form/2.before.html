<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor – New request</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #0B1416; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; line-height: 1.4; }
  #component { width: 1280px; min-height: 720px; margin: 0; background: #fff; }
  .topbar { display: flex; align-items: center; height: 44px; padding: 0 32px; border-bottom: 1px solid #0B1416; }
  .brand { font-family: Unbounded, "Archivo", Arial, sans-serif; font-weight: 300; text-transform: uppercase; letter-spacing: 0.08em; font-size: 14px; color: #0263AC; }
  main { width: 720px; margin: 0 0 0 32px; padding: 24px 0 32px; }
  h1 { margin: 0 0 20px; font-family: Unbounded, "Archivo", Arial, sans-serif; font-weight: 300; text-transform: uppercase; letter-spacing: 0.04em; font-size: 22px; line-height: 1.2; }
  form { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .wide { grid-column: 1 / -1; }
  label { font-size: 13px; font-weight: 600; }
  input, select, textarea { width: 100%; height: 34px; padding: 6px 10px; font: inherit; color: #0B1416; background: #fff; border: 1px solid #0B1416; border-radius: 2px; }
  textarea { height: 96px; resize: none; }
  input:focus, select:focus, textarea:focus, button:focus { outline: 2px solid #0263AC; outline-offset: 1px; }
  .actions { grid-column: 1 / -1; display: flex; gap: 10px; padding-top: 14px; margin-top: 2px; border-top: 1px solid #0B1416; }
  button { height: 36px; padding: 0 18px; font: inherit; font-weight: 600; border-radius: 2px; border: 1px solid #0263AC; cursor: pointer; }
  .primary { background: #0263AC; color: #fff; }
  .secondary { background: #fff; color: #0263AC; }
</style>
</head>
<body>
<div id="component">
  <header class="topbar"><span class="brand">Harbor</span></header>
  <main>
    <h1>New request</h1>
    <form action="#" onsubmit="return false">
      <div class="field wide">
        <label for="title">Title</label>
        <input id="title" type="text">
      </div>
      <div class="field wide">
        <label for="description">Description</label>
        <textarea id="description"></textarea>
      </div>
      <div class="field">
        <label for="priority">Priority</label>
        <select id="priority">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
      </div>
      <div class="field">
        <label for="assignee">Assignee</label>
        <select id="assignee">
          <option>Maya Chen</option>
          <option>Leo Park</option>
          <option>Ana Ruiz</option>
        </select>
      </div>
      <div class="field">
        <label for="due">Due date</label>
        <input id="due" type="date">
      </div>
      <div class="actions">
        <button type="button" class="secondary">Cancel</button>
        <button type="submit" class="primary">Create Request</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
