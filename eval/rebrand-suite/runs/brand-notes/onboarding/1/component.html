<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor – Connect your tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Instrument+Sans:wght@400;600&display=swap");
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4EFE6; }
  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 96px 0 64px;
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component .wrap { width: 640px; margin: 0 auto; }
  #component .progress {
    margin: 0 0 16px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #C2410C;
  }
  #component h1 {
    margin: 0 0 16px;
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.25;
  }
  #component .intro { margin: 0 0 40px; font-size: 18px; }
  #component ul { list-style: none; margin: 0 0 40px; padding: 0; border-top: 1px solid #1E2B24; }
  #component li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 24px 0;
    border-bottom: 1px solid #1E2B24;
  }
  #component h2 { margin: 0 0 4px; font-family: "Fraunces", Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 600; }
  #component li p { margin: 0; }
  #component button {
    font: inherit;
    font-weight: 600;
    padding: 10px 24px;
    border-radius: 4px;
    border: 2px solid #C2410C;
    cursor: pointer;
  }
  #component .connect { background: #FBF8F2; color: #C2410C; }
  #component .actions { display: flex; justify-content: space-between; }
  #component .skip { background: #FBF8F2; color: #1E2B24; border-color: #1E2B24; }
  #component .continue { background: #C2410C; color: #FBF8F2; }
  #component button:focus-visible { outline: 3px solid #1E2B24; outline-offset: 2px; }
</style>
</head>
<body>
<div id="component">
  <div class="wrap">
    <p class="progress">Step 2 of 4</p>
    <h1>Connect your tools</h1>
    <p class="intro">Harbor works best with the tools your team already uses.</p>
    <ul>
      <li>
        <div>
          <h2>Slack</h2>
          <p>Get request updates in your channels</p>
        </div>
        <button type="button" class="connect">Connect</button>
      </li>
      <li>
        <div>
          <h2>Google Calendar</h2>
          <p>See due dates on your calendar</p>
        </div>
        <button type="button" class="connect">Connect</button>
      </li>
      <li>
        <div>
          <h2>Jira</h2>
          <p>Link requests to engineering tickets</p>
        </div>
        <button type="button" class="connect">Connect</button>
      </li>
    </ul>
    <div class="actions">
      <button type="button" class="skip">Skip for Now</button>
      <button type="button" class="continue">Continue</button>
    </div>
  </div>
</div>
</body>
</html>
