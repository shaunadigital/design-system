<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace settings</title>
<style>
  body { margin: 0; background: #fff; }
  #component {
    width: 1280px;
    box-sizing: border-box;
    margin: 0 auto;
    padding: 64px 160px 96px;
    background: #fff;
    color: #0B1416;
    font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component h1, #component h2 {
    font-family: Unbounded, "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    text-transform: uppercase;
    margin: 0;
  }
  #component h1 { font-size: 36px; line-height: 1.2; margin-bottom: 48px; }
  #component h2 { font-size: 20px; margin-bottom: 24px; }
  #component section { padding: 32px 0; border-top: 1px solid #0B1416; }
  #component .field { margin-bottom: 20px; max-width: 480px; }
  #component label.text { display: block; font-weight: 600; margin-bottom: 6px; }
  #component input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    font: inherit;
    color: #0B1416;
    background: #fff;
    border: 1px solid #0B1416;
    border-radius: 4px;
  }
  #component button {
    font: inherit;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    border: 2px solid #0263AC;
  }
  #component .primary { background: #0263AC; color: #fff; }
  #component .danger { background: #fff; color: #0263AC; }
  #component .switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 640px;
    padding: 14px 0;
    border-bottom: 1px solid #d5dadc;
    cursor: pointer;
  }
  #component .switch input {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 44px;
    height: 24px;
    margin: 0 0 0 24px;
    border-radius: 12px;
    background: #fff;
    border: 2px solid #0B1416;
    position: relative;
    cursor: pointer;
  }
  #component .switch input::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #0B1416;
  }
  #component .switch input:checked { background: #0263AC; border-color: #0263AC; }
  #component .switch input:checked::after { left: 22px; background: #fff; }
  #component button:focus-visible, #component input:focus-visible {
    outline: 3px solid #0263AC;
    outline-offset: 2px;
  }
  #component p { margin: 0 0 20px; }
</style>
</head>
<body>
<div id="component">
  <h1>Workspace settings</h1>

  <section>
    <h2>General</h2>
    <div class="field">
      <label class="text" for="ws-name">Workspace name</label>
      <input type="text" id="ws-name" value="Harbor Ops">
    </div>
    <div class="field">
      <label class="text" for="ws-url">Workspace URL</label>
      <input type="text" id="ws-url" value="harbor.app/ops">
    </div>
    <button type="button" class="primary">Save Changes</button>
  </section>

  <section>
    <h2>Notifications</h2>
    <label class="switch">
      <span>Email me when a request is assigned to me</span>
      <input type="checkbox" role="switch">
    </label>
    <label class="switch">
      <span>Weekly summary</span>
      <input type="checkbox" role="switch">
    </label>
    <label class="switch">
      <span>Product updates</span>
      <input type="checkbox" role="switch">
    </label>
  </section>

  <section>
    <h2>Danger zone</h2>
    <p>Deleting a workspace removes all of its requests for everyone.</p>
    <button type="button" class="danger">Delete Workspace</button>
  </section>
</div>
</body>
</html>
