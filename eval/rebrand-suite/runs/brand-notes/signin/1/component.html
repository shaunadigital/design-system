<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Harbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4EFE6; }
  #component {
    width: 1280px;
    min-height: 800px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component form {
    width: 464px;
    padding: 32px;
    background: #FBF8F2;
    border: 1px solid #1E2B24;
    border-radius: 4px;
  }
  #component h1 {
    margin: 0 0 32px;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.25;
  }
  #component .field { margin-bottom: 20px; }
  #component label { display: block; margin-bottom: 6px; font-weight: 500; }
  #component input[type="email"],
  #component input[type="password"] {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border: 1px solid #1E2B24;
    border-radius: 4px;
    background: #F4EFE6;
    color: #1E2B24;
    font: inherit;
  }
  #component .check { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  #component .check label { margin: 0; font-weight: 400; }
  #component .check input { width: 20px; height: 20px; margin: 0; accent-color: #C2410C; }
  #component button {
    display: block;
    width: 100%;
    height: 48px;
    border-radius: 4px;
    border: 2px solid #C2410C;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #component .primary { background: #C2410C; color: #FBF8F2; margin-bottom: 12px; }
  #component .secondary { background: #FBF8F2; color: #C2410C; }
  #component .forgot { margin: 24px 0 0; text-align: center; }
  #component a { color: #C2410C; text-decoration: underline; }
  #component input:focus-visible,
  #component button:focus-visible,
  #component a:focus-visible { outline: 3px solid #1E2B24; outline-offset: 2px; }
</style>
</head>
<body>
<div id="component">
  <form action="#" method="post">
    <h1>Sign in to Harbor</h1>
    <div class="field">
      <label for="email">Work email</label>
      <input type="email" id="email" name="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
    </div>
    <div class="check">
      <input type="checkbox" id="keep" name="keep">
      <label for="keep">Keep me signed in</label>
    </div>
    <button type="submit" class="primary">Sign In</button>
    <button type="button" class="secondary">Continue with SSO</button>
    <p class="forgot"><a href="#">Forgot Password?</a></p>
  </form>
</div>
</body>
</html>
