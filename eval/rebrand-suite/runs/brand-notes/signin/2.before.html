<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Harbor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }

  #component {
    --ink: #0B1416;
    --accent: #0263AC;
    --line: #D5DBDD;
    width: 1280px;
    min-height: 800px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(640px 420px at 85% 0%, rgba(2, 99, 172, 0.08), transparent 70%),
      radial-gradient(520px 380px at 0% 100%, rgba(2, 99, 172, 0.05), transparent 70%),
      #fff;
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component .card {
    width: 440px;
    padding: 48px 44px 40px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(11, 20, 22, 0.04), 0 24px 48px -16px rgba(11, 20, 22, 0.14);
  }

  #component .mark {
    width: 40px;
    height: 40px;
    margin-bottom: 28px;
    border-radius: 10px;
    background: var(--accent);
    position: relative;
  }
  #component .mark::before,
  #component .mark::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    height: 3px;
    border-radius: 2px;
    background: #fff;
  }
  #component .mark::before { top: 16px; }
  #component .mark::after { top: 23px; opacity: 0.6; }

  #component h1 {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 24px;
    line-height: 1.25;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  #component .field { margin-bottom: 20px; }
  #component label.label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
  }
  #component input[type="email"],
  #component input[type="password"] {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border: 1px solid #8A9598;
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #component input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(2, 99, 172, 0.25);
  }

  #component .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 0 28px;
    font-size: 14px;
  }
  #component .check {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  #component .check input {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
  }
  #component a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-radius: 4px;
  }
  #component a:hover { text-decoration: underline; }
  #component a:focus-visible,
  #component button:focus-visible,
  #component .check input:focus-visible {
    outline: 3px solid rgba(2, 99, 172, 0.45);
    outline-offset: 2px;
  }

  #component button {
    display: block;
    width: 100%;
    height: 48px;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  #component .primary {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    box-shadow: 0 1px 2px rgba(2, 99, 172, 0.3);
  }
  #component .primary:hover { background: #02548F; }
  #component .secondary {
    border: 1px solid #8A9598;
    background: #fff;
    color: var(--ink);
  }
  #component .secondary:hover { background: #F3F6F7; border-color: var(--ink); }

  #component .divider {
    margin: 20px 0;
    height: 1px;
    background: var(--line);
  }
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>Sign in to Harbor</h1>
    <form action="#">
      <div class="field">
        <label class="label" for="email">Work email</label>
        <input id="email" type="email" name="email" autocomplete="email">
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password">
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" name="remember"> Keep me signed in</label>
        <a href="#">Forgot Password?</a>
      </div>
      <button type="submit" class="primary">Sign In</button>
      <div class="divider" aria-hidden="true"></div>
      <button type="button" class="secondary">Continue with SSO</button>
    </form>
  </main>
</div>
</body>
</html>
