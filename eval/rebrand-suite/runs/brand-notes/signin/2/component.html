<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Harbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F4EFE6; }

  #component {
    --ink: #1E2B24;
    --accent: #C2410C;
    --line: #DDD5C5;
    --control: #6F7A70;
    --card: #FBF8F2;
    width: 1280px;
    min-height: 800px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F4EFE6;
    color: var(--ink);
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component .card {
    width: 440px;
    padding: 48px 44px 40px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  #component .mark {
    width: 40px;
    height: 40px;
    margin-bottom: 28px;
    border-radius: 4px;
    background: var(--accent);
    position: relative;
  }
  #component .mark::before,
  #component .mark::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    height: 3px;
    border-radius: 2px;
    background: var(--card);
  }
  #component .mark::before { top: 16px; }
  #component .mark::after { top: 23px; opacity: 0.6; }

  #component h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.25;
    margin-bottom: 32px;
  }

  #component .field { margin-bottom: 20px; }
  #component label.label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
  }
  #component input[type="email"],
  #component input[type="password"] {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border: 1px solid var(--control);
    border-radius: 4px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #component input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.3);
  }

  #component .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 0 28px;
    font-size: 14px;
  }
  #component .check {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  #component .check input {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
  }
  #component a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-radius: 4px;
  }
  #component a:hover { text-decoration: underline; }
  #component a:focus-visible,
  #component button:focus-visible,
  #component .check input:focus-visible {
    outline: 3px solid rgba(194, 65, 12, 0.55);
    outline-offset: 2px;
  }

  #component button {
    display: block;
    width: 100%;
    height: 48px;
    border-radius: 4px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  #component .primary {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--card);
  }
  #component .primary:hover { background: #9A3409; border-color: #9A3409; }
  #component .secondary {
    border: 1px solid var(--control);
    background: var(--card);
    color: var(--ink);
  }
  #component .secondary:hover { background: #F4EFE6; border-color: var(--ink); }

  #component .divider {
    margin: 20px 0;
    height: 1px;
    background: var(--line);
  }
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>Sign in to Harbor</h1>
    <form action="#">
      <div class="field">
        <label class="label" for="email">Work email</label>
        <input id="email" type="email" name="email" autocomplete="email">
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password">
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" name="remember"> Keep me signed in</label>
        <a href="#">Forgot Password?</a>
      </div>
      <button type="submit" class="primary">Sign In</button>
      <div class="divider" aria-hidden="true"></div>
      <button type="button" class="secondary">Continue with SSO</button>
    </form>
  </main>
</div>
</body>
</html>
