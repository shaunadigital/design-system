<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team</title>
<meta name="viewport" content="width=1280">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F4EFE6; }
  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding: 120px 160px 160px;
  }
  #component .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 48px;
    border-bottom: 1px solid #1E2B24;
  }
  #component h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: 44px;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  #component .invite {
    appearance: none;
    border: 2px solid #C2410C;
    background: #C2410C;
    color: #fff;
    font: 600 16px/1 "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    padding: 18px 32px;
    border-radius: 4px;
    cursor: pointer;
  }
  #component .invite:focus-visible,
  #component select:focus-visible {
    outline: 3px solid #C2410C;
    outline-offset: 3px;
  }
  #component ul { list-style: none; }
  #component li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 36px 0;
    border-bottom: 1px solid #D9D0BF;
  }
  #component .person { display: flex; flex-direction: column; gap: 4px; }
  #component .name { font-size: 20px; font-weight: 600; line-height: 1.3; }
  #component .email { font-size: 16px; color: #4A5A50; }
  #component .role { position: relative; width: 168px; }
  #component .role::after {
    content: "";
    position: absolute;
    right: 20px;
    top: 50%;
    width: 8px;
    height: 8px;
    margin-top: -6px;
    border-right: 2px solid #C2410C;
    border-bottom: 2px solid #C2410C;
    transform: rotate(45deg);
    pointer-events: none;
  }
  #component select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    background: #FBF8F2;
    color: #1E2B24;
    font: 500 16px/1.2 "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    padding: 14px 44px 14px 20px;
    border: 1px solid #77857C;
    border-radius: 4px;
    cursor: pointer;
  }
  #component select:hover { border-color: #C2410C; }
  #component .sr {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="component">
  <header class="header">
    <h1>Team</h1>
    <button class="invite" type="button">Invite Member</button>
  </header>

  <ul>
    <li>
      <div class="person">
        <span class="name">Maya Chen</span>
        <span class="email">maya@harbor.app</span>
      </div>
      <div class="role">
        <label class="sr" for="r1">Role for Maya Chen</label>
        <select id="r1">
          <option selected>Admin</option>
          <option>Editor</option>
          <option>Viewer</option>
        </select>
      </div>
    </li>
    <li>
      <div class="person">
        <span class="name">Leo Park</span>
        <span class="email">leo@harbor.app</span>
      </div>
      <div class="role">
        <label class="sr" for="r2">Role for Leo Park</label>
        <select id="r2">
          <option>Admin</option>
          <option selected>Editor</option>
          <option>Viewer</option>
        </select>
      </div>
    </li>
    <li>
      <div class="person">
        <span class="name">Ana Ruiz</span>
        <span class="email">ana@harbor.app</span>
      </div>
      <div class="role">
        <label class="sr" for="r3">Role for Ana Ruiz</label>
        <select id="r3">
          <option>Admin</option>
          <option selected>Editor</option>
          <option>Viewer</option>
        </select>
      </div>
    </li>
    <li>
      <div class="person">
        <span class="name">Sam Ito</span>
        <span class="email">sam@harbor.app</span>
      </div>
      <div class="role">
        <label class="sr" for="r4">Role for Sam Ito</label>
        <select id="r4">
          <option>Admin</option>
          <option>Editor</option>
          <option selected>Viewer</option>
        </select>
      </div>
    </li>
    <li>
      <div class="person">
        <span class="name">Kai Lee</span>
        <span class="email">kai@harbor.app</span>
      </div>
      <div class="role">
        <label class="sr" for="r5">Role for Kai Lee</label>
        <select id="r5">
          <option>Admin</option>
          <option>Editor</option>
          <option selected>Viewer</option>
        </select>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
