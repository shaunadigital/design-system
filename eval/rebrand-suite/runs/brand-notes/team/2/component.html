<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }
  #component {
    width: 1280px;
    margin: 0 auto;
    padding: 32px 40px;
    background: #FBF8F2;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 2px solid #1E2B24;
  }
  h1 {
    margin: 0;
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: 28px;
  }
  .invite {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: #C2410C;
    border: 2px solid #C2410C;
    border-radius: 4px;
    padding: 8px 18px;
    cursor: pointer;
  }
  .invite:focus-visible, select:focus-visible {
    outline: 3px solid #1E2B24;
    outline-offset: 2px;
  }
  ul.members { list-style: none; margin: 0; padding: 0; }
  .cols, .member {
    display: grid;
    grid-template-columns: 280px 1fr 180px;
    align-items: center;
    column-gap: 24px;
    padding: 0 8px;
  }
  .cols {
    padding-top: 12px;
    padding-bottom: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid #1E2B24;
  }
  .member {
    height: 48px;
    border-bottom: 1px solid #E3DACB;
  }
  .member:hover { background: #F4EFE6; }
  .name { font-weight: 600; }
  .email { color: #1E2B24; }
  select {
    font: inherit;
    color: #1E2B24;
    background: #FBF8F2;
    border: 1px solid #1E2B24;
    border-radius: 4px;
    padding: 6px 8px;
    width: 140px;
  }
</style>
</head>
<body>
<div id="component">
  <div class="header">
    <h1>Team</h1>
    <button class="invite" type="button">Invite Member</button>
  </div>
  <div class="cols" aria-hidden="true"><span>Name</span><span>Email</span><span>Role</span></div>
  <ul class="members">
    <li class="member">
      <span class="name">Maya Chen</span>
      <span class="email">maya@harbor.app</span>
      <select aria-label="Role for Maya Chen"><option selected>Admin</option><option>Editor</option><option>Viewer</option></select>
    </li>
    <li class="member">
      <span class="name">Leo Park</span>
      <span class="email">leo@harbor.app</span>
      <select aria-label="Role for Leo Park"><option>Admin</option><option selected>Editor</option><option>Viewer</option></select>
    </li>
    <li class="member">
      <span class="name">Ana Ruiz</span>
      <span class="email">ana@harbor.app</span>
      <select aria-label="Role for Ana Ruiz"><option>Admin</option><option selected>Editor</option><option>Viewer</option></select>
    </li>
    <li class="member">
      <span class="name">Sam Ito</span>
      <span class="email">sam@harbor.app</span>
      <select aria-label="Role for Sam Ito"><option>Admin</option><option>Editor</option><option selected>Viewer</option></select>
    </li>
    <li class="member">
      <span class="name">Kai Lee</span>
      <span class="email">kai@harbor.app</span>
      <select aria-label="Role for Kai Lee"><option>Admin</option><option>Editor</option><option selected>Viewer</option></select>
    </li>
  </ul>
</div>
</body>
</html>
