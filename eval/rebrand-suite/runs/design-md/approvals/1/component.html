<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approvals | Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F4EFE6; }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 96px 64px;
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component .head { margin-bottom: 64px; }
  #component h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: #1E2B24;
  }
  #component .count {
    margin-top: 16px;
    font-size: 22px;
    line-height: 1.4;
    color: #5E6B63;
  }

  #component ul { list-style: none; display: flex; flex-direction: column; gap: 24px; }

  #component .card {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    column-gap: 64px;
    padding: 32px 48px;
    background: #FBF8F2;
    border: 1px solid #E9E1D2;
    border-radius: 6px;
  }

  #component .label {
    font-weight: 500;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #C2410C;
  }
  #component h2 {
    margin: 8px 0 4px;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  #component .who { font-size: 16px; color: #5E6B63; }
  #component .who span { color: #1E2B24; }

  #component .amount { text-align: right; min-width: 144px; }
  #component .amount .value {
    margin-top: 4px;
    font-size: 32px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  #component .actions { display: flex; align-items: center; gap: 12px; }
  #component .btn {
    min-height: 44px;
    padding: 8px 32px;
    border: 1px solid transparent;
    border-radius: 4px;
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn-primary { background: #1E2B24; color: #FBF8F2; }
  #component .btn-primary:hover { background: #C2410C; }
  #component .btn-quiet { background: transparent; color: #1E2B24; }
  #component .btn-quiet:hover { background: #F6DFD0; }
  #component .btn:focus-visible { outline: 2px solid #C2410C; outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    #component .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <header class="head">
    <h1>Approvals</h1>
    <p class="count">3 waiting for you</p>
  </header>

  <ul>
    <li class="card">
      <div>
        <p class="label">Requested by</p>
        <h2>Q4 travel budget</h2>
        <p class="who">Leo Park</p>
      </div>
      <div class="amount">
        <p class="label">Amount</p>
        <p class="value">$4,800</p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="button">Approve</button>
        <button class="btn btn-quiet" type="button">Decline</button>
      </div>
    </li>

    <li class="card">
      <div>
        <p class="label">Requested by</p>
        <h2>Design conference tickets</h2>
        <p class="who">Maya Chen</p>
      </div>
      <div class="amount">
        <p class="label">Amount</p>
        <p class="value">$1,250</p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="button">Approve</button>
        <button class="btn btn-quiet" type="button">Decline</button>
      </div>
    </li>

    <li class="card">
      <div>
        <p class="label">Requested by</p>
        <h2>Standing desks for support</h2>
        <p class="who">Ana Ruiz</p>
      </div>
      <div class="amount">
        <p class="label">Amount</p>
        <p class="value">$2,100</p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="button">Approve</button>
        <button class="btn btn-quiet" type="button">Decline</button>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
