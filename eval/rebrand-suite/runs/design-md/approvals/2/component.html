<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approvals</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F4EFE6; color: #1E2B24; font-family: "Instrument Sans", system-ui, sans-serif; font-size: 16px; }
  #component { width: 1280px; min-height: 720px; padding: 64px; background: #F4EFE6; }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 56px;
    letter-spacing: -0.02em; line-height: 1.1;
  }
  .count { margin-top: 8px; font-size: 18px; color: #5E6B63; }
  ul { list-style: none; margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
  .item {
    display: grid; grid-template-columns: 1fr 200px 120px auto; align-items: center; column-gap: 32px;
    padding: 16px 24px; background: #FBF8F2; border: 1px solid #E9E1D2; border-radius: 6px;
  }
  .title { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 18px; line-height: 1.3; }
  .requester { font-size: 16px; color: #5E6B63; }
  .amount { font-size: 22px; font-weight: 600; text-align: right; letter-spacing: -0.01em; }
  .actions { display: flex; gap: 8px; }
  .btn {
    min-height: 44px; padding: 0 24px; border-radius: 4px; border: 1px solid transparent;
    font-family: "Instrument Sans", system-ui, sans-serif; font-size: 16px; font-weight: 500; cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .primary { background: #1E2B24; color: #FBF8F2; }
  .primary:hover { background: #C2410C; }
  .quiet { background: transparent; color: #1E2B24; }
  .quiet:hover { background: #F6DFD0; border-color: #E8A989; }
  .btn:focus-visible { outline: 2px solid #C2410C; outline-offset: 2px; }
</style>
</head>
<body>
<div id="component">
  <h1>Approvals</h1>
  <p class="count">3 waiting for you</p>
  <ul>
    <li class="item">
      <span class="title">Q4 travel budget</span>
      <span class="requester">Leo Park</span>
      <span class="amount">$4,800</span>
      <span class="actions">
        <button class="btn primary" type="button">Approve</button>
        <button class="btn quiet" type="button">Decline</button>
      </span>
    </li>
    <li class="item">
      <span class="title">Design conference tickets</span>
      <span class="requester">Maya Chen</span>
      <span class="amount">$1,250</span>
      <span class="actions">
        <button class="btn primary" type="button">Approve</button>
        <button class="btn quiet" type="button">Decline</button>
      </span>
    </li>
    <li class="item">
      <span class="title">Standing desks for support</span>
      <span class="requester">Ana Ruiz</span>
      <span class="amount">$2,100</span>
      <span class="actions">
        <button class="btn primary" type="button">Approve</button>
        <button class="btn quiet" type="button">Decline</button>
      </span>
    </li>
  </ul>
</div>
</body>
</html>
