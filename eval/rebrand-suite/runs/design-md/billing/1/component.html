<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Billing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #F4EFE6; color: #1E2B24; font-family: "Instrument Sans", Arial, sans-serif; font-size: 16px; }
  #component { width: 1280px; padding: 64px; background: #F4EFE6; color: #1E2B24; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 56px; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 48px; }
  h2 { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.2; letter-spacing: -0.01em; }
  .card { background: #FBF8F2; border: 1px solid #E9E1D2; border-radius: 6px; padding: 32px; }
  .plan { display: flex; justify-content: space-between; align-items: center; gap: 32px; margin-bottom: 48px; }
  .plan p { color: #5E6B63; font-size: 16px; line-height: 1.5; }
  .plan .price { color: #1E2B24; font-size: 18px; margin-top: 8px; }
  .meter { width: 320px; height: 8px; background: #E9E1D2; border-radius: 4px; margin-top: 16px; overflow: hidden; }
  .meter span { display: block; width: 72%; height: 100%; background: #C2410C; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 32px; border: 0; border-radius: 4px; background: #1E2B24; color: #FBF8F2; font-family: "Instrument Sans", Arial, sans-serif; font-size: 16px; cursor: pointer; transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .btn:hover { background: #C2410C; }
  .btn:focus-visible { outline: 2px solid #C2410C; outline-offset: 2px; }
  .invoices h2 { margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 16px; border-bottom: 1px solid #E9E1D2; font-size: 16px; }
  th { font-weight: 500; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #5E6B63; }
  th.num, td.num { text-align: right; }
  tbody tr:last-child td { border-bottom: 0; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main id="component">
  <h1>Billing</h1>

  <section class="card plan" aria-labelledby="plan-title">
    <div>
      <h2 id="plan-title">Team plan</h2>
      <p class="price">$24 per seat per month</p>
      <p>18 of 25 seats used</p>
      <div class="meter" role="img" aria-label="18 of 25 seats used"><span></span></div>
    </div>
    <button class="btn" type="button">Change Plan</button>
  </section>

  <section class="card invoices" aria-labelledby="invoices-title">
    <h2 id="invoices-title">Invoices</h2>
    <table>
      <thead>
        <tr><th scope="col">Date</th><th scope="col" class="num">Amount</th><th scope="col">Status</th></tr>
      </thead>
      <tbody>
        <tr><td>Oct 1, 2026</td><td class="num">$432.00</td><td>Paid</td></tr>
        <tr><td>Sep 1, 2026</td><td class="num">$432.00</td><td>Paid</td></tr>
        <tr><td>Aug 1, 2026</td><td class="num">$408.00</td><td>Paid</td></tr>
        <tr><td>Jul 1, 2026</td><td class="num">$408.00</td><td>Paid</td></tr>
      </tbody>
    </table>
  </section>
</main>
</body>
</html>
