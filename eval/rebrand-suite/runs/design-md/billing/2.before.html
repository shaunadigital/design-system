<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Billing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 800px;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component h1 {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin-bottom: 48px;
  }

  #component .card {
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 32px;
  }

  #component .plan {
    display: grid;
    grid-template-columns: 1fr auto;
    column-gap: 32px;
    align-items: center;
    margin-bottom: 32px;
    background: #EEF4FA;
  }

  #component h2 {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  #component .price {
    margin-top: 8px;
    font-size: 18px;
    color: #55656A;
  }

  #component .seats { margin-top: 24px; max-width: 480px; }
  #component .seats p { font-size: 16px; color: #0B1416; margin-bottom: 8px; }
  #component .track {
    height: 8px;
    border-radius: 999px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    overflow: hidden;
  }
  #component .fill { width: 72%; height: 100%; background: #0263AC; border-radius: 999px; }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 32px;
    border: 1px solid #0B1416;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:hover { background: #0263AC; border-color: #0263AC; }
  #component .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 4px; }

  #component .invoices { padding: 32px 32px 16px; }
  #component .invoices h2 { margin-bottom: 24px; }

  #component table { width: 100%; border-collapse: collapse; }
  #component th {
    text-align: left;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #55656A;
    padding: 12px 0;
    border-bottom: 1px solid #9CC3EA;
  }
  #component td {
    padding: 16px 0;
    border-bottom: 1px solid #E6EFF7;
    font-size: 16px;
  }
  #component tbody tr:last-child td { border-bottom: 0; }
  #component tbody tr { transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  #component tbody tr:hover { background: #E6EFF7; }
  #component th:nth-child(1), #component td:nth-child(1) { width: 40%; padding-left: 12px; }
  #component th:nth-child(2), #component td:nth-child(2) { width: 30%; font-variant-numeric: tabular-nums; }
  #component .status {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: #E6EFF7;
    color: #0263AC;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  @media (prefers-reduced-motion: reduce) {
    #component * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <h1>Billing</h1>

  <section class="card plan" aria-label="Current plan">
    <div>
      <h2>Team plan</h2>
      <p class="price">$24 per seat per month</p>
      <div class="seats">
        <p>18 of 25 seats used</p>
        <div class="track" role="img" aria-label="18 of 25 seats used"><div class="fill"></div></div>
      </div>
    </div>
    <button class="btn" type="button">Change Plan</button>
  </section>

  <section class="card invoices" aria-labelledby="invoices-title">
    <h2 id="invoices-title">Invoices</h2>
    <table>
      <thead>
        <tr><th scope="col">Date</th><th scope="col">Amount</th><th scope="col">Status</th></tr>
      </thead>
      <tbody>
        <tr><td>Oct 1, 2026</td><td>$432.00</td><td><span class="status">Paid</span></td></tr>
        <tr><td>Sep 1, 2026</td><td>$432.00</td><td><span class="status">Paid</span></td></tr>
        <tr><td>Aug 1, 2026</td><td>$408.00</td><td><span class="status">Paid</span></td></tr>
        <tr><td>Jul 1, 2026</td><td>$408.00</td><td><span class="status">Paid</span></td></tr>
      </tbody>
    </table>
  </section>
</div>
</body>
</html>
