<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests | Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F4EFE6; }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }

  #component .page-title {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: #1E2B24;
    padding-bottom: 32px;
    border-bottom: 1px solid #E8A989;
  }

  #component .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 96px 0 64px;
  }

  #component .icon {
    width: 64px;
    height: 64px;
    border-radius: 6px;
    background: #F6DFD0;
    color: #C2410C;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 32px;
  }
  #component .icon svg { width: 24px; height: 24px; display: block; }

  #component .empty-title {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: #1E2B24;
  }

  #component .empty-text {
    max-width: 480px;
    margin-top: 16px;
    font-size: 18px;
    line-height: 1.5;
    color: #5E6B63;
  }

  #component .actions {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 32px;
    border-radius: 4px;
    background: #1E2B24;
    color: #FBF8F2;
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0;
    text-decoration: none;
    border: 1px solid #1E2B24;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:hover { background: #C2410C; border-color: #C2410C; }
  #component .btn:focus-visible,
  #component .link:focus-visible { outline: 2px solid #C2410C; outline-offset: 4px; }

  #component .link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 4px;
    color: #C2410C;
    font-size: 16px;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .link:hover { background: #F6DFD0; color: #1E2B24; }
</style>
</head>
<body>
<div id="component">
  <h1 class="page-title">Requests</h1>

  <main class="empty">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13l3-8h12l3 8"/>
        <path d="M3 13v6h18v-6"/>
        <path d="M3 13h5a4 4 0 0 0 8 0h5"/>
      </svg>
    </div>
    <h2 class="empty-title">No requests yet</h2>
    <p class="empty-text">When your team asks for something, it shows up here.</p>
    <div class="actions">
      <a class="btn" href="#create">Create a Request</a>
      <a class="link" href="#import">Import from a spreadsheet</a>
    </div>
  </main>
</div>
</body>
</html>
