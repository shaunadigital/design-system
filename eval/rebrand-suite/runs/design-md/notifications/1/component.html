<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F4EFE6; }
  #component {
    width: 1280px;
    min-height: 900px;
    margin: 0 auto;
    padding: 96px 64px;
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 32px;
    padding-bottom: 48px;
  }
  #component h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 32px;
    border: 1px solid #1E2B24;
    border-radius: 4px;
    background: #1E2B24;
    color: #FBF8F2;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:hover { background: #C2410C; border-color: #C2410C; }
  #component .btn:focus-visible { outline: 2px solid #C2410C; outline-offset: 4px; }
  #component .list {
    list-style: none;
    background: #FBF8F2;
    border: 1px solid #E9E1D2;
    border-radius: 6px;
    overflow: hidden;
  }
  #component .item {
    display: grid;
    grid-template-columns: 12px 1fr auto;
    align-items: center;
    column-gap: 24px;
    padding: 32px 48px;
    border-top: 1px solid #E9E1D2;
    color: #5E6B63;
  }
  #component .item:first-child { border-top: 0; }
  #component .item.unread { background: #F6DFD0; color: #1E2B24; }
  #component .dot { width: 12px; height: 12px; border-radius: 50%; }
  #component .unread .dot { background: #C2410C; }
  #component .text { font-size: 18px; line-height: 1.5; font-weight: 400; }
  #component .unread .text { font-weight: 500; }
  #component .time {
    font-size: 14px;
    line-height: 1.5;
    color: #5E6B63;
    white-space: nowrap;
  }
  #component .unread .time { color: #C2410C; font-weight: 500; }
</style>
</head>
<body>
<div id="component">
  <div class="header">
    <h1>Notifications</h1>
    <button class="btn" type="button">Mark All as Read</button>
  </div>
  <ul class="list">
    <li class="item unread"><span class="dot" aria-hidden="true"></span><span class="text">Leo Park approved Q4 travel budget</span><span class="time">2h ago</span></li>
    <li class="item unread"><span class="dot" aria-hidden="true"></span><span class="text">Maya Chen assigned you Laptop refresh for design</span><span class="time">3h ago</span></li>
    <li class="item unread"><span class="dot" aria-hidden="true"></span><span class="text">Your weekly summary is ready</span><span class="time">1d ago</span></li>
    <li class="item"><span class="dot" aria-hidden="true"></span><span class="text">Ana Ruiz commented on VPN access for contractors</span><span class="time">1d ago</span></li>
    <li class="item"><span class="dot" aria-hidden="true"></span><span class="text">Sam Ito joined Harbor Ops</span><span class="time">2d ago</span></li>
    <li class="item"><span class="dot" aria-hidden="true"></span><span class="text">Billing details were updated</span><span class="time">3d ago</span></li>
  </ul>
</div>
</body>
</html>
