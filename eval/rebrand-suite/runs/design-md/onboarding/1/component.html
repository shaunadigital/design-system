<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor: Connect your tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F4EFE6; }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component .wrap { max-width: 720px; margin: 0 auto; }

  #component .progress { margin-bottom: 64px; }
  #component .label {
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #C2410C;
  }
  #component .bar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    list-style: none;
  }
  #component .bar li {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #E9E1D2;
  }
  #component .bar li.done { background: #C2410C; }

  #component h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  #component .lead {
    margin-top: 16px;
    font-size: 18px;
    color: #5E6B63;
  }

  #component .options {
    list-style: none;
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #component .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 24px;
    background: #FBF8F2;
    border: 1px solid #E9E1D2;
    border-radius: 6px;
  }
  #component .card h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.3;
  }
  #component .card p {
    margin-top: 4px;
    font-size: 16px;
    color: #5E6B63;
  }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: 4px;
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn-quiet { background: transparent; color: #1E2B24; }
  #component .btn-quiet:hover { background: #F6DFD0; }
  #component .btn-connect { border-color: #E8A989; flex-shrink: 0; }
  #component .btn-primary { background: #1E2B24; color: #FBF8F2; }
  #component .btn-primary:hover { background: #C2410C; }
  #component .btn:focus-visible { outline: 2px solid #C2410C; outline-offset: 2px; }

  #component .actions {
    margin-top: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="wrap">
    <div class="progress">
      <p class="label">Step 2 of 4</p>
      <ol class="bar" aria-hidden="true">
        <li class="done"></li>
        <li class="done"></li>
        <li></li>
        <li></li>
      </ol>
    </div>

    <h1>Connect your tools</h1>
    <p class="lead">Harbor works best with the tools your team already uses.</p>

    <ul class="options">
      <li class="card">
        <div>
          <h2>Slack</h2>
          <p>Get request updates in your channels</p>
        </div>
        <button type="button" class="btn btn-quiet btn-connect" aria-label="Connect Slack">Connect</button>
      </li>
      <li class="card">
        <div>
          <h2>Google Calendar</h2>
          <p>See due dates on your calendar</p>
        </div>
        <button type="button" class="btn btn-quiet btn-connect" aria-label="Connect Google Calendar">Connect</button>
      </li>
      <li class="card">
        <div>
          <h2>Jira</h2>
          <p>Link requests to engineering tickets</p>
        </div>
        <button type="button" class="btn btn-quiet btn-connect" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button type="button" class="btn btn-quiet">Skip for Now</button>
      <button type="button" class="btn btn-primary">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
