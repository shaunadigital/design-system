<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect your tools</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #F4EFE6; }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px;
    background: #F4EFE6;
    color: #1E2B24;
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #component .wrap { width: 720px; }

  #component .progress { margin-bottom: 32px; }
  #component .label {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #C2410C;
  }
  #component .bar { display: flex; gap: 8px; }
  #component .bar span {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #E8A989;
  }
  #component .bar span.done { background: #C2410C; }

  #component h1 {
    margin: 0 0 16px;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: 56px;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  #component .lead {
    margin: 0 0 48px;
    font-size: 18px;
    line-height: 1.5;
    color: #5E6B63;
  }

  #component ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
  #component li {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 24px;
    background: #FBF8F2;
    border: 1px solid #E9E1D2;
    border-radius: 6px;
  }
  #component .icon {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 4px;
    background: #E9E1D2;
    color: #C2410C;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #component .icon svg { width: 24px; height: 24px; display: block; }
  #component .text { flex: 1; min-width: 0; }
  #component h2 {
    margin: 0 0 4px;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: 0;
  }
  #component .text p { margin: 0; font-size: 14px; line-height: 1.5; color: #5E6B63; }

  #component .btn {
    appearance: none;
    min-height: 44px;
    padding: 8px 24px;
    border-radius: 4px;
    border: 1px solid transparent;
    background: transparent;
    color: #1E2B24;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn.connect { border-color: #E8A989; flex: none; }
  #component .btn.connect:hover { background: #F6DFD0; border-color: #C2410C; }
  #component .btn.primary { background: #1E2B24; color: #FBF8F2; }
  #component .btn.primary:hover { background: #C2410C; }
  #component .btn.quiet:hover { background: #F6DFD0; }
  #component .btn:focus-visible { outline: 2px solid #C2410C; outline-offset: 2px; }

  #component .actions {
    margin-top: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="wrap">
    <div class="progress">
      <p class="label">Step 2 of 4</p>
      <div class="bar" aria-hidden="true">
        <span class="done"></span><span class="done"></span><span></span><span></span>
      </div>
    </div>

    <h1>Connect your tools</h1>
    <p class="lead">Harbor works best with the tools your team already uses.</p>

    <ul>
      <li>
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>
        </div>
        <div class="text">
          <h2>Slack</h2>
          <p>Get request updates in your channels</p>
        </div>
        <button class="btn connect" type="button" aria-label="Connect Slack">Connect</button>
      </li>
      <li>
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
        </div>
        <div class="text">
          <h2>Google Calendar</h2>
          <p>See due dates on your calendar</p>
        </div>
        <button class="btn connect" type="button" aria-label="Connect Google Calendar">Connect</button>
      </li>
      <li>
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        </div>
        <div class="text">
          <h2>Jira</h2>
          <p>Link requests to engineering tickets</p>
        </div>
        <button class="btn connect" type="button" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button class="btn quiet" type="button">Skip for Now</button>
      <button class="btn primary" type="button">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
