<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; color: #0B1416; font-family: "Archivo", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  #component { width: 1280px; margin: 0 auto; padding: 64px 64px 96px; background: #FFFFFF; }
  h1 { margin: 0 0 48px; font-family: "Unbounded", system-ui, sans-serif; font-weight: 300; font-size: 56px; line-height: 1.1; letter-spacing: -0.02em; text-transform: uppercase; }
  h2 { margin: 0 0 24px; font-family: "Unbounded", system-ui, sans-serif; font-weight: 500; font-size: 28px; line-height: 1.2; letter-spacing: -0.01em; }
  .card { width: 100%; max-width: 768px; margin: 0 0 32px; padding: 32px; background: #FFFFFF; border: 1px solid #9CC3EA; border-radius: 16px; }
  .field { display: block; margin: 0 0 24px; }
  .field span { display: block; margin: 0 0 8px; font-weight: 500; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #55656A; }
  .field input { display: block; width: 100%; min-height: 48px; padding: 12px 16px; font: inherit; font-size: 16px; color: #0B1416; background: #FFFFFF; border: 1px solid #55656A; border-radius: 12px; transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .field input:hover { background: #EEF4FA; }
  .btn { display: inline-block; min-height: 44px; padding: 8px 24px; font: inherit; font-size: 16px; font-weight: 500; color: #FFFFFF; background: #0B1416; border: 1px solid #0B1416; border-radius: 999px; cursor: pointer; transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .btn:hover { background: #0263AC; border-color: #0263AC; }
  .btn.quiet { color: #0B1416; background: transparent; border-color: #0B1416; }
  .btn.quiet:hover { background: #E6EFF7; border-color: #0B1416; }
  :focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }
  .switches { margin: 0; padding: 0; list-style: none; }
  .switches li + li { border-top: 1px solid #E6EFF7; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 56px; padding: 8px 0; cursor: pointer; }
  .switch input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 48px; height: 28px; margin: 0; background: #FFFFFF; border: 1px solid #55656A; border-radius: 999px; cursor: pointer; transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #55656A; border-radius: 999px; transition: transform 120ms cubic-bezier(0.2, 0.7, 0.2, 1), background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .switch input:checked { background: #0B1416; border-color: #0B1416; }
  .switch input:checked::after { background: #FFFFFF; transform: translateX(20px); }
  .danger p { margin: 0 0 24px; color: #55656A; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="component">
  <h1>Workspace settings</h1>

  <section class="card" aria-labelledby="general-title">
    <h2 id="general-title">General</h2>
    <label class="field"><span>Workspace name</span><input type="text" value="Harbor Ops"></label>
    <label class="field"><span>Workspace URL</span><input type="text" value="harbor.app/ops"></label>
    <button class="btn" type="button">Save Changes</button>
  </section>

  <section class="card" aria-labelledby="notifications-title">
    <h2 id="notifications-title">Notifications</h2>
    <ul class="switches">
      <li><label class="switch">Email me when a request is assigned to me<input type="checkbox" role="switch" checked></label></li>
      <li><label class="switch">Weekly summary<input type="checkbox" role="switch"></label></li>
      <li><label class="switch">Product updates<input type="checkbox" role="switch"></label></li>
    </ul>
  </section>

  <section class="card danger" aria-labelledby="danger-title">
    <h2 id="danger-title">Danger zone</h2>
    <p>Deleting a workspace removes all of its requests for everyone.</p>
    <button class="btn quiet" type="button">Delete Workspace</button>
  </section>
</div>
</body>
</html>
