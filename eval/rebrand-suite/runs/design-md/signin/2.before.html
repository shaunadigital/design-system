<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Harbor</title>
<style>
  #component, #component * { box-sizing: border-box; margin: 0; }

  #component {
    width: 1280px;
    min-height: 800px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 96px 64px;
    background: #EEF4FA;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
  }

  #component .card {
    width: 480px;
    padding: 48px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  #component h1 {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  #component form { display: flex; flex-direction: column; gap: 24px; }

  #component .field { display: flex; flex-direction: column; gap: 8px; }

  #component label.label {
    font-weight: 500;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #55656A;
  }

  #component input[type="email"],
  #component input[type="password"] {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font-family: inherit;
    font-size: 16px;
    color: #0B1416;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 12px;
    outline: none;
    transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1),
                box-shadow 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component input[type="email"]:hover,
  #component input[type="password"]:hover { border-color: #0263AC; }
  #component input[type="email"]:focus,
  #component input[type="password"]:focus {
    border-color: #0263AC;
    box-shadow: 0 0 0 3px #E6EFF7, 0 0 0 4px #0263AC;
  }

  #component .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  #component .check {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    font-size: 16px;
    cursor: pointer;
  }
  #component .check input {
    width: 20px;
    height: 20px;
    accent-color: #0263AC;
    cursor: pointer;
  }

  #component a.forgot {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-size: 16px;
    color: #0263AC;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  #component a.forgot:hover { text-decoration-thickness: 2px; }

  #component .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }

  #component .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 0 24px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.02em;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:focus-visible,
  #component a.forgot:focus-visible,
  #component .check input:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 3px;
  }
  #component .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
    border: 1px solid #0B1416;
  }
  #component .btn-primary:hover { background: #0263AC; border-color: #0263AC; }
  #component .btn-secondary {
    background: transparent;
    color: #0B1416;
    border: 1px solid #9CC3EA;
  }
  #component .btn-secondary:hover { background: #E6EFF7; border-color: #0263AC; }

  @media (prefers-reduced-motion: reduce) {
    #component * { transition: none !important; }
  }
</style>
</head>
<body style="margin:0">
<div id="component">
  <main class="card">
    <h1>Sign in to Harbor</h1>
    <form action="#">
      <div class="field">
        <label class="label" for="email">Work email</label>
        <input id="email" type="email" name="email" autocomplete="username">
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password">
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" name="remember"> Keep me signed in</label>
        <a class="forgot" href="#">Forgot Password?</a>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Sign In</button>
        <button class="btn btn-secondary" type="button">Continue with SSO</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
