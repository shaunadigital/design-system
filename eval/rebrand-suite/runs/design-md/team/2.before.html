<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FFFFFF; color: #0B1416; font-family: "Archivo", system-ui, sans-serif; font-size: 16px; }

  #component { width: 1280px; min-height: 720px; padding: 64px; background: #FFFFFF; }

  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-bottom: 32px; }
  h1 { font-family: "Unbounded", "Archivo", sans-serif; font-weight: 300; font-size: 56px; line-height: 1.1; letter-spacing: -0.02em; text-transform: uppercase; }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 24px; border: 0; border-radius: 999px; font: 500 16px "Archivo", system-ui, sans-serif; cursor: pointer; transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .btn-primary { background: #0B1416; color: #FFFFFF; }
  .btn-primary:hover { background: #0263AC; }
  .btn:focus-visible, select:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }

  .card { background: #FFFFFF; border: 1px solid #9CC3EA; border-radius: 16px; overflow: hidden; }
  .cols, .row { display: grid; grid-template-columns: 4fr 4fr 3fr; column-gap: 32px; align-items: center; padding: 0 24px; }
  .cols { min-height: 44px; background: #EEF4FA; border-bottom: 1px solid #9CC3EA; }
  .label { font: 500 12px "Archivo", system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #55656A; }

  ul { list-style: none; }
  .row { min-height: 64px; border-top: 1px solid #9CC3EA; }
  li:first-child .row { border-top: 0; }
  .name { font-weight: 500; font-size: 16px; }
  .email { font-size: 16px; color: #55656A; }

  select { width: 100%; max-width: 200px; min-height: 44px; padding: 0 12px; border: 1px solid #9CC3EA; border-radius: 12px; background: #FFFFFF; color: #0B1416; font: 16px "Archivo", system-ui, sans-serif; transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  select:hover { background: #E6EFF7; }
</style>
</head>
<body>
<div id="component">
  <div class="head">
    <h1>Team</h1>
    <button class="btn btn-primary" type="button">Invite Member</button>
  </div>

  <div class="card">
    <div class="cols">
      <span class="label">Name</span>
      <span class="label">Email</span>
      <span class="label">Role</span>
    </div>
    <ul>
      <li class="row">
        <span class="name">Maya Chen</span>
        <span class="email">maya@harbor.app</span>
        <select aria-label="Role for Maya Chen">
          <option selected>Admin</option><option>Editor</option><option>Viewer</option>
        </select>
      </li>
      <li class="row">
        <span class="name">Leo Park</span>
        <span class="email">leo@harbor.app</span>
        <select aria-label="Role for Leo Park">
          <option>Admin</option><option selected>Editor</option><option>Viewer</option>
        </select>
      </li>
      <li class="row">
        <span class="name">Ana Ruiz</span>
        <span class="email">ana@harbor.app</span>
        <select aria-label="Role for Ana Ruiz">
          <option>Admin</option><option selected>Editor</option><option>Viewer</option>
        </select>
      </li>
      <li class="row">
        <span class="name">Sam Ito</span>
        <span class="email">sam@harbor.app</span>
        <select aria-label="Role for Sam Ito">
          <option>Admin</option><option>Editor</option><option selected>Viewer</option>
        </select>
      </li>
      <li class="row">
        <span class="name">Kai Lee</span>
        <span class="email">kai@harbor.app</span>
        <select aria-label="Role for Kai Lee">
          <option>Admin</option><option>Editor</option><option selected>Viewer</option>
        </select>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
