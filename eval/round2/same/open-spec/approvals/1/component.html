<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
  }

  .head { margin-bottom: 48px; }

  h1 {
    font-family: "Unbounded", "Archivo", sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .count {
    margin-top: 16px;
    font-size: 18px;
    line-height: 1.5;
    color: #55656A;
  }

  .queue {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .card {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    align-items: center;
    padding: 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  .card:hover { background: #E6EFF7; }

  .info { grid-column: 1 / 8; }

  h2 {
    font-family: "Unbounded", "Archivo", sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  .requester {
    margin-top: 8px;
    font-size: 16px;
    color: #55656A;
  }

  .amount {
    grid-column: 8 / 10;
    font-family: "Unbounded", "Archivo", sans-serif;
    font-weight: 500;
    font-size: 22px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  .actions {
    grid-column: 10 / 13;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .btn {
    min-height: 44px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
  }
  .btn-primary:hover { background: #0263AC; }

  .btn-quiet {
    background: transparent;
    color: #0B1416;
  }
  .btn-quiet:hover {
    background: #E6EFF7;
    border-color: #9CC3EA;
  }

  .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<main id="component">
  <header class="head">
    <h1>Approvals</h1>
    <p class="count">3 waiting for you</p>
  </header>

  <ul class="queue">
    <li class="card">
      <div class="info">
        <h2>Q4 travel budget</h2>
        <p class="requester">Leo Park</p>
      </div>
      <p class="amount">$4,800</p>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Q4 travel budget">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Q4 travel budget">Decline</button>
      </div>
    </li>

    <li class="card">
      <div class="info">
        <h2>Design conference tickets</h2>
        <p class="requester">Maya Chen</p>
      </div>
      <p class="amount">$1,250</p>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Design conference tickets">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Design conference tickets">Decline</button>
      </div>
    </li>

    <li class="card">
      <div class="info">
        <h2>Standing desks for support</h2>
        <p class="requester">Ana Ruiz</p>
      </div>
      <p class="amount">$2,100</p>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Standing desks for support">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Standing desks for support">Decline</button>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
