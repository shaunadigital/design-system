<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
  }

  .page-head {
    margin-bottom: 48px;
  }

  h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .count {
    margin: 16px 0 0;
    font-size: 18px;
    line-height: 1.5;
    color: #55656A;
  }

  .queue {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 16px;
  }

  .card {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    column-gap: 48px;
    padding: 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  .card h2 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  .requester {
    margin: 8px 0 0;
    font-size: 16px;
    color: #55656A;
  }

  .amount {
    margin: 0;
    min-width: 112px;
    text-align: right;
    font-size: 28px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    color: #0B1416;
  }

  .actions {
    display: flex;
    gap: 8px;
  }

  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    min-width: 112px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    transition:
      background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
      color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
      border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
  }

  .btn-primary:hover {
    background: #0263AC;
  }

  .btn-quiet {
    background: transparent;
    color: #0B1416;
  }

  .btn-quiet:hover {
    background: #E6EFF7;
  }

  .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <main>
    <header class="page-head">
      <h1>Approvals</h1>
      <p class="count">3 waiting for you</p>
    </header>

    <ul class="queue">
      <li>
        <article class="card" aria-labelledby="a1">
          <div>
            <h2 id="a1">Q4 travel budget</h2>
            <p class="requester">Leo Park</p>
          </div>
          <p class="amount">$4,800</p>
          <div class="actions">
            <button type="button" class="btn btn-primary" aria-label="Approve Q4 travel budget">Approve</button>
            <button type="button" class="btn btn-quiet" aria-label="Decline Q4 travel budget">Decline</button>
          </div>
        </article>
      </li>

      <li>
        <article class="card" aria-labelledby="a2">
          <div>
            <h2 id="a2">Design conference tickets</h2>
            <p class="requester">Maya Chen</p>
          </div>
          <p class="amount">$1,250</p>
          <div class="actions">
            <button type="button" class="btn btn-primary" aria-label="Approve Design conference tickets">Approve</button>
            <button type="button" class="btn btn-quiet" aria-label="Decline Design conference tickets">Decline</button>
          </div>
        </article>
      </li>

      <li>
        <article class="card" aria-labelledby="a3">
          <div>
            <h2 id="a3">Standing desks for support</h2>
            <p class="requester">Ana Ruiz</p>
          </div>
          <p class="amount">$2,100</p>
          <div class="actions">
            <button type="button" class="btn btn-primary" aria-label="Approve Standing desks for support">Approve</button>
            <button type="button" class="btn btn-quiet" aria-label="Decline Standing desks for support">Decline</button>
          </div>
        </article>
      </li>
    </ul>
  </main>
</div>
</body>
</html>
