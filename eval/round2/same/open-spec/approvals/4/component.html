<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    background: #FFFFFF;
  }

  .header {
    padding: 96px 64px 48px;
  }

  h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .lead {
    margin: 16px 0 0;
    font-size: 22px;
    line-height: 1.4;
    color: #55656A;
  }

  .queue {
    background: #EEF4FA;
    padding: 64px 64px 96px;
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .card {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    align-items: center;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 32px;
  }

  .info { grid-column: span 6; }
  .money { grid-column: span 2; }
  .actions {
    grid-column: span 4;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .label {
    margin: 0 0 4px;
    font-weight: 500;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0263AC;
  }

  h2 {
    margin: 0 0 16px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  .requester {
    margin: 0;
    font-size: 18px;
    line-height: 1.4;
    color: #0B1416;
  }

  .amount {
    margin: 0;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    color: #0B1416;
  }

  .btn {
    appearance: none;
    min-height: 44px;
    padding: 0 24px;
    border: 0;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.5;
    cursor: pointer;
    transition:
      background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
      color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
  }
  .btn-primary:hover { background: #0263AC; }

  .btn-quiet {
    background: transparent;
    color: #0B1416;
  }
  .btn-quiet:hover { background: #E6EFF7; }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <main>
    <header class="header">
      <h1>Approvals</h1>
      <p class="lead">3 waiting for you</p>
    </header>

    <section class="queue" aria-label="Approvals queue">
      <ul class="list">
        <li class="card">
          <div class="info">
            <h2>Q4 travel budget</h2>
            <p class="label">Requester</p>
            <p class="requester">Leo Park</p>
          </div>
          <div class="money">
            <p class="label">Amount</p>
            <p class="amount">$4,800</p>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="button" aria-label="Approve Q4 travel budget">Approve</button>
            <button class="btn btn-quiet" type="button" aria-label="Decline Q4 travel budget">Decline</button>
          </div>
        </li>

        <li class="card">
          <div class="info">
            <h2>Design conference tickets</h2>
            <p class="label">Requester</p>
            <p class="requester">Maya Chen</p>
          </div>
          <div class="money">
            <p class="label">Amount</p>
            <p class="amount">$1,250</p>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="button" aria-label="Approve Design conference tickets">Approve</button>
            <button class="btn btn-quiet" type="button" aria-label="Decline Design conference tickets">Decline</button>
          </div>
        </li>

        <li class="card">
          <div class="info">
            <h2>Standing desks for support</h2>
            <p class="label">Requester</p>
            <p class="requester">Ana Ruiz</p>
          </div>
          <div class="money">
            <p class="label">Amount</p>
            <p class="amount">$2,100</p>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="button" aria-label="Approve Standing desks for support">Approve</button>
            <button class="btn btn-quiet" type="button" aria-label="Decline Standing desks for support">Decline</button>
          </div>
        </li>
      </ul>
    </section>
  </main>
</div>
</body>
</html>
