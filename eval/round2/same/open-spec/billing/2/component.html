<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing - Harbor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #FFFFFF;
  }

  #component {
    width: 1280px;
    min-height: 720px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
  }

  #component h1,
  #component h2,
  #component h3,
  #component p {
    margin: 0;
  }

  #component .page-title {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
    margin-bottom: 48px;
  }

  #component .layout {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    align-items: start;
  }

  #component .card {
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 32px;
  }

  #component .plan {
    grid-column: 1 / span 4;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  #component .invoices {
    grid-column: 5 / span 8;
  }

  #component .card-title {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  #component .price {
    font-size: 18px;
    line-height: 1.5;
    color: #0B1416;
    margin-top: 8px;
  }

  #component .seats {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #component .seats-text {
    font-size: 16px;
    color: #55656A;
  }

  #component .meter {
    height: 8px;
    border-radius: 999px;
    background: #EEF4FA;
    overflow: hidden;
  }

  #component .meter-fill {
    display: block;
    height: 100%;
    width: 72%;
    border-radius: 999px;
    background: #0263AC;
  }

  #component .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    align-self: flex-start;
    min-height: 48px;
    padding: 0 32px;
    border: 1px solid #0B1416;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component .button:hover {
    background: #0263AC;
    border-color: #0263AC;
  }

  #component .button:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 4px;
  }

  #component .invoices .card-title {
    margin-bottom: 24px;
  }

  #component table {
    width: 100%;
    border-collapse: collapse;
    font-size: 16px;
  }

  #component th {
    padding: 12px 0;
    border-bottom: 1px solid #9CC3EA;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: left;
    color: #55656A;
  }

  #component td {
    padding: 16px 0;
    border-bottom: 1px solid #EEF4FA;
    line-height: 1.5;
    color: #0B1416;
    vertical-align: middle;
  }

  #component tbody tr:last-child td {
    border-bottom: 0;
  }

  #component tbody tr {
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component th.num,
  #component td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
    padding-right: 48px;
  }

  #component .status {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: #E6EFF7;
    color: #0263AC;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0.02em;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .button,
    #component tbody tr { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <h1 class="page-title">Billing</h1>

  <div class="layout">
    <section class="card plan" aria-labelledby="plan-title">
      <div>
        <h2 class="card-title" id="plan-title">Team plan</h2>
        <p class="price">$24 per seat per month</p>
      </div>
      <div class="seats">
        <p class="seats-text">18 of 25 seats used</p>
        <div class="meter" role="progressbar" aria-label="Seats used" aria-valuemin="0" aria-valuemax="25" aria-valuenow="18">
          <span class="meter-fill"></span>
        </div>
      </div>
      <button type="button" class="button">Change Plan</button>
    </section>

    <section class="card invoices" aria-labelledby="invoices-title">
      <h2 class="card-title" id="invoices-title">Invoices</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col" class="num">Amount</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Oct 1, 2026</td>
            <td class="num">$432.00</td>
            <td><span class="status">Paid</span></td>
          </tr>
          <tr>
            <td>Sep 1, 2026</td>
            <td class="num">$432.00</td>
            <td><span class="status">Paid</span></td>
          </tr>
          <tr>
            <td>Aug 1, 2026</td>
            <td class="num">$408.00</td>
            <td><span class="status">Paid</span></td>
          </tr>
          <tr>
            <td>Jul 1, 2026</td>
            <td class="num">$408.00</td>
            <td><span class="status">Paid</span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
</div>
</body>
</html>
