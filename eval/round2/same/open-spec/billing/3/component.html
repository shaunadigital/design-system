<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  body {
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: #0B1416;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 100%;
    background: #FFFFFF;
    padding: 96px 64px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    row-gap: 48px;
  }
  .grid > * { grid-column: 1 / -1; }

  h1, h2 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
  }
  h1 {
    font-size: 56px;
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  h2 {
    font-size: 28px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .card {
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 32px;
  }

  .plan-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 32px;
  }
  .plan-price {
    margin: 8px 0 0;
    font-size: 18px;
    line-height: 1.5;
    color: #55656A;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 24px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .btn:hover { background: #0263AC; }
  .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 4px; }

  .seats { margin-top: 32px; }
  .seats p { margin: 0 0 12px; font-size: 16px; color: #0B1416; }
  .meter {
    height: 8px;
    border-radius: 999px;
    background: #EEF4FA;
    overflow: hidden;
  }
  .meter > span {
    display: block;
    height: 100%;
    width: 72%;
    border-radius: 999px;
    background: #0263AC;
  }

  .invoices { padding: 32px 32px 16px; }
  .invoices h2 { margin-bottom: 24px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 16px;
  }
  th, td {
    padding: 16px 0;
    text-align: left;
    vertical-align: middle;
  }
  th {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #55656A;
    border-bottom: 1px solid #9CC3EA;
  }
  td { border-bottom: 1px solid #EEF4FA; }
  tbody tr:last-child td { border-bottom: 0; }
  th:nth-child(1), td:nth-child(1) { width: 40%; }
  th:nth-child(2), td:nth-child(2) { width: 30%; font-variant-numeric: tabular-nums; }
  tbody tr { transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1); }
</style>
</head>
<body>
<div id="component">
  <main class="grid">
    <h1>Billing</h1>

    <section class="card" aria-labelledby="plan-title">
      <div class="plan-top">
        <div>
          <h2 id="plan-title">Team plan</h2>
          <p class="plan-price">$24 per seat per month</p>
        </div>
        <button class="btn" type="button">Change Plan</button>
      </div>
      <div class="seats">
        <p id="seats-label">18 of 25 seats used</p>
        <div class="meter" role="progressbar" aria-labelledby="seats-label" aria-valuemin="0" aria-valuemax="25" aria-valuenow="18"><span></span></div>
      </div>
    </section>

    <section class="card invoices" aria-labelledby="invoices-title">
      <h2 id="invoices-title">Invoices</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Amount</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Oct 1, 2026</td><td>$432.00</td><td>Paid</td></tr>
          <tr><td>Sep 1, 2026</td><td>$432.00</td><td>Paid</td></tr>
          <tr><td>Aug 1, 2026</td><td>$408.00</td><td>Paid</td></tr>
          <tr><td>Jul 1, 2026</td><td>$408.00</td><td>Paid</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
