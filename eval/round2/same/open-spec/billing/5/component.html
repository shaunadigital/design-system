<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 720px;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
  }

  h1, h2 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }

  h1 {
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin-bottom: 48px;
  }

  h2 {
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .layout {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    align-items: start;
  }

  .card {
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 32px;
  }

  .plan { grid-column: span 5; }
  .invoices { grid-column: span 7; }

  .price {
    margin: 8px 0 0;
    font-size: 22px;
    line-height: 1.3;
  }

  .seats { margin-top: 32px; }

  .seats p {
    margin: 0 0 12px;
    font-size: 16px;
    color: #55656A;
  }

  .meter {
    height: 8px;
    border-radius: 999px;
    background: #EEF4FA;
    overflow: hidden;
  }

  .meter span {
    display: block;
    height: 100%;
    width: 72%;
    border-radius: 999px;
    background: #0263AC;
  }

  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin-top: 32px;
    padding: 0 24px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0;
    cursor: pointer;
  }

  .button:hover { background: #0263AC; }

  .button:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .button { transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  }

  table {
    width: 100%;
    margin-top: 24px;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }

  th {
    padding: 0 16px 12px 0;
    border-bottom: 1px solid #9CC3EA;
    text-align: left;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #55656A;
  }

  td {
    padding: 16px 16px 16px 0;
    border-bottom: 1px solid #EEF4FA;
    font-size: 16px;
    line-height: 1.5;
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: 0; padding-bottom: 0; }

  th:last-child, td:last-child { padding-right: 0; }

  .status {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: #E6EFF7;
    color: #0263AC;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div id="component">
  <main>
    <h1>Billing</h1>

    <div class="layout">
      <section class="card plan" aria-labelledby="plan-title">
        <h2 id="plan-title">Team plan</h2>
        <p class="price">$24 per seat per month</p>

        <div class="seats">
          <p id="seats-label">18 of 25 seats used</p>
          <div class="meter" role="meter" aria-labelledby="seats-label" aria-valuemin="0" aria-valuemax="25" aria-valuenow="18"><span></span></div>
        </div>

        <button class="button" type="button">Change Plan</button>
      </section>

      <section class="card invoices" aria-labelledby="invoices-title">
        <h2 id="invoices-title">Invoices</h2>
        <table aria-labelledby="invoices-title">
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Amount</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Oct 1, 2026</td><td>$432.00</td><td><span class="status">Paid</span></td></tr>
            <tr><td>Sep 1, 2026</td><td>$432.00</td><td><span class="status">Paid</span></td></tr>
            <tr><td>Aug 1, 2026</td><td>$408.00</td><td><span class="status">Paid</span></td></tr>
            <tr><td>Jul 1, 2026</td><td>$408.00</td><td><span class="status">Paid</span></td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</div>
</body>
</html>
