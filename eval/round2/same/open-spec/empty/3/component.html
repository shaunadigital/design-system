<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
  }

  h1.page-title {
    margin: 0;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 48px;
  }

  .empty {
    width: 100%;
    max-width: 640px;
    padding: 64px 48px;
    background: #EEF4FA;
    border-radius: 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .empty-icon {
    width: 64px;
    height: 64px;
    margin-bottom: 24px;
    border-radius: 999px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    color: #0263AC;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-icon svg {
    width: 24px;
    height: 24px;
    display: block;
  }

  h2.empty-title {
    margin: 0 0 12px;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  .empty-text {
    margin: 0 0 32px;
    max-width: 384px;
    font-size: 18px;
    line-height: 1.5;
    color: #55656A;
  }

  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 32px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn-primary:hover { background: #0263AC; }

  .link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 999px;
    color: #0263AC;
    font-size: 16px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 4px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .link:hover { background: #E6EFF7; }

  .btn-primary:focus-visible,
  .link:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-primary, .link { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <h1 class="page-title">Requests</h1>

    <main class="stage">
      <section class="empty" aria-labelledby="empty-title">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 13l3-8h12l3 8"/>
            <path d="M3 13v6a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6"/>
            <path d="M3 13h5a4 4 0 0 0 8 0h5"/>
          </svg>
        </div>
        <h2 class="empty-title" id="empty-title">No requests yet</h2>
        <p class="empty-text">When your team asks for something, it shows up here.</p>
        <div class="actions">
          <a class="btn-primary" href="#create">Create a Request</a>
          <a class="link" href="#import">Import from a spreadsheet</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
