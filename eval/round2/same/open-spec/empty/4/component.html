<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requests | Harbor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #FFFFFF;
  }

  body {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: #0B1416;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
  }

  .page-title {
    grid-column: 1 / -1;
    margin: 0 0 48px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .empty {
    grid-column: 3 / 11;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 96px 64px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  .empty-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    margin-bottom: 24px;
    border-radius: 999px;
    background: #EEF4FA;
    color: #55656A;
  }

  .empty-icon svg {
    width: 24px;
    height: 24px;
    display: block;
  }

  .empty-title {
    margin: 0 0 12px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  .empty-text {
    max-width: 480px;
    margin: 0 0 32px;
    font-size: 18px;
    line-height: 1.5;
    color: #55656A;
  }

  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 32px;
    border: 1px solid #0B1416;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn:hover {
    background: #0263AC;
    border-color: #0263AC;
  }

  .link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 8px 16px;
    border-radius: 8px;
    color: #0263AC;
    font-size: 16px;
    line-height: 1.5;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .link:hover {
    background: #E6EFF7;
  }

  .btn:focus-visible,
  .link:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .link { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <main class="grid">
      <h1 class="page-title">Requests</h1>

      <section class="empty" aria-labelledby="empty-title">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 13l3-8h12l3 8"/>
            <path d="M3 13v6h18v-6h-5a4 4 0 0 1-8 0H3z"/>
          </svg>
        </div>
        <h2 class="empty-title" id="empty-title">No requests yet</h2>
        <p class="empty-text">When your team asks for something, it shows up here.</p>
        <div class="actions">
          <a class="btn" href="#create">Create a Request</a>
          <a class="link" href="#import">Import from a spreadsheet</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
