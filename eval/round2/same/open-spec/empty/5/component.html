<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requests | Harbor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #FFFFFF;
  }

  body {
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    color: #0B1416;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px;
    background: #FFFFFF;
    color: #0B1416;
  }

  .page-title {
    margin: 0 0 48px;
    font-family: "Unbounded", "Archivo", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 480px;
    padding: 96px 64px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  .empty-title {
    margin: 0 0 16px;
    font-family: "Unbounded", "Archivo", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  .empty-line {
    max-width: 480px;
    margin: 0 0 32px;
    font-size: 18px;
    line-height: 1.5;
    color: #55656A;
  }

  .actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 32px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.25;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .button:hover { background: #0263AC; }

  .link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 8px 16px;
    border-radius: 999px;
    color: #0263AC;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.25;
    text-decoration: underline;
    text-underline-offset: 4px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .link:hover { background: #E6EFF7; }

  .button:focus-visible,
  .link:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .button, .link { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <main>
      <h1 class="page-title">Requests</h1>
      <section class="empty" aria-labelledby="empty-title">
        <h2 class="empty-title" id="empty-title">No requests yet</h2>
        <p class="empty-line">When your team asks for something, it shows up here.</p>
        <div class="actions">
          <a class="button" href="#create">Create a Request</a>
          <a class="link" href="#import">Import from a spreadsheet</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
