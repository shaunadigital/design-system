<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New request</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 100vh;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 24px;
  }

  #component .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
  }

  #component h1 {
    grid-column: 1 / -1;
    margin: 0 0 48px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 64px;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  #component form.card {
    grid-column: 1 / span 8;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 48px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 32px;
    row-gap: 32px;
  }

  #component .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  #component .field.full { grid-column: 1 / -1; }

  #component label {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0263AC;
  }

  #component input,
  #component select,
  #component textarea {
    width: 100%;
    min-height: 48px;
    margin: 0;
    padding: 12px 16px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 24px;
    letter-spacing: 0;
    color: #0B1416;
    background-color: #FFFFFF;
    border: 1px solid #55656A;
    border-radius: 12px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component textarea {
    min-height: 144px;
    resize: vertical;
    display: block;
  }

  #component select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 48px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%230B1416' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 24px 24px;
  }

  #component input:hover,
  #component select:hover,
  #component textarea:hover {
    background-color: #E6EFF7;
    border-color: #0263AC;
  }

  #component input:focus-visible,
  #component select:focus-visible,
  #component textarea:focus-visible,
  #component .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  #component .actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 16px;
    padding-top: 16px;
  }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 32px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 24px;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
  }
  #component .btn-primary:hover { background: #0263AC; }

  #component .btn-quiet {
    background: transparent;
    color: #0B1416;
  }
  #component .btn-quiet:hover { background: #E6EFF7; }

  @media (prefers-reduced-motion: reduce) {
    #component * { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <div class="grid">
    <h1>New request</h1>

    <form class="card" action="#" method="post">
      <div class="field full">
        <label for="title">Title</label>
        <input id="title" name="title" type="text">
      </div>

      <div class="field full">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5"></textarea>
      </div>

      <div class="field">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          <option>Low</option>
          <option selected>Medium</option>
          <option>High</option>
        </select>
      </div>

      <div class="field">
        <label for="assignee">Assignee</label>
        <select id="assignee" name="assignee">
          <option>Maya Chen</option>
          <option>Leo Park</option>
          <option>Ana Ruiz</option>
        </select>
      </div>

      <div class="field">
        <label for="due">Due date</label>
        <input id="due" name="due" type="date">
      </div>

      <div class="actions">
        <button class="btn btn-quiet" type="button">Cancel</button>
        <button class="btn btn-primary" type="submit">Create Request</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
