<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Harbor: Connect your tools</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #FFFFFF;
  }

  #component {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --curve: cubic-bezier(0.2, 0.7, 0.2, 1);

    width: 1280px;
    min-height: 900px;
    margin: 0 auto;
    padding: 96px 64px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
  }

  #component .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
  }

  #component .header {
    grid-column: 1 / span 10;
  }

  #component .list,
  #component .actions {
    grid-column: 1 / span 8;
  }

  /* Progress */
  #component .progress {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  #component .progress-label {
    margin: 0;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.5;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
  }

  #component .progress-bar {
    display: flex;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  #component .progress-bar li {
    width: 48px;
    height: 4px;
    border-radius: 999px;
    background: var(--accent-tint);
  }

  #component .progress-bar li.done {
    background: var(--accent);
  }

  /* Heading */
  #component h1 {
    margin: 24px 0 0;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 56px;
    font-weight: 300;
    line-height: 1.15;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--ink);
  }

  #component .lead {
    margin: 16px 0 0;
    font-size: 22px;
    line-height: 1.5;
    color: var(--muted);
  }

  /* Options */
  #component .list {
    margin: 48px 0 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #component .card {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 24px 32px;
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
  }

  #component .icon {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--sand);
    color: var(--accent);
  }

  #component .icon svg {
    width: 24px;
    height: 24px;
    display: block;
  }

  #component .card-text {
    flex: 1;
    min-width: 0;
  }

  #component h2 {
    margin: 0;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 22px;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  #component .card-text p {
    margin: 4px 0 0;
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
  }

  /* Buttons */
  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0;
    white-space: nowrap;
    cursor: pointer;
    transition:
      background-color 180ms var(--curve),
      border-color 180ms var(--curve),
      color 180ms var(--curve);
  }

  #component .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #component .btn-quiet {
    background: transparent;
    color: var(--ink);
  }

  #component .btn-quiet:hover {
    background: var(--accent-tint);
  }

  #component .btn-connect {
    border-color: var(--accent-line);
  }

  #component .btn-primary {
    background: var(--ink);
    color: var(--on-ink);
  }

  #component .btn-primary:hover {
    background: var(--accent);
  }

  #component .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 48px;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="grid">
    <header class="header">
      <div class="progress">
        <p class="progress-label">Step 2 of 4</p>
        <ol class="progress-bar" aria-hidden="true">
          <li class="done"></li>
          <li class="done"></li>
          <li></li>
          <li></li>
        </ol>
      </div>
      <h1>Connect your tools</h1>
      <p class="lead">Harbor works best with the tools your team already uses.</p>
    </header>

    <ul class="list">
      <li class="card">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4 7.5 20M16.5 4l-2 16M4 9h16M3.5 15h16"/></svg>
        </span>
        <div class="card-text">
          <h2>Slack</h2>
          <p>Get request updates in your channels</p>
        </div>
        <button class="btn btn-quiet btn-connect" type="button" aria-label="Connect Slack">Connect</button>
      </li>

      <li class="card">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
        </span>
        <div class="card-text">
          <h2>Google Calendar</h2>
          <p>See due dates on your calendar</p>
        </div>
        <button class="btn btn-quiet btn-connect" type="button" aria-label="Connect Google Calendar">Connect</button>
      </li>

      <li class="card">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        </span>
        <div class="card-text">
          <h2>Jira</h2>
          <p>Link requests to engineering tickets</p>
        </div>
        <button class="btn btn-quiet btn-connect" type="button" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button class="btn btn-quiet" type="button">Skip for Now</button>
      <button class="btn btn-primary" type="button">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
