<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor: Connect your tools</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; background: #FFFFFF; }

  #component {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --curve: cubic-bezier(0.2, 0.7, 0.2, 1);

    width: 1280px;
    min-height: 900px;
    margin: 0 auto;
    padding: 96px 64px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
  }

  #component .grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: 32px;
  }

  #component main {
    grid-column: 3 / 11;
    display: flex;
    flex-direction: column;
  }

  /* Progress */
  #component .progress { margin: 0 0 24px; }

  #component .progress-label {
    display: block;
    margin: 0 0 12px;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  #component .progress-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  #component .progress-bar span {
    height: 4px;
    border-radius: 999px;
    background: var(--sand);
  }

  #component .progress-bar span.done { background: var(--accent); }

  /* Heading */
  #component h1 {
    margin: 0 0 16px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  #component .lead {
    margin: 0 0 48px;
    font-size: 22px;
    line-height: 1.5;
    color: var(--muted);
  }

  /* Options */
  #component .options {
    list-style: none;
    margin: 0 0 48px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #component .option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    padding: 24px 32px;
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
  }

  #component .option-text { min-width: 0; }

  #component h2 {
    margin: 0 0 4px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  #component .option p {
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
  }

  /* Buttons */
  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
    white-space: nowrap;
    cursor: pointer;
    transition:
      background-color 180ms var(--curve),
      color 180ms var(--curve),
      border-color 180ms var(--curve);
  }

  #component .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #component .btn-quiet:hover { background: var(--accent-tint); }

  #component .btn-connect { border-color: var(--ink); }
  #component .btn-connect:hover { border-color: var(--accent); color: var(--accent); }

  #component .btn-primary {
    background: var(--ink);
    color: var(--on-ink);
    padding: 0 32px;
  }
  #component .btn-primary:hover { background: var(--accent); }

  /* Footer actions */
  #component .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <div class="grid">
    <main>
      <div class="progress">
        <span class="progress-label">Step 2 of 4</span>
        <div class="progress-bar" aria-hidden="true">
          <span class="done"></span>
          <span class="done"></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <h1>Connect your tools</h1>
      <p class="lead">Harbor works best with the tools your team already uses.</p>

      <ul class="options">
        <li class="option">
          <div class="option-text">
            <h2>Slack</h2>
            <p>Get request updates in your channels</p>
          </div>
          <button type="button" class="btn btn-quiet btn-connect" aria-label="Connect Slack">Connect</button>
        </li>
        <li class="option">
          <div class="option-text">
            <h2>Google Calendar</h2>
            <p>See due dates on your calendar</p>
          </div>
          <button type="button" class="btn btn-quiet btn-connect" aria-label="Connect Google Calendar">Connect</button>
        </li>
        <li class="option">
          <div class="option-text">
            <h2>Jira</h2>
            <p>Link requests to engineering tickets</p>
          </div>
          <button type="button" class="btn btn-quiet btn-connect" aria-label="Connect Jira">Connect</button>
        </li>
      </ul>

      <div class="actions">
        <button type="button" class="btn btn-quiet">Skip for Now</button>
        <button type="button" class="btn btn-primary">Continue</button>
      </div>
    </main>
  </div>
</div>
</body>
</html>
