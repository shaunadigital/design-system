<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor: Connect your tools</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 900px;
    margin: 0;
    padding: 96px 64px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
  }

  #component main {
    grid-column: 2 / span 10;
  }

  #component .progress {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  #component .label {
    margin: 0;
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #0263AC;
  }

  #component .bar {
    display: flex;
    gap: 8px;
  }

  #component .bar span {
    display: block;
    width: 32px;
    height: 4px;
    border-radius: 999px;
    background: #9CC3EA;
  }

  #component .bar span.done {
    background: #0263AC;
  }

  #component h1 {
    margin: 24px 0 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  #component .lead {
    margin: 16px 0 0;
    font-size: 22px;
    line-height: 1.5;
    color: #55656A;
  }

  #component ul {
    list-style: none;
    margin: 48px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #component .card {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 24px 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  #component .icon {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #EEF4FA;
    color: #0263AC;
  }

  #component .icon svg {
    width: 24px;
    height: 24px;
    display: block;
  }

  #component .text {
    flex: 1;
    min-width: 0;
  }

  #component h2 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  #component .text p {
    margin: 4px 0 0;
    font-size: 16px;
    line-height: 1.5;
    color: #55656A;
  }

  #component .btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    min-width: 44px;
    padding: 0 32px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 24px;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component .btn-quiet {
    background: transparent;
    color: #0B1416;
  }

  #component .btn-quiet:hover {
    background: #E6EFF7;
  }

  #component .btn-outline {
    border-color: #0B1416;
  }

  #component .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
  }

  #component .btn-primary:hover {
    background: #0263AC;
  }

  #component .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  #component .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 48px;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <div class="grid">
    <main>
      <div class="progress">
        <p class="label">Step 2 of 4</p>
        <div class="bar" aria-hidden="true">
          <span class="done"></span>
          <span class="done"></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <h1>Connect your tools</h1>
      <p class="lead">Harbor works best with the tools your team already uses.</p>

      <ul>
        <li class="card">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 7 21M17 3l-2 18M4 9h17M3 15h17"/></svg>
          </span>
          <div class="text">
            <h2>Slack</h2>
            <p>Get request updates in your channels</p>
          </div>
          <button type="button" class="btn btn-quiet btn-outline" aria-label="Connect Slack">Connect</button>
        </li>

        <li class="card">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </span>
          <div class="text">
            <h2>Google Calendar</h2>
            <p>See due dates on your calendar</p>
          </div>
          <button type="button" class="btn btn-quiet btn-outline" aria-label="Connect Google Calendar">Connect</button>
        </li>

        <li class="card">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21 12 12 21 3 12Z"/><path d="M12 8l4 4-4 4-4-4Z"/></svg>
          </span>
          <div class="text">
            <h2>Jira</h2>
            <p>Link requests to engineering tickets</p>
          </div>
          <button type="button" class="btn btn-quiet btn-outline" aria-label="Connect Jira">Connect</button>
        </li>
      </ul>

      <div class="actions">
        <button type="button" class="btn btn-quiet">Skip for Now</button>
        <button type="button" class="btn btn-primary">Continue</button>
      </div>
    </main>
  </div>
</div>
</body>
</html>
