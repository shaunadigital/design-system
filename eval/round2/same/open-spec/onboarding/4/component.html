<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor: Connect your tools</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 800px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
  }
  #component h1,
  #component h2,
  #component p,
  #component ul { margin: 0; padding: 0; }
  #component ul { list-style: none; }

  #component .page {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    padding: 96px 64px 64px;
  }
  #component .content { grid-column: 3 / span 8; }

  /* Progress */
  #component .progress-label {
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0263AC;
  }
  #component .progress-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  #component .progress-bar span {
    height: 4px;
    border-radius: 999px;
    background: #9CC3EA;
  }
  #component .progress-bar span.done { background: #0263AC; }

  /* Heading */
  #component h1 {
    margin-top: 48px;
    font-family: "Unbounded", "Archivo", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.15;
    letter-spacing: 0;
    text-transform: uppercase;
    color: #0B1416;
  }
  #component .lead {
    margin-top: 16px;
    font-size: 22px;
    line-height: 1.5;
    color: #55656A;
  }

  /* Options */
  #component .options {
    display: grid;
    gap: 16px;
    margin-top: 48px;
  }
  #component .option {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    align-items: center;
    column-gap: 24px;
    padding: 24px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }
  #component .icon {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #EEF4FA;
    color: #0263AC;
  }
  #component .icon svg { width: 24px; height: 24px; display: block; }
  #component .option h2 {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.4;
    color: #0B1416;
  }
  #component .option p {
    margin-top: 4px;
    font-size: 16px;
    line-height: 1.5;
    color: #55656A;
  }

  /* Buttons */
  #component .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    min-width: 44px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: #0B1416;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn-quiet:hover { background: #E6EFF7; }
  #component .btn-outline { border-color: #0B1416; }
  #component .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
    padding: 0 32px;
  }
  #component .btn-primary:hover { background: #0263AC; }
  #component .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  /* Actions */
  #component .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid #9CC3EA;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <div class="page">
    <main class="content">
      <div class="progress">
        <p class="progress-label" id="progress-text">Step 2 of 4</p>
        <div class="progress-bar" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="2" aria-labelledby="progress-text">
          <span class="done"></span>
          <span class="done"></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <h1>Connect your tools</h1>
      <p class="lead">Harbor works best with the tools your team already uses.</p>

      <ul class="options">
        <li class="option">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 7 21M17 3l-2 18M4 9h17M3 15h17"/></svg>
          </span>
          <div>
            <h2>Slack</h2>
            <p>Get request updates in your channels</p>
          </div>
          <button class="btn btn-quiet btn-outline" type="button" aria-label="Connect Slack">Connect</button>
        </li>

        <li class="option">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </span>
          <div>
            <h2>Google Calendar</h2>
            <p>See due dates on your calendar</p>
          </div>
          <button class="btn btn-quiet btn-outline" type="button" aria-label="Connect Google Calendar">Connect</button>
        </li>

        <li class="option">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 11l8 8 8-8-8-8Z"/><path d="m12 11-3 3 3 3 3-3-3-3Z"/></svg>
          </span>
          <div>
            <h2>Jira</h2>
            <p>Link requests to engineering tickets</p>
          </div>
          <button class="btn btn-quiet btn-outline" type="button" aria-label="Connect Jira">Connect</button>
        </li>
      </ul>

      <div class="actions">
        <button class="btn btn-quiet" type="button">Skip for Now</button>
        <button class="btn btn-primary" type="button">Continue</button>
      </div>
    </main>
  </div>
</div>
</body>
</html>
