<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor: Connect your tools</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 96px 64px 64px;
    background: #FFFFFF;
    color: #0B1416;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
  }

  main {
    grid-column: 1 / span 10;
  }

  .progress {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 240px;
    margin: 0 0 32px;
  }

  .progress-label {
    margin: 0;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0263AC;
  }

  .progress-track {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .progress-track li {
    height: 4px;
    border-radius: 999px;
    background: #9CC3EA;
  }

  .progress-track li.done {
    background: #0263AC;
  }

  h1 {
    margin: 0 0 16px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.15;
    letter-spacing: 0;
    text-transform: uppercase;
    color: #0B1416;
  }

  .lead {
    margin: 0 0 48px;
    font-size: 22px;
    line-height: 1.4;
    color: #55656A;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 24px 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  .icon {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: #EEF4FA;
    color: #0B1416;
  }

  .icon svg {
    width: 24px;
    height: 24px;
    display: block;
  }

  .card-text {
    flex: 1;
    min-width: 0;
  }

  .card-text h2 {
    margin: 0 0 4px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: 0;
    color: #0B1416;
  }

  .card-text p {
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
    color: #55656A;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 8px 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: #0B1416;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 24px;
    letter-spacing: 0;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .btn-connect {
    flex: none;
    min-width: 128px;
    border-color: #0B1416;
  }

  .btn-connect:hover,
  .btn-quiet:hover {
    background: #E6EFF7;
  }

  .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
  }

  .btn-primary:hover {
    background: #0263AC;
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 16px;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid #9CC3EA;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <div class="grid">
    <main>
      <div class="progress">
        <p class="progress-label">Step 2 of 4</p>
        <ol class="progress-track" aria-hidden="true">
          <li class="done"></li>
          <li class="done"></li>
          <li></li>
          <li></li>
        </ol>
      </div>

      <h1>Connect your tools</h1>
      <p class="lead">Harbor works best with the tools your team already uses.</p>

      <ul class="options">
        <li class="card">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4 8 20M16 4l-1.5 16M4.5 9h15M4 15h15"/></svg>
          </span>
          <div class="card-text">
            <h2>Slack</h2>
            <p>Get request updates in your channels</p>
          </div>
          <button class="btn btn-connect" type="button" aria-label="Connect Slack">Connect</button>
        </li>

        <li class="card">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          </span>
          <div class="card-text">
            <h2>Google Calendar</h2>
            <p>See due dates on your calendar</p>
          </div>
          <button class="btn btn-connect" type="button" aria-label="Connect Google Calendar">Connect</button>
        </li>

        <li class="card">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.700l1-1"/></svg>
          </span>
          <div class="card-text">
            <h2>Jira</h2>
            <p>Link requests to engineering tickets</p>
          </div>
          <button class="btn btn-connect" type="button" aria-label="Connect Jira">Connect</button>
        </li>
      </ul>

      <div class="actions">
        <button class="btn btn-quiet" type="button">Skip for Now</button>
        <button class="btn btn-primary" type="button">Continue</button>
      </div>
    </main>
  </div>
</div>
</body>
</html>
