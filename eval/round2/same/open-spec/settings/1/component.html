<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace settings</title>
<style>
  :root {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --display: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    --text: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--text);
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 100vh;
    padding: 64px 64px 96px;
    background: var(--paper);
  }

  h1, h2, p { margin: 0; }

  h1 {
    font-family: var(--display);
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin-bottom: 64px;
  }

  .section {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    padding-top: 48px;
    border-top: 1px solid var(--accent-line);
    margin-bottom: 48px;
  }

  .section:last-child { margin-bottom: 0; }

  .section h2 {
    grid-column: 1 / span 4;
    font-family: var(--display);
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .card {
    grid-column: 5 / span 8;
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
    padding: 32px;
  }

  .field + .field { margin-top: 24px; }

  .field label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .field input {
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border: 1px solid var(--muted);
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--text);
    font-size: 16px;
    transition: border-color 120ms var(--ease), background-color 120ms var(--ease);
  }

  .field input:hover { background: var(--accent-tint); }

  .field input:focus-visible,
  .btn:focus-visible,
  .switch-row input:focus-visible ~ .track {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .field input:focus-visible { border-color: var(--accent); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 32px;
    border: 1px solid var(--ink);
    border-radius: 999px;
    font-family: var(--text);
    font-weight: 500;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: background-color 180ms var(--ease), color 180ms var(--ease), border-color 180ms var(--ease);
  }

  .btn-primary { background: var(--ink); color: var(--on-ink); }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); }

  .btn-quiet { background: transparent; color: var(--ink); }
  .btn-quiet:hover { background: var(--accent-tint); }

  .card .btn { margin-top: 32px; }

  .switch-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    min-height: 64px;
    padding: 8px 0;
    border-top: 1px solid var(--accent-line);
    cursor: pointer;
  }

  .switch-row:first-child { border-top: 0; padding-top: 0; }
  .switch-row:last-child { padding-bottom: 0; }

  .switch-row input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    margin: 0;
  }

  .track {
    position: relative;
    flex: none;
    width: 52px;
    height: 32px;
    border: 1px solid var(--muted);
    border-radius: 999px;
    background: var(--paper);
    transition: background-color 180ms var(--ease), border-color 180ms var(--ease);
  }

  .track::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 999px;
    background: var(--muted);
    transition: transform 180ms var(--ease), background-color 180ms var(--ease);
  }

  .switch-row input:checked ~ .track {
    background: var(--ink);
    border-color: var(--ink);
  }

  .switch-row input:checked ~ .track::after {
    background: var(--on-ink);
    transform: translateX(20px);
  }

  .switch-row:hover .track { border-color: var(--accent); }
  .switch-row:hover input:checked ~ .track { background: var(--accent); }

  .danger-text { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main id="component">
  <h1>Workspace settings</h1>

  <section class="section" aria-labelledby="general-title">
    <h2 id="general-title">General</h2>
    <form class="card" action="#" onsubmit="return false">
      <div class="field">
        <label for="workspace-name">Workspace name</label>
        <input id="workspace-name" type="text" value="Harbor Ops">
      </div>
      <div class="field">
        <label for="workspace-url">Workspace URL</label>
        <input id="workspace-url" type="text" value="harbor.app/ops">
      </div>
      <button class="btn btn-primary" type="button">Save Changes</button>
    </form>
  </section>

  <section class="section" aria-labelledby="notifications-title">
    <h2 id="notifications-title">Notifications</h2>
    <div class="card">
      <label class="switch-row">
        <input type="checkbox" role="switch" checked>
        <span>Email me when a request is assigned to me</span>
        <span class="track" aria-hidden="true"></span>
      </label>
      <label class="switch-row">
        <input type="checkbox" role="switch" checked>
        <span>Weekly summary</span>
        <span class="track" aria-hidden="true"></span>
      </label>
      <label class="switch-row">
        <input type="checkbox" role="switch">
        <span>Product updates</span>
        <span class="track" aria-hidden="true"></span>
      </label>
    </div>
  </section>

  <section class="section" aria-labelledby="danger-title">
    <h2 id="danger-title">Danger zone</h2>
    <div class="card">
      <p class="danger-text">Deleting a workspace removes all of its requests for everyone.</p>
      <button class="btn btn-quiet" type="button">Delete Workspace</button>
    </div>
  </section>
</main>
</body>
</html>
