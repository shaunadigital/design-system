<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace settings</title>
<style>
  :root {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --curve: cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: var(--sand);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    row-gap: 32px;
  }

  .grid > * { grid-column: 1 / -1; }

  h1 {
    margin: 0 0 16px;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }

  h2 {
    margin: 0 0 24px;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: 0;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
    padding: 32px;
  }

  .card.danger { border-color: var(--ink); }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 32px;
  }

  .field { display: flex; flex-direction: column; gap: 8px; }

  .field label {
    font-weight: 500;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .field input {
    height: 48px;
    padding: 0 16px;
    border: 1px solid var(--muted);
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    transition: background-color 120ms var(--curve), border-color 120ms var(--curve);
  }

  .field input:hover { background: var(--accent-tint); }
  .field input:focus { background: var(--paper); border-color: var(--accent); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 32px;
    border: 1px solid var(--ink);
    border-radius: 999px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    transition: background-color 180ms var(--curve), color 180ms var(--curve), border-color 180ms var(--curve);
  }

  .btn.primary { background: var(--ink); color: var(--on-ink); }
  .btn.primary:hover { background: var(--accent); border-color: var(--accent); }

  .btn.quiet { background: transparent; color: var(--ink); }
  .btn.quiet:hover { background: var(--accent-tint); }

  .actions { margin-top: 32px; }

  .switches { list-style: none; margin: 0; padding: 0; }
  .switches li { border-top: 1px solid var(--accent-line); }
  .switches li:last-child { border-bottom: 1px solid var(--accent-line); }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    min-height: 64px;
    padding: 12px 0;
    cursor: pointer;
  }

  .switch {
    position: relative;
    flex: none;
    width: 56px;
    height: 32px;
  }

  .switch input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .track {
    position: absolute;
    inset: 0;
    border: 1px solid var(--muted);
    border-radius: 999px;
    background: var(--sand);
    transition: background-color 120ms var(--curve), border-color 120ms var(--curve);
    pointer-events: none;
  }

  .track::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 180ms var(--curve), background-color 120ms var(--curve);
  }

  .switch input:checked + .track { background: var(--ink); border-color: var(--ink); }
  .switch input:checked + .track::after { transform: translateX(24px); background: var(--on-ink); }
  .switch-row:hover .track { border-color: var(--accent); }
  .switch-row:hover input:checked + .track { background: var(--accent); }

  .switch input:focus-visible + .track,
  .btn:focus-visible,
  .field input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .danger-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
  }

  .danger-body p { margin: 0; max-width: 640px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="grid">
    <h1>Workspace settings</h1>

    <section class="card" aria-labelledby="general-title">
      <h2 id="general-title">General</h2>
      <form action="#">
        <div class="fields">
          <div class="field">
            <label for="ws-name">Workspace name</label>
            <input id="ws-name" name="workspace-name" type="text" value="Harbor Ops">
          </div>
          <div class="field">
            <label for="ws-url">Workspace URL</label>
            <input id="ws-url" name="workspace-url" type="text" value="harbor.app/ops">
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" type="submit">Save Changes</button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="notifications-title">
      <h2 id="notifications-title">Notifications</h2>
      <ul class="switches">
        <li>
          <label class="switch-row">
            <span>Email me when a request is assigned to me</span>
            <span class="switch">
              <input type="checkbox" role="switch" checked>
              <span class="track"></span>
            </span>
          </label>
        </li>
        <li>
          <label class="switch-row">
            <span>Weekly summary</span>
            <span class="switch">
              <input type="checkbox" role="switch" checked>
              <span class="track"></span>
            </span>
          </label>
        </li>
        <li>
          <label class="switch-row">
            <span>Product updates</span>
            <span class="switch">
              <input type="checkbox" role="switch">
              <span class="track"></span>
            </span>
          </label>
        </li>
      </ul>
    </section>

    <section class="card danger" aria-labelledby="danger-title">
      <h2 id="danger-title">Danger zone</h2>
      <div class="danger-body">
        <p>Deleting a workspace removes all of its requests for everyone.</p>
        <button class="btn quiet" type="button">Delete Workspace</button>
      </div>
    </section>
  </main>
</div>
</body>
</html>
