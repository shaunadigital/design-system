<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace settings</title>
<style>
  :root {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --curve: cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--sand);
  }

  body {
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
    color: var(--ink);
  }

  #component {
    width: 1280px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: var(--sand);
  }

  h1 {
    margin: 0 0 48px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .sections {
    display: grid;
    gap: 32px;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
    padding: 32px;
  }

  h2 {
    margin: 0 0 24px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px 32px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field label {
    font-weight: 500;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .field input {
    height: 48px;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);
    border-radius: 12px;
    transition: border-color 120ms var(--curve), background-color 120ms var(--curve);
  }

  .field input:hover {
    background: var(--accent-tint);
  }

  .field input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-color: var(--accent);
  }

  .actions {
    margin-top: 32px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn {
    min-height: 44px;
    padding: 12px 32px;
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
    border-radius: 999px;
    border: 1px solid var(--ink);
    cursor: pointer;
    transition: background-color 180ms var(--curve), color 180ms var(--curve), border-color 180ms var(--curve);
  }

  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--on-ink);
  }

  .btn-primary:hover {
    background: var(--accent);
    border-color: var(--accent);
  }

  .btn-quiet {
    background: transparent;
    color: var(--ink);
  }

  .btn-quiet:hover {
    background: var(--accent-tint);
  }

  .switches {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .switches li + li {
    border-top: 1px solid var(--accent-line);
  }

  .switch-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    min-height: 64px;
    padding: 12px 0;
    cursor: pointer;
  }

  .switch-row input {
    position: absolute;
    right: 0;
    top: 50%;
    width: 48px;
    height: 44px;
    margin: 0;
    transform: translateY(-50%);
    opacity: 0;
    cursor: pointer;
  }

  .track {
    flex: none;
    position: relative;
    width: 48px;
    height: 28px;
    border-radius: 999px;
    background: var(--muted);
    transition: background-color 120ms var(--curve);
  }

  .track::after {
    content: "";
    position: absolute;
    top: 4px;
    left: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--paper);
    transition: transform 120ms var(--curve);
  }

  .switch-row input:checked + .track {
    background: var(--accent);
  }

  .switch-row input:checked + .track::after {
    transform: translateX(20px);
  }

  .switch-row input:focus-visible + .track {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .danger {
    border-color: var(--ink);
  }

  .danger p {
    margin: 0;
    max-width: 640px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <h1>Workspace settings</h1>

  <div class="sections">
    <section class="card" aria-labelledby="general-title">
      <h2 id="general-title">General</h2>
      <div class="fields">
        <div class="field">
          <label for="workspace-name">Workspace name</label>
          <input id="workspace-name" type="text" value="Harbor Ops">
        </div>
        <div class="field">
          <label for="workspace-url">Workspace URL</label>
          <input id="workspace-url" type="text" value="harbor.app/ops">
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary">Save Changes</button>
      </div>
    </section>

    <section class="card" aria-labelledby="notifications-title">
      <h2 id="notifications-title">Notifications</h2>
      <ul class="switches">
        <li>
          <label class="switch-row">
            <span>Email me when a request is assigned to me</span>
            <input type="checkbox" role="switch" checked>
            <span class="track" aria-hidden="true"></span>
          </label>
        </li>
        <li>
          <label class="switch-row">
            <span>Weekly summary</span>
            <input type="checkbox" role="switch" checked>
            <span class="track" aria-hidden="true"></span>
          </label>
        </li>
        <li>
          <label class="switch-row">
            <span>Product updates</span>
            <input type="checkbox" role="switch">
            <span class="track" aria-hidden="true"></span>
          </label>
        </li>
      </ul>
    </section>

    <section class="card danger" aria-labelledby="danger-title">
      <h2 id="danger-title">Danger zone</h2>
      <p>Deleting a workspace removes all of its requests for everyone.</p>
      <div class="actions">
        <button type="button" class="btn btn-quiet">Delete Workspace</button>
      </div>
    </section>
  </div>
</div>
</body>
</html>
