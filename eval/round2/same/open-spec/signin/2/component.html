<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 96px 64px;
    background: #EEF4FA;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    align-content: center;
  }

  #component .card {
    grid-column: 4 / span 6;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 48px;
  }

  #component h1 {
    margin: 0 0 32px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #0B1416;
  }

  #component form {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  #component .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #component label.label {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0263AC;
  }

  #component input[type="email"],
  #component input[type="password"] {
    width: 100%;
    min-height: 48px;
    padding: 12px 16px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: #0B1416;
    background: #FFFFFF;
    border: 1px solid #55656A;
    border-radius: 12px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component input[type="email"]:hover,
  #component input[type="password"]:hover {
    background: #E6EFF7;
  }
  #component input[type="email"]:focus,
  #component input[type="password"]:focus {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
    border-color: #0263AC;
    background: #FFFFFF;
  }

  #component .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    column-gap: 16px;
    row-gap: 4px;
  }

  #component .check {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    font-size: 16px;
    color: #0B1416;
    cursor: pointer;
  }
  #component .check input {
    width: 24px;
    height: 24px;
    margin: 0;
    accent-color: #0263AC;
    cursor: pointer;
  }
  #component .check input:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  #component a.link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-size: 16px;
    color: #0263AC;
    text-decoration: underline;
    text-underline-offset: 4px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component a.link:hover {
    background: #E6EFF7;
  }
  #component a.link:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  #component .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 8px;
  }

  #component .btn {
    width: 100%;
    min-height: 48px;
    padding: 12px 24px;
    border-radius: 999px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }
  #component .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
    border: 1px solid #0B1416;
  }
  #component .btn-primary:hover {
    background: #0263AC;
    border-color: #0263AC;
  }
  #component .btn-secondary {
    background: transparent;
    color: #0B1416;
    border: 1px solid #0B1416;
  }
  #component .btn-secondary:hover {
    background: #E6EFF7;
  }

  @media (prefers-reduced-motion: reduce) {
    #component * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <h1>Sign in to Harbor</h1>
    <form action="#" method="post">
      <div class="field">
        <label class="label" for="email">Work email</label>
        <input type="email" id="email" name="email" autocomplete="username">
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <div class="row">
        <label class="check">
          <input type="checkbox" name="remember">
          <span>Keep me signed in</span>
        </label>
        <a class="link" href="#">Forgot Password?</a>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Sign In</button>
        <button type="button" class="btn btn-secondary">Continue with SSO</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
