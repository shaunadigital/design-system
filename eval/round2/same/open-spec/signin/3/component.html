<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --curve: cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 96px 64px;
    background: var(--sand);
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    align-content: center;
  }

  #component .card {
    grid-column: 4 / span 6;
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
    padding: 48px;
  }

  #component h1 {
    margin: 0 0 32px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: 0;
    text-transform: uppercase;
    color: var(--ink);
  }

  #component .field { margin: 0 0 24px; }

  #component label.field-label {
    display: block;
    margin-bottom: 8px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  #component input[type="email"],
  #component input[type="password"] {
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);
    border-radius: 12px;
    transition: border-color 120ms var(--curve), background-color 120ms var(--curve);
  }

  #component input[type="email"]:hover,
  #component input[type="password"]:hover {
    background: var(--accent-tint);
  }

  #component input[type="email"]:focus,
  #component input[type="password"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-color: var(--accent);
    background: var(--paper);
  }

  #component .options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 32px;
  }

  #component .remember {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
  }

  #component .remember input {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: var(--accent);
  }

  #component .remember input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #component a.forgot {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-size: 16px;
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 4px;
    transition: background-color 120ms var(--curve);
  }

  #component a.forgot:hover { background: var(--accent-tint); }

  #component a.forgot:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #component .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 12px 24px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 24px;
    letter-spacing: 0.02em;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 180ms var(--curve), color 180ms var(--curve), border-color 180ms var(--curve);
  }

  #component .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #component .btn-primary {
    margin-bottom: 12px;
    color: var(--on-ink);
    background: var(--ink);
    border: 1px solid var(--ink);
  }

  #component .btn-primary:hover {
    background: var(--accent);
    border-color: var(--accent);
  }

  #component .btn-secondary {
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--accent-line);
  }

  #component .btn-secondary:hover {
    background: var(--accent-tint);
    border-color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    #component * { transition: none !important; }
  }
</style>
</head>
<body>
  <div id="component">
    <main class="card">
      <h1>Sign in to Harbor</h1>
      <form action="#" method="post">
        <div class="field">
          <label class="field-label" for="email">Work email</label>
          <input id="email" name="email" type="email" autocomplete="username">
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
        </div>
        <div class="options">
          <label class="remember">
            <input type="checkbox" name="remember">
            <span>Keep me signed in</span>
          </label>
          <a class="forgot" href="#">Forgot Password?</a>
        </div>
        <button class="btn btn-primary" type="submit">Sign In</button>
        <button class="btn btn-secondary" type="button">Continue with SSO</button>
      </form>
    </main>
  </div>
</body>
</html>
