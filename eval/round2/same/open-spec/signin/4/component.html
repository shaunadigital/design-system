<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; background: #FFFFFF; }

  #component {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

    width: 1280px;
    min-height: 800px;
    padding: 96px 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--sand);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
  }

  #component .card {
    width: 560px;
    padding: 48px;
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
  }

  #component h1 {
    margin: 0 0 32px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink);
  }

  #component form { margin: 0; }

  #component .field { margin: 0 0 24px; }

  #component label.field-label {
    display: block;
    margin: 0 0 8px;
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #component input[type="email"],
  #component input[type="password"] {
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 24px;
    letter-spacing: 0;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);
    border-radius: 12px;
    transition: background-color 120ms var(--ease), border-color 120ms var(--ease);
  }

  #component input[type="email"]:hover,
  #component input[type="password"]:hover {
    background: var(--accent-tint);
  }

  #component input[type="email"]:focus,
  #component input[type="password"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-color: var(--accent);
    background: var(--paper);
  }

  #component .options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 32px;
  }

  #component .remember {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
  }

  #component .remember input {
    width: 24px;
    height: 24px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  #component .remember input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #component a.forgot {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-size: 16px;
    color: var(--accent);
    text-decoration: none;
    border-radius: 8px;
  }

  #component a.forgot:hover { text-decoration: underline; text-underline-offset: 4px; }

  #component a.forgot:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #component .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 0 24px;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 24px;
    letter-spacing: 0;
    text-decoration: none;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 180ms var(--ease), color 180ms var(--ease), border-color 180ms var(--ease);
  }

  #component .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #component .btn-primary {
    background: var(--ink);
    color: #FFFFFF;
    border: 1px solid var(--ink);
  }

  #component .btn-primary:hover {
    background: var(--accent);
    border-color: var(--accent);
  }

  #component .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }

  #component .btn-secondary:hover {
    background: var(--accent-tint);
  }

  @media (prefers-reduced-motion: reduce) {
    #component *, #component *::before, #component *::after {
      transition-duration: 0ms !important;
    }
  }
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <h1>Sign in to Harbor</h1>
    <form action="#" method="post">
      <div class="field">
        <label class="field-label" for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username">
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <div class="options">
        <label class="remember">
          <input type="checkbox" name="remember">
          <span>Keep me signed in</span>
        </label>
        <a class="forgot" href="#">Forgot Password?</a>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Sign In</button>
        <button class="btn btn-secondary" type="button">Continue with SSO</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
