<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team | Harbor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #EEF4FA;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 720px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #EEF4FA;
  }

  .page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 32px;
    margin-bottom: 48px;
  }

  h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 32px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
  }
  .btn-primary:hover { background: #0263AC; }
  .btn:focus-visible,
  .role-select select:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .members {
    list-style: none;
    margin: 0;
    padding: 0;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    overflow: hidden;
  }

  .member {
    display: grid;
    grid-template-columns: 1fr 200px;
    align-items: center;
    column-gap: 32px;
    padding: 24px 32px;
    border-top: 1px solid #9CC3EA;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .member:first-child { border-top: 0; }
  .member:hover { background: #E6EFF7; }

  .member-name {
    margin: 0;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.4;
    color: #0B1416;
  }
  .member-email {
    margin: 4px 0 0;
    font-size: 14px;
    line-height: 1.4;
    color: #55656A;
  }

  .role-select { position: relative; display: block; }
  .role-select select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    min-height: 44px;
    padding: 0 48px 0 16px;
    background: #FFFFFF;
    color: #0B1416;
    border: 1px solid #9CC3EA;
    border-radius: 12px;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .role-select select:hover { border-color: #0263AC; }
  .role-select::after {
    content: "";
    position: absolute;
    right: 20px;
    top: 50%;
    width: 8px;
    height: 8px;
    margin-top: -6px;
    border-right: 2px solid #0B1416;
    border-bottom: 2px solid #0B1416;
    transform: rotate(45deg);
    pointer-events: none;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <main>
    <div class="page-header">
      <h1>Team</h1>
      <button type="button" class="btn btn-primary">Invite Member</button>
    </div>

    <ul class="members">
      <li class="member">
        <div>
          <p class="member-name">Maya Chen</p>
          <p class="member-email">maya@harbor.app</p>
        </div>
        <label class="role-select">
          <span class="visually-hidden">Role for Maya Chen</span>
          <select name="role-maya">
            <option selected>Admin</option>
            <option>Editor</option>
            <option>Viewer</option>
          </select>
        </label>
      </li>
      <li class="member">
        <div>
          <p class="member-name">Leo Park</p>
          <p class="member-email">leo@harbor.app</p>
        </div>
        <label class="role-select">
          <span class="visually-hidden">Role for Leo Park</span>
          <select name="role-leo">
            <option>Admin</option>
            <option selected>Editor</option>
            <option>Viewer</option>
          </select>
        </label>
      </li>
      <li class="member">
        <div>
          <p class="member-name">Ana Ruiz</p>
          <p class="member-email">ana@harbor.app</p>
        </div>
        <label class="role-select">
          <span class="visually-hidden">Role for Ana Ruiz</span>
          <select name="role-ana">
            <option>Admin</option>
            <option selected>Editor</option>
            <option>Viewer</option>
          </select>
        </label>
      </li>
      <li class="member">
        <div>
          <p class="member-name">Sam Ito</p>
          <p class="member-email">sam@harbor.app</p>
        </div>
        <label class="role-select">
          <span class="visually-hidden">Role for Sam Ito</span>
          <select name="role-sam">
            <option>Admin</option>
            <option>Editor</option>
            <option selected>Viewer</option>
          </select>
        </label>
      </li>
      <li class="member">
        <div>
          <p class="member-name">Kai Lee</p>
          <p class="member-email">kai@harbor.app</p>
        </div>
        <label class="role-select">
          <span class="visually-hidden">Role for Kai Lee</span>
          <select name="role-kai">
            <option>Admin</option>
            <option>Editor</option>
            <option selected>Viewer</option>
          </select>
        </label>
      </li>
    </ul>
  </main>
</div>
</body>
</html>
