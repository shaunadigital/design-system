<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor | Team</title>
<style>
  :root {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 720px;
    padding: 64px 64px 96px;
    background: var(--paper);
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    flex-wrap: wrap;
    margin-bottom: 48px;
  }

  h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 12px 32px;
    border: 1px solid var(--ink);
    border-radius: 999px;
    background: var(--ink);
    color: var(--on-ink);
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    cursor: pointer;
    transition: background-color 180ms var(--ease), color 180ms var(--ease), border-color 180ms var(--ease);
  }
  .btn-primary:hover {
    background: var(--accent);
    border-color: var(--accent);
  }
  .btn-primary:focus-visible,
  .select-wrap select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
    padding: 0 32px;
  }

  .members {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .member {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    align-items: center;
    padding: 24px 0;
    border-top: 1px solid var(--sand);
  }
  .member:first-child { border-top: 0; }

  .member-name {
    grid-column: span 4;
    margin: 0;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.5;
  }

  .member-email {
    grid-column: span 5;
    margin: 0;
    color: var(--muted);
    font-size: 16px;
  }

  .member-role {
    grid-column: span 3;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .select-wrap {
    position: relative;
    display: block;
  }
  .select-wrap::after {
    content: "";
    position: absolute;
    right: 20px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  .select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    min-height: 44px;
    padding: 8px 48px 8px 16px;
    border: 1px solid var(--muted);
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    cursor: pointer;
    transition: background-color 120ms var(--ease), border-color 120ms var(--ease);
  }
  .select-wrap select:hover {
    background: var(--accent-tint);
    border-color: var(--accent);
  }
</style>
</head>
<body>
<div id="component">
  <header class="page-header">
    <h1>Team</h1>
    <button type="button" class="btn-primary">Invite Member</button>
  </header>

  <section class="card" aria-label="Team members">
    <ul class="members">
      <li class="member">
        <p class="member-name">Maya Chen</p>
        <p class="member-email">maya@harbor.app</p>
        <div class="member-role">
          <label class="visually-hidden" for="role-maya">Role for Maya Chen</label>
          <span class="select-wrap">
            <select id="role-maya">
              <option selected>Admin</option>
              <option>Editor</option>
              <option>Viewer</option>
            </select>
          </span>
        </div>
      </li>
      <li class="member">
        <p class="member-name">Leo Park</p>
        <p class="member-email">leo@harbor.app</p>
        <div class="member-role">
          <label class="visually-hidden" for="role-leo">Role for Leo Park</label>
          <span class="select-wrap">
            <select id="role-leo">
              <option>Admin</option>
              <option selected>Editor</option>
              <option>Viewer</option>
            </select>
          </span>
        </div>
      </li>
      <li class="member">
        <p class="member-name">Ana Ruiz</p>
        <p class="member-email">ana@harbor.app</p>
        <div class="member-role">
          <label class="visually-hidden" for="role-ana">Role for Ana Ruiz</label>
          <span class="select-wrap">
            <select id="role-ana">
              <option>Admin</option>
              <option selected>Editor</option>
              <option>Viewer</option>
            </select>
          </span>
        </div>
      </li>
      <li class="member">
        <p class="member-name">Sam Ito</p>
        <p class="member-email">sam@harbor.app</p>
        <div class="member-role">
          <label class="visually-hidden" for="role-sam">Role for Sam Ito</label>
          <span class="select-wrap">
            <select id="role-sam">
              <option>Admin</option>
              <option>Editor</option>
              <option selected>Viewer</option>
            </select>
          </span>
        </div>
      </li>
      <li class="member">
        <p class="member-name">Kai Lee</p>
        <p class="member-email">kai@harbor.app</p>
        <div class="member-role">
          <label class="visually-hidden" for="role-kai">Role for Kai Lee</label>
          <span class="select-wrap">
            <select id="role-kai">
              <option>Admin</option>
              <option>Editor</option>
              <option selected>Viewer</option>
            </select>
          </span>
        </div>
      </li>
    </ul>
  </section>
</div>
</body>
</html>
