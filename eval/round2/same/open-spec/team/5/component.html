<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team | Harbor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 720px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
  }

  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    margin-bottom: 48px;
  }

  h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 32px;
    border: 1px solid #0B1416;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .btn:hover { background: #0263AC; border-color: #0263AC; }
  .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 4px; }

  .members {
    margin: 0;
    padding: 0;
    list-style: none;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    overflow: hidden;
  }

  .member {
    display: grid;
    grid-template-columns: 48px 1fr 192px;
    align-items: center;
    column-gap: 24px;
    padding: 24px 32px;
    background: #FFFFFF;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .member + .member { border-top: 1px solid #E6EFF7; }
  .member:hover { background: #EEF4FA; }

  .avatar {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: #E6EFF7;
    color: #0263AC;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .who { min-width: 0; }
  .name {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    color: #0B1416;
  }
  .email {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: #55656A;
  }

  .role { position: relative; display: block; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  select {
    display: block;
    width: 100%;
    min-height: 44px;
    padding: 8px 48px 8px 16px;
    border: 1px solid #9CC3EA;
    border-radius: 12px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  select:hover { background: #E6EFF7; border-color: #0263AC; }
  select:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }

  .chevron {
    position: absolute;
    top: 50%;
    right: 16px;
    width: 24px;
    height: 24px;
    margin-top: -12px;
    color: #0263AC;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main id="component">
  <header class="page-head">
    <h1>Team</h1>
    <a class="btn" href="#invite">Invite Member</a>
  </header>

  <ul class="members">
    <li class="member">
      <span class="avatar" aria-hidden="true">MC</span>
      <div class="who">
        <p class="name">Maya Chen</p>
        <p class="email">maya@harbor.app</p>
      </div>
      <div class="role">
        <label class="visually-hidden" for="role-maya">Role for Maya Chen</label>
        <select id="role-maya" name="role-maya">
          <option selected>Admin</option>
          <option>Editor</option>
          <option>Viewer</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </li>

    <li class="member">
      <span class="avatar" aria-hidden="true">LP</span>
      <div class="who">
        <p class="name">Leo Park</p>
        <p class="email">leo@harbor.app</p>
      </div>
      <div class="role">
        <label class="visually-hidden" for="role-leo">Role for Leo Park</label>
        <select id="role-leo" name="role-leo">
          <option>Admin</option>
          <option selected>Editor</option>
          <option>Viewer</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </li>

    <li class="member">
      <span class="avatar" aria-hidden="true">AR</span>
      <div class="who">
        <p class="name">Ana Ruiz</p>
        <p class="email">ana@harbor.app</p>
      </div>
      <div class="role">
        <label class="visually-hidden" for="role-ana">Role for Ana Ruiz</label>
        <select id="role-ana" name="role-ana">
          <option>Admin</option>
          <option selected>Editor</option>
          <option>Viewer</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </li>

    <li class="member">
      <span class="avatar" aria-hidden="true">SI</span>
      <div class="who">
        <p class="name">Sam Ito</p>
        <p class="email">sam@harbor.app</p>
      </div>
      <div class="role">
        <label class="visually-hidden" for="role-sam">Role for Sam Ito</label>
        <select id="role-sam" name="role-sam">
          <option>Admin</option>
          <option>Editor</option>
          <option selected>Viewer</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </li>

    <li class="member">
      <span class="avatar" aria-hidden="true">KL</span>
      <div class="who">
        <p class="name">Kai Lee</p>
        <p class="email">kai@harbor.app</p>
      </div>
      <div class="role">
        <label class="visually-hidden" for="role-kai">Role for Kai Lee</label>
        <select id="role-kai" name="role-kai">
          <option>Admin</option>
          <option>Editor</option>
          <option selected>Viewer</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
