<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals · Harbor</title>
<style>
/* tokens.css, inlined so this file stands alone */
:root {
  --paper: #FFFFFF;
  --paper-rgb: 255, 255, 255;
  --sand: #EEF4FA;
  --sand-rgb: 238, 244, 250;
  --card: #FFFFFF;
  --card-rgb: 255, 255, 255;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --muted-rgb: 85, 101, 106;
  --accent-text: #0263AC;
  --accent-text-rgb: 2, 99, 172;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --koa: #A65F35;
  --koa-rgb: 166, 95, 53;
  --white: #FFFFFF;
  --white-rgb: 255, 255, 255;
  --accent-tint: #E6EFF7;
  --accent-tint-rgb: 230, 239, 247;
  --accent-line: #9CC3EA;
  --accent-line-rgb: 156, 195, 234;
  --on-ink: #FFFFFF;
  --on-ink-rgb: 255, 255, 255;
  --shadow: #0B1416;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --font-hero: 'Unbounded', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --paper-rgb: 14, 22, 24;
  --sand: #131E21;
  --card: #172327;
  --card-rgb: 23, 35, 39;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --muted-rgb: 157, 174, 177;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --on-ink: #0E1618;
  --shadow: #000000;
  --shadow-rgb: 0, 0, 0;
}

/* Screen */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }
body { font-family: var(--font-body); color: var(--ink); }

#component {
  width: 1280px;
  min-height: 100vh;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-head h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
  color: var(--ink);
}
.page-head p {
  margin: var(--space-3) 0 0;
  font-size: var(--text-body-l);
  color: var(--muted);
}

.queue {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.item {
  display: grid;
  grid-template-columns: 1fr 200px auto;
  align-items: center;
  column-gap: var(--space-6);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.item-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
  color: var(--ink);
}
.item-requester {
  margin: var(--space-2) 0 0;
  font-size: var(--text-body);
  color: var(--muted);
}
.item-amount {
  margin: 0;
  font-family: var(--font-hero);
  font-weight: 300;
  font-size: var(--text-hero);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-align: right;
  white-space: nowrap;
  color: var(--ink);
}
.item-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  min-width: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  color: var(--ink);
  background: transparent;
  border: 0;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--secondary { border: 1.5px solid var(--ink); }
.btn--secondary:hover { background: var(--accent-tint); }
.btn--quiet:hover { background: var(--accent-tint); }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="page-head">
      <h1>Approvals</h1>
      <p>3 waiting for you</p>
    </header>

    <ul class="queue">
      <li class="item">
        <div>
          <h2 class="item-title">Q4 travel budget</h2>
          <p class="item-requester">Leo Park</p>
        </div>
        <p class="item-amount">$4,800</p>
        <div class="item-actions">
          <button type="button" class="btn btn--secondary" aria-label="Approve Q4 travel budget">Approve</button>
          <button type="button" class="btn btn--quiet" aria-label="Decline Q4 travel budget">Decline</button>
        </div>
      </li>

      <li class="item">
        <div>
          <h2 class="item-title">Design conference tickets</h2>
          <p class="item-requester">Maya Chen</p>
        </div>
        <p class="item-amount">$1,250</p>
        <div class="item-actions">
          <button type="button" class="btn btn--secondary" aria-label="Approve Design conference tickets">Approve</button>
          <button type="button" class="btn btn--quiet" aria-label="Decline Design conference tickets">Decline</button>
        </div>
      </li>

      <li class="item">
        <div>
          <h2 class="item-title">Standing desks for support</h2>
          <p class="item-requester">Ana Ruiz</p>
        </div>
        <p class="item-amount">$2,100</p>
        <div class="item-actions">
          <button type="button" class="btn btn--secondary" aria-label="Approve Standing desks for support">Approve</button>
          <button type="button" class="btn btn--quiet" aria-label="Decline Standing desks for support">Decline</button>
        </div>
      </li>
    </ul>
  </main>
</div>
</body>
</html>
