<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals · Harbor</title>
<style>
/* Tokens from tokens.css */
:root {
  --paper: #FFFFFF;
  --paper-rgb: 255, 255, 255;
  --sand: #EEF4FA;
  --sand-rgb: 238, 244, 250;
  --card: #FFFFFF;
  --card-rgb: 255, 255, 255;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --muted-rgb: 85, 101, 106;
  --accent-text: #0263AC;
  --accent-text-rgb: 2, 99, 172;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --accent-tint: #E6EFF7;
  --accent-tint-rgb: 230, 239, 247;
  --on-ink: #FFFFFF;
  --on-ink-rgb: 255, 255, 255;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-snug: -0.01em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-lead: 1.375rem;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 1280px;
  min-height: 720px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  background: var(--paper);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-head h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
  color: var(--ink);
}

.page-head p {
  margin: var(--space-3) 0 0;
  font-size: var(--text-body-l);
  color: var(--muted);
}

.queue {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.item {
  display: grid;
  grid-template-columns: 1fr 140px auto;
  align-items: center;
  column-gap: var(--space-6);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.item-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.25;
  letter-spacing: var(--tracking-tight);
  color: var(--ink);
}

.item-requester {
  margin: var(--space-1) 0 0;
  font-size: var(--text-small);
  color: var(--muted);
}

.item-amount {
  font-size: var(--text-body-l);
  font-weight: 600;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

.actions {
  display: flex;
  gap: var(--space-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-small);
  font-weight: 600;
  line-height: 1;
  color: var(--ink);
  background: transparent;
  border: 0;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}

.btn--secondary {
  border: 1.5px solid var(--ink);
}

.btn--secondary:hover { background: var(--accent-tint); }
.btn--quiet:hover { background: var(--accent-tint); }

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="page-head">
      <h1>Approvals</h1>
      <p>3 waiting for you</p>
    </header>

    <ul class="queue">
      <li class="item">
        <div>
          <h2 class="item-title" data-user-content>Q4 travel budget</h2>
          <p class="item-requester">Leo Park</p>
        </div>
        <div class="item-amount">$4,800</div>
        <div class="actions">
          <button class="btn btn--secondary" type="button" aria-label="Approve Q4 travel budget">Approve</button>
          <button class="btn btn--quiet" type="button" aria-label="Decline Q4 travel budget">Decline</button>
        </div>
      </li>

      <li class="item">
        <div>
          <h2 class="item-title" data-user-content>Design conference tickets</h2>
          <p class="item-requester">Maya Chen</p>
        </div>
        <div class="item-amount">$1,250</div>
        <div class="actions">
          <button class="btn btn--secondary" type="button" aria-label="Approve Design conference tickets">Approve</button>
          <button class="btn btn--quiet" type="button" aria-label="Decline Design conference tickets">Decline</button>
        </div>
      </li>

      <li class="item">
        <div>
          <h2 class="item-title" data-user-content>Standing desks for support</h2>
          <p class="item-requester">Ana Ruiz</p>
        </div>
        <div class="item-amount">$2,100</div>
        <div class="actions">
          <button class="btn btn--secondary" type="button" aria-label="Approve Standing desks for support">Approve</button>
          <button class="btn btn--quiet" type="button" aria-label="Decline Standing desks for support">Decline</button>
        </div>
      </li>
    </ul>
  </main>
</div>
</body>
</html>
