<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals · Harbor</title>
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --on-ink: #FFFFFF;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-hero: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-tight: -0.02em;
    --text-hero: clamp(1.5rem, 3.34vw, 3rem);
    --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
    --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
    --text-body: 1rem;
    --text-small: 0.875rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 720px;
    padding: var(--space-7) var(--space-6);
    background: var(--paper);
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .page-head h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-heading);
    line-height: 1.1;
    letter-spacing: var(--tracking-tight);
    text-transform: uppercase;
  }

  .page-head p {
    margin: var(--space-3) 0 0;
    font-size: var(--text-body);
    color: var(--muted);
  }

  .queue {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  .item {
    display: grid;
    grid-template-columns: 1fr 200px auto;
    align-items: center;
    column-gap: var(--space-6);
    padding: var(--space-5);
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
  }

  .item h2 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-step);
    line-height: 1.2;
    text-transform: uppercase;
  }

  .item .requester {
    margin: var(--space-2) 0 0;
    font-size: var(--text-body);
    color: var(--muted);
  }

  .item .amount {
    margin: 0;
    text-align: right;
    font-family: var(--font-hero);
    font-weight: 300;
    font-size: var(--text-hero);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 20px;
    border-radius: var(--radius-pill);
    border: 1.5px solid transparent;
    background: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: var(--text-small);
    line-height: 1;
    cursor: pointer;
    transition: background var(--dur-base) var(--ease);
  }

  .btn--secondary { border-color: var(--ink); }

  .btn--secondary:hover,
  .btn--quiet:hover { background: var(--accent-tint); }

  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="page-head">
      <h1>Approvals</h1>
      <p>3 waiting for you</p>
    </header>

    <ul class="queue">
      <li class="item">
        <div>
          <h2 data-user-content>Q4 travel budget</h2>
          <p class="requester">Leo Park</p>
        </div>
        <p class="amount">$4,800</p>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>

      <li class="item">
        <div>
          <h2 data-user-content>Design conference tickets</h2>
          <p class="requester">Maya Chen</p>
        </div>
        <p class="amount">$1,250</p>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>

      <li class="item">
        <div>
          <h2 data-user-content>Standing desks for support</h2>
          <p class="requester">Ana Ruiz</p>
        </div>
        <p class="amount">$2,100</p>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>
    </ul>
  </main>
</div>
</body>
</html>
