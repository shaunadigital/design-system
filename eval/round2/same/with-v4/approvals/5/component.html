<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Approvals · Harbor</title>
<style>
/* Tokens from tokens.css (only the ones this screen uses) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-9: 96px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-lead: 1.375rem;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 720px;
  margin: 0 auto;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  padding: var(--space-7) var(--space-6) var(--space-9);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-head h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
  letter-spacing: var(--tracking-snug);
}
.page-head p {
  margin: var(--space-3) 0 0;
  font-size: var(--text-body-l);
  color: var(--muted);
}

.queue {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.item {
  display: grid;
  grid-template-columns: 1fr 140px auto;
  align-items: center;
  column-gap: var(--space-6);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.item h2 {
  margin: 0;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-body-l);
  line-height: 1.3;
}
.item .requester {
  margin: var(--space-1) 0 0;
  font-size: var(--text-small);
  color: var(--muted);
}
.item .amount {
  margin: 0;
  text-align: right;
  font-weight: 600;
  font-size: var(--text-lead);
  font-variant-numeric: tabular-nums;
}
.actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  color: var(--ink);
  background: transparent;
  border: 0;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.btn:hover { background: rgba(var(--ink-rgb), 0.06); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--secondary { border: 1.5px solid var(--ink); }
.btn--quiet { border: 0; }
</style>
</head>
<body>
<main id="component">
  <div class="page">
    <header class="page-head">
      <h1>Approvals</h1>
      <p>3 waiting for you</p>
    </header>

    <ul class="queue">
      <li class="item">
        <div>
          <h2 data-user-content>Q4 travel budget</h2>
          <p class="requester">Leo Park</p>
        </div>
        <p class="amount">$4,800</p>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>

      <li class="item">
        <div>
          <h2 data-user-content>Design conference tickets</h2>
          <p class="requester">Maya Chen</p>
        </div>
        <p class="amount">$1,250</p>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>

      <li class="item">
        <div>
          <h2 data-user-content>Standing desks for support</h2>
          <p class="requester">Ana Ruiz</p>
        </div>
        <p class="amount">$2,100</p>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>
    </ul>
  </div>
</main>
</body>
</html>
