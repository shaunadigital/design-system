<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing · Harbor</title>
<style>
/* Tokens inlined from tokens.css */
:root {
  --paper: #FFFFFF;
  --paper-rgb: 255, 255, 255;
  --sand: #EEF4FA;
  --sand-rgb: 238, 244, 250;
  --card: #FFFFFF;
  --card-rgb: 255, 255, 255;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --muted-rgb: 85, 101, 106;
  --accent-text: #0263AC;
  --accent-text-rgb: 2, 99, 172;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --accent-tint: #E6EFF7;
  --accent-tint-rgb: 230, 239, 247;
  --on-ink: #FFFFFF;
  --on-ink-rgb: 255, 255, 255;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --font-hero: 'Unbounded', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 1280px;
  min-height: 800px;
  margin: 0 auto;
  background: var(--paper);
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
}

.section-title {
  margin: 0 0 var(--space-4);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  text-transform: uppercase;
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

/* Current plan */
.plan {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-6);
}
.plan-info {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  flex: 1;
  min-width: 0;
}
.plan-name {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  text-transform: uppercase;
}
.price {
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
}
.price-amount {
  font-family: var(--font-hero);
  font-weight: 300;
  font-size: var(--text-hero);
  line-height: 1.1;
}
.price-unit {
  font-size: var(--text-small);
  color: var(--muted);
}
.seats {
  max-width: 360px;
}
.seats-text {
  margin: 0 0 var(--space-2);
  font-size: var(--text-body);
}
.seats-bar {
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  overflow: hidden;
}
.seats-fill {
  width: 72%;
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--accent);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  border: 1.5px solid transparent;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease);
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--primary:hover { opacity: 0.88; }
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Table */
.table-card { padding: var(--space-2) var(--space-5); }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-small);
  text-align: left;
}
th, td {
  height: 52px;
  padding: 0 var(--space-3) 0 0;
  text-align: left;
  vertical-align: middle;
}
th {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
tbody tr + tr td,
thead + tbody tr:first-child td {
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
}
td { font-variant-numeric: tabular-nums; }
.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  font-size: var(--text-label);
  font-weight: 600;
  line-height: 1.5;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1 class="page-title">Billing</h1>

    <section class="card plan" aria-labelledby="plan-name">
      <div class="plan-info">
        <h2 class="plan-name" id="plan-name">Team plan</h2>
        <p class="price"><span class="price-amount">$24</span> <span class="price-unit">per seat per month</span></p>
        <div class="seats">
          <p class="seats-text">18 of 25 seats used</p>
          <div class="seats-bar" aria-hidden="true"><div class="seats-fill"></div></div>
        </div>
      </div>
      <button class="btn btn--primary" type="button">Change Plan</button>
    </section>

    <section aria-labelledby="invoices-title">
      <h2 class="section-title" id="invoices-title">Invoices</h2>
      <div class="card table-card">
        <table>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Amount</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Oct 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
            <tr><td>Sep 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
            <tr><td>Aug 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
            <tr><td>Jul 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</body>
</html>
