<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing · Harbor</title>
<style>
/* tokens.css, inlined */
:root {
  --paper: #FFFFFF;
  --paper-rgb: 255, 255, 255;
  --sand: #EEF4FA;
  --sand-rgb: 238, 244, 250;
  --card: #FFFFFF;
  --card-rgb: 255, 255, 255;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --muted-rgb: 85, 101, 106;
  --accent-text: #0263AC;
  --accent-text-rgb: 2, 99, 172;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --koa: #A65F35;
  --koa-rgb: 166, 95, 53;
  --white: #FFFFFF;
  --white-rgb: 255, 255, 255;
  --accent-tint: #E6EFF7;
  --accent-tint-rgb: 230, 239, 247;
  --accent-line: #9CC3EA;
  --accent-line-rgb: 156, 195, 234;
  --on-ink: #FFFFFF;
  --on-ink-rgb: 255, 255, 255;
  --shadow: #0B1416;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --font-hero: 'Unbounded', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tighter: -0.03em;
  --tracking-tight: -0.02em;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

.plan {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: var(--space-6);
}
.plan-main { display: flex; flex-direction: column; gap: var(--space-4); }
.plan-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}
.price { margin: 0; display: flex; align-items: baseline; gap: var(--space-2); }
.price-amount {
  font-family: var(--font-hero);
  font-weight: 300;
  font-size: var(--text-hero);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
}
.price-unit { font-size: var(--text-small); color: var(--muted); }

.plan-side { display: flex; align-items: center; gap: var(--space-6); }
.seats { margin: 0; display: flex; flex-direction: column; gap: var(--space-2); min-width: 200px; }
.seats-text { font-size: var(--text-body); }
.seats-bar {
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  overflow: hidden;
}
.seats-bar span { display: block; width: 72%; height: 100%; background: var(--accent); border-radius: var(--radius-pill); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font: inherit;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity var(--dur-fast) var(--ease);
}
.btn--primary { background: var(--ink); color: var(--on-ink); border: 0; }
.btn--primary:hover { opacity: 0.88; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.invoices-title {
  margin: 0 0 var(--space-4);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

table { width: 100%; border-collapse: collapse; font-size: var(--text-small); }
th {
  text-align: left;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 var(--space-3) var(--space-3) 0;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
td {
  height: 52px;
  padding: 0 var(--space-3) 0 0;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
  font-variant-numeric: tabular-nums;
}
tbody tr:last-child td { border-bottom: 0; }
th:nth-child(1), td:nth-child(1) { width: 40%; }
th:nth-child(2), td:nth-child(2) { width: 30%; }

.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  font-size: var(--text-label);
  font-weight: 600;
  line-height: 1.5;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1 class="page-title">Billing</h1>

    <section class="card plan" aria-label="Current plan">
      <div class="plan-main">
        <h2 class="plan-title">Team plan</h2>
        <p class="price"><span class="price-amount">$24</span><span class="price-unit">per seat per month</span></p>
      </div>
      <div class="plan-side">
        <div class="seats">
          <span class="seats-text">18 of 25 seats used</span>
          <span class="seats-bar" aria-hidden="true"><span></span></span>
        </div>
        <button type="button" class="btn btn--primary">Change Plan</button>
      </div>
    </section>

    <section class="card" aria-labelledby="invoices-heading">
      <h2 class="invoices-title" id="invoices-heading">Invoices</h2>
      <table>
        <thead>
          <tr><th scope="col">Date</th><th scope="col">Amount</th><th scope="col">Status</th></tr>
        </thead>
        <tbody>
          <tr><td>Oct 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Sep 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Aug 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Jul 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
