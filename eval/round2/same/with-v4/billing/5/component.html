<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor · Billing</title>
<meta name="viewport" content="width=1280">
<style>
/* Tokens from tokens.css (light theme, the ones this screen uses) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --font-hero: 'Unbounded', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 720px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-small);
  line-height: 1.5;
}

#component .page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

#component h1,
#component h2,
#component h3 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  text-transform: uppercase;
  line-height: 1.1;
}
#component h1 { font-size: var(--text-heading); }
#component h2,
#component h3 { font-size: var(--text-step); }

#component .top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#component .card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

/* Current plan */
#component .plan {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-6);
}
#component .plan-main {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  min-width: 0;
}
#component .price {
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
}
#component .price-amount {
  font-family: var(--font-hero);
  font-weight: 300;
  font-size: var(--text-hero);
  line-height: 1.1;
}
#component .price-unit {
  font-size: var(--text-small);
  color: var(--muted);
}
#component .seats {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  width: 320px;
}
#component .seats p {
  margin: 0;
  font-size: var(--text-small);
}
#component .meter {
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  overflow: hidden;
}
#component .meter-fill {
  display: block;
  height: 100%;
  width: 72%;
  border-radius: var(--radius-pill);
  background: var(--accent);
}

/* Buttons */
#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  border: 1.5px solid transparent;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease);
}
#component .btn--primary {
  background: var(--ink);
  color: var(--on-ink);
}
#component .btn:hover { opacity: 0.88; }
#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Invoices */
#component .invoices {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
#component table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-small);
}
#component th {
  height: 44px;
  padding: 0 var(--space-3);
  text-align: left;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
#component td {
  height: 52px;
  padding: 0 var(--space-3);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
  font-variant-numeric: tabular-nums;
}
#component tbody tr:last-child td { border-bottom: 0; }
#component .pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  font-size: var(--text-label);
  font-weight: 600;
  line-height: 1.5;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top-row">
      <h1>Billing</h1>
    </div>

    <section class="card plan" aria-labelledby="plan-title">
      <div class="plan-main">
        <h2 id="plan-title">Team plan</h2>
        <p class="price"><span class="price-amount">$24</span> <span class="price-unit">per seat per month</span></p>
        <div class="seats">
          <p>18 of 25 seats used</p>
          <div class="meter" role="progressbar" aria-label="Seats used" aria-valuemin="0" aria-valuemax="25" aria-valuenow="18">
            <span class="meter-fill"></span>
          </div>
        </div>
      </div>
      <button class="btn btn--primary" type="button">Change Plan</button>
    </section>

    <section class="invoices" aria-labelledby="invoices-title">
      <h2 id="invoices-title">Invoices</h2>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Amount</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Oct 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
            <tr><td>Sep 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
            <tr><td>Aug 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
            <tr><td>Jul 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</body>
</html>
