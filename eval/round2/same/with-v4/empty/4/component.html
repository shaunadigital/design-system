<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Requests · Harbor</title>
<style>
/* tokens.css, inlined */
:root {
  --paper: #FFFFFF;
  --paper-rgb: 255, 255, 255;
  --sand: #EEF4FA;
  --sand-rgb: 238, 244, 250;
  --card: #FFFFFF;
  --card-rgb: 255, 255, 255;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --muted-rgb: 85, 101, 106;
  --accent-text: #0263AC;
  --accent-text-rgb: 2, 99, 172;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --koa: #A65F35;
  --koa-rgb: 166, 95, 53;
  --white: #FFFFFF;
  --white-rgb: 255, 255, 255;
  --accent-tint: #E6EFF7;
  --accent-tint-rgb: 230, 239, 247;
  --accent-line: #9CC3EA;
  --accent-line-rgb: 156, 195, 234;
  --on-ink: #FFFFFF;
  --on-ink-rgb: 255, 255, 255;
  --shadow: #0B1416;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --font-hero: 'Unbounded', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 1280px;
  min-height: 800px;
  margin: 0 auto;
  background: var(--paper);
  padding: var(--space-7) var(--space-6) var(--space-9);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
  color: var(--ink);
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: var(--space-9) var(--space-6);
}

.empty-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.3;
  color: var(--ink);
}

.empty-line {
  margin: var(--space-3) 0 0;
  max-width: 400px;
  font-size: var(--text-body);
  color: var(--muted);
}

.actions {
  margin-top: var(--space-5);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease);
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}
.btn--primary:hover { opacity: 0.88; }

.text-link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--space-2);
  font-size: var(--text-small);
  font-weight: 500;
  color: var(--accent-text);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.text-link:hover { text-decoration-thickness: 2px; }

.btn:focus-visible,
.text-link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1 class="page-title">Requests</h1>

    <section class="empty" aria-labelledby="empty-title">
      <h2 class="empty-title" id="empty-title">No requests yet</h2>
      <p class="empty-line">When your team asks for something, it shows up here.</p>
      <div class="actions">
        <a class="btn btn--primary" href="#create">Create a Request</a>
        <a class="text-link" href="#import">Import from a spreadsheet</a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
