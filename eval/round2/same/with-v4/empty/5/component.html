<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests · Harbor</title>
<meta name="viewport" content="width=1280">
<style>
/* Tokens from tokens.css */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-pill: 999px;
  --radius-sm: 8px;
  --tracking-tight: -0.02em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-title: 1.75rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --on-ink: #0E1618;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6) var(--space-9);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.15;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
  color: var(--ink);
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 480px;
  margin: 0 auto;
  padding: var(--space-8) 0 0;
}

.empty-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-title);
  line-height: 1.25;
  color: var(--ink);
}

.empty-text {
  margin: var(--space-3) 0 0;
  font-size: var(--text-body);
  color: var(--muted);
}

.actions {
  margin-top: var(--space-6);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  transition: opacity var(--dur-base) var(--ease);
}
.btn--primary:hover { opacity: 0.88; }

.link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--space-2);
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: var(--text-small);
  color: var(--accent-text);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn:focus-visible, .link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1 class="page-title">Requests</h1>

    <section class="empty" aria-labelledby="empty-title">
      <h2 class="empty-title" id="empty-title">No requests yet</h2>
      <p class="empty-text">When your team asks for something, it shows up here.</p>
      <div class="actions">
        <a class="btn btn--primary" href="#">Create a Request</a>
        <a class="link" href="#">Import from a spreadsheet</a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
