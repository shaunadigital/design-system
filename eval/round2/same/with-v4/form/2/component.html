<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New request · Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 1280px;
  min-height: 800px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6) 0;
}

.page-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  margin-bottom: var(--space-6);
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
  color: var(--ink);
}

.actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--radius-pill);
  background: none;
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--primary:hover { opacity: 0.88; }
.btn--quiet:hover { background: rgba(var(--ink-rgb), 0.06); }
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.card {
  max-width: 720px;
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.form {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.field label {
  display: block;
  margin-bottom: var(--space-2);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  line-height: 1.2;
  text-transform: uppercase;
  color: var(--muted);
}

.input {
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 12px;
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  background: var(--paper);
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body);
  line-height: 1.4;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color var(--dur-fast) var(--ease);
}
.input::placeholder { color: var(--muted); }
.input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 0;
  border-color: var(--accent);
}

textarea.input {
  height: 112px;
  padding: 12px;
  resize: vertical;
}

.select { position: relative; }
.select .input { padding-right: 40px; }
.select::after {
  content: "";
  position: absolute;
  right: 16px;
  top: 50%;
  width: 8px;
  height: 8px;
  border-right: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="page-top">
      <h1>New request</h1>
      <div class="actions">
        <button type="button" class="btn btn--quiet">Cancel</button>
        <button type="submit" form="new-request" class="btn btn--primary">Create Request</button>
      </div>
    </div>

    <section class="card">
      <form id="new-request" class="form" action="#" method="post">
        <div class="field">
          <label for="title">Title</label>
          <input class="input" type="text" id="title" name="title">
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea class="input" id="description" name="description"></textarea>
        </div>

        <div class="field">
          <label for="priority">Priority</label>
          <div class="select">
            <select class="input" id="priority" name="priority">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="assignee">Assignee</label>
          <div class="select">
            <select class="input" id="assignee" name="assignee">
              <option>Maya Chen</option>
              <option>Leo Park</option>
              <option>Ana Ruiz</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="due">Due date</label>
          <input class="input" type="date" id="due" name="due">
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
