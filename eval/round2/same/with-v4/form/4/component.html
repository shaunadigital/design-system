<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor: New request</title>
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --on-ink: #FFFFFF;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --radius-md: 12px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-label: 0.14em;
    --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  #component {
    width: 1280px;
    min-height: 800px;
    background: var(--paper);
    padding: var(--space-7) var(--space-6);
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .page-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-heading);
    line-height: 1.1;
    text-transform: uppercase;
    color: var(--ink);
  }

  .card {
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
    padding: var(--space-5);
  }

  form {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
    margin: 0;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    min-width: 0;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-5);
  }

  label {
    font-family: var(--font-label);
    font-weight: 500;
    font-size: var(--text-label);
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--muted);
  }

  input,
  select,
  textarea {
    width: 100%;
    height: 44px;
    margin: 0;
    padding: 0 12px;
    font: inherit;
    font-size: var(--text-body);
    color: var(--ink);
    background: var(--paper);
    border: 1px solid rgba(var(--ink-rgb), 0.2);
    border-radius: var(--radius-md);
    transition: border-color var(--dur-fast) var(--ease);
  }

  textarea {
    height: 112px;
    padding: var(--space-3);
    resize: vertical;
    line-height: 1.5;
  }

  input::placeholder,
  textarea::placeholder { color: var(--muted); }

  input:focus,
  select:focus,
  textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 0;
  }

  .select-wrap { position: relative; }

  select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 44px;
    cursor: pointer;
  }

  .chevron {
    position: absolute;
    top: 50%;
    right: 12px;
    width: 20px;
    height: 20px;
    transform: translateY(-50%);
    color: var(--ink);
    pointer-events: none;
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    gap: var(--space-3);
    margin-top: var(--space-2);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 20px;
    border-radius: var(--radius-pill);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: var(--text-small);
    color: var(--ink);
    cursor: pointer;
    transition: background var(--dur-base) var(--ease), opacity var(--dur-base) var(--ease);
  }

  .btn--primary {
    background: var(--ink);
    color: var(--on-ink);
    border: 0;
  }
  .btn--primary:hover { opacity: 0.88; }

  .btn--quiet {
    background: transparent;
    border: 0;
  }
  .btn--quiet:hover { background: var(--accent-tint); }

  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="page-top">
      <h1>New request</h1>
    </div>

    <section class="card">
      <form action="#">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text">
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description"></textarea>
        </div>

        <div class="row">
          <div class="field">
            <label for="priority">Priority</label>
            <div class="select-wrap">
              <select id="priority" name="priority">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
              </select>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>

          <div class="field">
            <label for="assignee">Assignee</label>
            <div class="select-wrap">
              <select id="assignee" name="assignee">
                <option>Maya Chen</option>
                <option>Leo Park</option>
                <option>Ana Ruiz</option>
              </select>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>

          <div class="field">
            <label for="due">Due date</label>
            <input id="due" name="due" type="date">
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn btn--quiet">Cancel</button>
          <button type="submit" class="btn btn--primary">Create Request</button>
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
