<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Harbor: New request</title>
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent: #0263AC;
    --on-ink: #FFFFFF;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --radius-md: 12px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-label: 0.14em;
    --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  #component {
    width: 1280px;
    min-height: 800px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: var(--space-7) var(--space-6);
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-5);
  }

  .top-row h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-heading);
    line-height: 1.1;
    text-transform: uppercase;
    letter-spacing: 0;
    color: var(--ink);
  }

  .actions {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 20px;
    border-radius: var(--radius-pill);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: var(--text-small);
    line-height: 1;
    color: var(--ink);
    cursor: pointer;
    transition: opacity var(--dur-fast) var(--ease);
  }
  .btn:hover { opacity: 0.8; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn--primary {
    background: var(--ink);
    color: var(--on-ink);
    border: 0;
  }
  .btn--quiet {
    background: none;
    border: 0;
    color: var(--ink);
  }

  .card {
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
    padding: var(--space-5);
  }

  form {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-5) var(--space-5);
  }

  .field { min-width: 0; }
  .field--wide { grid-column: 1 / -1; }

  label {
    display: block;
    margin-bottom: var(--space-2);
    font-family: var(--font-label);
    font-weight: 500;
    font-size: var(--text-label);
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--muted);
  }

  input, select, textarea {
    display: block;
    width: 100%;
    height: 44px;
    margin: 0;
    padding: 0 12px;
    font: inherit;
    font-size: var(--text-body);
    color: var(--ink);
    background: var(--paper);
    border: 1px solid rgba(var(--ink-rgb), 0.2);
    border-radius: var(--radius-md);
    transition: border-color var(--dur-fast) var(--ease);
  }
  textarea {
    height: 112px;
    padding: 12px;
    resize: vertical;
  }
  ::placeholder { color: var(--muted); opacity: 1; }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 0;
    border-color: var(--accent);
  }

  .select-wrap { position: relative; }
  .select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 40px;
    cursor: pointer;
  }
  .select-wrap::after {
    content: "";
    position: absolute;
    right: 18px;
    top: 50%;
    width: 7px;
    height: 7px;
    border-right: 1.5px solid var(--ink);
    border-bottom: 1.5px solid var(--ink);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="component">
  <div class="page">
    <header class="top-row">
      <h1>New request</h1>
      <div class="actions">
        <button class="btn btn--quiet" type="button">Cancel</button>
        <button class="btn btn--primary" type="submit" form="new-request">Create Request</button>
      </div>
    </header>

    <main class="card">
      <form id="new-request" action="#" method="post">
        <div class="field field--wide">
          <label for="title">Title</label>
          <input id="title" name="title" type="text">
        </div>

        <div class="field field--wide">
          <label for="description">Description</label>
          <textarea id="description" name="description"></textarea>
        </div>

        <div class="field">
          <label for="priority">Priority</label>
          <div class="select-wrap">
            <select id="priority" name="priority">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="assignee">Assignee</label>
          <div class="select-wrap">
            <select id="assignee" name="assignee">
              <option>Maya Chen</option>
              <option>Leo Park</option>
              <option>Ana Ruiz</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="due">Due date</label>
          <input id="due" name="due" type="date">
        </div>
      </form>
    </main>
  </div>
</div>
</body>
</html>
