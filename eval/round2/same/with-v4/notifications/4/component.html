<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Notifications · Harbor</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --on-ink: #0E1618;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }
body { font-family: var(--font-body); color: var(--ink); }

#component {
  width: 1280px;
  min-height: 800px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
  color: var(--ink);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
}
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

.list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.item {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  min-height: 52px;
  font-size: var(--text-small);
  line-height: 1.4;
  font-weight: 400;
  color: var(--ink);
}
.item + .item {
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
}
.item--unread {
  font-weight: 600;
}

.dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: var(--radius-pill);
  background: transparent;
}
.item--unread .dot {
  background: var(--accent);
}

.text {
  flex: 1;
  min-width: 0;
}

.time {
  flex: none;
  font-weight: 400;
  color: var(--muted);
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>Notifications</h1>
      <button class="btn btn--primary" type="button">Mark All as Read</button>
    </div>

    <section class="card" aria-label="Notifications">
      <ul class="list">
        <li class="item item--unread">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Leo Park approved Q4 travel budget</span>
          <span class="time">2h ago</span>
        </li>
        <li class="item item--unread">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Maya Chen assigned you Laptop refresh for design</span>
          <span class="time">3h ago</span>
        </li>
        <li class="item item--unread">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Your weekly summary is ready</span>
          <span class="time">1d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Ana Ruiz commented on VPN access for contractors</span>
          <span class="time">1d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Sam Ito joined Harbor Ops</span>
          <span class="time">2d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Billing details were updated</span>
          <span class="time">3d ago</span>
        </li>
      </ul>
    </section>
  </main>
</div>
</body>
</html>
