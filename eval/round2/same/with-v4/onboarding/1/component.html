<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor: Connect your tools</title>
<style>
/* Tokens from tokens.css (day values, dusk overrides for the roles used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --on-ink: #0E1618;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.progress {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin: 0 0 var(--space-4);
  font-family: var(--font-label);
  font-size: var(--text-label);
  font-weight: 500;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
.progress-bar {
  display: flex;
  gap: var(--space-1);
}
.progress-bar span {
  width: 32px;
  height: 4px;
  border-radius: var(--radius-pill);
  background: rgba(var(--ink-rgb), 0.1);
}
.progress-bar span.done { background: var(--accent); }

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
  color: var(--ink);
}
.lede {
  margin: var(--space-4) 0 0;
  font-size: var(--text-body-l);
  color: var(--muted);
}

.tools {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.tool {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}
.tool-name {
  margin: 0;
  font-size: var(--text-body-l);
  font-weight: 600;
  line-height: 1.3;
  color: var(--ink);
}
.tool-desc {
  margin: var(--space-1) 0 0;
  font-size: var(--text-body);
  color: var(--muted);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-small);
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  color: var(--ink);
  background: transparent;
  border: 0;
  transition: background var(--dur-base) var(--ease), opacity var(--dur-base) var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--primary { background: var(--ink); color: var(--on-ink); }
.btn--primary:hover { opacity: 0.88; }
.btn--secondary { border: 1.5px solid var(--ink); }
.btn--secondary:hover { background: var(--accent-tint); }
.btn--quiet:hover { background: var(--accent-tint); }

.actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header>
      <p class="progress">
        <span>Step 2 of 4</span>
        <span class="progress-bar" aria-hidden="true">
          <span class="done"></span><span class="done"></span><span></span><span></span>
        </span>
      </p>
      <h1>Connect your tools</h1>
      <p class="lede">Harbor works best with the tools your team already uses.</p>
    </header>

    <ul class="tools">
      <li class="tool">
        <div>
          <p class="tool-name">Slack</p>
          <p class="tool-desc">Get request updates in your channels</p>
        </div>
        <button class="btn btn--secondary" type="button" aria-label="Connect Slack">Connect</button>
      </li>
      <li class="tool">
        <div>
          <p class="tool-name">Google Calendar</p>
          <p class="tool-desc">See due dates on your calendar</p>
        </div>
        <button class="btn btn--secondary" type="button" aria-label="Connect Google Calendar">Connect</button>
      </li>
      <li class="tool">
        <div>
          <p class="tool-name">Jira</p>
          <p class="tool-desc">Link requests to engineering tickets</p>
        </div>
        <button class="btn btn--secondary" type="button" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button class="btn btn--quiet" type="button">Skip for Now</button>
      <button class="btn btn--primary" type="button">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
