<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Harbor: Connect your tools</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --on-ink: #0E1618;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.progress {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  margin: 0 0 var(--space-4);
}
.progress__label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
.progress__bar {
  display: flex;
  gap: var(--space-1);
}
.progress__seg {
  width: 40px;
  height: 4px;
  border-radius: var(--radius-pill);
  background: rgba(var(--ink-rgb), 0.1);
}
.progress__seg--done { background: var(--accent); }

.title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.15;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
  color: var(--ink);
}
.lede {
  margin: var(--space-4) 0 0;
  font-size: var(--text-body-l);
  color: var(--muted);
}

.tools {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.tool {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}
.tool__name {
  margin: 0;
  font-size: var(--text-body-l);
  font-weight: 600;
  line-height: 1.3;
  color: var(--ink);
}
.tool__desc {
  margin: var(--space-1) 0 0;
  font-size: var(--text-body);
  color: var(--muted);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  border: 1.5px solid transparent;
  background: none;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-small);
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--primary { background: var(--ink); color: var(--on-ink); }
.btn--primary:hover { background: rgba(var(--ink-rgb), 0.86); }
.btn--secondary { border-color: var(--ink); }
.btn--secondary:hover { background: var(--accent-tint); }
.btn--quiet:hover { background: var(--accent-tint); }

.actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: var(--space-3);
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header>
      <div class="progress">
        <p class="progress__label">Step 2 of 4</p>
        <div class="progress__bar" role="img" aria-label="Step 2 of 4">
          <span class="progress__seg progress__seg--done"></span>
          <span class="progress__seg progress__seg--done"></span>
          <span class="progress__seg"></span>
          <span class="progress__seg"></span>
        </div>
      </div>
      <h1 class="title">Connect your tools</h1>
      <p class="lede">Harbor works best with the tools your team already uses.</p>
    </header>

    <ul class="tools">
      <li class="tool">
        <div>
          <h2 class="tool__name">Slack</h2>
          <p class="tool__desc">Get request updates in your channels</p>
        </div>
        <button type="button" class="btn btn--secondary" aria-label="Connect Slack">Connect</button>
      </li>
      <li class="tool">
        <div>
          <h2 class="tool__name">Google Calendar</h2>
          <p class="tool__desc">See due dates on your calendar</p>
        </div>
        <button type="button" class="btn btn--secondary" aria-label="Connect Google Calendar">Connect</button>
      </li>
      <li class="tool">
        <div>
          <h2 class="tool__name">Jira</h2>
          <p class="tool__desc">Link requests to engineering tickets</p>
        </div>
        <button type="button" class="btn btn--secondary" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button type="button" class="btn btn--quiet">Skip for Now</button>
      <button type="button" class="btn btn--primary">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
