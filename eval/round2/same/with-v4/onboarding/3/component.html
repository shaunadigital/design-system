<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor: Connect your tools</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --tracking-snug: -0.01em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  margin: 0 auto;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  padding: var(--space-7) var(--space-6);
}

#component .page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

#component .intro { display: flex; flex-direction: column; gap: var(--space-3); }

#component .progress {
  display: flex;
  align-items: center;
  gap: var(--space-4);
}
#component .progress-label {
  margin: 0;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
#component .progress-bar {
  display: flex;
  gap: var(--space-1);
  width: 128px;
}
#component .progress-bar span {
  flex: 1;
  height: 4px;
  border-radius: var(--radius-pill);
  background: rgba(var(--ink-rgb), 0.1);
}
#component .progress-bar span.done { background: var(--accent); }

#component h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
  color: var(--ink);
}
#component .lede {
  margin: 0;
  font-size: var(--text-body-l);
  color: var(--muted);
}

#component .tools {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
#component .tool {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}
#component .tool-name {
  margin: 0;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-body-l);
  line-height: 1.3;
  color: var(--ink);
}
#component .tool-desc {
  margin: var(--space-1) 0 0;
  font-size: var(--text-body);
  color: var(--muted);
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  min-width: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  border: 1.5px solid transparent;
  background: none;
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--dur-base) var(--ease), opacity var(--dur-base) var(--ease);
}
#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
#component .btn--primary {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--on-ink);
}
#component .btn--primary:hover { opacity: 0.88; }
#component .btn--secondary { border-color: var(--ink); }
#component .btn--secondary:hover { background: var(--plate-hover); }
#component .btn--quiet:hover { background: var(--accent-tint); }

#component .actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: var(--space-3);
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="intro">
      <div class="progress">
        <p class="progress-label">Step 2 of 4</p>
        <div class="progress-bar" aria-hidden="true">
          <span class="done"></span><span class="done"></span><span></span><span></span>
        </div>
      </div>
      <h1>Connect your tools</h1>
      <p class="lede">Harbor works best with the tools your team already uses.</p>
    </header>

    <ul class="tools">
      <li class="tool">
        <div>
          <h2 class="tool-name">Slack</h2>
          <p class="tool-desc">Get request updates in your channels</p>
        </div>
        <button type="button" class="btn btn--secondary" aria-label="Connect Slack">Connect</button>
      </li>
      <li class="tool">
        <div>
          <h2 class="tool-name">Google Calendar</h2>
          <p class="tool-desc">See due dates on your calendar</p>
        </div>
        <button type="button" class="btn btn--secondary" aria-label="Connect Google Calendar">Connect</button>
      </li>
      <li class="tool">
        <div>
          <h2 class="tool-name">Jira</h2>
          <p class="tool-desc">Link requests to engineering tickets</p>
        </div>
        <button type="button" class="btn btn--secondary" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button type="button" class="btn btn--quiet">Skip for Now</button>
      <button type="button" class="btn btn--primary">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
