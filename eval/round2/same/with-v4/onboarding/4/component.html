<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Harbor: Connect your tools</title>
<style>
/* Tokens from tokens.css */
:root {
  --paper: #FFFFFF;
  --paper-rgb: 255, 255, 255;
  --sand: #EEF4FA;
  --sand-rgb: 238, 244, 250;
  --card: #FFFFFF;
  --card-rgb: 255, 255, 255;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --muted-rgb: 85, 101, 106;
  --accent-text: #0263AC;
  --accent-text-rgb: 2, 99, 172;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --accent-tint: #E6EFF7;
  --accent-tint-rgb: 230, 239, 247;
  --on-ink: #FFFFFF;
  --on-ink-rgb: 255, 255, 255;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --tracking-snug: -0.01em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --paper-rgb: 14, 22, 24;
  --sand: #131E21;
  --card: #172327;
  --card-rgb: 23, 35, 39;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --muted-rgb: 157, 174, 177;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-rgb: 111, 170, 230;
  --accent-tint: #13283A;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--paper);
}

body {
  font-family: var(--font-body);
  font-size: var(--text-body);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

#component {
  width: 1280px;
  min-height: 800px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  background: var(--paper);
  color: var(--ink);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.intro {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.progress {
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.progress__label {
  margin: 0;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.progress__bar {
  display: flex;
  gap: var(--space-1);
  margin: 0;
  padding: 0;
  list-style: none;
}

.progress__bar li {
  width: 40px;
  height: 4px;
  border-radius: var(--radius-pill);
  background: rgba(var(--ink-rgb), 0.1);
}

.progress__bar li.is-done {
  background: var(--accent);
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
  color: var(--ink);
}

.lead {
  margin: 0;
  font-size: var(--text-body-l);
  line-height: 1.5;
  color: var(--muted);
}

.tools {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin: 0;
  padding: 0;
  list-style: none;
}

.tool {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.tool__text {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  min-width: 0;
}

.tool__name {
  margin: 0;
  font-size: var(--text-body-l);
  font-weight: 600;
  line-height: 1.3;
  color: var(--ink);
}

.tool__desc {
  margin: 0;
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--muted);
}

.actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: var(--space-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  min-width: 44px;
  padding: 0 20px;
  border: 1.5px solid transparent;
  border-radius: var(--radius-pill);
  background: none;
  font: inherit;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  white-space: nowrap;
  color: var(--ink);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn--primary {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--on-ink);
}

.btn--primary:hover {
  background: rgba(var(--ink-rgb), 0.85);
}

.btn--secondary {
  border-color: var(--ink);
}

.btn--secondary:hover {
  background: rgba(var(--ink-rgb), 0.06);
}

.btn--quiet:hover {
  background: rgba(var(--ink-rgb), 0.06);
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
</head>
<body>
<main id="component">
  <div class="page">
    <header class="intro">
      <div class="progress">
        <p class="progress__label">Step 2 of 4</p>
        <ol class="progress__bar" aria-hidden="true">
          <li class="is-done"></li>
          <li class="is-done"></li>
          <li></li>
          <li></li>
        </ol>
      </div>
      <h1>Connect your tools</h1>
      <p class="lead">Harbor works best with the tools your team already uses.</p>
    </header>

    <ul class="tools">
      <li class="tool">
        <div class="tool__text">
          <h2 class="tool__name">Slack</h2>
          <p class="tool__desc">Get request updates in your channels</p>
        </div>
        <button class="btn btn--secondary" type="button" aria-label="Connect Slack">Connect</button>
      </li>
      <li class="tool">
        <div class="tool__text">
          <h2 class="tool__name">Google Calendar</h2>
          <p class="tool__desc">See due dates on your calendar</p>
        </div>
        <button class="btn btn--secondary" type="button" aria-label="Connect Google Calendar">Connect</button>
      </li>
      <li class="tool">
        <div class="tool__text">
          <h2 class="tool__name">Jira</h2>
          <p class="tool__desc">Link requests to engineering tickets</p>
        </div>
        <button class="btn btn--secondary" type="button" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button class="btn btn--quiet" type="button">Skip for Now</button>
      <button class="btn btn--primary" type="button">Continue</button>
    </div>
  </div>
</main>
</body>
</html>
