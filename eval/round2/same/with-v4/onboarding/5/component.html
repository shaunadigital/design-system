<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Harbor: Connect your tools</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }
body {
  font-family: var(--font-body);
  font-size: var(--text-body);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
  color: var(--ink);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.intro { display: flex; flex-direction: column; gap: var(--space-4); }

.progress {
  display: flex;
  align-items: center;
  gap: var(--space-4);
}
.progress__label {
  margin: 0;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}
.progress__bar { display: flex; gap: var(--space-2); }
.progress__seg {
  width: 40px;
  height: 4px;
  border-radius: var(--radius-pill);
  background: rgba(var(--ink-rgb), 0.1);
}
.progress__seg--done { background: var(--accent); }

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}
.lede {
  margin: 0;
  font-size: var(--text-body-l);
  line-height: 1.5;
  color: var(--muted);
}

.tools {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-6);
}
.tool {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.tool__name {
  margin: 0;
  font-weight: 600;
  font-size: var(--text-body-l);
  line-height: 1.3;
}
.tool__desc {
  margin: var(--space-2) 0 var(--space-5);
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--muted);
}
.tool .btn { margin-top: auto; }

.actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: var(--space-3);
  padding-top: var(--space-6);
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border: 1.5px solid transparent;
  border-radius: var(--radius-pill);
  background: none;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  color: var(--ink);
  cursor: pointer;
  transition: background-color var(--dur-base) var(--ease),
              color var(--dur-base) var(--ease),
              border-color var(--dur-base) var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn--primary:hover { background: rgba(var(--ink-rgb), 0.85); }
.btn--secondary { border-color: var(--ink); }
.btn--secondary:hover { background: var(--ink); color: var(--on-ink); }
.btn--quiet:hover { background: rgba(var(--ink-rgb), 0.06); }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="intro">
      <div class="progress">
        <p class="progress__label">Step 2 of 4</p>
        <div class="progress__bar" aria-hidden="true">
          <span class="progress__seg progress__seg--done"></span>
          <span class="progress__seg progress__seg--done"></span>
          <span class="progress__seg"></span>
          <span class="progress__seg"></span>
        </div>
      </div>
      <h1>Connect your tools</h1>
      <p class="lede">Harbor works best with the tools your team already uses.</p>
    </header>

    <ul class="tools">
      <li class="tool">
        <h2 class="tool__name">Slack</h2>
        <p class="tool__desc">Get request updates in your channels</p>
        <button type="button" class="btn btn--secondary">Connect</button>
      </li>
      <li class="tool">
        <h2 class="tool__name">Google Calendar</h2>
        <p class="tool__desc">See due dates on your calendar</p>
        <button type="button" class="btn btn--secondary">Connect</button>
      </li>
      <li class="tool">
        <h2 class="tool__name">Jira</h2>
        <p class="tool__desc">Link requests to engineering tickets</p>
        <button type="button" class="btn btn--secondary">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button type="button" class="btn btn--quiet">Skip for Now</button>
      <button type="button" class="btn btn--primary">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
