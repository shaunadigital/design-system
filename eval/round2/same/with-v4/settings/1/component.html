<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace settings · Harbor</title>
<style>
/* tokens.css, the roles this screen uses */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --on-ink: #0E1618;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
}

.page-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  margin-bottom: var(--space-6);
}

h1, h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  text-transform: uppercase;
  letter-spacing: var(--tracking-snug);
  line-height: 1.15;
}
h1 { font-size: var(--text-heading); }
h2 { font-size: var(--text-step); }

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.card > h2 { margin-bottom: var(--space-5); }

/* Form fields */
.fields {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  max-width: 480px;
}
.field label {
  display: block;
  margin-bottom: var(--space-2);
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
.field input {
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  transition: border-color var(--dur-fast) var(--ease);
}
.field input::placeholder { color: var(--muted); }
.field input:focus { outline: 2px solid var(--accent); outline-offset: 0; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  border-radius: var(--radius-pill);
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:hover { opacity: 0.88; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn--secondary { background: transparent; color: var(--ink); border-color: var(--ink); }

.card .btn--primary { margin-top: var(--space-5); }

/* Switch rows */
.rows { list-style: none; margin: 0; padding: 0; }
.rows li + li { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  min-height: 52px;
  cursor: pointer;
  font-size: var(--text-body);
}

.switch {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  flex: none;
  width: 48px;
  height: 28px;
  margin: 0;
  background: transparent;
  border: 1.5px solid var(--muted);
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: background-color var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.switch::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 4px;
  width: 18px;
  height: 18px;
  margin-top: -9px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform var(--dur-base) var(--ease), background-color var(--dur-base) var(--ease);
}
.switch:checked { background: var(--ink); border-color: var(--ink); }
.switch:checked::before { background: var(--on-ink); transform: translateX(20px); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Danger zone */
.danger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}
.danger p { margin: 0; }

@media (prefers-reduced-motion: reduce) {
  .btn, .switch, .switch::before, .field input { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="page-top">
      <h1>Workspace settings</h1>
    </div>

    <div class="stack">
      <section class="card" aria-labelledby="general-title">
        <h2 id="general-title">General</h2>
        <div class="fields">
          <div class="field">
            <label for="ws-name">Workspace name</label>
            <input id="ws-name" type="text" value="Harbor Ops">
          </div>
          <div class="field">
            <label for="ws-url">Workspace URL</label>
            <input id="ws-url" type="text" value="harbor.app/ops">
          </div>
        </div>
        <button class="btn btn--primary" type="button">Save Changes</button>
      </section>

      <section class="card" aria-labelledby="notifications-title">
        <h2 id="notifications-title">Notifications</h2>
        <ul class="rows">
          <li>
            <label class="row">
              <span>Email me when a request is assigned to me</span>
              <input class="switch" type="checkbox" role="switch" checked>
            </label>
          </li>
          <li>
            <label class="row">
              <span>Weekly summary</span>
              <input class="switch" type="checkbox" role="switch" checked>
            </label>
          </li>
          <li>
            <label class="row">
              <span>Product updates</span>
              <input class="switch" type="checkbox" role="switch">
            </label>
          </li>
        </ul>
      </section>

      <section class="card" aria-labelledby="danger-title">
        <h2 id="danger-title">Danger zone</h2>
        <div class="danger">
          <p>Deleting a workspace removes all of its requests for everyone.</p>
          <button class="btn btn--secondary" type="button">Delete Workspace</button>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
