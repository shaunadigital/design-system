<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Workspace settings</title>
<style>
/* Tokens copied from tokens.css (only the ones this screen uses) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --on-ink: #0E1618;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 1280px;
  min-height: 100vh;
  background: var(--paper);
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
}

.page__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-6);
}

.page__title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
  letter-spacing: 0;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

.card__title {
  margin: 0 0 var(--space-5);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: 0;
}

/* Form fields */
.fields {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  max-width: 560px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.input {
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  height: 44px;
  width: 100%;
  padding: 0 var(--space-3);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  transition: border-color var(--dur-fast) var(--ease);
}
.input::placeholder { color: var(--muted); }
.input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 0;
}

.card__actions {
  margin-top: var(--space-5);
}

/* Buttons: one size, two kinds used here */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease);
}
.btn:hover { opacity: 0.88; }
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}
.btn--secondary {
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--ink);
}

/* Switches */
.switches {
  list-style: none;
  margin: 0;
  padding: 0;
}
.switches > li + li {
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
}

.switch {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  min-height: 52px;
  cursor: pointer;
}
.switch__text {
  font-size: var(--text-body);
  color: var(--ink);
}
.switch__input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.switch__track {
  position: relative;
  flex: none;
  width: 44px;
  height: 24px;
  border: 2px solid var(--muted);
  border-radius: var(--radius-pill);
  background: transparent;
  transition: background-color var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.switch__track::after {
  content: "";
  position: absolute;
  top: 4px;
  left: 4px;
  width: 12px;
  height: 12px;
  border-radius: var(--radius-pill);
  background: var(--muted);
  transition: transform var(--dur-base) var(--ease), background-color var(--dur-base) var(--ease);
}
.switch__input:checked + .switch__track {
  background: var(--ink);
  border-color: var(--ink);
}
.switch__input:checked + .switch__track::after {
  background: var(--on-ink);
  transform: translateX(20px);
}
.switch__input:focus-visible + .switch__track {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Danger zone */
.danger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}
.danger__text {
  margin: 0;
  font-size: var(--text-body);
  color: var(--ink);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="page__top">
      <h1 class="page__title">Workspace settings</h1>
    </div>

    <div class="stack">
      <section class="card" aria-labelledby="general-title">
        <h2 class="card__title" id="general-title">General</h2>
        <div class="fields">
          <div class="field">
            <label class="label" for="ws-name">Workspace name</label>
            <input class="input" id="ws-name" name="workspace-name" type="text" value="Harbor Ops">
          </div>
          <div class="field">
            <label class="label" for="ws-url">Workspace URL</label>
            <input class="input" id="ws-url" name="workspace-url" type="text" value="harbor.app/ops">
          </div>
        </div>
        <div class="card__actions">
          <button class="btn btn--primary" type="button">Save Changes</button>
        </div>
      </section>

      <section class="card" aria-labelledby="notifications-title">
        <h2 class="card__title" id="notifications-title">Notifications</h2>
        <ul class="switches">
          <li>
            <label class="switch">
              <span class="switch__text">Email me when a request is assigned to me</span>
              <input class="switch__input" type="checkbox" role="switch" checked>
              <span class="switch__track" aria-hidden="true"></span>
            </label>
          </li>
          <li>
            <label class="switch">
              <span class="switch__text">Weekly summary</span>
              <input class="switch__input" type="checkbox" role="switch" checked>
              <span class="switch__track" aria-hidden="true"></span>
            </label>
          </li>
          <li>
            <label class="switch">
              <span class="switch__text">Product updates</span>
              <input class="switch__input" type="checkbox" role="switch">
              <span class="switch__track" aria-hidden="true"></span>
            </label>
          </li>
        </ul>
      </section>

      <section class="card" aria-labelledby="danger-title">
        <h2 class="card__title" id="danger-title">Danger zone</h2>
        <div class="danger">
          <p class="danger__text">Deleting a workspace removes all of its requests for everyone.</p>
          <button class="btn btn--secondary" type="button">Delete Workspace</button>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
