<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Workspace settings</title>
<style>
/* Tokens from tokens.css (light theme), the values this screen uses */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  box-sizing: content-box;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

h1, h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  text-transform: uppercase;
  line-height: 1.1;
  letter-spacing: var(--tracking-snug);
}
h1 { font-size: var(--text-heading); }
h2 { font-size: var(--text-step); }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

/* Form fields */
.field { display: flex; flex-direction: column; gap: var(--space-2); max-width: 480px; }
.fields { display: flex; flex-direction: column; gap: var(--space-5); }

.field label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.field input {
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  height: 44px;
  padding: 0 12px;
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  width: 100%;
}
.field input::placeholder { color: var(--muted); }
.field input:focus { outline: 2px solid var(--accent); outline-offset: 0; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--primary { background: var(--ink); color: var(--on-ink); border: 0; }
.btn--primary:hover { opacity: 0.88; }
.btn--secondary {
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--ink);
}
.btn--secondary:hover { background: rgba(var(--ink-rgb), 0.06); }

.actions { display: flex; }

/* Switch rows */
.switches { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.switches li { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }
.switches li:first-child { border-top: 0; padding-top: 0; }

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  min-height: 52px;
  font-size: var(--text-body);
  cursor: pointer;
}

.switch {
  position: relative;
  flex: none;
  width: 52px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
}
.switch input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.track {
  position: relative;
  width: 48px;
  height: 28px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--muted);
  background: transparent;
  transition: background-color var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.track::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 4px;
  width: 16px;
  height: 16px;
  margin-top: -8px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform var(--dur-base) var(--ease), background-color var(--dur-base) var(--ease);
}
.switch input:checked + .track { background: var(--ink); border-color: var(--ink); }
.switch input:checked + .track::after { background: var(--on-ink); transform: translateX(20px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Danger zone */
.danger-body {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}
.danger-body p { margin: 0; font-size: var(--text-body); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="page-top">
      <h1>Workspace settings</h1>
    </div>

    <section class="card" aria-labelledby="general-title">
      <h2 id="general-title">General</h2>
      <div class="fields">
        <div class="field">
          <label for="ws-name">Workspace name</label>
          <input id="ws-name" type="text" value="Harbor Ops">
        </div>
        <div class="field">
          <label for="ws-url">Workspace URL</label>
          <input id="ws-url" type="text" value="harbor.app/ops">
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn btn--primary">Save Changes</button>
      </div>
    </section>

    <section class="card" aria-labelledby="notifications-title">
      <h2 id="notifications-title">Notifications</h2>
      <ul class="switches">
        <li>
          <label class="switch-row">
            <span>Email me when a request is assigned to me</span>
            <span class="switch">
              <input type="checkbox" role="switch" checked>
              <span class="track" aria-hidden="true"></span>
            </span>
          </label>
        </li>
        <li>
          <label class="switch-row">
            <span>Weekly summary</span>
            <span class="switch">
              <input type="checkbox" role="switch" checked>
              <span class="track" aria-hidden="true"></span>
            </span>
          </label>
        </li>
        <li>
          <label class="switch-row">
            <span>Product updates</span>
            <span class="switch">
              <input type="checkbox" role="switch">
              <span class="track" aria-hidden="true"></span>
            </span>
          </label>
        </li>
      </ul>
    </section>

    <section class="card" aria-labelledby="danger-title">
      <h2 id="danger-title">Danger zone</h2>
      <div class="danger-body">
        <p>Deleting a workspace removes all of its requests for everyone.</p>
        <button type="button" class="btn btn--secondary">Delete Workspace</button>
      </div>
    </section>
  </main>
</div>
</body>
</html>
