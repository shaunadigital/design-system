<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Workspace settings · Harbor</title>
<style>
/* Tokens from tokens.css (day theme and dusk theme) */
:root {
  --paper: #FFFFFF;
  --paper-rgb: 255, 255, 255;
  --sand: #EEF4FA;
  --sand-rgb: 238, 244, 250;
  --card: #FFFFFF;
  --card-rgb: 255, 255, 255;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --muted-rgb: 85, 101, 106;
  --accent-text: #0263AC;
  --accent-text-rgb: 2, 99, 172;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --white: #FFFFFF;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --on-ink-rgb: 255, 255, 255;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }
body {
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

#component {
  width: 1280px;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
}

.page {
  width: min(1120px, calc(100% - 2 * var(--space-6)));
  margin: 0 auto;
  padding: var(--space-7) 0 var(--space-8);
}

.page-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
  margin-bottom: var(--space-6);
}

h1, h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  text-transform: uppercase;
}
h1 {
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
}
h2 {
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-tight);
}

.sections {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.card > h2 { margin-bottom: var(--space-5); }

.stack { max-width: 560px; }

/* Form fields */
.field + .field { margin-top: var(--space-5); }
.field label {
  display: block;
  margin-bottom: var(--space-2);
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  line-height: 1.3;
  color: var(--muted);
}
.field input {
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 var(--space-3);
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.field input::placeholder { color: var(--muted); }
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border: 1.5px solid transparent;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn--primary:hover { opacity: 0.88; }
.btn--secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn--secondary:hover { background: rgba(var(--ink-rgb), 0.06); }

.form-actions { margin-top: var(--space-5); }

/* Switches */
.switch-list { margin: 0; padding: 0; list-style: none; }
.switch-list li { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }
.switch-list li:first-child { border-top: 0; }
.switch-row {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  min-height: 52px;
  cursor: pointer;
}
.switch-text { font-size: var(--text-body); color: var(--ink); }
.switch-row input {
  position: absolute;
  right: 0;
  top: 50%;
  width: 44px;
  height: 44px;
  margin: 0;
  transform: translateY(-50%);
  opacity: 0;
  cursor: pointer;
}
.track {
  position: relative;
  flex: none;
  width: 44px;
  height: 28px;
  border: 2px solid var(--muted);
  border-radius: var(--radius-pill);
  background: transparent;
  transition: background-color var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.track::after {
  content: "";
  position: absolute;
  top: 4px;
  left: 4px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform var(--dur-base) var(--ease), background-color var(--dur-base) var(--ease);
}
.switch-row input:checked + .track { background: var(--ink); border-color: var(--ink); }
.switch-row input:checked + .track::after { background: var(--on-ink); transform: translateX(16px); }
.switch-row input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Danger zone */
.danger-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-6);
}
.danger-row p { margin: 0; font-size: var(--text-body); color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="page-top">
      <h1>Workspace settings</h1>
    </div>

    <div class="sections">
      <section class="card" aria-labelledby="general-heading">
        <h2 id="general-heading">General</h2>
        <form class="stack" action="#">
          <div class="field">
            <label for="workspace-name">Workspace name</label>
            <input id="workspace-name" name="workspace-name" type="text" value="Harbor Ops" autocomplete="off">
          </div>
          <div class="field">
            <label for="workspace-url">Workspace URL</label>
            <input id="workspace-url" name="workspace-url" type="text" value="harbor.app/ops" autocomplete="off">
          </div>
          <div class="form-actions">
            <button class="btn btn--primary" type="submit">Save Changes</button>
          </div>
        </form>
      </section>

      <section class="card" aria-labelledby="notifications-heading">
        <h2 id="notifications-heading">Notifications</h2>
        <ul class="switch-list stack">
          <li>
            <label class="switch-row">
              <span class="switch-text">Email me when a request is assigned to me</span>
              <input type="checkbox" role="switch" name="notify-assigned" checked>
              <span class="track" aria-hidden="true"></span>
            </label>
          </li>
          <li>
            <label class="switch-row">
              <span class="switch-text">Weekly summary</span>
              <input type="checkbox" role="switch" name="notify-weekly" checked>
              <span class="track" aria-hidden="true"></span>
            </label>
          </li>
          <li>
            <label class="switch-row">
              <span class="switch-text">Product updates</span>
              <input type="checkbox" role="switch" name="notify-product">
              <span class="track" aria-hidden="true"></span>
            </label>
          </li>
        </ul>
      </section>

      <section class="card" aria-labelledby="danger-heading">
        <h2 id="danger-heading">Danger zone</h2>
        <div class="danger-row">
          <p>Deleting a workspace removes all of its requests for everyone.</p>
          <button class="btn btn--secondary" type="button">Delete Workspace</button>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
