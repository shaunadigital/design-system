<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Harbor</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-9: 96px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-step: 1.75rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6) var(--space-9);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component .page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  justify-content: center;
}

#component .card {
  width: 400px;
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

#component h1 {
  margin: 0 0 var(--space-5);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
  color: var(--ink);
}

#component form {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

#component .field { display: flex; flex-direction: column; gap: var(--space-2); }

#component label.field-label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

#component input[type="email"],
#component input[type="password"] {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease);
}
#component input::placeholder { color: var(--muted); }
#component input[type="email"]:focus,
#component input[type="password"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

#component .keep {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 44px;
  font-size: var(--text-body);
  color: var(--ink);
  cursor: pointer;
}
#component .keep input {
  width: 20px;
  height: 20px;
  margin: 0;
  accent-color: var(--accent);
  cursor: pointer;
}
#component .keep input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

#component .actions { display: flex; flex-direction: column; gap: var(--space-3); }

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 44px;
  padding: 0 20px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
#component .btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}
#component .btn--primary:hover { opacity: 0.88; }
#component .btn--secondary {
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--ink);
}
#component .btn--secondary:hover { background: var(--accent-tint); }

#component .forgot {
  display: flex;
  justify-content: center;
}
#component .forgot a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--space-2);
  font-size: var(--text-small);
  font-weight: 500;
  color: var(--accent-text);
  text-decoration: underline;
  text-underline-offset: 3px;
  border-radius: var(--radius-sm);
}
#component .forgot a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  #component * { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <section class="card" aria-labelledby="signin-title">
      <h1 id="signin-title">Sign in to Harbor</h1>
      <form action="#" method="post">
        <div class="field">
          <label class="field-label" for="email">Work email</label>
          <input id="email" name="email" type="email" autocomplete="username">
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
        </div>
        <label class="keep">
          <input type="checkbox" name="keep">
          <span>Keep me signed in</span>
        </label>
        <div class="actions">
          <button class="btn btn--primary" type="submit">Sign In</button>
          <button class="btn btn--secondary" type="button">Continue with SSO</button>
        </div>
        <div class="forgot">
          <a href="#">Forgot Password?</a>
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
