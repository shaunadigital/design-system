<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team · Harbor</title>
<style>
/* Tokens from tokens.css (light theme, only the ones this screen uses) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }
body { font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; }

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
  color: var(--ink);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border: 1.5px solid transparent;
  border-radius: var(--radius-pill);
  font: inherit;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn--primary { background: var(--ink); color: var(--on-ink); }
.btn--primary:hover { opacity: 0.88; }
.btn--primary:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

.members { list-style: none; margin: 0; padding: 0; }

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 176px;
  align-items: center;
  column-gap: var(--space-5);
  min-height: 52px;
  font-size: var(--text-small);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
.row:last-child { border-bottom: 0; }

.row--head {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.name { font-weight: 600; }
.email { color: var(--muted); }

.select {
  position: relative;
  display: block;
}
.select::after {
  content: "";
  position: absolute;
  right: 16px;
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
.select select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 44px;
  padding: 0 40px 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  cursor: pointer;
}
.select select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>Team</h1>
      <button type="button" class="btn btn--primary">Invite Member</button>
    </div>

    <section class="card" aria-label="Team members">
      <div class="row row--head" aria-hidden="true">
        <span>Name</span>
        <span>Email</span>
        <span>Role</span>
      </div>
      <ul class="members">
        <li class="row">
          <span class="name">Maya Chen</span>
          <span class="email">maya@harbor.app</span>
          <label class="select">
            <select aria-label="Role for Maya Chen">
              <option selected>Admin</option>
              <option>Editor</option>
              <option>Viewer</option>
            </select>
          </label>
        </li>
        <li class="row">
          <span class="name">Leo Park</span>
          <span class="email">leo@harbor.app</span>
          <label class="select">
            <select aria-label="Role for Leo Park">
              <option>Admin</option>
              <option selected>Editor</option>
              <option>Viewer</option>
            </select>
          </label>
        </li>
        <li class="row">
          <span class="name">Ana Ruiz</span>
          <span class="email">ana@harbor.app</span>
          <label class="select">
            <select aria-label="Role for Ana Ruiz">
              <option>Admin</option>
              <option selected>Editor</option>
              <option>Viewer</option>
            </select>
          </label>
        </li>
        <li class="row">
          <span class="name">Sam Ito</span>
          <span class="email">sam@harbor.app</span>
          <label class="select">
            <select aria-label="Role for Sam Ito">
              <option>Admin</option>
              <option>Editor</option>
              <option selected>Viewer</option>
            </select>
          </label>
        </li>
        <li class="row">
          <span class="name">Kai Lee</span>
          <span class="email">kai@harbor.app</span>
          <label class="select">
            <select aria-label="Role for Kai Lee">
              <option>Admin</option>
              <option>Editor</option>
              <option selected>Viewer</option>
            </select>
          </label>
        </li>
      </ul>
    </section>
  </main>
</div>
</body>
</html>
