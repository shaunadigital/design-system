<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Team · Harbor</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-small);
}

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
  color: var(--ink);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease);
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}
.btn--primary:hover { opacity: 0.88; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

.members {
  list-style: none;
  margin: 0;
  padding: 0;
}

.member {
  display: grid;
  grid-template-columns: 280px 1fr 168px;
  align-items: center;
  column-gap: var(--space-5);
  min-height: 52px;
  font-size: var(--text-small);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
.member:last-child { border-bottom: 0; }

.member-name {
  font-weight: 600;
  color: var(--ink);
}
.member-email {
  color: var(--muted);
}

.select {
  position: relative;
  display: block;
}
.select::after {
  content: "";
  position: absolute;
  right: 16px;
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--ink);
  border-bottom: 1.5px solid var(--ink);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
.select select {
  appearance: none;
  -webkit-appearance: none;
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 40px 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  cursor: pointer;
}
.select select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 0;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="page-top">
      <h1>Team</h1>
      <button type="button" class="btn btn--primary">Invite Member</button>
    </div>

    <section class="card" aria-label="Team members">
      <ul class="members">
        <li class="member">
          <span class="member-name">Maya Chen</span>
          <span class="member-email">maya@harbor.app</span>
          <span class="select">
            <select aria-label="Role for Maya Chen">
              <option selected>Admin</option>
              <option>Editor</option>
              <option>Viewer</option>
            </select>
          </span>
        </li>
        <li class="member">
          <span class="member-name">Leo Park</span>
          <span class="member-email">leo@harbor.app</span>
          <span class="select">
            <select aria-label="Role for Leo Park">
              <option>Admin</option>
              <option selected>Editor</option>
              <option>Viewer</option>
            </select>
          </span>
        </li>
        <li class="member">
          <span class="member-name">Ana Ruiz</span>
          <span class="member-email">ana@harbor.app</span>
          <span class="select">
            <select aria-label="Role for Ana Ruiz">
              <option>Admin</option>
              <option selected>Editor</option>
              <option>Viewer</option>
            </select>
          </span>
        </li>
        <li class="member">
          <span class="member-name">Sam Ito</span>
          <span class="member-email">sam@harbor.app</span>
          <span class="select">
            <select aria-label="Role for Sam Ito">
              <option>Admin</option>
              <option>Editor</option>
              <option selected>Viewer</option>
            </select>
          </span>
        </li>
        <li class="member">
          <span class="member-name">Kai Lee</span>
          <span class="member-email">kai@harbor.app</span>
          <span class="select">
            <select aria-label="Role for Kai Lee">
              <option>Admin</option>
              <option>Editor</option>
              <option selected>Viewer</option>
            </select>
          </span>
        </li>
      </ul>
    </section>
  </main>
</div>
</body>
</html>
