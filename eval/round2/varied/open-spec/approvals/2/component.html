<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approvals</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 720px;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component h1 {
    margin: 0 0 16px;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  #component .summary {
    margin: 0 0 48px;
    font-size: 22px;
    line-height: 1.4;
    color: #55656A;
  }

  #component ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 24px;
  }

  #component .item {
    display: grid;
    grid-template-columns: 1fr 176px 128px auto;
    column-gap: 32px;
    align-items: center;
    padding: 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  #component .item h2 {
    margin: 0;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  #component .label {
    display: block;
    margin-bottom: 4px;
    font-weight: 500;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0263AC;
  }

  #component .value {
    font-size: 18px;
    line-height: 1.4;
  }

  #component .amount { text-align: right; }
  #component .amount .value { font-weight: 500; }

  #component .actions {
    display: flex;
    gap: 12px;
  }

  #component .btn {
    min-height: 44px;
    padding: 8px 24px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component .btn-primary { background: #0B1416; color: #FFFFFF; }
  #component .btn-primary:hover { background: #0263AC; }

  #component .btn-quiet {
    background: transparent;
    color: #0B1416;
    border-color: #9CC3EA;
  }
  #component .btn-quiet:hover { background: #E6EFF7; }

  #component .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <h1>Approvals</h1>
  <p class="summary">3 waiting for you</p>

  <ul>
    <li class="item">
      <h2>Q4 travel budget</h2>
      <div><span class="label">Requester</span><span class="value">Leo Park</span></div>
      <div class="amount"><span class="label">Amount</span><span class="value">$4,800</span></div>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Q4 travel budget">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Q4 travel budget">Decline</button>
      </div>
    </li>
    <li class="item">
      <h2>Design conference tickets</h2>
      <div><span class="label">Requester</span><span class="value">Maya Chen</span></div>
      <div class="amount"><span class="label">Amount</span><span class="value">$1,250</span></div>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Design conference tickets">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Design conference tickets">Decline</button>
      </div>
    </li>
    <li class="item">
      <h2>Standing desks for support</h2>
      <div><span class="label">Requester</span><span class="value">Ana Ruiz</span></div>
      <div class="amount"><span class="label">Amount</span><span class="value">$2,100</span></div>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Standing desks for support">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Standing desks for support">Decline</button>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
