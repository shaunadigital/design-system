<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Approvals</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; background: #EEF4FA; }

  body {
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: #0B1416;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #EEF4FA;
    color: #0B1416;
  }

  .head {
    margin: 0 0 48px;
  }

  .head h1 {
    margin: 0 0 12px;
    font-family: "Unbounded", "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .head p {
    margin: 0;
    font-size: 22px;
    line-height: 1.4;
    color: #55656A;
  }

  .queue {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .item {
    display: grid;
    grid-template-columns: 1fr 192px auto;
    align-items: center;
    column-gap: 32px;
    padding: 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  .item h2 {
    margin: 0 0 8px;
    font-family: "Unbounded", "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  .who {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font-size: 16px;
    color: #55656A;
  }

  .who svg {
    width: 24px;
    height: 24px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .amount {
    margin: 0;
    text-align: right;
    font-family: "Unbounded", "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: #0B1416;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn {
    appearance: none;
    -webkit-appearance: none;
    min-height: 44px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    cursor: pointer;
    transition:
      background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
      color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
      border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
  }

  .btn-primary:hover { background: #0263AC; }

  .btn-quiet {
    background: transparent;
    color: #0B1416;
  }

  .btn-quiet:hover {
    background: #E6EFF7;
    color: #0263AC;
  }

  .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <header class="head">
    <h1>Approvals</h1>
    <p>3 waiting for you</p>
  </header>

  <ul class="queue">
    <li class="item">
      <div>
        <h2>Q4 travel budget</h2>
        <p class="who">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          Leo Park
        </p>
      </div>
      <p class="amount">$4,800</p>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Q4 travel budget">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Q4 travel budget">Decline</button>
      </div>
    </li>

    <li class="item">
      <div>
        <h2>Design conference tickets</h2>
        <p class="who">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          Maya Chen
        </p>
      </div>
      <p class="amount">$1,250</p>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Design conference tickets">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Design conference tickets">Decline</button>
      </div>
    </li>

    <li class="item">
      <div>
        <h2>Standing desks for support</h2>
        <p class="who">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          Ana Ruiz
        </p>
      </div>
      <p class="amount">$2,100</p>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Standing desks for support">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Standing desks for support">Decline</button>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
