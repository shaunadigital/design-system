<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Approvals</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 720px;
    background: #FFFFFF;
    color: #0B1416;
  }

  .band {
    background: #EEF4FA;
    padding: 48px 64px 32px;
  }

  h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  .count {
    margin: 16px 0 0;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.5;
    color: #0263AC;
  }

  .queue {
    list-style: none;
    margin: 0;
    padding: 32px 64px 64px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .item {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    align-items: center;
    padding: 16px 24px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  .item:hover { background: #E6EFF7; }

  .title {
    grid-column: span 5;
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 18px;
    line-height: 1.3;
    letter-spacing: 0;
  }

  .requester {
    grid-column: span 2;
    margin: 0;
    font-size: 16px;
    color: #55656A;
  }

  .amount {
    grid-column: span 2;
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .actions {
    grid-column: span 3;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .btn {
    min-width: 112px;
    min-height: 44px;
    padding: 0 24px;
    border-radius: 999px;
    border: 1px solid #0B1416;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
  }
  .btn-primary:hover {
    background: #0263AC;
    border-color: #0263AC;
  }

  .btn-quiet {
    background: transparent;
    color: #0B1416;
    border-color: #9CC3EA;
  }
  .btn-quiet:hover {
    background: #E6EFF7;
    border-color: #0263AC;
  }

  .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<main id="component">
  <header class="band">
    <h1>Approvals</h1>
    <p class="count">3 waiting for you</p>
  </header>

  <ul class="queue">
    <li class="item">
      <h2 class="title">Q4 travel budget</h2>
      <p class="requester">Leo Park</p>
      <p class="amount">$4,800</p>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Q4 travel budget">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Q4 travel budget">Decline</button>
      </div>
    </li>

    <li class="item">
      <h2 class="title">Design conference tickets</h2>
      <p class="requester">Maya Chen</p>
      <p class="amount">$1,250</p>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Design conference tickets">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Design conference tickets">Decline</button>
      </div>
    </li>

    <li class="item">
      <h2 class="title">Standing desks for support</h2>
      <p class="requester">Ana Ruiz</p>
      <p class="amount">$2,100</p>
      <div class="actions">
        <button class="btn btn-primary" type="button" aria-label="Approve Standing desks for support">Approve</button>
        <button class="btn btn-quiet" type="button" aria-label="Decline Standing desks for support">Decline</button>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
