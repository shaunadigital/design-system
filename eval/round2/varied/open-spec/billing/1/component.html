<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Billing</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: #FFFFFF;
  }

  #component {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

    width: 1280px;
    min-height: 900px;
    margin: 0 auto;
    padding: 96px 64px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  #component h1,
  #component h2,
  #component h3 {
    margin: 0;
    font-family: "Unbounded", "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }

  #component h1 {
    font-size: 56px;
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }

  #component h2,
  #component h3 {
    font-size: 28px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  #component .plan {
    margin-top: 64px;
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    align-items: center;
    column-gap: 64px;
    padding: 48px;
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
  }

  #component .plan-price {
    margin: 12px 0 0;
    font-size: 18px;
    line-height: 1.5;
    color: var(--muted);
  }

  #component .seats-text {
    margin: 0;
    font-size: 16px;
    color: var(--ink);
  }

  #component .seats-bar {
    margin-top: 12px;
    height: 8px;
    border-radius: 999px;
    background: var(--accent-tint);
    overflow: hidden;
  }

  #component .seats-fill {
    width: 72%;
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
  }

  #component .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 32px;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background-color 180ms var(--ease);
  }

  #component .button:hover { background: var(--accent); }

  #component .button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  #component .invoices { margin-top: 96px; }

  #component .table-card {
    margin-top: 32px;
    padding: 16px 48px 24px;
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
  }

  #component table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-variant-numeric: tabular-nums;
  }

  #component th {
    padding: 24px 0 16px;
    border-bottom: 1px solid var(--accent-line);
    font-size: 12px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #component td {
    padding: 24px 0;
    border-bottom: 1px solid var(--sand);
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
  }

  #component tbody tr:last-child td { border-bottom: 0; padding-bottom: 8px; }

  #component th:nth-child(1), #component td:nth-child(1) { width: 40%; }
  #component th:nth-child(2), #component td:nth-child(2) { width: 30%; }

  #component .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-weight: 500;
  }

  #component .status::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--accent);
  }
</style>
</head>
<body>
<div id="component">
  <main>
    <h1>Billing</h1>

    <section class="plan" aria-labelledby="plan-title">
      <div>
        <h2 id="plan-title">Team plan</h2>
        <p class="plan-price">$24 per seat per month</p>
      </div>
      <div>
        <p class="seats-text">18 of 25 seats used</p>
        <div class="seats-bar" aria-hidden="true"><div class="seats-fill"></div></div>
      </div>
      <button class="button" type="button">Change Plan</button>
    </section>

    <section class="invoices" aria-labelledby="invoices-title">
      <h2 id="invoices-title">Invoices</h2>
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Amount</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Oct 1, 2026</td><td>$432.00</td><td><span class="status">Paid</span></td></tr>
            <tr><td>Sep 1, 2026</td><td>$432.00</td><td><span class="status">Paid</span></td></tr>
            <tr><td>Aug 1, 2026</td><td>$408.00</td><td><span class="status">Paid</span></td></tr>
            <tr><td>Jul 1, 2026</td><td>$408.00</td><td><span class="status">Paid</span></td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</body>
</html>
