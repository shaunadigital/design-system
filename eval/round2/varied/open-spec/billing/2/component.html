<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Billing</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 720px;
    margin: 0 auto;
    padding: 64px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component h1,
  #component h2 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    color: #0B1416;
  }

  #component h1 {
    font-size: 56px;
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  #component h2 {
    font-size: 28px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  .layout {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    align-items: start;
    margin-top: 48px;
  }

  .card {
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 32px;
  }

  .plan { grid-column: span 4; }
  .invoices { grid-column: span 8; }

  .price {
    margin: 12px 0 0;
    font-size: 18px;
    line-height: 1.5;
  }

  .seats { margin-top: 32px; }

  .seats-text {
    margin: 0;
    font-size: 16px;
    color: #0B1416;
  }

  .meter {
    margin-top: 8px;
    height: 8px;
    border-radius: 999px;
    background: #EEF4FA;
    overflow: hidden;
  }

  .meter span {
    display: block;
    width: 72%;
    height: 100%;
    border-radius: 999px;
    background: #0263AC;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin-top: 32px;
    padding: 0 24px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn:hover { background: #0263AC; }

  .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 4px;
  }

  table {
    width: 100%;
    margin-top: 16px;
    border-collapse: collapse;
  }

  th, td {
    padding: 12px 0;
    text-align: left;
    vertical-align: middle;
  }

  th {
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #55656A;
    border-bottom: 1px solid #9CC3EA;
  }

  td {
    font-size: 16px;
    border-bottom: 1px solid #EEF4FA;
  }

  tbody tr:last-child td { border-bottom: 0; }

  .col-date { width: 40%; }
  .col-amount { width: 30%; text-align: right; }
  .col-status { width: 30%; padding-left: 48px; }

  td.col-amount { font-variant-numeric: tabular-nums; }

  .status {
    display: inline-block;
    padding: 4px 12px;
    border: 1px solid #9CC3EA;
    border-radius: 999px;
    background: #E6EFF7;
    color: #0B1416;
    font-size: 14px;
    line-height: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <h1>Billing</h1>

  <div class="layout">
    <section class="card plan" aria-label="Current plan">
      <h2>Team plan</h2>
      <p class="price">$24 per seat per month</p>

      <div class="seats">
        <p class="seats-text">18 of 25 seats used</p>
        <div class="meter" aria-hidden="true"><span></span></div>
      </div>

      <button class="btn" type="button">Change Plan</button>
    </section>

    <section class="card invoices" aria-labelledby="invoices-heading">
      <h2 id="invoices-heading">Invoices</h2>
      <table>
        <thead>
          <tr>
            <th scope="col" class="col-date">Date</th>
            <th scope="col" class="col-amount">Amount</th>
            <th scope="col" class="col-status">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="col-date">Oct 1, 2026</td>
            <td class="col-amount">$432.00</td>
            <td class="col-status"><span class="status">Paid</span></td>
          </tr>
          <tr>
            <td class="col-date">Sep 1, 2026</td>
            <td class="col-amount">$432.00</td>
            <td class="col-status"><span class="status">Paid</span></td>
          </tr>
          <tr>
            <td class="col-date">Aug 1, 2026</td>
            <td class="col-amount">$408.00</td>
            <td class="col-status"><span class="status">Paid</span></td>
          </tr>
          <tr>
            <td class="col-date">Jul 1, 2026</td>
            <td class="col-amount">$408.00</td>
            <td class="col-status"><span class="status">Paid</span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
</div>
</body>
</html>
