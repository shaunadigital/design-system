<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #FFFFFF;
  }

  body {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 24px;
    color: #0B1416;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
  }

  h1, h2, p { margin: 0; }

  .page-title {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 64px;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .small-title {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 36px;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: 32px;
    align-items: center;
  }

  /* Plan panel */
  .plan {
    margin-top: 48px;
    padding: 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  .plan-info { grid-column: span 5; }
  .plan-seats { grid-column: span 4; }
  .plan-action { grid-column: span 3; justify-self: end; }

  .plan-price {
    margin-top: 8px;
    font-size: 18px;
    line-height: 28px;
    color: #55656A;
  }

  .seats-text {
    font-size: 16px;
    line-height: 24px;
    color: #0B1416;
  }

  .meter {
    margin-top: 12px;
    height: 8px;
    border-radius: 999px;
    background: #E6EFF7;
    overflow: hidden;
  }

  .meter-fill {
    display: block;
    width: 72%;
    height: 100%;
    border-radius: 999px;
    background: #0263AC;
  }

  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 8px 24px;
    border: 1px solid #0B1416;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 24px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .button:hover {
    background: #0263AC;
    border-color: #0263AC;
  }

  .button:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 4px;
  }

  /* Invoices */
  .invoices { margin-top: 48px; }

  .table-card {
    margin-top: 24px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  thead th {
    padding: 16px 32px;
    background: #EEF4FA;
    color: #55656A;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border-bottom: 1px solid #9CC3EA;
  }

  tbody td {
    padding: 16px 32px;
    font-size: 16px;
    line-height: 24px;
    color: #0B1416;
    border-bottom: 1px solid #E6EFF7;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #E6EFF7; }

  .col-date { width: 40%; }
  .col-amount { width: 30%; }
  .col-status { width: 30%; }

  .num {
    font-variant-numeric: tabular-nums;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #E6EFF7;
    color: #0263AC;
    font-size: 14px;
    font-weight: 500;
    line-height: 16px;
    letter-spacing: 0.02em;
  }

  .badge::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: currentColor;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <main>
    <h1 class="page-title">Billing</h1>

    <section class="plan grid" aria-labelledby="plan-title">
      <div class="plan-info">
        <h2 class="small-title" id="plan-title">Team plan</h2>
        <p class="plan-price">$24 per seat per month</p>
      </div>
      <div class="plan-seats">
        <p class="seats-text">18 of 25 seats used</p>
        <div class="meter" role="progressbar" aria-label="Seats used" aria-valuemin="0" aria-valuemax="25" aria-valuenow="18">
          <span class="meter-fill"></span>
        </div>
      </div>
      <div class="plan-action">
        <button class="button" type="button">Change Plan</button>
      </div>
    </section>

    <section class="invoices" aria-labelledby="invoices-title">
      <h2 class="small-title" id="invoices-title">Invoices</h2>
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th scope="col" class="col-date">Date</th>
              <th scope="col" class="col-amount">Amount</th>
              <th scope="col" class="col-status">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Oct 1, 2026</td>
              <td class="num">$432.00</td>
              <td><span class="badge">Paid</span></td>
            </tr>
            <tr>
              <td>Sep 1, 2026</td>
              <td class="num">$432.00</td>
              <td><span class="badge">Paid</span></td>
            </tr>
            <tr>
              <td>Aug 1, 2026</td>
              <td class="num">$408.00</td>
              <td><span class="badge">Paid</span></td>
            </tr>
            <tr>
              <td>Jul 1, 2026</td>
              <td class="num">$408.00</td>
              <td><span class="badge">Paid</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</body>
</html>
