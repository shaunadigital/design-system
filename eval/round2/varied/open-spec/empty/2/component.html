<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests | Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px;
    background: #FFFFFF;
    color: #0B1416;
  }

  #component h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  #component .empty {
    margin: 64px auto 0;
    width: 100%;
    max-width: 704px;
    padding: 64px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  #component h2 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  #component .empty p {
    margin: 12px 0 0;
    max-width: 440px;
    font-size: 18px;
    line-height: 1.5;
    color: #55656A;
  }

  #component .actions {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #component .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 12px 32px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.25;
    letter-spacing: 0.02em;
    text-decoration: none;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component .button:hover { background: #55656A; }

  #component .link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 999px;
    color: #0263AC;
    font-size: 16px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 4px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component .link:hover { background: #E6EFF7; }

  #component a:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .button, #component .link { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <main>
      <h1>Requests</h1>
      <section class="empty" aria-labelledby="empty-title">
        <h2 id="empty-title">No requests yet</h2>
        <p>When your team asks for something, it shows up here.</p>
        <div class="actions">
          <a class="button" href="#create">Create a Request</a>
          <a class="link" href="#import">Import from a spreadsheet</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
