<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Requests</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    gap: 64px;
  }

  #component h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #0B1416;
  }

  #component .panel {
    flex: 1;
    min-height: 480px;
    background: #EEF4FA;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 96px 64px;
  }

  #component .message {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  #component .icon {
    width: 64px;
    height: 64px;
    border-radius: 999px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    color: #0B1416;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 32px;
  }
  #component .icon svg { width: 24px; height: 24px; display: block; }

  #component h2 {
    margin: 0 0 12px;
    font-family: "Unbounded", "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  #component p {
    margin: 0 0 48px;
    font-size: 18px;
    line-height: 1.5;
    letter-spacing: 0;
    color: #55656A;
    max-width: 400px;
  }

  #component .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 32px;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    text-decoration: none;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:hover { background: #0263AC; }

  #component .link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 8px;
    color: #0263AC;
    font-size: 16px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .link:hover { background: #E6EFF7; }

  #component .btn:focus-visible,
  #component .link:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 4px;
  }
</style>
</head>
<body>
  <div id="component">
    <h1>Requests</h1>

    <section class="panel" aria-labelledby="empty-title">
      <div class="message">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 13l3-8h12l3 8"/>
            <path d="M3 13v6h18v-6"/>
            <path d="M3 13h5a4 4 0 0 0 8 0h5"/>
          </svg>
        </div>
        <h2 id="empty-title">No requests yet</h2>
        <p>When your team asks for something, it shows up here.</p>
        <div class="actions">
          <a class="btn" href="#">Create a Request</a>
          <a class="link" href="#">Import from a spreadsheet</a>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
