<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor: New request</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--sand);
  }

  body {
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px;
    background: var(--sand);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
  }

  h1 {
    grid-column: 1 / -1;
    margin: 0 0 32px;
    font-family: "Unbounded", "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .card {
    grid-column: 1 / span 8;
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
    padding: 32px;
  }

  form {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    row-gap: 24px;
    margin: 0;
  }

  .field { display: flex; flex-direction: column; }
  .full  { grid-column: 1 / -1; }
  .third { grid-column: span 4; }

  label {
    margin-bottom: 8px;
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
  }

  input, select, textarea {
    width: 100%;
    min-height: 44px;
    margin: 0;
    padding: 8px 12px;
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 24px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--muted);
    border-radius: 12px;
    transition: background-color 120ms var(--ease), border-color 120ms var(--ease);
  }

  textarea {
    min-height: 128px;
    resize: vertical;
  }

  input:hover, select:hover, textarea:hover { background: var(--accent-tint); }

  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-color: var(--accent);
    background: var(--paper);
  }

  .select-wrap { position: relative; }

  select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 48px;
    cursor: pointer;
  }

  .select-wrap::after {
    content: "";
    position: absolute;
    right: 20px;
    top: 50%;
    width: 8px;
    height: 8px;
    margin-top: -8px;
    border-right: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    transform: rotate(45deg);
    pointer-events: none;
  }

  .actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 8px;
    padding-top: 24px;
    border-top: 1px solid var(--accent-line);
  }

  button {
    min-height: 44px;
    padding: 8px 24px;
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 24px;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 180ms var(--ease), color 180ms var(--ease), border-color 180ms var(--ease);
  }

  .quiet {
    background: transparent;
    color: var(--ink);
  }
  .quiet:hover { background: var(--accent-tint); }

  .primary {
    background: var(--ink);
    color: var(--on-ink);
  }
  .primary:hover { background: var(--accent); }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div id="component">
    <div class="grid">
      <h1>New request</h1>

      <div class="card">
        <form action="#">
          <div class="field full">
            <label for="title">Title</label>
            <input id="title" name="title" type="text">
          </div>

          <div class="field full">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5"></textarea>
          </div>

          <div class="field third">
            <label for="priority">Priority</label>
            <div class="select-wrap">
              <select id="priority" name="priority">
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
              </select>
            </div>
          </div>

          <div class="field third">
            <label for="assignee">Assignee</label>
            <div class="select-wrap">
              <select id="assignee" name="assignee">
                <option>Maya Chen</option>
                <option>Leo Park</option>
                <option>Ana Ruiz</option>
              </select>
            </div>
          </div>

          <div class="field third">
            <label for="due">Due date</label>
            <input id="due" name="due" type="date">
          </div>

          <div class="actions">
            <button type="button" class="quiet">Cancel</button>
            <button type="submit" class="primary">Create Request</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
