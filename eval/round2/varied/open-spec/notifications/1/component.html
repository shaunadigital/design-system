<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  body {
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    color: #0B1416;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
  }

  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 32px;
    margin-bottom: 48px;
  }

  h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 24px;
    border: 1px solid #0B1416;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .btn:hover { background: #0263AC; border-color: #0263AC; }
  .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 4px; }

  .card {
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    overflow: hidden;
  }

  .list { list-style: none; margin: 0; padding: 0; }

  .item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 24px 32px;
    background: #FFFFFF;
    border-top: 1px solid #EEF4FA;
  }
  .item:first-child { border-top: 0; }
  .item.unread { background: #E6EFF7; }

  .dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: transparent;
  }
  .unread .dot { background: #0263AC; }

  .icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: #EEF4FA;
    color: #55656A;
  }
  .unread .icon { background: #FFFFFF; color: #0263AC; }
  .icon svg { width: 24px; height: 24px; display: block; }

  .text {
    flex: 1;
    min-width: 0;
    font-size: 18px;
    line-height: 1.4;
    font-weight: 400;
    color: #0B1416;
  }
  .unread .text { font-weight: 600; }

  .time {
    flex: none;
    font-size: 14px;
    line-height: 1.4;
    color: #55656A;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <main>
    <div class="header">
      <h1>Notifications</h1>
      <button class="btn" type="button">Mark All as Read</button>
    </div>

    <section class="card" aria-label="Notifications">
      <ul class="list">
        <li class="item unread">
          <span class="dot" role="img" aria-label="Unread"></span>
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
          </span>
          <span class="text">Leo Park approved Q4 travel budget</span>
          <span class="time">2h ago</span>
        </li>
        <li class="item unread">
          <span class="dot" role="img" aria-label="Unread"></span>
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/></svg>
          </span>
          <span class="text">Maya Chen assigned you Laptop refresh for design</span>
          <span class="time">3h ago</span>
        </li>
        <li class="item unread">
          <span class="dot" role="img" aria-label="Unread"></span>
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>
          </span>
          <span class="text">Your weekly summary is ready</span>
          <span class="time">1d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>
          </span>
          <span class="text">Ana Ruiz commented on VPN access for contractors</span>
          <span class="time">1d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><path d="M3 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M19 7v6M16 10h6"/></svg>
          </span>
          <span class="text">Sam Ito joined Harbor Ops</span>
          <span class="time">2d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>
          </span>
          <span class="text">Billing details were updated</span>
          <span class="time">3d ago</span>
        </li>
      </ul>
    </section>
  </main>
</div>
</body>
</html>
