<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor: Connect your tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 900px;
    margin: 0 auto;
    padding: 96px 64px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component .screen {
    width: 760px;
    margin: 0 auto;
  }

  #component .progress-label {
    margin: 0 0 12px;
    font-weight: 500;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0263AC;
  }

  #component .progress-bar {
    display: flex;
    gap: 8px;
    margin: 0 0 48px;
    padding: 0;
    list-style: none;
  }
  #component .progress-bar li {
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: #9CC3EA;
  }
  #component .progress-bar li.done { background: #0263AC; }

  #component h1 {
    margin: 0 0 16px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  #component .lead {
    margin: 0 0 48px;
    font-size: 22px;
    line-height: 1.4;
    color: #55656A;
  }

  #component .options {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 0 0 48px;
    padding: 0;
    list-style: none;
  }

  #component .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 24px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  #component .card h2 {
    margin: 0 0 4px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 18px;
    line-height: 1.3;
    letter-spacing: 0;
  }
  #component .card p {
    margin: 0;
    font-size: 16px;
    color: #55656A;
  }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 24px;
    border-radius: 999px;
    border: 1px solid #0B1416;
    background: transparent;
    color: #0B1416;
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:hover { background: #E6EFF7; }
  #component .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }

  #component .btn-primary { background: #0B1416; color: #FFFFFF; }
  #component .btn-primary:hover { background: #0263AC; border-color: #0263AC; }

  #component .btn-quiet { border-color: transparent; padding: 0 16px; }

  #component .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="screen">
    <p class="progress-label">Step 2 of 4</p>
    <ol class="progress-bar" aria-hidden="true">
      <li class="done"></li>
      <li class="done"></li>
      <li></li>
      <li></li>
    </ol>

    <h1>Connect your tools</h1>
    <p class="lead">Harbor works best with the tools your team already uses.</p>

    <ul class="options">
      <li class="card">
        <div>
          <h2>Slack</h2>
          <p>Get request updates in your channels</p>
        </div>
        <button type="button" class="btn" aria-label="Connect Slack">Connect</button>
      </li>
      <li class="card">
        <div>
          <h2>Google Calendar</h2>
          <p>See due dates on your calendar</p>
        </div>
        <button type="button" class="btn" aria-label="Connect Google Calendar">Connect</button>
      </li>
      <li class="card">
        <div>
          <h2>Jira</h2>
          <p>Link requests to engineering tickets</p>
        </div>
        <button type="button" class="btn" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button type="button" class="btn btn-quiet">Skip for Now</button>
      <button type="button" class="btn btn-primary">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
