<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor: Connect your tools</title>
<style>
  :root {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --curve: cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 900px;
    margin: 0 auto;
    padding: 96px 64px;
    background: var(--paper);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
  }

  .content {
    grid-column: 3 / span 8;
  }

  .progress {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 48px;
  }

  .progress-label {
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .segments {
    display: flex;
    gap: 8px;
  }

  .segments span {
    display: block;
    width: 32px;
    height: 4px;
    border-radius: 999px;
    background: var(--sand);
  }

  .segments span.done { background: var(--accent); }

  h1 {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .lead {
    margin-top: 24px;
    font-size: 22px;
    line-height: 1.5;
    color: var(--muted);
  }

  .options {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 64px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 24px;
    background: var(--paper);
    border: 1px solid var(--accent-line);
    border-radius: 16px;
  }

  .icon {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--sand);
    color: var(--accent);
  }

  .icon svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .text { flex: 1; min-width: 0; }

  .name {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 24px;
    letter-spacing: 0;
    color: var(--ink);
  }

  .desc {
    margin-top: 4px;
    font-size: 16px;
    line-height: 24px;
    color: var(--muted);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    line-height: 24px;
    cursor: pointer;
    transition: background-color 180ms var(--curve), border-color 180ms var(--curve), color 180ms var(--curve);
  }

  .btn:hover { background: var(--accent-tint); }

  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-connect {
    flex: none;
    border-color: var(--accent-line);
  }

  .btn-connect:hover { border-color: var(--accent); }

  .btn-primary {
    background: var(--ink);
    color: var(--on-ink);
    padding: 0 32px;
  }

  .btn-primary:hover { background: var(--accent); }

  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 64px;
  }

  .btn-quiet { margin-left: -24px; }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="grid">
    <div class="content">
      <div class="progress">
        <div class="segments" aria-hidden="true">
          <span class="done"></span><span class="done"></span><span></span><span></span>
        </div>
        <p class="progress-label">Step 2 of 4</p>
      </div>

      <h1>Connect your tools</h1>
      <p class="lead">Harbor works best with the tools your team already uses.</p>

      <ul class="options">
        <li class="card">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9.5 3.5 8 20.5M16 3.5l-1.5 17M4 9h16.5M3.5 15H20"/></svg>
          </div>
          <div class="text">
            <h2 class="name">Slack</h2>
            <p class="desc">Get request updates in your channels</p>
          </div>
          <button class="btn btn-connect" type="button" aria-label="Connect Slack">Connect</button>
        </li>

        <li class="card">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          </div>
          <div class="text">
            <h2 class="name">Google Calendar</h2>
            <p class="desc">See due dates on your calendar</p>
          </div>
          <button class="btn btn-connect" type="button" aria-label="Connect Google Calendar">Connect</button>
        </li>

        <li class="card">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3.5 20.5 12 12 20.5 3.5 12 12 3.5Z"/><path d="M12 8.5 15.5 12 12 15.5 8.5 12 12 8.5Z"/></svg>
          </div>
          <div class="text">
            <h2 class="name">Jira</h2>
            <p class="desc">Link requests to engineering tickets</p>
          </div>
          <button class="btn btn-connect" type="button" aria-label="Connect Jira">Connect</button>
        </li>
      </ul>

      <div class="actions">
        <button class="btn btn-quiet" type="button">Skip for Now</button>
        <button class="btn btn-primary" type="button">Continue</button>
      </div>
    </div>
  </main>
</div>
</body>
</html>
