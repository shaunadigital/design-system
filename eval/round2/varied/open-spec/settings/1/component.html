<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
  }

  #component h1 {
    margin: 0 0 48px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }

  #component .card {
    margin: 0 0 32px;
    padding: 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  #component h2 {
    margin: 0 0 24px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  /* General */
  #component .fields {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px 32px;
    margin-bottom: 32px;
  }
  #component .field { display: flex; flex-direction: column; gap: 8px; }
  #component .field label {
    font-size: 14px;
    font-weight: 500;
    color: #55656A;
  }
  #component .field input {
    height: 48px;
    padding: 0 16px;
    font: inherit;
    font-size: 16px;
    color: #0B1416;
    background: #FFFFFF;
    border: 1px solid #55656A;
    border-radius: 12px;
    transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .field input:hover { border-color: #0263AC; }
  #component .field input:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  /* Buttons */
  #component .btn {
    min-height: 44px;
    padding: 0 24px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }
  #component .btn-primary {
    color: #FFFFFF;
    background: #0B1416;
    border: 1px solid #0B1416;
  }
  #component .btn-primary:hover { background: #0263AC; border-color: #0263AC; }
  #component .btn-quiet {
    color: #0B1416;
    background: transparent;
    border: 1px solid #0B1416;
  }
  #component .btn-quiet:hover { background: #E6EFF7; }

  /* Notifications */
  #component .switches { list-style: none; margin: 0; padding: 0; }
  #component .switches li { border-top: 1px solid #9CC3EA; }
  #component .switches li:first-child { border-top: 0; }
  #component .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    min-height: 64px;
    cursor: pointer;
  }
  #component .switch-row input {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    flex: none;
    width: 48px;
    height: 28px;
    margin: 0;
    background: #FFFFFF;
    border: 1px solid #55656A;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .switch-row input::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    background: #55656A;
    border-radius: 999px;
    transition: transform 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .switch-row input:checked {
    background: #0B1416;
    border-color: #0B1416;
  }
  #component .switch-row input:checked::before {
    background: #FFFFFF;
    transform: translateX(20px);
  }
  #component .switch-row input:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  /* Danger zone */
  #component .danger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
  }
  #component .danger h2 { margin-bottom: 8px; }
  #component .danger p { margin: 0; color: #55656A; }

  @media (prefers-reduced-motion: reduce) {
    #component * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <h1>Workspace settings</h1>

  <section class="card" aria-labelledby="general-title">
    <h2 id="general-title">General</h2>
    <div class="fields">
      <div class="field">
        <label for="ws-name">Workspace name</label>
        <input id="ws-name" type="text" value="Harbor Ops">
      </div>
      <div class="field">
        <label for="ws-url">Workspace URL</label>
        <input id="ws-url" type="text" value="harbor.app/ops">
      </div>
    </div>
    <button class="btn btn-primary" type="button">Save Changes</button>
  </section>

  <section class="card" aria-labelledby="notifications-title">
    <h2 id="notifications-title">Notifications</h2>
    <ul class="switches">
      <li>
        <label class="switch-row">
          <span>Email me when a request is assigned to me</span>
          <input type="checkbox" role="switch" checked>
        </label>
      </li>
      <li>
        <label class="switch-row">
          <span>Weekly summary</span>
          <input type="checkbox" role="switch" checked>
        </label>
      </li>
      <li>
        <label class="switch-row">
          <span>Product updates</span>
          <input type="checkbox" role="switch">
        </label>
      </li>
    </ul>
  </section>

  <section class="card danger" aria-labelledby="danger-title">
    <div>
      <h2 id="danger-title">Danger zone</h2>
      <p>Deleting a workspace removes all of its requests for everyone.</p>
    </div>
    <button class="btn btn-quiet" type="button">Delete Workspace</button>
  </section>
</div>
</body>
</html>
