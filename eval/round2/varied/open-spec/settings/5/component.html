<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace settings</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
  }

  #component .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    row-gap: 24px;
  }

  #component h1 {
    grid-column: 1 / span 12;
    margin: 0 0 24px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  #component .card {
    grid-column: 1 / span 8;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 32px;
  }

  #component .card.danger { border-color: #0B1416; }

  #component h2 {
    margin: 0 0 24px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  #component .field { display: block; margin-bottom: 24px; }

  #component .field label {
    display: block;
    margin-bottom: 8px;
    color: #0263AC;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  #component .field input {
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border: 1px solid #55656A;
    border-radius: 12px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: inherit;
    font-size: 16px;
    transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1), background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component .field input:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
    border-color: #0263AC;
  }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 32px;
    border: 1px solid #0B1416;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    line-height: 1;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }

  #component .btn-primary { background: #0B1416; color: #FFFFFF; }
  #component .btn-primary:hover { background: #0263AC; border-color: #0263AC; }

  #component .btn-quiet { background: transparent; color: #0B1416; }
  #component .btn-quiet:hover { background: #E6EFF7; }

  #component .switches { list-style: none; margin: 0; padding: 0; }

  #component .switches li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    padding: 16px 0;
    border-top: 1px solid #9CC3EA;
  }

  #component .switches li:first-child { border-top: 0; padding-top: 0; }
  #component .switches li:last-child { padding-bottom: 0; }

  #component .switches label { flex: 1; cursor: pointer; }

  #component .switch {
    position: relative;
    flex: none;
    width: 52px;
    height: 32px;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid #55656A;
    border-radius: 999px;
    background: #FFFFFF;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 999px;
    background: #55656A;
    transition: transform 180ms cubic-bezier(0.2, 0.7, 0.2, 1), background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component .switch:checked { background: #0B1416; border-color: #0B1416; }
  #component .switch:checked::after { background: #FFFFFF; transform: translateX(20px); }
  #component .switch:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }

  #component .danger p { margin: 0 0 24px; }

  @media (prefers-reduced-motion: reduce) {
    #component *, #component *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="grid">
    <h1>Workspace settings</h1>

    <section class="card" aria-labelledby="general-title">
      <h2 id="general-title">General</h2>
      <div class="field">
        <label for="workspace-name">Workspace name</label>
        <input id="workspace-name" type="text" value="Harbor Ops">
      </div>
      <div class="field">
        <label for="workspace-url">Workspace URL</label>
        <input id="workspace-url" type="text" value="harbor.app/ops">
      </div>
      <button class="btn btn-primary" type="button">Save Changes</button>
    </section>

    <section class="card" aria-labelledby="notifications-title">
      <h2 id="notifications-title">Notifications</h2>
      <ul class="switches">
        <li>
          <label for="n-assigned">Email me when a request is assigned to me</label>
          <input class="switch" id="n-assigned" type="checkbox" role="switch" checked>
        </li>
        <li>
          <label for="n-weekly">Weekly summary</label>
          <input class="switch" id="n-weekly" type="checkbox" role="switch" checked>
        </li>
        <li>
          <label for="n-product">Product updates</label>
          <input class="switch" id="n-product" type="checkbox" role="switch">
        </li>
      </ul>
    </section>

    <section class="card danger" aria-labelledby="danger-title">
      <h2 id="danger-title">Danger zone</h2>
      <p>Deleting a workspace removes all of its requests for everyone.</p>
      <button class="btn btn-quiet" type="button">Delete Workspace</button>
    </section>
  </main>
</div>
</body>
</html>
