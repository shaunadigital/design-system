<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Harbor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    padding: 96px 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #EEF4FA;
  }

  .card {
    width: 480px;
    padding: 48px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  h1 {
    margin: 0 0 32px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: 0;
    text-transform: uppercase;
    color: #0B1416;
  }

  .field { margin-bottom: 24px; }

  label.field-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0263AC;
  }

  input[type="email"],
  input[type="password"] {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    color: #0B1416;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 12px;
    transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1),
                background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  input[type="email"]:hover,
  input[type="password"]:hover { background: #E6EFF7; }

  input[type="email"]:focus,
  input[type="password"]:focus {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
    border-color: #0263AC;
    background: #FFFFFF;
  }

  .keep {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    margin: 0 0 24px;
    font-size: 16px;
    color: #0B1416;
    cursor: pointer;
  }

  .keep input {
    flex: none;
    width: 24px;
    height: 24px;
    margin: 0;
    accent-color: #0263AC;
    cursor: pointer;
  }

  .keep input:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 12px 24px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .btn-primary {
    color: #FFFFFF;
    background: #0B1416;
    border: 1px solid #0B1416;
  }

  .btn-primary:hover { background: #0263AC; border-color: #0263AC; }

  .btn-secondary {
    margin-top: 16px;
    color: #0B1416;
    background: transparent;
    border: 1px solid #9CC3EA;
  }

  .btn-secondary:hover { background: #E6EFF7; border-color: #0263AC; }

  .help {
    margin: 24px 0 0;
    text-align: center;
  }

  .help a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-size: 16px;
    color: #0263AC;
    text-decoration: underline;
    text-underline-offset: 4px;
    transition: color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .help a:hover { color: #0B1416; }

  .help a:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
    border-radius: 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <h1>Sign in to Harbor</h1>
    <form>
      <div class="field">
        <label class="field-label" for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username">
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <label class="keep">
        <input type="checkbox" name="remember">
        <span>Keep me signed in</span>
      </label>
      <button class="btn btn-primary" type="submit">Sign In</button>
      <button class="btn btn-secondary" type="button">Continue with SSO</button>
      <p class="help"><a href="#">Forgot Password?</a></p>
    </form>
  </main>
</div>
</body>
</html>
