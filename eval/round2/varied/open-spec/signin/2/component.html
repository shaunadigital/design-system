<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Sign in to Harbor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; background: #FFFFFF; }

  body {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: #0B1416;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px;
    background: #EEF4FA;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 512px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 48px;
  }

  .mark {
    display: block;
    width: 24px;
    height: 24px;
    margin-bottom: 24px;
    color: #0263AC;
  }

  h1 {
    margin: 0 0 32px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .field { margin-bottom: 24px; }

  label.label {
    display: block;
    margin-bottom: 8px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0B1416;
  }

  input[type="email"],
  input[type="password"] {
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font-family: inherit;
    font-size: 16px;
    color: #0B1416;
    background: #FFFFFF;
    border: 1px solid #55656A;
    border-radius: 12px;
    outline: none;
    transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1),
                background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1),
                box-shadow 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  input[type="email"]:hover,
  input[type="password"]:hover {
    border-color: #0B1416;
    background: #E6EFF7;
  }

  input[type="email"]:focus,
  input[type="password"]:focus {
    border-color: #0263AC;
    background: #FFFFFF;
    box-shadow: 0 0 0 2px #0263AC;
  }

  .options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .check {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    cursor: pointer;
    color: #0B1416;
  }

  .check input {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: #0B1416;
    cursor: pointer;
  }

  .check input:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  a.link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-size: 16px;
    color: #0263AC;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    border-radius: 8px;
    transition: color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  a.link:hover { color: #0B1416; }

  a.link:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 0 24px;
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    line-height: 1;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .btn-primary {
    color: #FFFFFF;
    background: #0B1416;
    border: 1px solid #0B1416;
  }

  .btn-primary:hover {
    background: #0263AC;
    border-color: #0263AC;
  }

  .btn-secondary {
    color: #0B1416;
    background: transparent;
    border: 1px solid #55656A;
  }

  .btn-secondary:hover {
    background: #E6EFF7;
    border-color: #0B1416;
  }

  .rule {
    height: 1px;
    margin: 24px 0;
    background: #9CC3EA;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="5" r="2"></circle>
      <path d="M12 7v14"></path>
      <path d="M7 11h10"></path>
      <path d="M4 15c0 3.5 3.5 6 8 6s8-2.5 8-6"></path>
    </svg>

    <h1>Sign in to Harbor</h1>

    <form action="#" method="post">
      <div class="field">
        <label class="label" for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username">
      </div>

      <div class="field">
        <label class="label" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>

      <div class="options">
        <label class="check">
          <input type="checkbox" name="remember">
          <span>Keep me signed in</span>
        </label>
        <a class="link" href="#">Forgot Password?</a>
      </div>

      <button class="btn btn-primary" type="submit">Sign In</button>

      <div class="rule" aria-hidden="true"></div>

      <button class="btn btn-secondary" type="button">Continue with SSO</button>
    </form>
  </main>
</div>
</body>
</html>
