<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Harbor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; background: #FFFFFF; }

  body {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    color: #0B1416;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 96px 64px;
    background: #EEF4FA;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 520px;
    padding: 64px 48px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  h1 {
    margin: 0 0 48px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #0B1416;
  }

  form { margin: 0; }

  .field { margin: 0 0 24px; }

  label.field-label {
    display: block;
    margin: 0 0 8px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0263AC;
  }

  input[type="email"],
  input[type="password"] {
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    color: #0B1416;
    background: #FFFFFF;
    border: 1px solid #55656A;
    border-radius: 12px;
    transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1),
                background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  input[type="email"]:hover,
  input[type="password"]:hover { background: #E6EFF7; }

  input[type="email"]:focus,
  input[type="password"]:focus {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
    border-color: #0263AC;
    background: #FFFFFF;
  }

  .keep {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    margin: 0 0 32px;
    font-size: 16px;
    color: #0B1416;
    cursor: pointer;
  }

  .keep input {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: #0263AC;
    cursor: pointer;
  }

  .keep input:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 0 32px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-decoration: none;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .btn-primary {
    color: #FFFFFF;
    background: #0B1416;
    border: 1px solid #0B1416;
  }

  .btn-primary:hover { background: #0263AC; border-color: #0263AC; }

  .btn-quiet {
    margin-top: 12px;
    color: #0B1416;
    background: transparent;
    border: 1px solid #9CC3EA;
  }

  .btn-quiet:hover { background: #E6EFF7; }

  .help {
    margin: 32px 0 0;
    text-align: center;
  }

  .help a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 8px;
    font-size: 16px;
    color: #0263AC;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    border-radius: 8px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .help a:hover { background: #E6EFF7; }

  .help a:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div id="component">
    <main class="card">
      <h1>Sign in to Harbor</h1>
      <form action="#">
        <div class="field">
          <label class="field-label" for="email">Work email</label>
          <input type="email" id="email" name="email" autocomplete="email">
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password">
        </div>
        <label class="keep">
          <input type="checkbox" name="remember">
          <span>Keep me signed in</span>
        </label>
        <button type="submit" class="btn btn-primary">Sign In</button>
        <button type="button" class="btn btn-quiet">Continue with SSO</button>
        <p class="help"><a href="#">Forgot Password?</a></p>
      </form>
    </main>
  </div>
</body>
</html>
