<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EEF4FA; }

  #component {
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 96px 64px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    align-content: center;
    background: #EEF4FA;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component .card {
    grid-column: 4 / span 6;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 48px;
  }

  #component h1 {
    margin: 0 0 32px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  #component form { display: flex; flex-direction: column; }

  #component .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

  #component label.caption {
    font-family: "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0263AC;
  }

  #component input[type="email"],
  #component input[type="password"] {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    color: #0B1416;
    background: #FFFFFF;
    border: 1px solid #55656A;
    border-radius: 12px;
    transition: border-color 120ms var(--ease), background-color 120ms var(--ease);
  }
  #component input[type="email"]:hover,
  #component input[type="password"]:hover { background: #E6EFF7; }
  #component input[type="email"]:focus,
  #component input[type="password"]:focus { background: #FFFFFF; border-color: #0263AC; }

  #component :focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }

  #component .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
  }

  #component .check {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    cursor: pointer;
    color: #0B1416;
  }
  #component .check input {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: #0263AC;
  }

  #component a.link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: #0263AC;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    transition: text-decoration-thickness 120ms var(--ease);
  }
  #component a.link:hover { text-decoration-thickness: 2px; }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 0 24px;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 180ms var(--ease), color 180ms var(--ease), border-color 180ms var(--ease);
  }
  #component .btn-primary { background: #0B1416; color: #FFFFFF; border: 1px solid #0B1416; }
  #component .btn-primary:hover { background: #0263AC; border-color: #0263AC; }
  #component .btn-secondary { background: transparent; color: #0B1416; border: 1px solid #9CC3EA; margin-top: 12px; }
  #component .btn-secondary:hover { background: #E6EFF7; }

  @media (prefers-reduced-motion: reduce) {
    #component * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <h1>Sign in to Harbor</h1>
    <form action="#">
      <div class="field">
        <label class="caption" for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username">
      </div>
      <div class="field">
        <label class="caption" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" name="remember"> <span>Keep me signed in</span></label>
        <a class="link" href="#">Forgot Password?</a>
      </div>
      <button class="btn btn-primary" type="submit">Sign In</button>
      <button class="btn btn-secondary" type="button">Continue with SSO</button>
    </form>
  </main>
</div>
</body>
</html>
