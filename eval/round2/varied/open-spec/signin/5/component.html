<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 800px;
    padding: 96px 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #EEF4FA;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component .card {
    width: 480px;
    padding: 48px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  #component h1 {
    margin: 0 0 32px;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #0B1416;
  }

  #component .field { margin-bottom: 24px; }

  #component label.field-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #55656A;
  }

  #component input[type="email"],
  #component input[type="password"] {
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font-family: inherit;
    font-size: 16px;
    color: #0B1416;
    background: #FFFFFF;
    border: 1px solid #55656A;
    border-radius: 12px;
    transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1), background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component input[type="email"]:hover,
  #component input[type="password"]:hover { background: #E6EFF7; }
  #component input[type="email"]:focus,
  #component input[type="password"]:focus {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
    border-color: #0263AC;
  }

  #component .keep {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    margin-bottom: 24px;
    font-size: 16px;
    color: #0B1416;
    cursor: pointer;
  }
  #component .keep input {
    width: 24px;
    height: 24px;
    margin: 0;
    accent-color: #0263AC;
    cursor: pointer;
  }
  #component .keep input:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  #component .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 0 24px;
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }
  #component .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
    border: 1px solid #0B1416;
  }
  #component .btn-primary:hover { background: #0263AC; border-color: #0263AC; }
  #component .btn-quiet {
    margin-top: 12px;
    background: transparent;
    color: #0B1416;
    border: 1px solid #9CC3EA;
  }
  #component .btn-quiet:hover { background: #E6EFF7; }

  #component .forgot {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin-top: 24px;
    font-size: 16px;
    color: #0263AC;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  #component .forgot:hover { background: #E6EFF7; }
  #component .forgot:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    #component * { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <h1>Sign in to Harbor</h1>
    <form action="#" method="post">
      <div class="field">
        <label class="field-label" for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <label class="keep">
        <input type="checkbox" name="remember">
        <span>Keep me signed in</span>
      </label>
      <button class="btn btn-primary" type="submit">Sign In</button>
      <button class="btn btn-quiet" type="button">Continue with SSO</button>
      <a class="forgot" href="#">Forgot Password?</a>
    </form>
  </main>
</div>
</body>
</html>
