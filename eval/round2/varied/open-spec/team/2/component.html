<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: #FFFFFF;
    color: #0B1416;
  }

  body {
    font-family: "Archivo", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 900px;
    margin: 0 auto;
    padding: 96px 64px;
    background: #FFFFFF;
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 64px;
  }

  h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 32px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .btn-primary {
    background: #0B1416;
    color: #FFFFFF;
  }

  .btn-primary:hover {
    background: #0263AC;
  }

  .btn:focus-visible,
  .select:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .members {
    list-style: none;
    margin: 0;
    padding: 0;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    overflow: hidden;
  }

  .member {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .member + .member {
    border-top: 1px solid #EEF4FA;
  }

  .member:hover {
    background: #EEF4FA;
  }

  .identity {
    display: flex;
    align-items: center;
    gap: 24px;
    min-width: 0;
  }

  .avatar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: #E6EFF7;
    color: #0263AC;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .name {
    margin: 0;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.3;
    color: #0B1416;
  }

  .email {
    margin: 4px 0 0;
    font-size: 14px;
    line-height: 1.4;
    color: #55656A;
  }

  .role {
    position: relative;
    flex: none;
    width: 192px;
  }

  .role label {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .select {
    appearance: none;
    -webkit-appearance: none;
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 48px 0 16px;
    border: 1px solid #9CC3EA;
    border-radius: 12px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    cursor: pointer;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .select:hover {
    background: #E6EFF7;
    border-color: #0263AC;
  }

  .chevron {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 24px;
    height: 24px;
    color: #0B1416;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main id="component">
  <header class="page-header">
    <h1>Team</h1>
    <button type="button" class="btn btn-primary">Invite Member</button>
  </header>

  <ul class="members">
    <li class="member">
      <div class="identity">
        <span class="avatar" aria-hidden="true">MC</span>
        <div>
          <p class="name">Maya Chen</p>
          <p class="email">maya@harbor.app</p>
        </div>
      </div>
      <div class="role">
        <label for="role-maya">Role for Maya Chen</label>
        <select id="role-maya" class="select">
          <option selected>Admin</option>
          <option>Editor</option>
          <option>Viewer</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </li>

    <li class="member">
      <div class="identity">
        <span class="avatar" aria-hidden="true">LP</span>
        <div>
          <p class="name">Leo Park</p>
          <p class="email">leo@harbor.app</p>
        </div>
      </div>
      <div class="role">
        <label for="role-leo">Role for Leo Park</label>
        <select id="role-leo" class="select">
          <option>Admin</option>
          <option selected>Editor</option>
          <option>Viewer</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </li>

    <li class="member">
      <div class="identity">
        <span class="avatar" aria-hidden="true">AR</span>
        <div>
          <p class="name">Ana Ruiz</p>
          <p class="email">ana@harbor.app</p>
        </div>
      </div>
      <div class="role">
        <label for="role-ana">Role for Ana Ruiz</label>
        <select id="role-ana" class="select">
          <option>Admin</option>
          <option selected>Editor</option>
          <option>Viewer</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </li>

    <li class="member">
      <div class="identity">
        <span class="avatar" aria-hidden="true">SI</span>
        <div>
          <p class="name">Sam Ito</p>
          <p class="email">sam@harbor.app</p>
        </div>
      </div>
      <div class="role">
        <label for="role-sam">Role for Sam Ito</label>
        <select id="role-sam" class="select">
          <option>Admin</option>
          <option>Editor</option>
          <option selected>Viewer</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </li>

    <li class="member">
      <div class="identity">
        <span class="avatar" aria-hidden="true">KL</span>
        <div>
          <p class="name">Kai Lee</p>
          <p class="email">kai@harbor.app</p>
        </div>
      </div>
      <div class="role">
        <label for="role-kai">Role for Kai Lee</label>
        <select id="role-kai" class="select">
          <option>Admin</option>
          <option>Editor</option>
          <option selected>Viewer</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
