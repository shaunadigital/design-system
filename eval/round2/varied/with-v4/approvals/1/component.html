<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Approvals</title>
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --on-ink: #FFFFFF;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-label: 0.14em;
    --tracking-tight: -0.02em;
    --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--paper);
  }

  #component {
    width: 1280px;
    min-height: 720px;
    padding: var(--space-7) var(--space-6);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-small);
    line-height: 1.4;
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .page-head h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-heading);
    line-height: 1.1;
    letter-spacing: var(--tracking-tight);
    text-transform: uppercase;
  }

  .page-head p {
    margin: var(--space-3) 0 0;
    font-size: var(--text-body);
    color: var(--muted);
  }

  .card {
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
    padding: var(--space-5);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  col.c-title { width: auto; }
  col.c-requester { width: 200px; }
  col.c-amount { width: 120px; }
  col.c-actions { width: 232px; }

  th {
    height: 52px;
    padding: 0 var(--space-3);
    text-align: left;
    font-family: var(--font-label);
    font-weight: 500;
    font-size: var(--text-label);
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
  }

  td {
    height: 52px;
    padding: 0 var(--space-3);
    font-size: var(--text-small);
    border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: 0; }

  th.num, td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  td.title { font-weight: 600; }
  td.amount { font-weight: 600; }
  td.requester { color: var(--ink); }

  th.actions, td.actions { padding-right: 0; }

  .row-actions {
    display: flex;
    justify-content: flex-end;
    gap: var(--space-2);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 20px;
    border-radius: var(--radius-pill);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: var(--text-small);
    color: var(--ink);
    background: transparent;
    border: 0;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
  }

  .btn:hover { background: var(--accent-tint); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn--secondary { border: 1.5px solid var(--ink); }
  .btn--quiet { border: 0; }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="page-head">
      <h1>Approvals</h1>
      <p>3 waiting for you</p>
    </header>

    <section class="card" aria-label="Approvals queue">
      <table>
        <colgroup>
          <col class="c-title">
          <col class="c-requester">
          <col class="c-amount">
          <col class="c-actions">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">Request</th>
            <th scope="col">Requester</th>
            <th scope="col" class="num">Amount</th>
            <th scope="col" class="actions"><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="title" data-user-content>Q4 travel budget</td>
            <td class="requester">Leo Park</td>
            <td class="num amount">$4,800</td>
            <td class="actions">
              <div class="row-actions">
                <button type="button" class="btn btn--secondary" aria-label="Approve Q4 travel budget">Approve</button>
                <button type="button" class="btn btn--quiet" aria-label="Decline Q4 travel budget">Decline</button>
              </div>
            </td>
          </tr>
          <tr>
            <td class="title" data-user-content>Design conference tickets</td>
            <td class="requester">Maya Chen</td>
            <td class="num amount">$1,250</td>
            <td class="actions">
              <div class="row-actions">
                <button type="button" class="btn btn--secondary" aria-label="Approve Design conference tickets">Approve</button>
                <button type="button" class="btn btn--quiet" aria-label="Decline Design conference tickets">Decline</button>
              </div>
            </td>
          </tr>
          <tr>
            <td class="title" data-user-content>Standing desks for support</td>
            <td class="requester">Ana Ruiz</td>
            <td class="num amount">$2,100</td>
            <td class="actions">
              <div class="row-actions">
                <button type="button" class="btn btn--secondary" aria-label="Approve Standing desks for support">Approve</button>
                <button type="button" class="btn btn--quiet" aria-label="Decline Standing desks for support">Decline</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
