<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Approvals · Harbor</title>
<style>
/* Tokens copied from tokens.css (only the ones this screen uses) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-lead: 1.375rem;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --on-ink: #0E1618;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
}

.page-head { margin-bottom: var(--space-6); }

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
  letter-spacing: 0;
}

.summary {
  margin: var(--space-3) 0 0;
  font-size: var(--text-body-l);
  color: var(--muted);
}

.queue {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.item {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  column-gap: var(--space-6);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.item-title {
  margin: 0;
  font-size: var(--text-body-l);
  font-weight: 600;
  letter-spacing: var(--tracking-snug);
}

.item-requester {
  margin: var(--space-1) 0 0;
  font-size: var(--text-small);
  color: var(--muted);
}

.item-amount {
  font-size: var(--text-lead);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.item-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  min-width: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  border: 0;
  background: none;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-small);
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
}
.btn--secondary { border: 1.5px solid var(--ink); }
.btn--quiet { border: 0; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="page-head">
      <h1>Approvals</h1>
      <p class="summary">3 waiting for you</p>
    </header>

    <ul class="queue">
      <li class="item">
        <div>
          <h2 class="item-title">Q4 travel budget</h2>
          <p class="item-requester">Leo Park</p>
        </div>
        <div class="item-amount">$4,800</div>
        <div class="item-actions">
          <button class="btn btn--secondary" type="button" aria-label="Approve Q4 travel budget">Approve</button>
          <button class="btn btn--quiet" type="button" aria-label="Decline Q4 travel budget">Decline</button>
        </div>
      </li>

      <li class="item">
        <div>
          <h2 class="item-title">Design conference tickets</h2>
          <p class="item-requester">Maya Chen</p>
        </div>
        <div class="item-amount">$1,250</div>
        <div class="item-actions">
          <button class="btn btn--secondary" type="button" aria-label="Approve Design conference tickets">Approve</button>
          <button class="btn btn--quiet" type="button" aria-label="Decline Design conference tickets">Decline</button>
        </div>
      </li>

      <li class="item">
        <div>
          <h2 class="item-title">Standing desks for support</h2>
          <p class="item-requester">Ana Ruiz</p>
        </div>
        <div class="item-amount">$2,100</div>
        <div class="item-actions">
          <button class="btn btn--secondary" type="button" aria-label="Approve Standing desks for support">Approve</button>
          <button class="btn btn--quiet" type="button" aria-label="Decline Standing desks for support">Decline</button>
        </div>
      </li>
    </ul>
  </main>
</div>
</body>
</html>
