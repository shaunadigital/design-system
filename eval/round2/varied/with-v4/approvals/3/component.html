<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Approvals</title>
<style>
/* Tokens inlined from tokens.css so this file is self-contained */
:root {
  --paper: #FFFFFF;
  --paper-rgb: 255, 255, 255;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --accent-tint: #E6EFF7;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --live: #E26D7E;
  --live-rgb: 226, 109, 126;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-hero: 'Unbounded', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }
body { font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; }
h1, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }

#component {
  width: 1280px;
  min-height: 720px;
  margin: 0 auto;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6) var(--space-8);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.top h1 {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
  color: var(--ink);
}

.status {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-body-l);
  line-height: 1.4;
  color: var(--muted);
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--live);
  box-shadow: 0 0 0 4px rgba(var(--live-rgb), 0.18);
  flex: none;
}

.queue {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.item {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  column-gap: var(--space-6);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.who {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  min-width: 0;
}

.title {
  font-size: var(--text-body-l);
  font-weight: 600;
  line-height: 1.35;
  color: var(--ink);
}

.requester {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-small);
  line-height: 1.4;
  color: var(--muted);
}

.requester svg {
  width: 16px;
  height: 16px;
  flex: none;
}

.amount {
  min-width: 128px;
  text-align: right;
  font-family: var(--font-hero);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  color: var(--ink);
}

.actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-small);
  font-weight: 600;
  line-height: 1;
  color: var(--ink);
  background: none;
  border: 0;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}

.btn--secondary {
  border: 1.5px solid var(--ink);
}

.btn:hover { background: var(--accent-tint); }
.btn:active { background: var(--plate-hover); transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="top">
      <h1>Approvals</h1>
      <p class="status"><span class="dot" aria-hidden="true"></span>3 waiting for you</p>
    </header>

    <ul class="queue" aria-label="Approvals waiting for you">
      <li class="item">
        <div class="who">
          <p class="title" data-user-content>Q4 travel budget</p>
          <p class="requester">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg>
            <span>Leo Park</span>
          </p>
        </div>
        <p class="amount">$4,800</p>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>

      <li class="item">
        <div class="who">
          <p class="title" data-user-content>Design conference tickets</p>
          <p class="requester">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg>
            <span>Maya Chen</span>
          </p>
        </div>
        <p class="amount">$1,250</p>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>

      <li class="item">
        <div class="who">
          <p class="title" data-user-content>Standing desks for support</p>
          <p class="requester">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg>
            <span>Ana Ruiz</span>
          </p>
        </div>
        <p class="amount">$2,100</p>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>
    </ul>
  </main>
</div>
</body>
</html>
