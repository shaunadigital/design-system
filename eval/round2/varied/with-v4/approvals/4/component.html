<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals · Harbor</title>
<style>
  /* Tokens copied from tokens.css (light theme, the roles this screen uses) */
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --space-8: 64px;
    --space-9: 96px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-snug: -0.01em;
    --tracking-tight: -0.02em;
    --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
    --text-statement: clamp(1.25rem, 2.22vw, 2rem);
    --text-lead: 1.375rem;
    --text-body-l: 1.125rem;
    --text-body: 1rem;
    --text-small: 0.875rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }

  #component {
    width: 1280px;
    min-height: 800px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    line-height: 1.5;
    padding: var(--space-7) var(--space-6) var(--space-9);
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .page-head { display: block; }

  .page-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-heading);
    line-height: 1.1;
    letter-spacing: var(--tracking-snug);
    text-transform: uppercase;
  }

  .page-sub {
    margin: var(--space-3) 0 0;
    font-size: var(--text-body-l);
    color: var(--muted);
  }

  .queue {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }

  .approval {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 200px auto;
    align-items: center;
    column-gap: var(--space-6);
    padding: var(--space-5);
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
  }

  .approval-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: var(--text-lead);
    line-height: 1.25;
    letter-spacing: var(--tracking-tight);
  }

  .approval-requester {
    margin: var(--space-2) 0 0;
    font-size: var(--text-body);
    color: var(--muted);
  }

  .approval-amount {
    margin: 0;
    text-align: right;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-statement);
    line-height: 1.1;
    letter-spacing: var(--tracking-tight);
    font-variant-numeric: tabular-nums;
  }

  .approval-actions {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }

  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 20px;
    border-radius: var(--radius-pill);
    background: none;
    border: 0;
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: var(--text-small);
    line-height: 1;
    cursor: pointer;
    transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn--secondary { border: 1.5px solid var(--ink); }
  .btn--secondary:hover { background: var(--ink); color: var(--on-ink); }

  .btn--quiet:hover { background: var(--accent-tint); }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="page-head">
      <h1 class="page-title">Approvals</h1>
      <p class="page-sub">3 waiting for you</p>
    </header>

    <ul class="queue">
      <li class="approval">
        <div>
          <h2 class="approval-title">Q4 travel budget</h2>
          <p class="approval-requester">Leo Park</p>
        </div>
        <p class="approval-amount">$4,800</p>
        <div class="approval-actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>

      <li class="approval">
        <div>
          <h2 class="approval-title">Design conference tickets</h2>
          <p class="approval-requester">Maya Chen</p>
        </div>
        <p class="approval-amount">$1,250</p>
        <div class="approval-actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>

      <li class="approval">
        <div>
          <h2 class="approval-title">Standing desks for support</h2>
          <p class="approval-requester">Ana Ruiz</p>
        </div>
        <p class="approval-amount">$2,100</p>
        <div class="approval-actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>
    </ul>
  </main>
</div>
</body>
</html>
