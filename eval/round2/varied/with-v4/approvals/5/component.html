<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Approvals</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-lead: 1.375rem;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --tracking-tight: -0.02em;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
}
:root { color-scheme: light; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 720px;
  padding: var(--space-7) var(--space-6);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}
#component .page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

#component .top h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
  letter-spacing: var(--tracking-tight);
}
#component .top p {
  margin: var(--space-3) 0 0;
  color: var(--muted);
}

#component .queue {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
#component .item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 160px 120px auto;
  align-items: center;
  column-gap: var(--space-5);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}
#component .title {
  margin: 0;
  font-size: var(--text-body-l);
  font-weight: 600;
  line-height: 1.3;
}
#component .requester {
  color: var(--muted);
}
#component .amount {
  font-size: var(--text-lead);
  font-weight: 600;
  line-height: 1.2;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
#component .actions {
  display: flex;
  gap: var(--space-3);
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--radius-pill);
  background: none;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-small);
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease);
}
#component .btn--secondary {
  border: 1.5px solid var(--ink);
}
#component .btn:hover {
  background: rgba(var(--ink-rgb), 0.06);
}
#component .btn:active {
  background: rgba(var(--ink-rgb), 0.12);
}
#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="top">
      <h1>Approvals</h1>
      <p>3 waiting for you</p>
    </header>

    <ul class="queue">
      <li class="item">
        <h2 class="title" data-user-content>Q4 travel budget</h2>
        <span class="requester">Leo Park</span>
        <span class="amount">$4,800</span>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>
      <li class="item">
        <h2 class="title" data-user-content>Design conference tickets</h2>
        <span class="requester">Maya Chen</span>
        <span class="amount">$1,250</span>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>
      <li class="item">
        <h2 class="title" data-user-content>Standing desks for support</h2>
        <span class="requester">Ana Ruiz</span>
        <span class="amount">$2,100</span>
        <div class="actions">
          <button class="btn btn--secondary" type="button">Approve</button>
          <button class="btn btn--quiet" type="button">Decline</button>
        </div>
      </li>
    </ul>
  </main>
</div>
</body>
</html>
