<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Billing · Harbor</title>
<style>
  /* Tokens from tokens.css (day theme), inlined so the file is self-contained */
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --on-ink: #FFFFFF;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --font-hero: 'Unbounded', system-ui, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --space-8: 64px;
    --space-9: 96px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-tight: -0.02em;
    --tracking-label: 0.14em;
    --text-hero: clamp(1.5rem, 3.34vw, 3rem);
    --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
    --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-base: 180ms;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }

  #component {
    width: 1280px;
    min-height: 800px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    line-height: 1.5;
    padding: var(--space-7) var(--space-6) var(--space-9);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
  }

  h1, h2 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    text-transform: uppercase;
    letter-spacing: var(--tracking-tight);
    line-height: 1.1;
  }
  h1 { font-size: var(--text-heading); }
  h2 { font-size: var(--text-step); }

  .card {
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
  }

  /* Current plan */
  .plan {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-6);
    padding: var(--space-5);
  }
  .plan-main {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
    width: 360px;
  }
  .price {
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
    margin: 0;
  }
  .price-amount {
    font-family: var(--font-hero);
    font-weight: 300;
    font-size: var(--text-hero);
    letter-spacing: var(--tracking-tight);
    line-height: 1.1;
  }
  .price-unit {
    font-size: var(--text-small);
    color: var(--muted);
  }
  .seats {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }
  .seats-text {
    margin: 0;
    font-size: var(--text-small);
    color: var(--muted);
  }
  .meter {
    height: 8px;
    border-radius: var(--radius-pill);
    background: var(--accent-tint);
    overflow: hidden;
  }
  .meter-fill {
    display: block;
    height: 100%;
    width: 72%;
    border-radius: var(--radius-pill);
    background: var(--accent);
  }

  /* Primary button */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 20px;
    border-radius: var(--radius-pill);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: var(--text-small);
    line-height: 1;
    cursor: pointer;
    transition: opacity var(--dur-base) var(--ease);
  }
  .btn--primary {
    background: var(--ink);
    color: var(--on-ink);
    border: 0;
  }
  .btn--primary:hover { opacity: 0.88; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Invoices */
  .invoices {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
    margin-top: var(--space-5);
  }
  .table-card { padding: 0 var(--space-5); }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--text-small);
  }
  th, td {
    height: 52px;
    padding: 0;
    text-align: left;
    border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: 0; }
  th {
    font-family: var(--font-label);
    font-weight: 500;
    font-size: var(--text-label);
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--muted);
  }
  th:nth-child(1), td:nth-child(1) { width: 40%; }
  th:nth-child(2), td:nth-child(2) { width: 30%; }
  td:nth-child(2) { font-variant-numeric: tabular-nums; }
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    background: var(--accent-tint);
    color: var(--accent-text);
    font-size: var(--text-label);
    font-weight: 600;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="top">
      <h1>Billing</h1>
    </header>

    <section class="card plan" aria-labelledby="plan-title">
      <div class="plan-main">
        <h2 id="plan-title">Team plan</h2>
        <p class="price">
          <span class="price-amount">$24</span>
          <span class="price-unit">per seat per month</span>
        </p>
        <div class="seats">
          <p class="seats-text">18 of 25 seats used</p>
          <div class="meter" aria-hidden="true"><span class="meter-fill"></span></div>
        </div>
      </div>
      <button class="btn btn--primary" type="button">Change Plan</button>
    </section>

    <section class="invoices" aria-labelledby="invoices-title">
      <h2 id="invoices-title">Invoices</h2>
      <div class="card table-card">
        <table>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Amount</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Oct 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
            <tr><td>Sep 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
            <tr><td>Aug 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
            <tr><td>Jul 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</body>
</html>
