<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Billing · Harbor</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-hero: 'Unbounded', system-ui, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
  letter-spacing: var(--tracking-snug);
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

.section-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: var(--tracking-snug);
}

.plan {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-6);
}
.plan-info { display: flex; flex-direction: column; gap: var(--space-3); }
.plan-price { margin: 0; color: var(--muted); font-size: var(--text-small); }
.plan-price strong {
  font-family: var(--font-hero);
  font-weight: 300;
  font-size: var(--text-hero);
  color: var(--ink);
  line-height: 1.2;
}
.plan-seats { margin: 0; font-size: var(--text-body); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease);
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}
.btn--primary:hover { opacity: 0.88; }
.btn:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

.invoices-title { margin-bottom: var(--space-3); }

table { width: 100%; border-collapse: collapse; font-size: var(--text-small); }
th, td { height: 52px; padding: 0; text-align: left; border-bottom: 1px solid rgba(var(--ink-rgb), 0.1); }
tbody tr:last-child td { border-bottom: 0; }
th {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
td { font-variant-numeric: tabular-nums; }
.col-date { width: 40%; }
.col-amount { width: 30%; }
.col-status { width: 30%; }

.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  font-size: var(--text-label);
  font-weight: 600;
  line-height: 1.5;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1 class="page-title">Billing</h1>

    <section class="card plan" aria-label="Current plan">
      <div class="plan-info">
        <h2 class="section-title">Team plan</h2>
        <p class="plan-price"><strong>$24</strong> per seat per month</p>
        <p class="plan-seats">18 of 25 seats used</p>
      </div>
      <button type="button" class="btn btn--primary">Change Plan</button>
    </section>

    <section class="card" aria-labelledby="invoices-title">
      <h2 class="section-title invoices-title" id="invoices-title">Invoices</h2>
      <table>
        <thead>
          <tr>
            <th class="col-date" scope="col">Date</th>
            <th class="col-amount" scope="col">Amount</th>
            <th class="col-status" scope="col">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Oct 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Sep 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Aug 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Jul 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
