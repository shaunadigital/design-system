<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Billing</title>
<style>
/* Tokens from tokens.css, inlined so the file is self-contained */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --font-hero: 'Unbounded', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  padding: var(--space-7) var(--space-6) var(--space-9);
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
  padding-bottom: var(--space-3);
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

.label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.card-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
}

/* Plan panel */
.plan {
  display: grid;
  grid-template-columns: 1fr 320px auto;
  align-items: center;
  column-gap: var(--space-8);
  padding: var(--space-5) var(--space-5);
}

.plan-main {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.price {
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  color: var(--muted);
  font-size: var(--text-small);
}

.price-amount {
  font-family: var(--font-hero);
  font-weight: 300;
  font-size: var(--text-hero);
  line-height: 1.1;
  letter-spacing: var(--tracking-snug);
  color: var(--ink);
}

.seats {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.seats-text {
  margin: 0;
  font-size: var(--text-body);
  color: var(--ink);
}

.meter {
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  overflow: hidden;
}

.meter-fill {
  height: 100%;
  width: 72%;
  border-radius: var(--radius-pill);
  background: var(--accent);
}

/* Button: primary, 44px pill */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  border: 0;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  text-decoration: none;
  transition: opacity var(--dur-base) var(--ease), transform var(--dur-base) var(--ease);
}

.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
}

.btn--primary:hover { opacity: 0.88; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Invoices */
.invoices {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-small);
  font-variant-numeric: tabular-nums;
}

.table th {
  text-align: left;
  height: 44px;
  padding: 0;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}

.table td {
  height: 52px;
  padding: 0;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}

.table tbody tr:last-child td { border-bottom: 0; }

.table th:nth-child(1), .table td:nth-child(1) { width: 40%; }
.table th:nth-child(2), .table td:nth-child(2) { width: 40%; }

.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  font-size: var(--text-label);
  font-weight: 600;
  line-height: 1.5;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1 class="page-title">Billing</h1>

    <section class="card plan" aria-label="Current plan">
      <div class="plan-main">
        <h2 class="card-title">Team plan</h2>
        <p class="price"><span class="price-amount">$24</span> per seat per month</p>
      </div>
      <div class="seats">
        <p class="seats-text">18 of 25 seats used</p>
        <div class="meter" aria-hidden="true"><div class="meter-fill"></div></div>
      </div>
      <button class="btn btn--primary" type="button">Change Plan</button>
    </section>

    <section class="card invoices" aria-labelledby="invoices-title">
      <h2 class="card-title" id="invoices-title">Invoices</h2>
      <table class="table">
        <thead>
          <tr>
            <th scope="col"><span class="label">Date</span></th>
            <th scope="col"><span class="label">Amount</span></th>
            <th scope="col"><span class="label">Status</span></th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Oct 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Sep 1, 2026</td><td>$432.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Aug 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Jul 1, 2026</td><td>$408.00</td><td><span class="pill">Paid</span></td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
