<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requests · Harbor</title>
<style>
/* Tokens from tokens.css, inlined so this file is self-contained */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  margin: 0 auto;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#component .page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

#component .page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

#component .empty-card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
  box-shadow: 0 24px 48px -32px rgba(var(--shadow-rgb), 0.18);
}

#component .empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: var(--space-9) var(--space-6);
}

#component .empty-icon {
  display: grid;
  place-items: center;
  width: var(--space-8);
  height: var(--space-8);
  border-radius: var(--radius-md);
  background: var(--accent-tint);
  color: var(--accent-text);
  margin-bottom: var(--space-5);
}

#component .empty-icon svg {
  width: var(--space-6);
  height: var(--space-6);
  display: block;
}

#component .empty-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.25;
  letter-spacing: var(--tracking-tight);
  color: var(--ink);
}

#component .empty-text {
  margin: var(--space-3) 0 0;
  max-width: 420px;
  font-size: var(--text-body);
  color: var(--muted);
}

#component .empty-actions {
  margin-top: var(--space-6);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--radius-pill);
  font: inherit;
  font-size: var(--text-small);
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  text-decoration: none;
  transition: opacity var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}

#component .btn--primary {
  background: var(--ink);
  color: var(--on-ink);
}

#component .btn--primary:hover { opacity: 0.88; }
#component .btn--primary:active { transform: scale(0.98); }

#component .text-link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--space-2);
  border-radius: var(--radius-pill);
  font-size: var(--text-small);
  font-weight: 500;
  color: var(--accent-text);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
  transition: text-decoration-thickness var(--dur-fast) var(--ease);
}

#component .text-link:hover { text-decoration-thickness: 2px; }

#component .btn:focus-visible,
#component .text-link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1 class="page-title">Requests</h1>

    <section class="empty-card" aria-labelledby="empty-title">
      <div class="empty">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 13l2.6-7.2A2 2 0 0 1 7.5 4.5h9a2 2 0 0 1 1.9 1.3L21 13"/>
            <path d="M3 13v5a1.5 1.5 0 0 0 1.5 1.5h15A1.5 1.5 0 0 0 21 18v-5h-5.2a1.8 1.8 0 0 0-1.7 1.2 2.2 2.2 0 0 1-4.2 0A1.8 1.8 0 0 0 8.2 13H3z"/>
          </svg>
        </div>
        <h2 class="empty-title" id="empty-title">No requests yet</h2>
        <p class="empty-text">When your team asks for something, it shows up here.</p>
        <div class="empty-actions">
          <button type="button" class="btn btn--primary">Create a Request</button>
          <a class="text-link" href="#import">Import from a spreadsheet</a>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
