<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Requests · Harbor</title>
<style>
/* Tokens from tokens.css (day theme, the ones this screen uses) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-loose: 0.02em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-title: 1.75rem;
  --text-body-l: 1.125rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--paper);
}

#component {
  width: 1280px;
  min-height: 800px;
  display: flex;
  flex-direction: column;
  padding: var(--space-7) var(--space-6) 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

.page {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-loose);
  text-transform: uppercase;
  color: var(--ink);
}

.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-bottom: var(--space-9);
  text-align: center;
}

.empty-icon {
  width: var(--space-8);
  height: var(--space-8);
  display: grid;
  place-items: center;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  margin-bottom: var(--space-6);
}

.empty-icon svg {
  width: var(--space-6);
  height: var(--space-6);
  display: block;
}

.empty-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-title);
  line-height: 1.25;
  letter-spacing: var(--tracking-snug);
  color: var(--ink);
}

.empty-text {
  margin: var(--space-3) 0 0;
  max-width: 480px;
  font-size: var(--text-body-l);
  line-height: 1.55;
  color: var(--muted);
  text-wrap: balance;
}

.actions {
  margin-top: var(--space-6);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-small);
  font-weight: 600;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
}

.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
  transition: opacity var(--dur-base) var(--ease);
}

.btn--primary:hover { opacity: 0.88; }

.link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--space-2);
  border-radius: var(--radius-pill);
  font-size: var(--text-small);
  font-weight: 500;
  color: var(--accent-text);
  text-decoration: underline;
  text-decoration-color: transparent;
  text-underline-offset: var(--space-1);
  transition: text-decoration-color var(--dur-fast) var(--ease);
}

.link:hover { text-decoration-color: currentColor; }

.btn:focus-visible,
.link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div id="component">
  <div class="page">
    <h1 class="page-title">Requests</h1>

    <section class="empty" aria-labelledby="empty-title">
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 13.5 6.2 5.8A1.5 1.5 0 0 1 7.6 4.8h8.8a1.5 1.5 0 0 1 1.4 1l2.7 7.7"/>
          <path d="M3.5 13.5V18a1.5 1.5 0 0 0 1.5 1.5h14a1.5 1.5 0 0 0 1.5-1.5v-4.5h-4.6a1.5 1.5 0 0 0-1.4 1l-.2.5a1.5 1.5 0 0 1-1.4 1h-2.8a1.5 1.5 0 0 1-1.4-1l-.2-.5a1.5 1.5 0 0 0-1.4-1z"/>
        </svg>
      </div>
      <h2 class="empty-title" id="empty-title">No requests yet</h2>
      <p class="empty-text">When your team asks for something, it shows up here.</p>
      <div class="actions">
        <a class="btn btn--primary" href="#create">Create a Request</a>
        <a class="link" href="#import">Import from a spreadsheet</a>
      </div>
    </section>
  </div>
</div>
</body>
</html>
