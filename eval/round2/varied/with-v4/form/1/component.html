<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>New request · Harbor</title>
<style>
/* Tokens from tokens.css (day theme, subset in use) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-text: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
}
:root { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }
body { font-family: var(--font-body); font-size: var(--text-body); color: var(--ink); }

#component {
  width: 1280px;
  min-height: 800px;
  padding: var(--space-7) var(--space-6);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}
.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}
.top-row h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
  color: var(--ink);
}
.actions { display: flex; align-items: center; gap: var(--space-3); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
}
.btn--primary { background: var(--ink); color: var(--on-ink); border: 0; }
.btn--quiet { background: none; color: var(--ink); border: 0; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.form { display: flex; flex-direction: column; gap: var(--space-5); }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); }

.field { display: flex; flex-direction: column; min-width: 0; }
.field label {
  margin-bottom: var(--space-2);
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.input, .select, .textarea {
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  appearance: none;
  -webkit-appearance: none;
}
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.textarea { height: 112px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }

.select-wrap { position: relative; }
.select { padding-right: 40px; }
.select-wrap::after {
  content: "";
  position: absolute;
  right: 16px;
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 1.8px solid var(--ink);
  border-bottom: 1.8px solid var(--ink);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top-row">
      <h1>New request</h1>
      <div class="actions">
        <button class="btn btn--quiet" type="button">Cancel</button>
        <button class="btn btn--primary" type="submit" form="create-request">Create Request</button>
      </div>
    </div>

    <section class="card">
      <form class="form" id="create-request" action="#">
        <div class="field">
          <label for="title">Title</label>
          <input class="input" id="title" name="title" type="text">
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea class="textarea" id="description" name="description"></textarea>
        </div>

        <div class="row">
          <div class="field">
            <label for="priority">Priority</label>
            <div class="select-wrap">
              <select class="select" id="priority" name="priority">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="assignee">Assignee</label>
            <div class="select-wrap">
              <select class="select" id="assignee" name="assignee">
                <option>Maya Chen</option>
                <option>Leo Park</option>
                <option>Ana Ruiz</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="due">Due date</label>
            <input class="input" id="due" name="due" type="date">
          </div>
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
