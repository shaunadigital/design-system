<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Harbor: New request</title>
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --space-8: 64px;
    --radius-md: 12px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-tight: -0.02em;
    --tracking-label: 0.14em;
    --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }

  #component {
    width: 1280px;
    min-height: 800px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    line-height: 1.5;
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: var(--space-7) var(--space-6) var(--space-8);
    box-sizing: content-box;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-6);
    margin-bottom: var(--space-6);
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-heading);
    line-height: 1.1;
    letter-spacing: var(--tracking-tight);
    text-transform: uppercase;
    color: var(--ink);
  }

  .actions {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 20px;
    border: 1.5px solid transparent;
    border-radius: var(--radius-pill);
    background: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-small);
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
  }
  .btn--primary { background: var(--ink); color: var(--on-ink); }
  .btn--primary:hover { opacity: 0.88; }
  .btn--quiet:hover { background: rgba(var(--ink-rgb), 0.06); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card {
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
    padding: var(--space-5);
  }

  form {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-5);
  }
  .field { display: flex; flex-direction: column; min-width: 0; }
  .field--wide { grid-column: 1 / -1; }

  label {
    margin-bottom: var(--space-2);
    font-family: var(--font-label);
    font-size: var(--text-label);
    font-weight: 500;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--muted);
  }

  input, select, textarea {
    width: 100%;
    height: 44px;
    margin: 0;
    padding: 0 12px;
    border: 1px solid rgba(var(--ink-rgb), 0.2);
    border-radius: var(--radius-md);
    background: var(--paper);
    color: var(--ink);
    font: inherit;
    font-size: var(--text-body);
    line-height: 1.5;
    transition: border-color var(--dur-fast) var(--ease);
  }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
  textarea { height: 112px; padding: 10px 12px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

  .select { position: relative; }
  .select select { appearance: none; -webkit-appearance: none; padding-right: 40px; cursor: pointer; }
  .select svg {
    position: absolute;
    top: 50%;
    right: 12px;
    width: 16px;
    height: 16px;
    margin-top: -8px;
    color: var(--ink);
    pointer-events: none;
  }

  input[type="date"] { min-width: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>New request</h1>
      <div class="actions">
        <button class="btn btn--quiet" type="button">Cancel</button>
        <button class="btn btn--primary" type="submit" form="request-form">Create Request</button>
      </div>
    </div>

    <section class="card">
      <form id="request-form" action="#" method="post">
        <div class="field field--wide">
          <label for="title">Title</label>
          <input id="title" name="title" type="text">
        </div>

        <div class="field field--wide">
          <label for="description">Description</label>
          <textarea id="description" name="description"></textarea>
        </div>

        <div class="field">
          <label for="priority">Priority</label>
          <div class="select">
            <select id="priority" name="priority">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
            </select>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>

        <div class="field">
          <label for="assignee">Assignee</label>
          <div class="select">
            <select id="assignee" name="assignee">
              <option>Maya Chen</option>
              <option>Leo Park</option>
              <option>Ana Ruiz</option>
            </select>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>

        <div class="field">
          <label for="due">Due date</label>
          <input id="due" name="due" type="date">
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
