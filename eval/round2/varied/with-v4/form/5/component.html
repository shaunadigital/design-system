<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Harbor: New request</title>
<style>
/* Tokens inlined from tokens.css (day theme) so this file is self-contained */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
}
:root { color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }
body { font-family: var(--font-body); font-size: var(--text-body); color: var(--ink); }

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
}

.page-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}
.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
  color: var(--ink);
}
.page-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.card {
  margin-top: var(--space-6);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.fields {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}
.row-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-5);
}
.field { display: flex; flex-direction: column; min-width: 0; }

.label {
  margin-bottom: var(--space-2);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  line-height: 1.3;
  color: var(--muted);
}

.input, .select, .textarea {
  display: block;
  width: 100%;
  height: 44px;
  margin: 0;
  padding: 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.textarea { height: 112px; padding: 12px; resize: vertical; line-height: 1.4; }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
}

.select-wrap { position: relative; }
.select { appearance: none; -webkit-appearance: none; padding-right: 40px; cursor: pointer; }
.select-wrap svg {
  position: absolute;
  top: 50%;
  right: 12px;
  width: 16px;
  height: 16px;
  margin-top: -8px;
  color: var(--ink);
  pointer-events: none;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  margin: 0;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  color: var(--ink);
  background: none;
  border: 0;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease);
}
.btn:hover { opacity: 0.8; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--primary { background: var(--ink); color: var(--on-ink); }
.btn--quiet { background: none; color: var(--ink); }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="page-top">
      <h1 class="page-title">New request</h1>
      <div class="page-actions">
        <button class="btn btn--quiet" type="button">Cancel</button>
        <button class="btn btn--primary" type="submit" form="create-request">Create Request</button>
      </div>
    </div>

    <section class="card">
      <form id="create-request" class="fields" action="#">
        <div class="field">
          <label class="label" for="title">Title</label>
          <input class="input" id="title" name="title" type="text">
        </div>

        <div class="field">
          <label class="label" for="description">Description</label>
          <textarea class="textarea" id="description" name="description"></textarea>
        </div>

        <div class="row-3">
          <div class="field">
            <label class="label" for="priority">Priority</label>
            <div class="select-wrap">
              <select class="select" id="priority" name="priority">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
              </select>
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>
            </div>
          </div>

          <div class="field">
            <label class="label" for="assignee">Assignee</label>
            <div class="select-wrap">
              <select class="select" id="assignee" name="assignee">
                <option>Maya Chen</option>
                <option>Leo Park</option>
                <option>Ana Ruiz</option>
              </select>
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>
            </div>
          </div>

          <div class="field">
            <label class="label" for="due">Due date</label>
            <input class="input" id="due" name="due" type="date">
          </div>
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
