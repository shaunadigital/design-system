<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Harbor: Connect your tools</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--space-6);
}

.title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

.lede {
  margin: var(--space-3) 0 0;
  font-size: var(--text-body);
  color: var(--muted);
}

.label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.progress {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--space-2);
  flex: none;
}

.progress__bar {
  display: flex;
  gap: var(--space-1);
  width: 160px;
}

.progress__seg {
  flex: 1;
  height: 4px;
  border-radius: var(--radius-pill);
  background: rgba(var(--ink-rgb), 0.1);
}

.progress__seg--done { background: var(--accent); }

.options {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.option {
  display: grid;
  grid-template-columns: 240px 1fr auto;
  align-items: center;
  gap: var(--space-5);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.option__name {
  margin: 0;
  font-weight: 600;
  font-size: var(--text-body-l);
  line-height: 1.3;
}

.option__desc {
  margin: 0;
  font-size: var(--text-body);
  color: var(--muted);
}

.actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
  padding-top: var(--space-5);
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  min-width: 44px;
  padding: 0 20px;
  border: 1.5px solid transparent;
  border-radius: var(--radius-pill);
  background: none;
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease), background-color var(--dur-base) var(--ease);
}

.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn--primary {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--on-ink);
}
.btn--primary:hover { opacity: 0.88; }

.btn--secondary { border-color: var(--ink); }
.btn--secondary:hover { background: rgba(var(--ink-rgb), 0.05); }

.btn--quiet:hover { background: rgba(var(--ink-rgb), 0.05); }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header class="top">
      <div>
        <h1 class="title">Connect your tools</h1>
        <p class="lede">Harbor works best with the tools your team already uses.</p>
      </div>
      <div class="progress" role="group" aria-label="Progress">
        <span class="label">Step 2 of 4</span>
        <div class="progress__bar" aria-hidden="true">
          <span class="progress__seg progress__seg--done"></span>
          <span class="progress__seg progress__seg--done"></span>
          <span class="progress__seg"></span>
          <span class="progress__seg"></span>
        </div>
      </div>
    </header>

    <ul class="options">
      <li class="option">
        <h2 class="option__name">Slack</h2>
        <p class="option__desc">Get request updates in your channels</p>
        <button class="btn btn--secondary" type="button">Connect</button>
      </li>
      <li class="option">
        <h2 class="option__name">Google Calendar</h2>
        <p class="option__desc">See due dates on your calendar</p>
        <button class="btn btn--secondary" type="button">Connect</button>
      </li>
      <li class="option">
        <h2 class="option__name">Jira</h2>
        <p class="option__desc">Link requests to engineering tickets</p>
        <button class="btn btn--secondary" type="button">Connect</button>
      </li>
    </ul>

    <footer class="actions">
      <button class="btn btn--quiet" type="button">Skip for Now</button>
      <button class="btn btn--primary" type="button">Continue</button>
    </footer>
  </main>
</div>
</body>
</html>
