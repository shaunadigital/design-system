<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Connect your tools · Harbor</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --on-ink: #0E1618;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#component {
  width: 1280px;
  min-height: 720px;
  margin: 0 auto;
  background: var(--paper);
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.progress {
  display: flex;
  align-items: center;
  gap: var(--space-4);
}
.progress__label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
  margin: 0;
}
.progress__bar {
  display: flex;
  gap: var(--space-2);
  width: 160px;
}
.progress__bar span {
  flex: 1;
  height: 4px;
  border-radius: var(--radius-pill);
  background: rgba(var(--ink-rgb), 0.1);
}
.progress__bar span.is-done { background: var(--accent); }

.intro { display: flex; flex-direction: column; gap: var(--space-4); }
.intro__top { display: flex; flex-direction: column; gap: var(--space-5); }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: 0;
  text-transform: uppercase;
}
.lede {
  margin: 0;
  font-size: var(--text-body-l);
  color: var(--muted);
}

.options {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-6);
}
.option {
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.option__icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  background: var(--accent-tint);
  color: var(--accent-text);
  display: grid;
  place-items: center;
  margin-bottom: var(--space-5);
}
.option__icon svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.option__name {
  margin: 0;
  font-weight: 600;
  font-size: var(--text-body-l);
  line-height: 1.3;
  letter-spacing: var(--tracking-snug);
}
.option__desc {
  margin: var(--space-1) 0 var(--space-5);
  color: var(--muted);
  font-size: var(--text-body);
}
.option .btn { margin-top: auto; width: 100%; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  border: 0;
  background: none;
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--primary { background: var(--ink); color: var(--on-ink); }
.btn--primary:hover { background: rgba(var(--ink-rgb), 0.86); }
.btn--secondary { border: 1.5px solid var(--ink); }
.btn--secondary:hover { background: var(--accent-tint); }
.btn--quiet:hover { background: rgba(var(--ink-rgb), 0.06); }

.actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: var(--space-3);
  padding-top: var(--space-5);
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
</head>
<body>
<main id="component">
  <div class="page">
    <div class="intro">
      <div class="intro__top">
        <div class="progress">
          <p class="progress__label">Step 2 of 4</p>
          <div class="progress__bar" aria-hidden="true">
            <span class="is-done"></span><span class="is-done"></span><span></span><span></span>
          </div>
        </div>
        <h1>Connect your tools</h1>
      </div>
      <p class="lede">Harbor works best with the tools your team already uses.</p>
    </div>

    <ul class="options">
      <li class="option">
        <div class="option__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9.5 4 8 20M16 4l-1.5 16M4 9h16M3.5 15h16"/></svg>
        </div>
        <h2 class="option__name">Slack</h2>
        <p class="option__desc">Get request updates in your channels</p>
        <button class="btn btn--secondary" type="button" aria-label="Connect Slack">Connect</button>
      </li>
      <li class="option">
        <div class="option__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        </div>
        <h2 class="option__name">Google Calendar</h2>
        <p class="option__desc">See due dates on your calendar</p>
        <button class="btn btn--secondary" type="button" aria-label="Connect Google Calendar">Connect</button>
      </li>
      <li class="option">
        <div class="option__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3.5 20 12l-8 8.5L4 12z"/><path d="m12 8.5 3.5 3.5-3.5 3.5L8.5 12z"/></svg>
        </div>
        <h2 class="option__name">Jira</h2>
        <p class="option__desc">Link requests to engineering tickets</p>
        <button class="btn btn--secondary" type="button" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button class="btn btn--quiet" type="button">Skip for Now</button>
      <button class="btn btn--primary" type="button">Continue</button>
    </div>
  </div>
</main>
</body>
</html>
