<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor: Connect your tools</title>
<style>
/* Tokens copied from tokens.css (day theme, only the ones used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-lead: 1.375rem;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#component .page {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

/* Header */
#component .progress {
  display: flex;
  align-items: center;
  gap: var(--space-4);
}
#component .progress-label {
  margin: 0;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}
#component .progress-bar {
  display: flex;
  gap: var(--space-1);
}
#component .progress-bar span {
  width: 32px;
  height: 4px;
  border-radius: var(--radius-pill);
  background: rgba(var(--ink-rgb), 0.1);
}
#component .progress-bar span.is-done { background: var(--accent); }

#component h1 {
  margin: var(--space-5) 0 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.15;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
}
#component .intro {
  margin: var(--space-4) 0 0;
  font-size: var(--text-body-l);
  color: var(--muted);
}

/* Options */
#component .options {
  list-style: none;
  margin: var(--space-5) 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-6);
}
#component .option {
  display: flex;
  flex-direction: column;
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}
#component .option-icon {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-md);
  background: var(--accent-tint);
  color: var(--accent-text);
}
#component .option-icon svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#component .option h2 {
  margin: var(--space-5) 0 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.25;
}
#component .option p {
  margin: var(--space-2) 0 0;
  font-size: var(--text-body);
  color: var(--muted);
}
#component .option .btn { margin-top: var(--space-6); align-self: flex-start; }

/* Buttons: 44px pills, one size */
#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  border: 1.5px solid transparent;
  background: none;
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
#component .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#component .btn--primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
#component .btn--primary:hover { background: rgba(var(--ink-rgb), 0.85); }
#component .btn--secondary { border-color: var(--ink); }
#component .btn--secondary:hover { background: var(--accent-tint); }
#component .btn--quiet:hover { background: rgba(var(--ink-rgb), 0.06); }

/* Footer actions */
#component .actions {
  margin-top: auto;
  padding-top: var(--space-5);
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: var(--space-3);
}

@media (prefers-reduced-motion: reduce) {
  #component .btn { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <header>
      <div class="progress">
        <p class="progress-label">Step 2 of 4</p>
        <div class="progress-bar" aria-hidden="true">
          <span class="is-done"></span><span class="is-done"></span><span></span><span></span>
        </div>
      </div>
      <h1>Connect your tools</h1>
      <p class="intro">Harbor works best with the tools your team already uses.</p>
    </header>

    <ul class="options">
      <li class="option">
        <div class="option-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9.5 4 7.5 20M16.5 4l-2 16M4 9h16M3.5 15h16"/></svg>
        </div>
        <h2>Slack</h2>
        <p>Get request updates in your channels</p>
        <button type="button" class="btn btn--secondary" aria-label="Connect Slack">Connect</button>
      </li>
      <li class="option">
        <div class="option-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
        </div>
        <h2>Google Calendar</h2>
        <p>See due dates on your calendar</p>
        <button type="button" class="btn btn--secondary" aria-label="Connect Google Calendar">Connect</button>
      </li>
      <li class="option">
        <div class="option-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3l8 9-8 9-8-9z"/><circle cx="12" cy="12" r="2"/></svg>
        </div>
        <h2>Jira</h2>
        <p>Link requests to engineering tickets</p>
        <button type="button" class="btn btn--secondary" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button type="button" class="btn btn--quiet">Skip for Now</button>
      <button type="button" class="btn btn--primary">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
