<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace settings · Harbor</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 1280px;
  min-height: 800px;
  background: var(--paper);
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.15;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

.card-title {
  margin: 0 0 var(--space-5);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

.fields {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  max-width: 480px;
}

.field label {
  display: block;
  margin-bottom: var(--space-2);
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.field input {
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
}
.field input::placeholder { color: var(--muted); }
.field input:focus { outline: 2px solid var(--accent); outline-offset: 0; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease);
}
.btn:hover { opacity: 0.88; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--primary { background: var(--ink); color: var(--on-ink); border: 0; }
.btn--secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }

.card-actions { margin-top: var(--space-5); }

.switch-list { list-style: none; margin: 0; padding: 0; }
.switch-list li + li { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  min-height: 52px;
  cursor: pointer;
}

.switch {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  flex: none;
  width: 44px;
  height: 24px;
  margin: 0;
  background: transparent;
  border: 1.5px solid var(--muted);
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.switch::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 4px;
  width: 14px;
  height: 14px;
  background: var(--muted);
  border-radius: var(--radius-pill);
  transform: translateY(-50%);
  transition: transform var(--dur-base) var(--ease), background var(--dur-base) var(--ease);
}
.switch:checked { background: var(--ink); border-color: var(--ink); }
.switch:checked::after { background: var(--on-ink); transform: translate(19px, -50%); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.danger-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}
.danger-row p { margin: 0; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .btn, .switch, .switch::after { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1 class="page-title">Workspace settings</h1>

    <section class="card" aria-labelledby="general-title">
      <h2 class="card-title" id="general-title">General</h2>
      <div class="fields">
        <div class="field">
          <label for="workspace-name">Workspace name</label>
          <input type="text" id="workspace-name" name="workspace-name" value="Harbor Ops">
        </div>
        <div class="field">
          <label for="workspace-url">Workspace URL</label>
          <input type="text" id="workspace-url" name="workspace-url" value="harbor.app/ops">
        </div>
      </div>
      <div class="card-actions">
        <button type="button" class="btn btn--primary">Save Changes</button>
      </div>
    </section>

    <section class="card" aria-labelledby="notifications-title">
      <h2 class="card-title" id="notifications-title">Notifications</h2>
      <ul class="switch-list">
        <li>
          <label class="switch-row">
            <span>Email me when a request is assigned to me</span>
            <input type="checkbox" class="switch" role="switch" checked>
          </label>
        </li>
        <li>
          <label class="switch-row">
            <span>Weekly summary</span>
            <input type="checkbox" class="switch" role="switch" checked>
          </label>
        </li>
        <li>
          <label class="switch-row">
            <span>Product updates</span>
            <input type="checkbox" class="switch" role="switch">
          </label>
        </li>
      </ul>
    </section>

    <section class="card" aria-labelledby="danger-title">
      <h2 class="card-title" id="danger-title">Danger zone</h2>
      <div class="danger-row">
        <p>Deleting a workspace removes all of its requests for everyone.</p>
        <button type="button" class="btn btn--secondary">Delete Workspace</button>
      </div>
    </section>
  </main>
</div>
</body>
</html>
