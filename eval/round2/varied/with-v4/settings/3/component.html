<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Workspace settings · Harbor</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --white: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  padding: var(--space-7) var(--space-6) var(--space-8);
}

#component .page {
  max-width: 1120px;
  margin: 0 auto;
}

#component .page-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 64px;
}

#component h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

#component .sections {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
  margin-top: var(--space-7);
}

#component .section {
  display: grid;
  grid-template-columns: 360px 1fr;
  column-gap: var(--space-6);
  align-items: start;
}

#component h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
}

#component .card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

#component .field + .field { margin-top: var(--space-5); }

#component .field label {
  display: block;
  margin-bottom: var(--space-2);
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  line-height: 1.3;
  text-transform: uppercase;
  color: var(--muted);
}

#component .field input {
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 var(--space-3);
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--white);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
#component .field input::placeholder { color: var(--muted); }
#component .field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
}

#component .actions { margin-top: var(--space-5); }

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  border-radius: var(--radius-pill);
  cursor: pointer;
  white-space: nowrap;
  transition: background-color var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
}
#component .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#component .btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}
#component .btn--primary:hover { opacity: 0.88; }
#component .btn--secondary {
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--ink);
}
#component .btn--secondary:hover { background: var(--accent-tint); }

#component .switch-row {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  min-height: 52px;
  cursor: pointer;
}
#component .switch-row + .switch-row {
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
}
#component .switch-text {
  font-size: var(--text-body);
  color: var(--ink);
}
#component .switch-row input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
#component .track {
  position: relative;
  flex: none;
  width: 44px;
  height: 24px;
  border-radius: var(--radius-pill);
  background: var(--white);
  border: 1.5px solid var(--muted);
  transition: background-color var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
#component .track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 15px;
  height: 15px;
  border-radius: var(--radius-pill);
  background: var(--muted);
  transition: transform var(--dur-base) var(--ease), background-color var(--dur-base) var(--ease);
}
#component .switch-row input:checked + .track {
  background: var(--accent);
  border-color: var(--accent);
}
#component .switch-row input:checked + .track::after {
  background: var(--white);
  transform: translateX(20px);
}
#component .switch-row input:focus-visible + .track {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

#component .danger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-6);
}
#component .danger p {
  margin: 0;
  max-width: 440px;
  font-size: var(--text-body);
  color: var(--muted);
}

@media (prefers-reduced-motion: reduce) {
  #component * { transition: none !important; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="page-top">
      <h1>Workspace settings</h1>
    </div>

    <div class="sections">
      <section class="section" aria-labelledby="general-title">
        <h2 id="general-title">General</h2>
        <form class="card">
          <div class="field">
            <label for="ws-name">Workspace name</label>
            <input id="ws-name" type="text" value="Harbor Ops" autocomplete="off">
          </div>
          <div class="field">
            <label for="ws-url">Workspace URL</label>
            <input id="ws-url" type="text" value="harbor.app/ops" autocomplete="off">
          </div>
          <div class="actions">
            <button type="button" class="btn btn--primary">Save Changes</button>
          </div>
        </form>
      </section>

      <section class="section" aria-labelledby="notifications-title">
        <h2 id="notifications-title">Notifications</h2>
        <div class="card">
          <label class="switch-row">
            <span class="switch-text">Email me when a request is assigned to me</span>
            <input type="checkbox" role="switch" checked>
            <span class="track" aria-hidden="true"></span>
          </label>
          <label class="switch-row">
            <span class="switch-text">Weekly summary</span>
            <input type="checkbox" role="switch" checked>
            <span class="track" aria-hidden="true"></span>
          </label>
          <label class="switch-row">
            <span class="switch-text">Product updates</span>
            <input type="checkbox" role="switch">
            <span class="track" aria-hidden="true"></span>
          </label>
        </div>
      </section>

      <section class="section" aria-labelledby="danger-title">
        <h2 id="danger-title">Danger zone</h2>
        <div class="card danger">
          <p>Deleting a workspace removes all of its requests for everyone.</p>
          <button type="button" class="btn btn--secondary">Delete Workspace</button>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
