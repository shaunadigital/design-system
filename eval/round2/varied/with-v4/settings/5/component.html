<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Workspace settings · Harbor</title>
<style>
/* Tokens from tokens.css (light theme, only those used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--paper);
}

body {
  font-family: var(--font-body);
  font-size: var(--text-body);
  color: var(--ink);
  line-height: 1.5;
}

#component {
  width: 1280px;
  min-height: 100vh;
  background: var(--paper);
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.page-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

h1, h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  text-transform: uppercase;
}

h1 {
  font-size: var(--text-heading);
  line-height: 1.1;
}

h2 {
  font-size: var(--text-step);
  line-height: 1.2;
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

/* Form fields */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field-label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.field input {
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  height: 44px;
  padding: 0 12px;
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  background: var(--paper);
  outline: none;
  width: 100%;
}

.field input::placeholder { color: var(--muted); }

.field input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 0;
}

.fields {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease);
}

.btn:hover { opacity: 0.88; }

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}

.btn--secondary {
  background: none;
  color: var(--ink);
  border: 1.5px solid var(--ink);
}

.card-actions {
  display: flex;
  justify-content: flex-start;
}

/* Switch rows */
.switches {
  list-style: none;
  margin: 0;
  padding: 0;
}

.switches li + li {
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
}

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  min-height: 52px;
  cursor: pointer;
  font-size: var(--text-body);
}

.switch {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  flex: none;
  width: 44px;
  height: 24px;
  margin: 0;
  border-radius: var(--radius-pill);
  background: var(--muted);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease);
}

.switch::before {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--paper);
  transition: transform var(--dur-base) var(--ease);
}

.switch:checked { background: var(--accent); }
.switch:checked::before { transform: translateX(20px); }

.switch:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Danger zone */
.danger-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}

.danger-row p {
  margin: 0;
  font-size: var(--text-body);
}

@media (prefers-reduced-motion: reduce) {
  .btn, .switch, .switch::before { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="page-top">
      <h1>Workspace settings</h1>
    </div>

    <section class="card" aria-labelledby="general-title">
      <h2 id="general-title">General</h2>
      <div class="fields">
        <div class="field">
          <label class="field-label" for="workspace-name">Workspace name</label>
          <input id="workspace-name" type="text" value="Harbor Ops" autocomplete="off">
        </div>
        <div class="field">
          <label class="field-label" for="workspace-url">Workspace URL</label>
          <input id="workspace-url" type="text" value="harbor.app/ops" autocomplete="off">
        </div>
      </div>
      <div class="card-actions">
        <button type="button" class="btn btn--primary">Save Changes</button>
      </div>
    </section>

    <section class="card" aria-labelledby="notifications-title">
      <h2 id="notifications-title">Notifications</h2>
      <ul class="switches">
        <li>
          <label class="switch-row">
            <span>Email me when a request is assigned to me</span>
            <input class="switch" type="checkbox" role="switch" checked>
          </label>
        </li>
        <li>
          <label class="switch-row">
            <span>Weekly summary</span>
            <input class="switch" type="checkbox" role="switch" checked>
          </label>
        </li>
        <li>
          <label class="switch-row">
            <span>Product updates</span>
            <input class="switch" type="checkbox" role="switch">
          </label>
        </li>
      </ul>
    </section>

    <section class="card" aria-labelledby="danger-title">
      <h2 id="danger-title">Danger zone</h2>
      <div class="danger-row">
        <p>Deleting a workspace removes all of its requests for everyone.</p>
        <button type="button" class="btn btn--secondary">Delete Workspace</button>
      </div>
    </section>
  </main>
</div>
</body>
</html>
