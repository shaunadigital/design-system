<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Sign in to Harbor</title>
<style>
/* tokens.css (light theme) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-7) var(--space-6);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  -webkit-font-smoothing: antialiased;
}

.card {
  width: 400px;
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  box-shadow: 0 24px 48px -24px rgba(var(--shadow-rgb), 0.35);
}

h1 {
  margin: 0 0 var(--space-6);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
  text-wrap: balance;
  color: var(--ink);
}

.field { margin-bottom: var(--space-5); }

.field label {
  display: block;
  margin-bottom: var(--space-2);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.field input {
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  transition: border-color var(--dur-fast) var(--ease);
}
.field input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 0;
  border-color: var(--accent);
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-5);
}

.check {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 44px;
  font-size: var(--text-small);
  color: var(--ink);
  cursor: pointer;
}
.check input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--ink);
  cursor: pointer;
}
.check input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font-size: var(--text-small);
  font-weight: 500;
  color: var(--accent-text);
  text-decoration: underline;
  text-underline-offset: 3px;
  border-radius: var(--radius-sm);
}
.link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 44px;
  padding: 0 20px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease), background-color var(--dur-base) var(--ease);
}
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}
.btn--primary:hover { opacity: 0.88; }
.btn--secondary {
  margin-top: var(--space-3);
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--ink);
}
.btn--secondary:hover { background: var(--accent-tint); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <h1>Sign in to Harbor</h1>
    <form action="#" method="post">
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <div class="row">
        <label class="check">
          <input type="checkbox" name="remember">
          Keep me signed in
        </label>
        <a class="link" href="#">Forgot Password?</a>
      </div>
      <button class="btn btn--primary" type="submit">Sign In</button>
      <button class="btn btn--secondary" type="button">Continue with SSO</button>
    </form>
  </main>
</div>
</body>
</html>
