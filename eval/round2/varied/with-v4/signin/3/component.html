<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Sign in to Harbor</title>
<style>
/* Tokens inlined from tokens.css so this file is self-contained. */
:root {
  --paper: #FFFFFF;
  --paper-rgb: 255, 255, 255;
  --sand: #EEF4FA;
  --sand-rgb: 238, 244, 250;
  --card: #FFFFFF;
  --card-rgb: 255, 255, 255;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --muted-rgb: 85, 101, 106;
  --accent-text: #0263AC;
  --accent-text-rgb: 2, 99, 172;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --white: #FFFFFF;
  --accent-tint: #E6EFF7;
  --accent-tint-rgb: 230, 239, 247;
  --on-ink: #FFFFFF;
  --on-ink-rgb: 255, 255, 255;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  margin: 0 auto;
  padding: var(--space-9) var(--space-6);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

.card {
  width: 400px;
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.title {
  margin: 0 0 var(--space-6);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.25;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
  color: var(--ink);
}

.field + .field { margin-top: var(--space-5); }

.field label {
  display: block;
  margin-bottom: var(--space-2);
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.field input {
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--white);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease);
}
.field input::placeholder { color: var(--muted); }
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
}

.keep {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 44px;
  margin-top: var(--space-2);
  font-size: var(--text-small);
  color: var(--ink);
  cursor: pointer;
}
.keep input {
  flex: none;
  width: 20px;
  height: 20px;
  margin: 0;
  accent-color: var(--ink);
  cursor: pointer;
}
.keep input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.actions {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin-top: var(--space-5);
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 44px;
  padding: 0 20px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  text-decoration: none;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition:
    background-color var(--dur-base) var(--ease),
    opacity var(--dur-base) var(--ease),
    transform var(--dur-fast) var(--ease);
}
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn:active { transform: translateY(1px); }

.btn--primary {
  color: var(--on-ink);
  background: var(--ink);
  border: 0;
}
.btn--primary:hover { opacity: 0.88; }

.btn--secondary {
  color: var(--ink);
  background: transparent;
  border: 1.5px solid var(--ink);
}
.btn--secondary:hover { background: var(--accent-tint); }

.forgot {
  display: flex;
  justify-content: center;
  margin-top: var(--space-3);
}
.forgot a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--space-2);
  font-size: var(--text-small);
  font-weight: 500;
  color: var(--accent-text);
  text-decoration: underline;
  text-underline-offset: 3px;
  border-radius: var(--radius-sm);
}
.forgot a:hover { text-decoration-thickness: 2px; }
.forgot a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <h1 class="title">Sign in to Harbor</h1>

    <form action="#" method="post">
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>

      <label class="keep">
        <input type="checkbox" name="keep">
        Keep me signed in
      </label>

      <div class="actions">
        <button class="btn btn--primary" type="submit">Sign In</button>
        <button class="btn btn--secondary" type="button">Continue with SSO</button>
      </div>

      <div class="forgot">
        <a href="#">Forgot Password?</a>
      </div>
    </form>
  </main>
</div>
</body>
</html>
