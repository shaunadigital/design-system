<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Team · Harbor</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  -webkit-font-smoothing: antialiased;
}

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
}

.page {
  max-width: 1184px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  margin-bottom: var(--space-6);
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-small);
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease);
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--primary:hover { opacity: 0.88; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-small);
}

th {
  height: 44px;
  padding: 0 var(--space-3);
  text-align: left;
  font-family: var(--font-label);
  font-size: var(--text-label);
  font-weight: 500;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}

td {
  height: 52px;
  padding: 0 var(--space-3);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: 0; }

.col-name { width: 32%; }
.col-email { width: 40%; }
.col-role { width: 28%; }

.name { font-weight: 600; color: var(--ink); }
.email { color: var(--muted); }

.select {
  position: relative;
  display: inline-block;
  width: 160px;
}
.select::after {
  content: "";
  position: absolute;
  right: 16px;
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--ink);
  border-bottom: 1.5px solid var(--ink);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
select {
  appearance: none;
  -webkit-appearance: none;
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 36px 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  cursor: pointer;
}
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>Team</h1>
      <button type="button" class="btn btn--primary">Invite Member</button>
    </div>

    <section class="card" aria-label="Team members">
      <table>
        <thead>
          <tr>
            <th scope="col" class="col-name">Name</th>
            <th scope="col" class="col-email">Email</th>
            <th scope="col" class="col-role">Role</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="name" data-user-content>Maya Chen</td>
            <td class="email">maya@harbor.app</td>
            <td>
              <span class="select">
                <select aria-label="Role for Maya Chen">
                  <option selected>Admin</option>
                  <option>Editor</option>
                  <option>Viewer</option>
                </select>
              </span>
            </td>
          </tr>
          <tr>
            <td class="name" data-user-content>Leo Park</td>
            <td class="email">leo@harbor.app</td>
            <td>
              <span class="select">
                <select aria-label="Role for Leo Park">
                  <option>Admin</option>
                  <option selected>Editor</option>
                  <option>Viewer</option>
                </select>
              </span>
            </td>
          </tr>
          <tr>
            <td class="name" data-user-content>Ana Ruiz</td>
            <td class="email">ana@harbor.app</td>
            <td>
              <span class="select">
                <select aria-label="Role for Ana Ruiz">
                  <option>Admin</option>
                  <option selected>Editor</option>
                  <option>Viewer</option>
                </select>
              </span>
            </td>
          </tr>
          <tr>
            <td class="name" data-user-content>Sam Ito</td>
            <td class="email">sam@harbor.app</td>
            <td>
              <span class="select">
                <select aria-label="Role for Sam Ito">
                  <option>Admin</option>
                  <option>Editor</option>
                  <option selected>Viewer</option>
                </select>
              </span>
            </td>
          </tr>
          <tr>
            <td class="name" data-user-content>Kai Lee</td>
            <td class="email">kai@harbor.app</td>
            <td>
              <span class="select">
                <select aria-label="Role for Kai Lee">
                  <option>Admin</option>
                  <option>Editor</option>
                  <option selected>Viewer</option>
                </select>
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
