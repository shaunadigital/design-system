<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Team</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  -webkit-font-smoothing: antialiased;
}

#component {
  width: 1280px;
  min-height: 720px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  background: var(--paper);
}
.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  height: 44px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn--primary { background: var(--ink); color: var(--on-ink); }
.btn--primary:hover { opacity: 0.88; }
.btn--primary:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 16px; height: 16px; flex: none; }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
  box-shadow: 0 1px 2px rgba(var(--shadow-rgb), 0.04);
}

table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th {
  height: 44px;
  padding: 0 var(--space-3);
  text-align: left;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
td {
  height: 52px;
  padding: 4px var(--space-3);
  font-size: var(--text-small);
  vertical-align: middle;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
tbody tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
.col-member { width: 34%; }
.col-email { width: 38%; }
.col-role { width: 28%; }

.member { display: flex; align-items: center; gap: var(--space-3); }
.avatar {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-pill);
  display: grid;
  place-items: center;
  background: var(--accent-tint);
  color: var(--accent-text);
  font-size: var(--text-label);
  font-weight: 600;
  letter-spacing: 0.02em;
}
.name { font-weight: 600; color: var(--ink); }
.email { color: var(--muted); }

.select {
  position: relative;
  display: block;
  width: 176px;
}
.select select {
  appearance: none;
  -webkit-appearance: none;
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 40px 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease);
}
.select select:hover { border-color: rgba(var(--ink-rgb), 0.4); }
.select select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.select::after {
  content: "";
  position: absolute;
  right: 16px;
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--ink);
  border-bottom: 1.5px solid var(--ink);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>Team</h1>
      <button class="btn btn--primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Invite Member
      </button>
    </div>

    <section class="card" aria-label="Team members">
      <table>
        <thead>
          <tr>
            <th class="col-member" scope="col">Member</th>
            <th class="col-email" scope="col">Email</th>
            <th class="col-role" scope="col">Role</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><div class="member"><span class="avatar" aria-hidden="true">MC</span><span class="name" data-user-content>Maya Chen</span></div></td>
            <td class="email">maya@harbor.app</td>
            <td>
              <label class="select">
                <select aria-label="Role for Maya Chen">
                  <option selected>Admin</option>
                  <option>Editor</option>
                  <option>Viewer</option>
                </select>
              </label>
            </td>
          </tr>
          <tr>
            <td><div class="member"><span class="avatar" aria-hidden="true">LP</span><span class="name" data-user-content>Leo Park</span></div></td>
            <td class="email">leo@harbor.app</td>
            <td>
              <label class="select">
                <select aria-label="Role for Leo Park">
                  <option>Admin</option>
                  <option selected>Editor</option>
                  <option>Viewer</option>
                </select>
              </label>
            </td>
          </tr>
          <tr>
            <td><div class="member"><span class="avatar" aria-hidden="true">AR</span><span class="name" data-user-content>Ana Ruiz</span></div></td>
            <td class="email">ana@harbor.app</td>
            <td>
              <label class="select">
                <select aria-label="Role for Ana Ruiz">
                  <option>Admin</option>
                  <option selected>Editor</option>
                  <option>Viewer</option>
                </select>
              </label>
            </td>
          </tr>
          <tr>
            <td><div class="member"><span class="avatar" aria-hidden="true">SI</span><span class="name" data-user-content>Sam Ito</span></div></td>
            <td class="email">sam@harbor.app</td>
            <td>
              <label class="select">
                <select aria-label="Role for Sam Ito">
                  <option>Admin</option>
                  <option>Editor</option>
                  <option selected>Viewer</option>
                </select>
              </label>
            </td>
          </tr>
          <tr>
            <td><div class="member"><span class="avatar" aria-hidden="true">KL</span><span class="name" data-user-content>Kai Lee</span></div></td>
            <td class="email">kai@harbor.app</td>
            <td>
              <label class="select">
                <select aria-label="Role for Kai Lee">
                  <option>Admin</option>
                  <option>Editor</option>
                  <option selected>Viewer</option>
                </select>
              </label>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
