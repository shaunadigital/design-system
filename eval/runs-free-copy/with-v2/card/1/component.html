<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Working Session</title>
<style>
/* Tokens copied from tokens.css (day theme, then dusk), only the roles this card uses. */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --live: #E26D7E;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
  --live: #EE8D9A;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--space-6);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow:
    0 8px 24px rgba(var(--shadow-rgb), 0.08),
    6px 6px 0 var(--live);
}

#component .label {
  margin: 0;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}

#component .title {
  margin: var(--space-2) 0 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  letter-spacing: var(--tracking-tight);
  line-height: 1.2;
}

#component .desc {
  margin: 0;
  color: var(--muted);
}

#component .price {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  margin: 0;
}

#component .price-num {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-hero);
  letter-spacing: var(--tracking-tight);
  line-height: 1;
}

#component .price-unit {
  font-size: var(--text-small);
  color: var(--muted);
}

#component .includes {
  list-style: none;
  margin: 0;
  padding: var(--space-5) 0 0;
  border-top: 1px solid var(--accent-line);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

#component .includes li {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
}

#component .tick {
  flex: none;
  width: 24px;
  height: 24px;
  margin-top: 0;
  color: var(--accent);
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: var(--space-3) var(--space-6);
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-body);
  cursor: pointer;
  transition: transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}

#component .btn--fill {
  background: var(--ink);
  color: var(--on-ink);
  box-shadow: 0 0 0 0 var(--accent);
}

#component .btn--fill:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 0 3px var(--accent);
}

#component .btn--fill:active {
  transform: translateY(0);
  transition-duration: var(--dur-fast);
}

#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  #component .btn { transition: none; }
  #component .btn--fill:hover { transform: none; }
}
</style>
</head>
<body>
  <article id="component" aria-labelledby="session-title">
    <header>
      <p class="label">One Hour</p>
      <h2 class="title" id="session-title">Working Session</h2>
    </header>

    <p class="price">
      <span class="price-num">$150</span>
      <span class="price-unit">per hour</span>
    </p>

    <p class="desc">Book one focused hour with me to unblock a project, review your work or plan what to build next.</p>

    <ul class="includes">
      <li>
        <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span>60 minutes live on a video call</span>
      </li>
      <li>
        <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span>Hands-on help with your code or design</span>
      </li>
      <li>
        <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span>Written notes and next steps afterward</span>
      </li>
    </ul>

    <button class="btn btn--fill" type="button">Book This Session</button>
  </article>
</body>
</html>
