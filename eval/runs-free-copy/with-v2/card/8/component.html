<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Working Session</title>
<style>
/* Tokens from tokens.css (generated from tokens/tokens.json) */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --live: #E26D7E;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --font-hero: 'Unbounded', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-line: #2D5B85;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
  --live: #EE8D9A;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--space-6);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow:
    0 12px 32px rgba(var(--shadow-rgb), 0.12),
    8px 8px 0 var(--live);
}

#component .label {
  margin: 0;
  font-family: var(--font-label);
  font-size: var(--text-label);
  font-weight: 500;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}

#component .title {
  margin: var(--space-2) 0 0;
  font-family: var(--font-display);
  font-size: var(--text-step);
  font-weight: 300;
  line-height: 1.15;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

#component .price {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  margin: 0;
}

#component .price-amount {
  font-family: var(--font-hero);
  font-size: var(--text-hero);
  font-weight: 300;
  line-height: 1;
  letter-spacing: var(--tracking-tight);
}

#component .price-unit {
  font-size: var(--text-small);
  color: var(--muted);
}

#component .description {
  margin: 0;
  color: var(--muted);
}

#component .includes {
  margin: 0;
  padding: var(--space-5) 0 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  border-top: 1px solid var(--accent-line);
}

#component .includes li {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
}

#component .includes svg {
  flex: none;
  width: 24px;
  height: 24px;
  color: var(--accent);
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: var(--space-3) var(--space-6);
  border: 2px solid var(--ink);
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}

#component .btn:hover {
  background: var(--accent);
  border-color: var(--accent);
}

#component .btn:active { transform: translateY(1px); }

#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  #component .btn { transition: none; }
}
</style>
</head>
<body>
<section id="component" aria-labelledby="session-title">
  <header>
    <p class="label">One On One</p>
    <h2 class="title" id="session-title">Working Session</h2>
  </header>

  <p class="price">
    <span class="price-amount">$150</span>
    <span class="price-unit">per hour</span>
  </p>

  <p class="description">One focused hour together on your project, so you leave with working code and a clear next step.</p>

  <ul class="includes">
    <li>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span>60 minutes of live video pairing</span>
    </li>
    <li>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span>A short prep call to set the goal</span>
    </li>
    <li>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span>Written notes sent after the session</span>
    </li>
  </ul>

  <a class="btn" href="#book">Book This Session</a>
</section>
</body>
</html>
