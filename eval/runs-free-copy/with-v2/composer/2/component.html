<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
/* Tokens: subset of tokens.css (generated from tokens/tokens.json) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-4: 16px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --plate-hover: #1A2A36;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: min(720px, 100% - 128px);
}

.composer {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-4);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.08);
  transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.composer:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-tint), 0 4px 16px rgba(var(--shadow-rgb), 0.08);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.composer__input {
  display: block;
  width: 100%;
  min-height: 72px;
  padding: var(--space-2) var(--space-2) 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body-l);
  line-height: 1.5;
  letter-spacing: var(--tracking-snug);
}
.composer__input::placeholder {
  color: var(--muted);
  opacity: 1;
}

.composer__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:active { transform: scale(0.96); }
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn svg {
  width: 24px;
  height: 24px;
  display: block;
}

.btn--plain:hover { background: var(--plate-hover); }

.btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--fill:hover { background: var(--accent); color: var(--paper); }

@media (prefers-reduced-motion: reduce) {
  .composer, .btn { transition: none; }
  .btn:active { transform: none; }
}
</style>
</head>
<body>
  <div id="component">
    <form class="composer" action="#">
      <label for="message" class="visually-hidden">Message</label>
      <textarea id="message" class="composer__input" name="message" rows="2" placeholder="Message Claude"></textarea>
      <div class="composer__bar">
        <button type="button" class="btn btn--plain" aria-label="Attach File">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11.5l-8.1 8.1a5 5 0 0 1-7.07-7.07l8.5-8.5a3.33 3.33 0 0 1 4.71 4.71l-8.5 8.5a1.67 1.67 0 0 1-2.36-2.36l7.8-7.8"/>
          </svg>
        </button>
        <button type="submit" class="btn btn--fill" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/>
            <path d="M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>
    </form>
  </div>
</body>
</html>
