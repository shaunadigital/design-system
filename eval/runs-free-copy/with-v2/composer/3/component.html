<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
/* Tokens, copied from tokens.css (generated from tokens/tokens.json) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-8: 64px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --plate-hover: #1A2A36;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: min(720px, 100% - 2 * var(--space-8));
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: var(--space-2);
  padding: var(--space-3);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.08);
  transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.composer:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 4px 16px rgba(var(--shadow-rgb), 0.08);
}

.composer__input {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  max-height: 200px;
  margin: 0;
  padding: var(--space-3) var(--space-2);
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  line-height: 1.5;
}
.composer__input::placeholder {
  color: var(--muted);
  opacity: 1;
}

.btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  font: inherit;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn:active { transform: scale(0.96); }
.btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

.btn--plain {
  background: transparent;
  color: var(--ink);
}
.btn--plain:hover { background: var(--plate-hover); }

.btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--fill:hover { background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  .composer, .btn { transition: none; }
  .btn:active { transform: none; }
}
</style>
</head>
<body>
  <div id="component">
    <div class="composer">
      <button class="btn btn--plain" type="button" aria-label="Attach File">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill-rule="evenodd" d="M16.5 3A5.5 5.5 0 0 1 22 8.5v7a8 8 0 0 1-16 0V7a1 1 0 0 1 2 0v8.5a6 6 0 0 0 12 0v-7a3.5 3.5 0 0 0-7 0v7a1 1 0 0 0 2 0V8a1 1 0 0 1 2 0v7.5a3 3 0 0 1-6 0v-7A5.5 5.5 0 0 1 16.5 3Z"/>
        </svg>
      </button>
      <textarea class="composer__input" rows="1" placeholder="Message Claude" aria-label="Message Claude"></textarea>
      <button class="btn btn--fill" type="button" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5a1 1 0 0 1 .7.3l6 6a1 1 0 0 1-1.4 1.4L13 6.9V19.5a1 1 0 1 1-2 0V6.9l-4.3 4.3a1 1 0 0 1-1.4-1.4l6-6a1 1 0 0 1 .7-.3Z"/>
        </svg>
      </button>
    </div>
  </div>
</body>
</html>
