<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --accent-line: #9CC3EA;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-loose: 0.02em;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-rgb: 111, 170, 230;
  --accent-line: #2D5B85;
  --accent-tint: #13283A;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --paper: #0E1618;
    --card: #172327;
    --ink: #E9EFEF;
    --muted: #9DAEB1;
    --accent: #6FAAE6;
    --accent-rgb: 111, 170, 230;
    --accent-line: #2D5B85;
    --accent-tint: #13283A;
    --on-ink: #0E1618;
    --shadow-rgb: 0, 0, 0;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: min(720px, 100% - 128px);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
  transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
#component:focus-within {
  border-color: var(--accent);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08), 0 0 0 3px rgba(var(--accent-rgb), 0.2);
}

#component .field {
  display: block;
  width: 100%;
  min-height: 96px;
  margin: 0;
  padding: var(--space-2) var(--space-1);
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body-l);
  line-height: 1.5;
}
#component .field::placeholder { color: var(--muted); opacity: 1; }

#component .bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-width: 44px;
  min-height: 44px;
  margin: 0;
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  letter-spacing: var(--tracking-loose);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
#component .btn:active { transform: scale(0.97); }
#component .btn svg { width: 24px; height: 24px; flex: none; }

#component .btn--plain {
  padding: 0;
  background: transparent;
  color: var(--ink);
}
#component .btn--plain:hover { background: var(--accent-tint); }

#component .btn--fill {
  padding: 0 var(--space-5) 0 var(--space-4);
  background: var(--ink);
  color: var(--on-ink);
}
#component .btn--fill:hover { background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  #component, #component .btn { transition: none; }
  #component .btn:active { transform: none; }
}
</style>
</head>
<body>
<div id="component">
  <textarea class="field" name="message" rows="3" placeholder="Message Claude" aria-label="Message Claude"></textarea>
  <div class="bar">
    <button class="btn btn--plain" type="button" aria-label="Attach File">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 11.5l-8.2 8.2a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/>
      </svg>
    </button>
    <button class="btn btn--fill" type="submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/>
      </svg>
      Send
    </button>
  </div>
</div>
</body>
</html>
