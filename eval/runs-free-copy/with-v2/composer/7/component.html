<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
/* Tokens from tokens.css (generated), only the ones used here */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --plate-hover: #E3ECF5;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --on-ink: #0E1618;
  --plate-hover: #1A2A36;
  --shadow-rgb: 0, 0, 0;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 100%;
  max-width: 720px;
  padding: 0 var(--space-5);
}

.composer {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-4);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
  transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.composer:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-tint), 0 8px 24px rgba(var(--shadow-rgb), 0.08);
}

.composer__input {
  display: block;
  width: 100%;
  min-height: 72px;
  padding: var(--space-2) var(--space-1);
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  line-height: 1.5;
  resize: none;
  outline: none;
}
.composer__input::placeholder { color: var(--muted); opacity: 1; }

.composer__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  font: inherit;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:active { transform: scale(0.96); }
.btn svg { width: 24px; height: 24px; display: block; }

.btn--plain { background: transparent; color: var(--ink); }
.btn--plain:hover { background: var(--plate-hover); }

.btn--fill { background: var(--ink); color: var(--on-ink); }
.btn--fill:hover { background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div id="component">
  <form class="composer" action="#">
    <textarea class="composer__input" name="message" rows="2" placeholder="Message Claude" aria-label="Message Claude"></textarea>
    <div class="composer__bar">
      <button class="btn btn--plain" type="button" aria-label="Attach File">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.2-8.2a3.3 3.3 0 0 1 4.7 4.7l-8.2 8.2a1.7 1.7 0 0 1-2.4-2.4l7.5-7.5"/>
        </svg>
      </button>
      <button class="btn btn--fill" type="submit" aria-label="Send Message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/>
        </svg>
      </button>
    </div>
  </form>
</div>
</body>
</html>
