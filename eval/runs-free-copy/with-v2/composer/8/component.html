<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
/* Tokens from tokens.css (subset used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --plate-hover: #E3ECF5;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-text: #9CC3EA;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --on-ink: #0E1618;
  --plate-hover: #1A2A36;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--space-6);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 100%;
  max-width: 680px;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
  transition: border-color var(--dur-base) var(--ease);
}
#component:focus-within {
  border-color: var(--accent);
}

#component .field {
  display: block;
  width: 100%;
  min-height: 96px;
  padding: var(--space-2) var(--space-2) 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body-l);
  line-height: 1.5;
  letter-spacing: var(--tracking-snug);
  resize: none;
}
#component .field::placeholder {
  color: var(--muted);
  opacity: 1;
}
#component .field:focus {
  outline: none;
}

#component .bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
  transition:
    background var(--dur-base) var(--ease),
    color var(--dur-base) var(--ease),
    transform var(--dur-fast) var(--ease);
}
#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
#component .btn:active {
  transform: scale(0.97);
}
#component .btn svg {
  width: 24px;
  height: 24px;
  flex: none;
}

#component .btn--plain {
  padding: 0;
  background: transparent;
  color: var(--ink);
}
#component .btn--plain:hover {
  background: var(--plate-hover);
}

#component .btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}
#component .btn--fill:hover {
  background: var(--accent);
  color: var(--on-ink);
}

@media (prefers-reduced-motion: reduce) {
  #component, #component .btn { transition: none; }
  #component .btn:active { transform: none; }
}
</style>
</head>
<body>
<form id="component" action="#">
  <textarea class="field" name="message" rows="3" placeholder="Message Claude" aria-label="Message Claude"></textarea>
  <div class="bar">
    <button class="btn btn--plain" type="button" aria-label="Attach File">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 11.5l-8.1 8.1a5 5 0 0 1-7.1-7.1l8.4-8.4a3.3 3.3 0 0 1 4.7 4.7l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.7-7.7"/>
      </svg>
    </button>
    <button class="btn btn--fill" type="submit">
      Send
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
  </div>
</form>
</body>
</html>
