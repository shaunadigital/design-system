<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Tokens from tokens.css (day theme, plus dusk values) */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --plate-hover: #1A2A36;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 240px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

/* Trigger: the pill button, showing the chat it belongs to */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-4);
  border: 1.5px solid var(--ink);
  border-radius: var(--radius-pill);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-small);
  font-weight: 500;
  letter-spacing: var(--tracking-snug);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease);
}
.btn:hover,
.btn[aria-expanded="true"] { background: var(--plate-hover); }
.btn:focus-visible,
.menu__item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn__title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.btn__chevron { flex: none; transform: rotate(180deg); }

/* Menu, open below the button */
.menu {
  margin: var(--space-2) 0 0;
  padding: var(--space-2);
  list-style: none;
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow:
    0 12px 32px rgba(var(--shadow-rgb), 0.14),
    0 2px 6px rgba(var(--shadow-rgb), 0.08);
}
.menu__item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.menu__item:hover { background: var(--plate-hover); }
.menu__item svg { flex: none; color: var(--accent-text); }
.menu__sep {
  height: 1px;
  margin: var(--space-1) var(--space-2);
  background: var(--accent-line);
}

@media (prefers-reduced-motion: reduce) {
  .btn, .menu__item { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
    <span class="btn__title" data-user-content>Trip planning for Oʻahu</span>
    <svg class="btn__chevron" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <ul class="menu" id="chat-menu" role="menu" aria-label="Chat options">
    <li role="none">
      <button class="menu__item" type="button" role="menuitem">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M15.2 4.8a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8L9.4 18.6 4.5 19.5l.9-4.9z"/>
          <path fill="var(--card)" d="M14 7l3 3-1.1 1.1-3-3z"/>
        </svg>
        Rename
      </button>
    </li>
    <li role="none">
      <button class="menu__item" type="button" role="menuitem">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 3a1 1 0 0 1 .7.3l4 4a1 1 0 1 1-1.4 1.4L13 6.4V14a1 1 0 1 1-2 0V6.4L8.7 8.7a1 1 0 0 1-1.4-1.4l4-4A1 1 0 0 1 12 3z"/>
          <path fill="currentColor" d="M5 12a2 2 0 0 1 2-2h1a1 1 0 1 1 0 2H7v7h10v-7h-1a1 1 0 1 1 0-2h1a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/>
        </svg>
        Share
      </button>
    </li>
    <li role="none">
      <button class="menu__item" type="button" role="menuitem">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="5" rx="1.5" fill="currentColor"/>
          <path fill="currentColor" d="M4.5 10.5h15V18a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2z"/>
          <rect x="9.5" y="12.5" width="5" height="2" rx="1" fill="var(--card)"/>
        </svg>
        Archive
      </button>
    </li>
    <li class="menu__sep" role="separator"></li>
    <li role="none">
      <button class="menu__item" type="button" role="menuitem">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M9 3.5A1.5 1.5 0 0 1 10.5 2h3A1.5 1.5 0 0 1 15 3.5V5h4.5a1 1 0 1 1 0 2h-15a1 1 0 0 1 0-2H9z"/>
          <path fill="currentColor" d="M5.7 8.5h12.6l-.8 10.9a2 2 0 0 1-2 1.6H8.5a2 2 0 0 1-2-1.6z"/>
          <rect x="9.3" y="11" width="1.6" height="6.5" rx=".8" fill="var(--card)"/>
          <rect x="13.1" y="11" width="1.6" height="6.5" rx=".8" fill="var(--card)"/>
        </svg>
        Delete
      </button>
    </li>
  </ul>
</div>
</body>
</html>
