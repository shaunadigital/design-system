<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Menu</title>
<style>
/* Tokens used here, copied from tokens.css (generated from tokens/tokens.json) */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --plate-hover: #1A2A36;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-2);
  width: 240px;
}

/* Trigger: the .btn pill, ink for the rest */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 44px;
  max-width: 100%;
  padding: 0 var(--space-4) 0 var(--space-5);
  border: 1.5px solid var(--ink);
  border-radius: var(--radius-pill);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  letter-spacing: var(--tracking-snug);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
.btn:hover { background: var(--plate-hover); }
.btn:focus-visible, .menu__item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn[aria-expanded="true"] { background: var(--accent-tint); }
.btn__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.btn__chevron {
  flex: none;
  width: 24px;
  height: 24px;
}

.menu {
  width: 100%;
  margin: 0;
  padding: var(--space-2);
  list-style: none;
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 12px 32px rgba(var(--shadow-rgb), 0.14), 0 2px 6px rgba(var(--shadow-rgb), 0.08);
}
.menu__sep {
  height: 1px;
  margin: var(--space-2) var(--space-2);
  background: var(--accent-line);
}
.menu__item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.menu__item:hover { background: var(--plate-hover); }
.menu__item:hover .menu__icon { color: var(--accent-text); }
.menu__icon {
  flex: none;
  width: 24px;
  height: 24px;
  color: var(--ink);
  transition: color var(--dur-fast) var(--ease);
}
.knockout { fill: var(--card); }
.knockout-stroke { stroke: var(--card); fill: none; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div id="component">
  <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
    <span class="btn__label" data-user-content>Trip Planning Ideas</span>
    <svg class="btn__chevron" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6.7 9.3a1 1 0 0 1 1.4 0l3.9 3.9 3.9-3.9a1 1 0 1 1 1.4 1.4l-4.6 4.6a1 1 0 0 1-1.4 0l-4.6-4.6a1 1 0 0 1 0-1.4z" fill="currentColor"/>
    </svg>
  </button>

  <ul class="menu" id="chat-menu" role="menu" aria-label="Chat actions">
    <li role="none">
      <button class="menu__item" type="button" role="menuitem">
        <svg class="menu__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 17.25V20h2.75L17.8 8.95l-2.75-2.75L4 17.25zM19.7 7.05a1 1 0 0 0 0-1.41l-1.34-1.34a1 1 0 0 0-1.41 0l-1.1 1.1 2.75 2.75 1.1-1.1z" fill="currentColor"/>
        </svg>
        Rename
      </button>
    </li>
    <li role="none">
      <button class="menu__item" type="button" role="menuitem">
        <svg class="menu__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.5 11l7-4.5M8.5 13l7 4.5" stroke="currentColor" stroke-width="2" fill="none"/>
          <circle cx="18" cy="5.5" r="3" fill="currentColor"/>
          <circle cx="6" cy="12" r="3" fill="currentColor"/>
          <circle cx="18" cy="18.5" r="3" fill="currentColor"/>
          <circle class="knockout" cx="6" cy="12" r="1"/>
        </svg>
        Share
      </button>
    </li>
    <li role="none">
      <button class="menu__item" type="button" role="menuitem">
        <svg class="menu__icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="5" rx="1.5" fill="currentColor"/>
          <path d="M5 10.5h14V19a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19z" fill="currentColor"/>
          <rect class="knockout" x="9.5" y="12.5" width="5" height="2" rx="1"/>
        </svg>
        Archive
      </button>
    </li>
    <li class="menu__sep" role="separator"></li>
    <li role="none">
      <button class="menu__item" type="button" role="menuitem">
        <svg class="menu__icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="2.5" rx="1" fill="currentColor"/>
          <rect x="4" y="5" width="16" height="2.5" rx="1" fill="currentColor"/>
          <path d="M6 9h12l-.9 10.9a1.5 1.5 0 0 1-1.5 1.1H8.4a1.5 1.5 0 0 1-1.5-1.1z" fill="currentColor"/>
          <path class="knockout-stroke" d="M10 12v6M14 12v6" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Delete
      </button>
    </li>
  </ul>
</div>
</body>
</html>
