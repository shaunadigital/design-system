<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Menu</title>
<style>
/* Subset of tokens.css (generated from tokens/tokens.json), inlined so this file stands alone. */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-7: 48px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-body: 1rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --plate-hover: #1A2A36;
  --shadow-rgb: 0, 0, 0;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  position: relative;
  width: 240px;
  /* room for the open menu below the button */
  height: 280px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  width: 100%;
  min-height: 44px;
  padding: var(--space-2) var(--space-4);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--ink);
  font: 500 var(--text-body)/1.25 var(--font-body);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.btn:hover { background: var(--plate-hover); }
.btn__title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.btn__chev {
  flex: none;
  width: 20px;
  height: 20px;
  transform: rotate(180deg);
}

.menu {
  position: absolute;
  top: calc(44px + var(--space-2));
  left: 0;
  right: 0;
  margin: 0;
  padding: var(--space-2);
  list-style: none;
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 12px 32px rgba(var(--shadow-rgb), 0.14), 0 2px 6px rgba(var(--shadow-rgb), 0.08);
}
.menu__sep {
  height: 1px;
  margin: var(--space-2) var(--space-2);
  background: var(--accent-line);
}
.item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  min-height: 44px;
  padding: var(--space-2) var(--space-3);
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--ink);
  font: 500 var(--text-body)/1.25 var(--font-body);
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.item:hover { background: var(--plate-hover); }
.item:active { background: var(--accent-tint); }
.item svg {
  flex: none;
  width: 24px;
  height: 24px;
}

.btn:focus-visible, .item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .btn, .item { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
    <span class="btn__title" data-user-content>Trip planning for Maui</span>
    <svg class="btn__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14l5-5 5 5"/></svg>
  </button>

  <ul class="menu" id="chat-menu" role="menu" aria-label="Chat actions">
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.2 4.8a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8L9.5 18.5 4.5 19.5l1-5z"/><path d="M13.6 6.4l4 4" stroke="var(--card)" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        Rename
      </button>
    </li>
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="17" cy="6.5" r="3"/><circle cx="7" cy="12" r="3"/><circle cx="17" cy="17.5" r="3"/><path d="M9.5 10.5l5.5-3M9.5 13.5l5.5 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="7" cy="12" r="1" fill="var(--card)"/></svg>
        Share
      </button>
    </li>
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="4.5" rx="1.2"/><path d="M4.5 10h15v8a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2z"/><path d="M9.5 13.5h5" stroke="var(--card)" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        Archive
      </button>
    </li>
    <li class="menu__sep" role="separator"></li>
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3.5h6l.8 1.5H20v2H4V5h4.2z"/><path d="M5.8 8.5h12.4l-.9 10.6a2 2 0 0 1-2 1.9H8.7a2 2 0 0 1-2-1.9z"/><path d="M10 11.5v6M14 11.5v6" stroke="var(--card)" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        Delete
      </button>
    </li>
  </ul>
</div>
</body>
</html>
