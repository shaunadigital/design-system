<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
/* From tokens.css (generated from tokens/tokens.json). */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --plate-hover: #1A2A36;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 280px;
  height: 560px;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding: var(--space-4);
  background: var(--sand);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-small);
  font-weight: 500;
  letter-spacing: var(--tracking-snug);
  text-decoration: none;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.btn--fill { background: var(--ink); color: var(--on-ink); }
.btn--fill:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(var(--shadow-rgb), 0.18); }
.btn--fill:active { transform: translateY(0); }
.btn:focus-visible, .chat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 20px; height: 20px; flex: none; }

.recent { display: flex; flex-direction: column; gap: var(--space-2); min-height: 0; }
.label {
  margin: 0;
  padding: 0 var(--space-3);
  font-family: var(--font-label);
  font-size: var(--text-label);
  font-weight: 500;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
.chats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); }

.chat {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 44px;
  padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  color: var(--ink);
  font-size: var(--text-small);
  text-decoration: none;
  transition: background var(--dur-fast) var(--ease);
}
.chat svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
.chat span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat:hover { background: var(--plate-hover); }
.chat[aria-current="page"] { background: var(--accent-tint); color: var(--accent-text); font-weight: 500; box-shadow: inset 0 0 0 1px var(--accent-line); }
.chat[aria-current="page"] svg { color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  .btn, .chat { transition: none; }
  .btn--fill:hover { transform: none; }
}
</style>
</head>
<body>
