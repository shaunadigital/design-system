<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Sidebar</title>
<style>
/* Tokens used here, copied from tokens.css (generated from tokens.json) */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --ink: #0B1416;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --plate-hover: #1A2A36;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 288px;
  height: 640px;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding: var(--space-4);
  background: var(--sand);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-5);
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  letter-spacing: var(--tracking-snug);
  text-decoration: none;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn--fill {
  width: 100%;
  border: 0;
  background: var(--ink);
  color: var(--on-ink);
}
.btn--fill:hover { transform: translateY(-1px); }
.btn--fill:active { transform: translateY(0); }
.btn svg { width: 24px; height: 24px; flex: none; }

a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.recent {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 0;
}
.label {
  padding: 0 var(--space-3);
  font-family: var(--font-label);
  font-size: var(--text-label);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: var(--tracking-label);
  color: var(--muted);
}

.chats { list-style: none; display: flex; flex-direction: column; gap: var(--space-1); }

.chat {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 44px;
  padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  color: var(--ink);
  font-size: var(--text-small);
  text-decoration: none;
  transition: background var(--dur-fast) var(--ease);
}
.chat svg { width: 24px; height: 24px; flex: none; color: var(--muted); }
.chat span {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.chat:hover { background: var(--plate-hover); }
.chat[aria-current="page"] {
  background: var(--accent-tint);
  color: var(--accent-text);
  font-weight: 500;
}
.chat[aria-current="page"] svg { color: var(--accent-text); }

@media (prefers-reduced-motion: reduce) {
  .btn, .chat { transition: none; }
  .btn--fill:hover { transform: none; }
}
</style>
</head>
<body>
<div id="component">
  <nav aria-label="Chats" style="display:contents">
    <a class="btn btn--fill" href="#new">

      New Chat

    <div class="recent">

            <span data-user-content>Planning the Waikīkī case study</span>
          </a>
        </li>
        <li>
          <a class="chat" href="#c2">

            <span data-user-content>Contrast check for dusk theme</span>
          </a>
        </li>
        <li>
          <a class="chat" href="#c3">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.2 3.6a.6.6 0 0 1-1-.46V16h-.3A2.5 2.5 0 0 1 4 13.5z"/></svg>
            <span data-user-content>Rewrite my about page intro</span>
          </a>
        </li>
        <li>
          <a class="chat" href="#c4">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.2 3.6a.6.6 0 0 1-1-.46V16h-.3A2.5 2.5 0 0 1 4 13.5z"/></svg>
            <span data-user-content>Icon set ideas for the footer</span>
          </a>
        </li>
        <li>
          <a class="chat" href="#c5">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.2 3.6a.6.6 0 0 1-1-.46V16h-.3A2.5 2.5 0 0 1 4 13.5z"/></svg>
            <span data-user-content>Email reply to a client</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>
</div>
</body>
</html>
