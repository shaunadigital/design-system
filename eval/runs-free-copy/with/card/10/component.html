<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Working Session</title>
<style>
/* Tokens inlined from tokens.css (generated from tokens/tokens.json) */
:root {
  --paper: #FFFFFF;
  --paper-rgb: 255, 255, 255;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --live: #E26D7E;
  --live-rgb: 226, 109, 126;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --font-hero: 'Unbounded', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --paper-rgb: 14, 22, 24;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-rgb: 111, 170, 230;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
  --live: #EE8D9A;
  --live-rgb: 238, 141, 154;
}

/* Page */
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--space-8) var(--space-5);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

/* Card */
#component {
  width: 100%;
  max-width: 400px;
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow:
    0 8px 24px rgba(var(--shadow-rgb), 0.08),
    6px 6px 0 rgba(var(--live-rgb), 0.9);
}
#component .label {
  margin: 0 0 var(--space-3);
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}
#component h2 {
  margin: 0 0 var(--space-4);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.15;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}
#component .price {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  margin: 0 0 var(--space-4);
  color: var(--ink);
}
#component .price strong {
  font-family: var(--font-hero);
  font-weight: 300;
  font-size: var(--text-hero);
  line-height: 1;
  letter-spacing: var(--tracking-tight);
}
#component .price span {
  font-size: var(--text-body);
  color: var(--muted);
}
#component .desc {
  margin: 0 0 var(--space-5);
  font-size: var(--text-body-l);
  color: var(--muted);
}
#component ul {
  margin: 0 0 var(--space-6);
  padding: var(--space-5) 0 0;
  list-style: none;
  display: grid;
  gap: var(--space-3);
  border-top: 1px solid var(--accent-line);
}
#component li {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  font-size: var(--text-body);
}
#component li svg {
  flex: none;
  width: 24px;
  height: 24px;
  color: var(--accent-text);
}

/* Button */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-body);
  text-decoration: none;
  transition: transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.btn--fill {
  background: var(--ink);
  color: var(--on-ink);
  box-shadow: 4px 4px 0 var(--accent);
}
.btn--fill:hover {
  transform: translate(-1px, -1px);
  box-shadow: 6px 6px 0 var(--accent);
}
.btn--fill:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 var(--accent);
  transition-duration: var(--dur-fast);
}
.btn:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 4px;
}
@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <p class="label">Working Session</p>
  <h2>One Hour, Together</h2>
  <p class="price"><strong>$150</strong><span>per hour</span></p>
  <p class="desc">A focused hour to work through your project side by side, from a stuck problem to a clear plan.</p>
  <ul>
    <li>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span>60 minutes live on a video call</span>
    </li>
    <li>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span>Written notes and next steps afterwards</span>
    </li>
    <li>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span>One follow-up question by email</span>
    </li>
  </ul>
  <a class="btn btn--fill" href="#book">Book This Session</a>
</div>
</body>
</html>
