:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;

body {

  min-height: 100vh;
  display: grid;

  color: var(--ink);

  line-height: 1.5;
}

  width: 100%;
  max-width: 400px;
  padding: var(--space-6);
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow:
    0 12px 32px rgba(var(--shadow-rgb), 0.08),
    8px 8px 0 rgba(var(--live-rgb), 0.9);
}
#component .label {
  margin: 0 0 var(--space-3);
  font-family: var(--font-label);
  font-size: var(--text-label);
  font-weight: 500;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}

  margin: 0 0 var(--space-4);
  font-family: var(--font-display);
  font-size: var(--text-step);
  font-weight: 300;
  line-height: 1.15;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}
#component .price {

  align-items: baseline;
  gap: var(--space-2);
  margin: 0 0 var(--space-4);
}
#component .price-amount {
  font-family: var(--font-hero);
  font-size: var(--text-hero);
  font-weight: 300;
  letter-spacing: var(--tracking-tighter);
  line-height: 1;
}
#component .price-unit {
  font-size: var(--text-small);
  color: var(--muted);
}
#component .desc {
  margin: 0 0 var(--space-5);
  color: var(--muted);
}
#component ul {
  margin: 0 0 var(--space-6);
  padding: var(--space-5) 0 0;
  list-style: none;
  display: grid;
  gap: var(--space-3);
  border-top: 1px solid var(--accent-line);
}
#component li {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
}
#component li svg {
  flex: none;
  width: 24px;
  height: 24px;
  color: var(--accent);
}
#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 48px;
  padding: var(--space-3) var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 600;
  letter-spacing: var(--tracking-loose);
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 0 0 0 var(--accent);
  transition:

    transform var(--dur-fast) var(--ease);
}
#component .btn:hover { box-shadow: 0 0 0 4px var(--accent); }
#component .btn:active { transform: scale(0.98); }
#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
@media (prefers-reduced-motion: reduce) {
  #component .btn { transition: none; }
}
