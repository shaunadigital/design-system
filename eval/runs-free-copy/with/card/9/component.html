<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Working Session</title>
<style>
/* Tokens from tokens.css (only the ones this card uses) */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --live-rgb: 226, 109, 126;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tighter: -0.03em;
  --tracking-label: 0.14em;
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
  --live-rgb: 238, 141, 154;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 100%;
  max-width: 400px;
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow:
    0 12px 32px rgba(var(--shadow-rgb), 0.08),
    6px 6px 0 rgba(var(--live-rgb), 0.35);
}

#component .label {
  margin: 0;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}

#component .title {
  margin: var(--space-2) 0 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  letter-spacing: var(--tracking-tighter);
  line-height: 1.2;
}

#component .price {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  margin: var(--space-4) 0 0;
}

#component .price strong {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-hero);
  letter-spacing: var(--tracking-tighter);
  line-height: 1;
}

#component .price span {
  font-size: var(--text-small);
  color: var(--muted);
}

#component .desc {
  margin: var(--space-4) 0 0;
  color: var(--muted);
}

#component .includes {
  list-style: none;
  margin: var(--space-5) 0 0;
  padding: var(--space-5) 0 0;
  border-top: 1px solid var(--accent-line);
  display: grid;
  gap: var(--space-3);
}

#component .includes li {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

#component .tick {
  flex: none;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
}

#component .btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  margin-top: var(--space-6);
  padding: var(--space-3) var(--space-6);
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-body);
  text-decoration: none;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}

#component .btn:hover {
  background: var(--accent);
  color: var(--paper);
}

#component .btn:active { transform: translateY(1px); }

#component .btn:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  #component .btn { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <p class="label">Working Session</p>
  <h2 class="title">One-Hour Working Session</h2>
  <p class="price"><strong>$150</strong><span>per hour</span></p>
  <p class="desc">A focused hour together on your project, whether that is a build, a review or a problem you are stuck on.</p>
  <ul class="includes">
    <li>
      <span class="tick" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      One hour of live, one-on-one work
    </li>
    <li>
      <span class="tick" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      A prep call before we start
    </li>
    <li>
      <span class="tick" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      Written notes and next steps after
    </li>
  </ul>
  <a class="btn" href="#book">Book This Session</a>
</div>
</body>
</html>
