<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
/* Tokens inlined from tokens.css (subset used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --muted-rgb: 85, 101, 106;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --accent-tint: #E6EFF7;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-8: 64px;
  --radius-pill: 999px;
  --radius-card: 16px;
  --text-body-l: 1.125rem;
  --tracking-snug: -0.01em;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0E1618;
    --card: #172327;
    --ink: #E9EFEF;
    --muted: #9DAEB1;
    --muted-rgb: 157, 174, 177;
    --accent: #6FAAE6;
    --accent-rgb: 111, 170, 230;
    --accent-tint: #13283A;
    --plate-hover: #1A2A36;
    --on-ink: #0E1618;
    --shadow-rgb: 0, 0, 0;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--space-5);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4);
  background: var(--card);
  border: 1px solid rgba(var(--muted-rgb), 0.45);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
  transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
#component:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.2), 0 8px 24px rgba(var(--shadow-rgb), 0.08);
}

#component textarea {
  display: block;
  width: 100%;
  min-height: 72px;
  margin: 0;
  padding: var(--space-2) var(--space-2) var(--space-2) 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body-l);
  line-height: 1.5;
  letter-spacing: var(--tracking-snug);
}
#component textarea::placeholder {
  color: var(--muted);
  opacity: 1;
}

.actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn svg {
  width: 24px;
  height: 24px;
  display: block;
}
.btn:active { transform: scale(0.96); }
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn--plain {
  background: transparent;
  color: var(--ink);
}
.btn--plain:hover { background: var(--plate-hover); }

.btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--fill:hover { background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  #component, .btn { transition: none; }
  .btn:active { transform: none; }
}
</style>
</head>
<body>
  <div id="component">
    <textarea rows="2" placeholder="Message Claude" aria-label="Message Claude"></textarea>
    <div class="actions">
      <button type="button" class="btn btn--plain" aria-label="Attach File">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/>
        </svg>
      </button>
      <button type="submit" class="btn btn--fill" aria-label="Send Message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5"/>
          <path d="M5.5 11.5L12 5l6.5 6.5"/>
        </svg>
      </button>
    </div>
  </div>
</body>
</html>
