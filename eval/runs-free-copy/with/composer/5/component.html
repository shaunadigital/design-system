<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
/* Tokens copied from tokens.css (generated from tokens/tokens.json) */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-rgb: 111, 170, 230;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --plate-hover: #1A2A36;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: min(720px, 100% - 128px);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
  transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}

#component:focus-within {
  border-color: var(--accent);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08), 0 0 0 1px var(--accent);
}

#component textarea {
  display: block;
  width: 100%;
  min-height: 72px;
  margin: 0;
  padding: var(--space-2) var(--space-1);
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body-l);
  line-height: 1.5;
  letter-spacing: var(--tracking-snug);
}

#component textarea::placeholder {
  color: var(--muted);
  opacity: 1;
}

#component .actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-width: 44px;
  min-height: 44px;
  margin: 0;
  padding: 0 var(--space-3);
  border: 0;
  border-radius: var(--radius-pill);
  font: inherit;
  font-size: var(--text-body);
  font-weight: 500;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}

#component .btn svg {
  width: 24px;
  height: 24px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#component .btn:active { transform: scale(0.96); }

#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

#component .btn--plain {
  background: transparent;
  color: var(--ink);
}

#component .btn--plain:hover {
  background: var(--plate-hover);
  color: var(--accent-text);
}

#component .btn--fill {
  padding: 0 var(--space-5);
  background: var(--ink);
  color: var(--on-ink);
}

#component .btn--fill:hover {
  background: var(--accent);
}

@media (prefers-reduced-motion: reduce) {
  #component, #component .btn { transition: none; }
  #component .btn:active { transform: none; }
}
</style>
</head>
<body>
<div id="component">
  <textarea name="message" rows="2" placeholder="Message Claude" aria-label="Message Claude"></textarea>
  <div class="actions">
    <button type="button" class="btn btn--plain" aria-label="Attach File">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-8.1 8.1a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>
    </button>
    <button type="submit" class="btn btn--fill" aria-label="Send">
      <span>Send</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
    </button>
  </div>
</div>
</body>
</html>
