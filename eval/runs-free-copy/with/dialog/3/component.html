<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
/* Subset of tokens.css (generated from tokens.json), inlined so the file stands alone. */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --plate-hover: #E3ECF5;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-loose: 0.02em;
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --on-ink: #0E1618;
  --plate-hover: #1A2A36;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 440px;
  max-width: calc(100vw - 40px);
  padding: var(--space-6);
  background: var(--card);
  border-radius: var(--radius-card);
  box-shadow:
    0 1px 2px rgba(var(--shadow-rgb), 0.08),
    0 16px 48px rgba(var(--shadow-rgb), 0.16);
}

.dialog-title {
  margin: 0 0 var(--space-3);
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.25;
  letter-spacing: var(--tracking-snug);
  color: var(--ink);
}

.dialog-text {
  margin: 0;
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--muted);
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
  margin-top: var(--space-6);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  min-width: 44px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-small);
  letter-spacing: var(--tracking-loose);
  cursor: pointer;
  transition:
    background var(--dur-base) var(--ease),
    transform var(--dur-fast) var(--ease);
}
.btn:active { transform: scale(0.97); }
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn--plain {
  background: transparent;
  color: var(--ink);
}
.btn--plain:hover { background: var(--plate-hover); }

.btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--fill:hover { background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
  .btn:active { transform: none; }
}
</style>
</head>
<body>
  <div id="component" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-text">
    <h2 class="dialog-title" id="dialog-title">Delete this chat?</h2>
    <p class="dialog-text" id="dialog-text">This removes the conversation and all of its messages for good, and it can't be undone.</p>
    <div class="dialog-actions">
      <button class="btn btn--plain" type="button">Cancel</button>
      <button class="btn btn--fill" type="button">Delete</button>
    </div>
  </div>
</body>
</html>
