<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
  /* Tokens from tokens.css (generated), only the ones this component uses */
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --accent-line: #9CC3EA;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-snug: -0.01em;
    --tracking-loose: 0.02em;
    --text-lead: 1.375rem;
    --text-body: 1rem;
    --text-small: 0.875rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
    color-scheme: light;
  }
  :root[data-theme="dusk"] {
    color-scheme: dark;
    --paper: #0E1618;
    --card: #172327;
    --ink: #E9EFEF;
    --muted: #9DAEB1;
    --accent: #6FAAE6;
    --on-ink: #0E1618;
    --shadow-rgb: 0, 0, 0;
    --accent-line: #2D5B85;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  #component {
    width: 100%;
    max-width: 420px;
    padding: var(--space-6);
    background: var(--card);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-card);
    box-shadow: 0 16px 48px rgba(var(--shadow-rgb), 0.16), 0 2px 8px rgba(var(--shadow-rgb), 0.08);
  }

  #component h2 {
    margin: 0 0 var(--space-3);
    font-family: var(--font-display);
    font-weight: 500;
    font-size: var(--text-lead);
    line-height: 1.25;
    letter-spacing: var(--tracking-snug);
    color: var(--ink);
  }

  #component p {
    margin: 0 0 var(--space-6);
    font-size: var(--text-body);
    line-height: 1.55;
    color: var(--muted);
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    gap: var(--space-3);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    min-width: 44px;
    padding: 0 var(--space-5);
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: var(--text-body);
    letter-spacing: var(--tracking-loose);
    cursor: pointer;
    transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease), border-color var(--dur-base) var(--ease);
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .btn--plain {
    background: transparent;
    color: var(--ink);
  }
  .btn--plain:hover { border-color: var(--accent-line); }

  .btn--fill {
    background: var(--ink);
    color: var(--on-ink);
  }
  .btn--fill:hover { background: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <div id="component" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-desc">
    <h2 id="dialog-title">Delete this chat?</h2>
    <p id="dialog-desc">This removes the conversation and its messages for good, and it can't be undone.</p>
    <div class="actions">
      <button type="button" class="btn btn--plain">Cancel</button>
      <button type="button" class="btn btn--fill">Delete</button>
    </div>
  </div>
</body>
</html>
