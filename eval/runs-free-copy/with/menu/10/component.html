<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Menu</title>
<style>
/* Tokens from tokens.css (generated), only the roles this component uses */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --radius-sm: 8px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-2);
}

/* Trigger: the .btn pill, ink for the rest */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-4) 0 var(--space-5);
  border: 1.5px solid var(--ink);
  border-radius: var(--radius-pill);
  background: var(--paper);
  color: var(--ink);
  font: 500 var(--text-small) / 1 var(--font-body);
  letter-spacing: var(--tracking-snug);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
.btn[aria-expanded="true"] {
  background: var(--ink);
  color: var(--on-ink);
}
.btn:hover { background: var(--accent-tint); color: var(--ink); }
.btn[aria-expanded="true"]:hover { background: var(--ink); color: var(--on-ink); }
.btn .chev { width: 20px; height: 20px; transform: rotate(180deg); }

.menu {
  width: 232px;
  margin: 0;
  padding: var(--space-2);
  list-style: none;
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 12px 32px rgba(var(--shadow-rgb), 0.14), 0 2px 6px rgba(var(--shadow-rgb), 0.08);
}

.item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  font: 400 var(--text-body) / 1 var(--font-body);
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.item:hover { background: var(--accent-tint); }
.item svg { flex: none; width: 24px; height: 24px; color: var(--accent); }

.sep {
  height: 1px;
  margin: var(--space-1) var(--space-2);
  background: var(--accent-line);
}

.btn:focus-visible,
.item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .btn, .item { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
    Chat Options
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <ul class="menu" id="chat-menu" role="menu" aria-label="Chat options">
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
        Rename
      </button>
    </li>
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg>
        Share
      </button>
    </li>
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4.5" rx="1.2"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5"/><path d="M10 12.5h4"/></svg>
        Archive
      </button>
    </li>
    <li class="sep" role="separator"></li>
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 12.5a1 1 0 0 0 1 .9h8a1 1 0 0 0 1-.9L18 7"/><path d="M10 11v6M14 11v6"/></svg>
        Delete
      </button>
    </li>
  </ul>
</div>
</body>
</html>
