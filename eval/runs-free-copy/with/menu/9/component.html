<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Menu</title>
<style>
/* Tokens from tokens.css (subset used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --shadow-rgb: 11, 20, 22;
  --on-ink: #FFFFFF;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --plate-hover: #1A2A36;
  --shadow-rgb: 0, 0, 0;
  --on-ink: #0E1618;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 248px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-2);
}

/* Trigger: the .btn pill, ink for the rest */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-4) 0 var(--space-5);
  border: 1.5px solid var(--ink);
  border-radius: var(--radius-pill);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.btn:hover { background: var(--ink); color: var(--on-ink); }
.btn:focus-visible,
.item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn svg { transition: transform var(--dur-base) var(--ease); transform: rotate(180deg); }

.icon {
  width: 24px;
  height: 24px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.menu {
  width: 100%;
  margin: 0;
  padding: var(--space-2);
  list-style: none;
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 12px 32px rgba(var(--shadow-rgb), 0.14), 0 2px 6px rgba(var(--shadow-rgb), 0.08);
}

.menu-label {
  padding: var(--space-2) var(--space-3) var(--space-1);
  font-family: var(--font-label);
  font-size: var(--text-label);
  font-weight: 500;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.item:hover { background: var(--plate-hover); }
.item .icon { color: var(--accent); }

.divider {
  height: 1px;
  margin: var(--space-2) var(--space-3);
  background: var(--accent-line);
}
</style>
</head>
<body>
<div id="component">
  <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
    Chat Options
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
  </button>
  <ul class="menu" id="chat-menu" role="menu" aria-label="Chat options">
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
        Rename
      </button>
    </li>
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        Share
      </button>
    </li>
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12.5h4"/></svg>
        Archive
      </button>
    </li>
    <li role="separator" class="divider"></li>
    <li role="none">
      <button class="item" type="button" role="menuitem">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></svg>
        Delete
      </button>
    </li>
  </ul>
</div>
</body>
</html>
