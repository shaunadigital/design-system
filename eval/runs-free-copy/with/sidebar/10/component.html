<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
/* Subset of tokens.css (generated from tokens/tokens.json), inlined so the file is self-contained. */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --ink: #0B1416;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --plate-hover: #E3ECF5;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --accent: #6FAAE6;
  --on-ink: #0E1618;
  --plate-hover: #1A2A36;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 280px;
  height: 640px;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding: var(--space-4);
  background: var(--sand);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--fill:hover { background: var(--accent); }
.btn:active { transform: scale(0.98); }
.btn svg { width: 20px; height: 20px; flex: none; }

a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.label {
  margin: 0 0 var(--space-2);
  padding: 0 var(--space-3);
  font-family: var(--font-label);
  font-size: var(--text-label);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: var(--tracking-label);
  color: var(--muted);
}

.chats {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.chat {
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  color: var(--ink);
  font-size: var(--text-small);
  line-height: 1.3;
  text-decoration: none;
  transition: background var(--dur-fast) var(--ease);
}
.chat span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chat:hover { background: var(--plate-hover); }
.chat[aria-current="page"] {
  background: var(--accent-tint);
  color: var(--accent-text);
  font-weight: 600;
  box-shadow: inset 0 0 0 1px var(--accent-line);
}

@media (prefers-reduced-motion: reduce) {
  .btn, .chat { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <a class="btn btn--fill" href="#new">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    New Chat
  </a>
  <nav aria-label="Recent chats">
    <h2 class="label">Recent</h2>
    <ul class="chats">
      <li><a class="chat" href="#waikiki-palette"><span>Waikīkī palette contrast check</span></a></li>
      <li><a class="chat" href="#case-study" aria-current="page"><span>Case study page layout ideas</span></a></li>
      <li><a class="chat" href="#dusk-theme"><span>Dusk theme token roles</span></a></li>
      <li><a class="chat" href="#wordmark"><span>Wordmark spacing at small sizes</span></a></li>
      <li><a class="chat" href="#reduced-motion"><span>Reduced motion for looping video</span></a></li>
    </ul>
  </nav>
</div>
</body>
</html>
