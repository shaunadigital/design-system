<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Sidebar</title>
<style>
/* Tokens copied from tokens.css (day theme), only the ones this component uses */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --ink: #0B1416;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --radius-sm: 8px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 288px;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding: var(--space-4);
  background: var(--sand);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--font-body);
  font-size: var(--text-small);
  font-weight: 500;
  letter-spacing: var(--tracking-snug);
  text-decoration: none;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:hover { background: var(--accent); }
.btn:active { transform: scale(0.98); }
.btn:focus-visible,
.chat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 24px; height: 24px; flex: none; }

.label {
  padding: 0 var(--space-3);
  font-family: var(--font-label);
  font-size: var(--text-label);
  font-weight: 500;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.recent { display: flex; flex-direction: column; gap: var(--space-2); }

.chats { list-style: none; display: flex; flex-direction: column; gap: var(--space-1); }

.chat {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 44px;
  padding: 0 var(--space-3);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-size: var(--text-small);
  text-decoration: none;
  transition: background var(--dur-fast) var(--ease);
}
.chat:hover { background: var(--plate-hover); }
.chat svg { width: 24px; height: 24px; flex: none; color: var(--muted); }
.chat span {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.chat[aria-current="page"] {
  background: var(--accent-tint);
  color: var(--accent-text);
  font-weight: 500;
  box-shadow: inset 0 0 0 1px var(--accent-line);
}
.chat[aria-current="page"] svg { color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  .btn, .chat { transition: none; }
}
</style>
</head>
<body>
<nav id="component" aria-label="Chats">
  <a class="btn" href="#new">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
    New Chat
  </a>

  <div class="recent">
    <h2 class="label">Recent</h2>
    <ul class="chats">
      <li>
        <a class="chat" href="#c1">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/></svg>
          <span>Trip ideas for Oʻahu</span>
        </a>
      </li>
      <li>
        <a class="chat" href="#c2" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/></svg>
          <span>Case study outline</span>
        </a>
      </li>
      <li>
        <a class="chat" href="#c3">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/></svg>
          <span>Fix my color contrast</span>
        </a>
      </li>
      <li>
        <a class="chat" href="#c4">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/></svg>
          <span>Email draft to a client</span>
        </a>
      </li>
      <li>
        <a class="chat" href="#c5">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/></svg>
          <span>Icon set naming ideas</span>
        </a>
      </li>
    </ul>
  </div>
</nav>
</body>
</html>
