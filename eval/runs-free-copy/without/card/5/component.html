<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a working session</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    line-height: 1.5;
  }
  #component {
    width: 100%;
    max-width: 400px;
    padding: 32px;
    background: #fff;
    border: 1px solid #0B1416;
    border-top: 4px solid #0263AC;
    border-radius: 4px;
  }
  #component h2 {
    margin: 0 0 16px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 1.375rem;
    line-height: 1.25;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  #component .price {
    margin: 0 0 16px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  #component .amount {
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 2.5rem;
    line-height: 1;
    color: #0263AC;
  }
  #component .unit { font-size: 1rem; }
  #component .desc { margin: 0 0 24px; font-size: 1rem; }
  #component ul {
    margin: 0 0 32px;
    padding: 24px 0 0;
    list-style: none;
    border-top: 1px solid #0B1416;
  }
  #component li {
    position: relative;
    padding-left: 28px;
    margin-bottom: 12px;
  }
  #component li:last-child { margin-bottom: 0; }
  #component li::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 0.3em;
    width: 6px;
    height: 11px;
    border: solid #0263AC;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  #component .book {
    display: block;
    padding: 14px 24px;
    background: #0263AC;
    color: #fff;
    border: 2px solid #0263AC;
    border-radius: 4px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
  }
  #component .book:hover { background: #fff; color: #0263AC; }
  #component .book:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <div id="component">
    <h2>Working session</h2>
    <p class="price"><span class="amount">$150</span><span class="unit">per hour</span></p>
    <p class="desc">One focused hour together on your design problem, whether it's a portfolio, an interface, or a brand in progress.</p>
    <ul>
      <li>60 minutes of live, one-on-one video time</li>
      <li>Honest feedback on your work as we go</li>
      <li>A short written summary of next steps</li>
    </ul>
    <a class="book" href="#book">Book this session</a>
  </div>
</body>
</html>
