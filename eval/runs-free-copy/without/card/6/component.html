<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a working session</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }

  #component {
    width: 100%;
    max-width: 400px;
    padding: 40px 36px;
    background: #fff;
    border: 1px solid #0B1416;
    border-top: 6px solid #0263AC;
    border-radius: 4px;
  }

  #component h2 {
    margin: 0 0 20px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  #component .price {
    margin: 0 0 16px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  #component .amount {
    font-size: 44px;
    font-weight: 700;
    line-height: 1;
    color: #0263AC;
  }

  #component .unit {
    font-size: 16px;
  }

  #component .description {
    margin: 0 0 24px;
    font-size: 16px;
  }

  #component ul {
    margin: 0 0 32px;
    padding: 24px 0 0;
    list-style: none;
    border-top: 1px solid #0B1416;
  }

  #component li {
    position: relative;
    margin: 0 0 12px;
    padding-left: 28px;
    font-size: 16px;
  }

  #component li:last-child { margin-bottom: 0; }

  #component li::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 5px;
    width: 6px;
    height: 12px;
    border: solid #0263AC;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  #component .book {
    display: block;
    padding: 14px 24px;
    background: #0263AC;
    color: #fff;
    border: 2px solid #0263AC;
    border-radius: 4px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
  }

  #component .book:hover { background: #0B1416; border-color: #0B1416; }

  #component .book:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <div id="component">
    <h2>One-hour working session</h2>
    <p class="price"><span class="amount">$150</span><span class="unit">per hour</span></p>
    <p class="description">A focused one-on-one hour to work through your design problem together, from rough idea to clear next steps.</p>
    <ul>
      <li>60 minutes of live, one-on-one work</li>
      <li>Honest feedback on your current designs</li>
      <li>Written summary of next steps afterwards</li>
    </ul>
    <a class="book" href="#book">Book this session</a>
  </div>
</body>
</html>
