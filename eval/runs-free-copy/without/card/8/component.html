<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a working session</title>
<style>
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    box-sizing: border-box;
    width: 380px;
    padding: 32px;
    background: #fff;
    border: 1px solid #0B1416;
    border-top: 6px solid #0263AC;
    border-radius: 4px;
  }
  #component h2 {
    margin: 0 0 12px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  #component .desc {
    margin: 0 0 24px;
    font-size: 16px;
    line-height: 1.5;
  }
  #component .price {
    margin: 0 0 24px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  #component .amount {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 40px;
    line-height: 1;
    color: #0263AC;
  }
  #component .unit { font-size: 16px; }
  #component ul {
    margin: 0 0 32px;
    padding: 0;
    list-style: none;
    border-top: 1px solid #0B1416;
  }
  #component li {
    position: relative;
    padding: 12px 0 12px 28px;
    border-bottom: 1px solid #0B1416;
    font-size: 16px;
    line-height: 1.4;
  }
  #component li::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 15px;
    width: 6px;
    height: 11px;
    border: solid #0263AC;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  #component a.book {
    display: block;
    padding: 14px 24px;
    background: #0263AC;
    color: #fff;
    border: 2px solid #0263AC;
    border-radius: 4px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
  }
  #component a.book:hover { background: #0B1416; border-color: #0B1416; }
  #component a.book:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <div id="component">
    <h2>Working session</h2>
    <p class="desc">One focused hour together on your project, whether that's a design review, a tricky problem, or planning what to build next.</p>
    <p class="price"><span class="amount">$150</span><span class="unit">per hour</span></p>
    <ul>
      <li>60 minutes of live one-on-one time</li>
      <li>Honest, actionable feedback on your work</li>
      <li>A written summary of next steps</li>
    </ul>
    <a class="book" href="#book">Book this session</a>
  </div>
</body>
</html>
