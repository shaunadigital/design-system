<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a working session</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", Arial, Helvetica, sans-serif;
  }

  #component {
    width: 100%;
    max-width: 400px;
    padding: 36px;
    background: #fff;
    border: 1px solid #0B1416;
    border-top: 6px solid #0263AC;
    border-radius: 4px;
  }

  #component h2 {
    margin: 0 0 12px;
    font-family: "Unbounded Light", "Unbounded", "Arial Black", Arial, sans-serif;
    font-weight: 300;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  #component .price {
    margin: 0 0 20px;
    font-size: 16px;
  }

  #component .price strong {
    font-family: "Unbounded Light", "Unbounded", "Arial Black", Arial, sans-serif;
    font-weight: 300;
    font-size: 40px;
    color: #0263AC;
  }

  #component .desc {
    margin: 0 0 24px;
    font-size: 16px;
    line-height: 1.6;
  }

  #component ul {
    margin: 0 0 32px;
    padding: 0;
    list-style: none;
  }

  #component li {
    position: relative;
    padding: 10px 0 10px 28px;
    border-top: 1px solid #0B1416;
    font-size: 16px;
    line-height: 1.4;
  }

  #component li:last-child { border-bottom: 1px solid #0B1416; }

  #component li::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 14px;
    width: 6px;
    height: 11px;
    border: solid #0263AC;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  #component .book {
    display: block;
    padding: 14px 20px;
    background: #0263AC;
    color: #fff;
    border: 2px solid #0263AC;
    border-radius: 4px;
    font-family: "Archivo", Arial, Helvetica, sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
  }

  #component .book:hover { background: #0B1416; border-color: #0B1416; }

  #component .book:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <div id="component">
    <h2>Working session</h2>
    <p class="price"><strong>$150</strong> / hour</p>
    <p class="desc">One focused hour together on your design project, whether you're stuck, starting out or need a second pair of eyes.</p>
    <ul>
      <li>One hour of live, one-on-one time</li>
      <li>Honest feedback on your work</li>
      <li>Written notes and next steps afterwards</li>
    </ul>
    <a class="book" href="#book">Book this session</a>
  </div>
</body>
</html>
