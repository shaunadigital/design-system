<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message composer</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
    --line: #c9d1d4;
    --muted: #55646a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #component {
    width: 640px;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  #component:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  #component textarea {
    width: 100%;
    min-height: 72px;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    line-height: 1.5;
    padding: 0;
  }
  #component textarea::placeholder { color: var(--muted); opacity: 1; }
  #component .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #component button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 12px;
    cursor: pointer;
    font: inherit;
  }
  #component button svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #component .attach {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  #component .attach:hover { border-color: var(--ink); }
  #component .send {
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
  }
  #component .send:hover { background: #02548f; border-color: #02548f; }
  #component button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <div id="component">
    <textarea rows="3" placeholder="Message Claude" aria-label="Message Claude"></textarea>
    <div class="actions">
      <button type="button" class="attach" aria-label="Attach a file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
      </button>
      <button type="button" class="send" aria-label="Send message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
