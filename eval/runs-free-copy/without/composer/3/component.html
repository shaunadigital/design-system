<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message composer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }

  #component {
    width: 100%;
    max-width: 680px;
    padding: 12px 12px 12px 16px;
    background: #fff;
    border: 1px solid #0B1416;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #component:focus-within {
    border-color: #0263AC;
    box-shadow: 0 0 0 1px #0263AC;
  }

  #component textarea {
    display: block;
    width: 100%;
    min-height: 72px;
    padding: 4px 4px 4px 0;
    margin: 0;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: #0B1416;
    font: inherit;
    font-size: 16px;
    line-height: 1.5;
  }

  #component textarea::placeholder {
    color: #4A5559;
    opacity: 1;
  }

  #component .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #component button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 12px;
    cursor: pointer;
    font: inherit;
  }

  #component button svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #component .attach {
    background: transparent;
    border: 1px solid transparent;
    color: #0B1416;
  }

  #component .attach:hover { border-color: #0B1416; }

  #component .send {
    background: #0263AC;
    border: 1px solid #0263AC;
    color: #fff;
  }

  #component .send:hover { background: #014F8A; border-color: #014F8A; }

  #component button:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="component">
    <textarea id="message" name="message" rows="3" placeholder="Message Claude" aria-label="Message Claude"></textarea>
    <div class="actions">
      <button type="button" class="attach" aria-label="Attach a file">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/>
        </svg>
      </button>
      <button type="button" class="send" aria-label="Send message">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>
</body>
</html>
