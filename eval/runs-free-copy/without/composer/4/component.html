<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message composer</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    width: 640px;
    max-width: 100%;
    padding: 12px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: #fff;
    border: 1.5px solid #0B1416;
    border-radius: 16px;
  }
  #component:focus-within { border-color: #0263AC; box-shadow: 0 0 0 3px rgba(2, 99, 172, .25); }
  #component textarea {
    flex: 1;
    min-width: 0;
    height: 72px;
    padding: 10px 8px;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: #0B1416;
    font: 400 16px/1.5 "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component textarea::placeholder { color: #5A676B; opacity: 1; }
  #component button {
    flex: none;
    width: 44px;
    height: 44px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    font: inherit;
  }
  #component button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #component .attach { background: transparent; color: #0B1416; }
  #component .attach:hover { background: #E8EEF0; }
  #component .send { background: #0263AC; color: #fff; }
  #component .send:hover { background: #024F89; }
  #component button:focus-visible { outline: 3px solid #0B1416; outline-offset: 2px; }
</style>
</head>
<body>
  <form id="component" action="#">
    <button type="button" class="attach" aria-label="Attach a file">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l8-8"/></svg>
    </button>
    <textarea name="message" rows="3" placeholder="Message Claude" aria-label="Message Claude"></textarea>
    <button type="submit" class="send" aria-label="Send message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</body>
</html>
