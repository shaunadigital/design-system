<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message composer</title>
<style>
  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }

  #component {
    width: 640px;
    max-width: 100%;
    padding: 12px 12px 12px 16px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: #ffffff;
    border: 1px solid #0B1416;
    border-radius: 16px;
  }

  #component:focus-within {
    border-color: #0263AC;
    box-shadow: 0 0 0 1px #0263AC;
  }

  #component .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  #component textarea {
    flex: 1;
    min-width: 0;
    height: 72px;
    padding: 8px 0;
    border: 0;
    outline: none;
    resize: none;
    background: transparent;
    color: #0B1416;
    font: inherit;
    font-size: 16px;
    line-height: 24px;
  }

  #component textarea::placeholder {
    color: #556266;
    opacity: 1;
  }

  #component button {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 12px;
    cursor: pointer;
    font: inherit;
  }

  #component button svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #component .attach {
    background: transparent;
    border: 1px solid transparent;
    color: #0B1416;
  }

  #component .attach:hover {
    border-color: #0B1416;
  }

  #component .send {
    background: #0263AC;
    border: 1px solid #0263AC;
    color: #ffffff;
  }

  #component .send:hover {
    background: #0B1416;
    border-color: #0B1416;
  }

  #component button:focus-visible {
    outline: 3px solid #0263AC;
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <form id="component" action="#">
    <label for="message" class="visually-hidden">Message Claude</label>
    <button type="button" class="attach" aria-label="Attach a file">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
    </button>
    <textarea id="message" name="message" placeholder="Message Claude" rows="3"></textarea>
    <button type="submit" class="send" aria-label="Send message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</body>
</html>
