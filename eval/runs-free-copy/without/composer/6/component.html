<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message composer</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
    --line: rgba(11, 20, 22, 0.28);
    --muted: #4a5659;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #component {
    width: 720px;
    max-width: 100%;
    padding: 12px 12px 12px 16px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
  }

  #component:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  #component textarea {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    max-height: 200px;
    padding: 10px 4px;
    margin: 0;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    line-height: 24px;
  }

  #component textarea::placeholder {
    color: var(--muted);
    opacity: 1;
  }

  #component button {
    flex: none;
    width: 44px;
    height: 44px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 12px;
    font: inherit;
    cursor: pointer;
  }

  #component button svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #component .attach {
    background: transparent;
    color: var(--ink);
  }

  #component .attach:hover {
    background: rgba(11, 20, 22, 0.08);
  }

  #component .send {
    background: var(--accent);
    color: #ffffff;
  }

  #component .send:hover {
    background: #024f8a;
  }

  #component button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="component">
    <button type="button" class="attach" aria-label="Attach a file">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l8-8"/></svg>
    </button>
    <textarea rows="1" placeholder="Message Claude" aria-label="Message Claude"></textarea>
    <button type="submit" class="send" aria-label="Send message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</body>
</html>
