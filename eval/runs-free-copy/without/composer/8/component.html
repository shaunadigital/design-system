<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message composer</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #FFFFFF;
    --line: rgba(11, 20, 22, 0.28);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  #component {
    width: 640px;
    max-width: 100%;
    padding: 12px 12px 12px 16px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #component:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  #component .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  #component textarea {
    width: 100%;
    min-height: 56px;
    padding: 4px 0;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    line-height: 1.5;
  }

  #component textarea::placeholder {
    color: #4A5658;
    opacity: 1;
  }

  #component .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #component button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    font: inherit;
    cursor: pointer;
  }

  #component button svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #component .attach {
    background: transparent;
    color: var(--ink);
  }

  #component .attach:hover {
    background: rgba(11, 20, 22, 0.08);
  }

  #component .send {
    background: var(--accent);
    color: #FFFFFF;
  }

  #component .send:hover {
    background: #024F8A;
  }

  #component button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <form id="component" action="#">
    <label for="message" class="visually-hidden">Message Claude</label>
    <textarea id="message" name="message" rows="2" placeholder="Message Claude"></textarea>
    <div class="actions">
      <button type="button" class="attach" aria-label="Attach a file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
      </button>
      <button type="submit" class="send" aria-label="Send message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
</body>
</html>
