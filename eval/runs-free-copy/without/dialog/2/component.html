<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }

  #component {
    width: 440px;
    max-width: calc(100vw - 48px);
    padding: 32px;
    background: #fff;
    border: 1px solid #0B1416;
    border-radius: 8px;
    box-shadow: 0 12px 32px rgba(11, 20, 22, 0.16);
  }

  #component h2 {
    margin: 0 0 12px;
    font-family: "Unbounded", "Arial Black", system-ui, sans-serif;
    font-weight: 300;
    font-size: 20px;
    line-height: 1.3;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }

  #component p {
    margin: 0 0 28px;
    font-size: 16px;
    line-height: 1.5;
    color: #0B1416;
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }

  .btn {
    min-height: 44px;
    padding: 0 22px;
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    border-radius: 6px;
    border: 2px solid #0263AC;
    cursor: pointer;
  }

  .btn-cancel {
    background: #fff;
    color: #0263AC;
  }

  .btn-delete {
    background: #0263AC;
    color: #fff;
  }

  .btn:hover { filter: brightness(0.92); }

  .btn:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="component" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-desc">
    <h2 id="dialog-title">Delete this chat?</h2>
    <p id="dialog-desc">This permanently removes the conversation and its messages, and it can't be undone.</p>
    <div class="actions">
      <button type="button" class="btn btn-cancel">Cancel</button>
      <button type="button" class="btn btn-delete">Delete</button>
    </div>
  </div>
</body>
</html>
