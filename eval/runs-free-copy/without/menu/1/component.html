<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat menu</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #fff;
    --line: rgba(11, 20, 22, 0.14);
    --tint: rgba(2, 99, 172, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }
  #component {
    width: 240px;
    /* room for the open menu below the button, keeps the pair centered */
    height: 260px;
    position: relative;
  }
  .trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    min-height: 44px;
    padding: 0 14px 0 16px;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 8px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .trigger svg { transition: none; transform: rotate(180deg); }
  .trigger:focus-visible,
  .item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .menu {
    position: absolute;
    top: calc(44px + 6px);
    left: 0;
    right: 0;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.12);
  }
  .menu li { margin: 0; }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 44px;
    padding: 0 12px;
    background: none;
    border: 0;
    border-radius: 6px;
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .item svg { flex: none; color: var(--accent); }
  .item:hover { background: var(--tint); }
  .item:focus-visible { outline-offset: -2px; }
  .sep {
    height: 1px;
    margin: 6px 6px;
    background: var(--line);
  }
  .item.danger { font-weight: 600; }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      <span>Chat options</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat options">
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 15.5l1-4L12 3a1.4 1.4 0 012 0l1 1a1.4 1.4 0 010 2L6.5 14.5z"/><path d="M10.5 4.5l3 3"/></svg>
          Rename
        </button>
      </li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="4.5" cy="9" r="2"/><circle cx="13.5" cy="4" r="2"/><circle cx="13.5" cy="14" r="2"/><path d="M6.3 8l5.4-3M6.3 10l5.4 3"/></svg>
          Share
        </button>
      </li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="14" height="4" rx="1"/><path d="M3.5 7v7a1 1 0 001 1h9a1 1 0 001-1V7"/><path d="M7 10.5h4"/></svg>
          Archive
        </button>
      </li>
      <li class="sep" role="separator"></li>
      <li role="none">
        <button class="item danger" type="button" role="menuitem">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h12"/><path d="M7 4.5V3a1 1 0 011-1h2a1 1 0 011 1v1.5"/><path d="M4.5 4.5l.7 9.6a1 1 0 001 .9h5.6a1 1 0 001-.9l.7-9.6"/><path d="M7.5 8v4M10.5 8v4"/></svg>
          Delete
        </button>
      </li>
    </ul>
  </div>
</body>
</html>
