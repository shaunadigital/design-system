<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", Arial, sans-serif;
  }
  #component {
    position: relative;
    width: 220px;
    height: 260px;
  }
  .trigger {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 16px;
    background: #fff;
    color: #0B1416;
    border: 1px solid #0B1416;
    border-radius: 6px;
    font-family: "Unbounded", "Archivo", Arial, sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .trigger svg { width: 14px; height: 14px; transition: none; transform: rotate(180deg); }
  .trigger:focus-visible,
  .item:focus-visible { outline: 3px solid #0263AC; outline-offset: 2px; }
  .menu {
    position: absolute;
    top: 52px;
    left: 0;
    width: 220px;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: #fff;
    border: 1px solid #0B1416;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.14);
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    height: 44px;
    padding: 0 12px;
    background: none;
    border: 0;
    border-radius: 4px;
    color: #0B1416;
    font: 400 16px/1 "Archivo", Arial, sans-serif;
    text-align: left;
    cursor: pointer;
  }
  .item svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .item:hover { background: #0263AC; color: #fff; }
  .sep { height: 1px; margin: 6px 6px; background: #0B1416; opacity: 0.15; }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat options
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat options">
      <li role="none"><button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>Rename</button></li>
      <li role="none"><button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg>Share</button></li>
      <li role="none"><button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/></svg>Archive</button></li>
      <li class="sep" role="separator"></li>
      <li role="none"><button class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>Delete</button></li>
    </ul>
  </div>
</body>
</html>
