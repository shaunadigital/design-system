<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat menu</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    position: relative;
    width: 220px;
    height: 260px;
  }
  .trigger {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 16px;
    font: 500 15px/1 "Archivo", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--ink);
    border-radius: 8px;
    cursor: pointer;
  }
  .trigger[aria-expanded="true"] {
    border-color: var(--accent);
    color: var(--accent);
  }
  .trigger svg { width: 16px; height: 16px; transform: rotate(180deg); }
  .trigger:focus-visible,
  .item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .menu {
    position: absolute;
    top: 52px;
    left: 0;
    width: 220px;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: var(--bg);
    border: 1px solid var(--ink);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.14);
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    height: 44px;
    padding: 0 12px;
    font: 400 15px/1 "Archivo", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 6px;
    text-align: left;
    cursor: pointer;
  }
  .item:hover { background: rgba(2, 99, 172, 0.08); color: var(--accent); }
  .item svg {
    width: 18px;
    height: 18px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .divider {
    height: 1px;
    margin: 6px 6px;
    background: rgba(11, 20, 22, 0.2);
  }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat options
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat options">
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 15.5l1-4L12.5 2.5l3 3-9 9z"/><path d="M10.5 4.5l3 3"/></svg>
          Rename
        </button>
      </li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="4" cy="9" r="2"/><circle cx="14" cy="4" r="2"/><circle cx="14" cy="14" r="2"/><path d="M5.8 8l6.4-3M5.8 10l6.4 3"/></svg>
          Share
        </button>
      </li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="3" width="14" height="4" rx="1"/><path d="M3 7v7.5a1 1 0 001 1h10a1 1 0 001-1V7M7 10.5h4"/></svg>
          Archive
        </button>
      </li>
      <li class="divider" role="separator"></li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M7 5V3h4v2M4.5 5l.7 10a1 1 0 001 .9h5.6a1 1 0 001-.9l.7-10M7.5 8v5M10.5 8v5"/></svg>
          Delete
        </button>
      </li>
    </ul>
  </div>
</body>
</html>
