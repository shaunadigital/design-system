<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat menu</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --line: rgba(11, 20, 22, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    position: relative;
    width: 240px;
    /* room for the open menu so the pair sits centered */
    height: 250px;
  }
  .trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    height: 44px;
    padding: 0 14px 0 16px;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 8px;
    font: 500 15px/1 "Archivo", "Helvetica Neue", Arial, sans-serif;
    cursor: pointer;
  }
  .trigger:focus-visible,
  .item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .trigger svg { transition: none; transform: rotate(180deg); }
  .menu {
    position: absolute;
    top: 52px;
    left: 0;
    width: 100%;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.12);
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    height: 40px;
    padding: 0 10px;
    background: none;
    border: 0;
    border-radius: 4px;
    color: var(--ink);
    font: 400 15px/1 "Archivo", "Helvetica Neue", Arial, sans-serif;
    text-align: left;
    cursor: pointer;
  }
  .item:hover { background: rgba(2, 99, 172, 0.08); color: var(--accent); }
  .item svg { flex: none; }
  .sep {
    height: 1px;
    margin: 6px 4px;
    background: var(--line);
  }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat options
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat options">
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15l.7-3.3L12.5 2.9a1.5 1.5 0 012.1 0l.5.5a1.5 1.5 0 010 2.1l-8.8 8.8z"/><path d="M11 4.5l2.5 2.5"/></svg>
          Rename
        </button>
      </li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="4.5" cy="9" r="2"/><circle cx="13.5" cy="4" r="2"/><circle cx="13.5" cy="14" r="2"/><path d="M6.3 8l5.4-3M6.3 10l5.4 3"/></svg>
          Share
        </button>
      </li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="14" height="4" rx="1"/><path d="M3.5 7v7a1 1 0 001 1h9a1 1 0 001-1V7M7 10.5h4"/></svg>
          Archive
        </button>
      </li>
      <li class="sep" role="separator"></li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h12M7 5V3.5h4V5M4.5 5l.7 9.2a1 1 0 001 .8h5.6a1 1 0 001-.8L13.5 5M7.5 8v4M10.5 8v4"/></svg>
          Delete
        </button>
      </li>
    </ul>
  </div>
</body>
</html>
