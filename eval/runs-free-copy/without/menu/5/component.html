<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat menu</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
    --line: rgba(11, 20, 22, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    position: relative;
    width: 240px;
    height: 280px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .trigger {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 16px;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 8px;
    font: 500 15px/1 "Archivo", "Helvetica Neue", Arial, sans-serif;
    cursor: pointer;
  }
  .trigger[aria-expanded="true"] {
    border-color: var(--accent);
    color: var(--accent);
  }
  .trigger:focus-visible,
  .item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .trigger svg { width: 16px; height: 16px; flex: none; }
  .menu {
    list-style: none;
    margin: 8px 0 0;
    padding: 6px;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.12);
  }
  .menu li + li.sep {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    height: 40px;
    padding: 0 12px;
    background: none;
    border: 0;
    border-radius: 6px;
    color: var(--ink);
    font: 400 15px/1 "Archivo", "Helvetica Neue", Arial, sans-serif;
    text-align: left;
    cursor: pointer;
  }
  .item:hover { background: rgba(2, 99, 172, 0.08); color: var(--accent); }
  .item svg { width: 18px; height: 18px; flex: none; }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat options
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 8 6l4.5 4.5"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat options">
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 2.5 15.5 5.5 6 15H3v-3z"/></svg>
          Rename
        </button>
      </li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11.5V2.5M5.5 5.5 9 2l3.5 3.5M3.5 9v6h11V9"/></svg>
          Share
        </button>
      </li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h13v3h-13zM3.5 6.5v8h11v-8M7 10h4"/></svg>
          Archive
        </button>
      </li>
      <li role="none" class="sep">
        <button class="item" type="button" role="menuitem">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h12M7 4.5v-2h4v2M4.5 4.5l.7 10h7.6l.7-10M7.5 7.5v4.5M10.5 7.5v4.5"/></svg>
          Delete
        </button>
      </li>
    </ul>
  </div>
</body>
</html>
