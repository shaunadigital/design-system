<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat menu</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", Arial, sans-serif;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #component {
    width: 240px;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    height: 44px;
    padding: 0 14px 0 16px;
    background: #fff;
    color: #0B1416;
    border: 1px solid #0263AC;
    border-radius: 8px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .trigger:focus-visible, .item:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }
  .trigger svg { color: #0263AC; transform: rotate(180deg); }
  .menu {
    list-style: none;
    margin: 6px 0 0;
    padding: 6px;
    background: #fff;
    border: 1px solid #0B1416;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.14);
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    height: 40px;
    padding: 0 10px;
    background: transparent;
    color: #0B1416;
    border: 0;
    border-radius: 4px;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .item:hover { background: #0263AC; color: #fff; }
  .item svg { flex: none; }
  .sep {
    height: 1px;
    margin: 6px 4px;
    background: #0B1416;
    opacity: 0.2;
  }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat options
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat options">
      <li role="none"><button class="item" type="button" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        Rename</button></li>
      <li role="none"><button class="item" type="button" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        Share</button></li>
      <li role="none"><button class="item" type="button" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 001 1h12a1 1 0 001-1V8M10 12h4"/></svg>
        Archive</button></li>
      <li class="sep" role="separator"></li>
      <li role="none"><button class="item" type="button" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>
        Delete</button></li>
    </ul>
  </div>
</body>
</html>
