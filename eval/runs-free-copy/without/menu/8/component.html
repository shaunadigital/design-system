<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat menu</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", Arial, sans-serif;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #component {
    position: relative;
    width: 240px;
    height: 280px;
  }
  .trigger {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 16px;
    background: #fff;
    color: #0B1416;
    border: 1px solid #0B1416;
    border-radius: 6px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .trigger[aria-expanded="true"] { border-color: #0263AC; color: #0263AC; }
  .trigger:focus-visible, .item:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }
  .chevron {
    width: 8px;
    height: 8px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: translateY(-2px) rotate(225deg);
  }
  .menu {
    position: absolute;
    top: 52px;
    left: 0;
    width: 220px;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: #fff;
    border: 1px solid #0B1416;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.14);
  }
  .menu li { margin: 0; }
  .menu li.sep { height: 1px; margin: 6px 4px; background: rgba(11, 20, 22, 0.2); }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 44px;
    padding: 0 12px;
    background: transparent;
    color: #0B1416;
    border: 0;
    border-radius: 4px;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .item:hover { background: #0263AC; color: #fff; }
  .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat options <span class="chevron" aria-hidden="true"></span>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat options">
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg>
          Rename
        </button>
      </li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>
          Share
        </button>
      </li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/></svg>
          Archive
        </button>
      </li>
      <li class="sep" role="separator"></li>
      <li role="none">
        <button class="item" type="button" role="menuitem">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>
          Delete
        </button>
      </li>
    </ul>
  </div>
</body>
</html>
