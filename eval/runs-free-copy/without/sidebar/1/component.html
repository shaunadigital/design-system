<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat sidebar</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
    --muted: #4b5a5e;
    --line: #dde3e5;
    --tint: #e8f1f8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    width: 280px;
    height: 560px;
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .new-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-height: 44px;
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: 600 15px/1 "Archivo", "Helvetica Neue", Arial, sans-serif;
    cursor: pointer;
  }
  .new-chat:hover { background: #02508b; }
  .new-chat:focus-visible, .chat:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
  .new-chat svg { width: 16px; height: 16px; }
  .label {
    margin: 24px 12px 8px;
    font: 300 12px/1.2 "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .chat {
    display: block;
    padding: 10px 12px;
    border-radius: 8px;
    border-left: 3px solid transparent;
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat:hover { background: #f1f4f5; }
  .chat[aria-current="page"] {
    background: var(--tint);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
  <nav id="component" aria-label="Chat sidebar">
    <button class="new-chat" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>
      New chat
    </button>
    <h2 class="label" id="recent-label">Recent</h2>
    <ul aria-labelledby="recent-label">
      <li><a class="chat" href="#">Portfolio case study outline</a></li>
      <li><a class="chat" href="#" aria-current="page">Logo feedback for client</a></li>
      <li><a class="chat" href="#">Type pairing ideas</a></li>
      <li><a class="chat" href="#">Accessible color contrast</a></li>
      <li><a class="chat" href="#">About page copy edits</a></li>
    </ul>
  </nav>
</body>
</html>
