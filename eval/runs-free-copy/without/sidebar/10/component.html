<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat sidebar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
    --muted: rgba(11, 20, 22, 0.68);
    --line: rgba(11, 20, 22, 0.14);
    --tint: rgba(2, 99, 172, 0.09);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  #component {
    width: 280px;
    padding: 20px 16px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .new-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--accent);
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: 600 15px/1.2 "Archivo", "Helvetica Neue", Arial, sans-serif;
    cursor: pointer;
  }
  .new-chat:hover { background: var(--bg); color: var(--accent); }
  .new-chat:focus-visible, .chat:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
  .new-chat svg { width: 16px; height: 16px; }
  .label {
    margin: 28px 0 8px 12px;
    font: 300 12px/1.2 "Unbounded", "Archivo", Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .chat {
    display: block;
    padding: 10px 12px;
    border-radius: 8px;
    border-left: 3px solid transparent;
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat:hover { background: rgba(11, 20, 22, 0.05); }
  .chat[aria-current="page"] {
    background: var(--tint);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="component">
    <nav aria-label="Chats">
      <button class="new-chat" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>
        New chat
      </button>
      <h2 class="label" id="recent">Recent</h2>
      <ul aria-labelledby="recent">
        <li><a class="chat" href="#">Portfolio case study outline</a></li>
        <li><a class="chat" href="#" aria-current="page">Color palette feedback</a></li>
        <li><a class="chat" href="#">Rewrite my about page</a></li>
        <li><a class="chat" href="#">Type pairing ideas</a></li>
        <li><a class="chat" href="#">Accessibility audit notes</a></li>
      </ul>
    </nav>
  </div>
</body>
</html>
