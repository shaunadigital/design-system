<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --muted: #4A5659;
    --line: #DCE2E4;
    --tint: #E8F1F8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #fff;
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #component {
    width: 280px;
    padding: 20px 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .new-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-height: 44px;
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: 600 15px/1.2 "Archivo", system-ui, sans-serif;
    cursor: pointer;
  }
  .new-chat:hover { background: #02528F; }
  .new-chat:focus-visible, .chat:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
  .new-chat svg { width: 16px; height: 16px; }
  .label {
    margin: 28px 0 8px;
    padding: 0 12px;
    font: 300 12px/1.2 "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 2px; }
  .chat {
    display: block;
    min-height: 40px;
    padding: 10px 12px;
    border-radius: 8px;
    border-left: 3px solid transparent;
    color: var(--ink);
    font-size: 14px;
    line-height: 1.4;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat:hover { background: #F1F4F5; }
  .chat[aria-current="page"] {
    background: var(--tint);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="component">
    <nav aria-label="Chats">
      <button class="new-chat" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>
        New chat
      </button>
      <h2 class="label" id="recent-label">Recent</h2>
      <ul aria-labelledby="recent-label">
        <li><a class="chat" href="#" aria-current="page">Portfolio case study outline</a></li>
        <li><a class="chat" href="#">Color palette contrast check</a></li>
        <li><a class="chat" href="#">Rewrite my about page</a></li>
        <li><a class="chat" href="#">Typography pairing ideas</a></li>
        <li><a class="chat" href="#">Client proposal email draft</a></li>
      </ul>
    </nav>
  </div>
</body>
</html>
