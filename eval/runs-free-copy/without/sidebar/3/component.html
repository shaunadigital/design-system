<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat sidebar</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #FFFFFF;
    --muted: #4A5659;
    --line: #D9DFE1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    width: 280px;
    padding: 20px 16px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .new-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: 600 15px/1.2 "Archivo", "Helvetica Neue", Arial, sans-serif;
    cursor: pointer;
  }
  .new-chat:hover { background: var(--ink); }
  .new-chat svg { width: 16px; height: 16px; }
  .recent-label {
    margin: 28px 0 8px;
    padding: 0 12px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 2px; }
  .chat {
    display: block;
    padding: 10px 12px;
    border-radius: 8px;
    border-left: 3px solid transparent;
    color: var(--ink);
    font-size: 14.5px;
    line-height: 1.3;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat:hover { background: #F0F3F4; }
  .chat[aria-current="page"] {
    background: #E6F0F8;
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .new-chat:focus-visible,
  .chat:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="component">
    <nav aria-label="Chats">
      <button type="button" class="new-chat">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>
        New chat
      </button>
      <h2 class="recent-label">Recent</h2>
      <ul>
        <li><a class="chat" href="#" aria-current="page">Portfolio case study outline</a></li>
        <li><a class="chat" href="#">Color palette feedback</a></li>
        <li><a class="chat" href="#">Rewrite my about page</a></li>
        <li><a class="chat" href="#">Typeface pairing ideas</a></li>
        <li><a class="chat" href="#">Accessible contrast check</a></li>
      </ul>
    </nav>
  </div>
</body>
</html>
