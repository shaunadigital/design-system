<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat sidebar</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  #component {
    width: 280px;
    padding: 20px 16px;
    background: #fff;
    border: 1px solid #0B1416;
    border-radius: 12px;
  }
  .new-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px 16px;
    background: #0263AC;
    color: #fff;
    border: 2px solid #0263AC;
    border-radius: 8px;
    font: 600 15px/1.2 "Archivo", system-ui, sans-serif;
    text-decoration: none;
  }
  .new-chat:hover { background: #fff; color: #0263AC; }
  .new-chat:focus-visible, .chat:focus-visible { outline: 3px solid #0B1416; outline-offset: 2px; }
  .new-chat svg { width: 16px; height: 16px; }
  .label {
    margin: 28px 0 8px;
    padding: 0 12px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .chat {
    display: block;
    padding: 10px 12px;
    border-radius: 8px;
    border-left: 4px solid transparent;
    color: #0B1416;
    font-size: 14px;
    line-height: 1.3;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat:hover { background: #EEF4F9; }
  .chat[aria-current="page"] {
    background: #E3EEF7;
    border-left-color: #0263AC;
    font-weight: 600;
  }
</style>
</head>
<body>
  <nav id="component" aria-label="Chats">
    <a class="new-chat" href="#new">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>
      New chat
    </a>
    <h2 class="label">Recent</h2>
    <ul>
      <li><a class="chat" href="#c1">Portfolio case study outline</a></li>
      <li><a class="chat" href="#c2" aria-current="page">Brand color contrast check</a></li>
      <li><a class="chat" href="#c3">Unbounded type pairing ideas</a></li>
      <li><a class="chat" href="#c4">Project page copy edits</a></li>
      <li><a class="chat" href="#c5">Accessible nav patterns</a></li>
    </ul>
  </nav>
</body>
</html>
