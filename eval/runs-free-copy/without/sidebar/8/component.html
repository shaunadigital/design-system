<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat sidebar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    width: 280px;
    padding: 20px 16px;
    background: #fff;
    border: 1px solid rgba(11, 20, 22, 0.15);
    border-radius: 12px;
  }
  .new-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #0263AC;
    border-radius: 8px;
    background: #0263AC;
    color: #fff;
    font: 600 15px/1.2 "Archivo", "Helvetica Neue", Arial, sans-serif;
    cursor: pointer;
  }
  .new-chat:hover { background: #fff; color: #0263AC; }
  .new-chat:focus-visible, .chat:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 2px;
  }
  .new-chat svg { width: 16px; height: 16px; flex: none; }
  h2 {
    margin: 28px 0 8px;
    padding: 0 12px;
    font: 300 12px/1.2 "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #0B1416;
  }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .chat {
    display: block;
    padding: 10px 12px;
    border-left: 3px solid transparent;
    border-radius: 6px;
    color: #0B1416;
    font-size: 15px;
    line-height: 1.3;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat:hover { background: rgba(2, 99, 172, 0.07); }
  .chat[aria-current="page"] {
    background: rgba(2, 99, 172, 0.1);
    border-left-color: #0263AC;
    color: #0263AC;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="component">
    <nav aria-label="Chats">
      <button class="new-chat" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>
        New chat
      </button>
      <h2 id="recent-label">Recent</h2>
      <ul aria-labelledby="recent-label">
        <li><a class="chat" href="#" aria-current="page">Portfolio case study outline</a></li>
        <li><a class="chat" href="#">Color palette feedback</a></li>
        <li><a class="chat" href="#">Rewrite my about page</a></li>
        <li><a class="chat" href="#">Typography pairing ideas</a></li>
        <li><a class="chat" href="#">Client proposal email</a></li>
      </ul>
    </nav>
  </div>
</body>
</html>
