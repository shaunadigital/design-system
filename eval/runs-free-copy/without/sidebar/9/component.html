<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
    --muted: rgba(11, 20, 22, 0.68);
    --line: rgba(11, 20, 22, 0.14);
    --tint: rgba(2, 99, 172, 0.09);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #component {
    width: 280px;
    height: 560px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 20px 16px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .new-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-height: 44px;
    padding: 10px 16px;
    border: 2px solid var(--accent);
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: 600 15px/1.2 "Archivo", system-ui, sans-serif;
    cursor: pointer;
  }
  .new-chat:hover { background: #fff; color: var(--accent); }
  .new-chat:focus-visible, .chat:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
  .new-chat svg { width: 16px; height: 16px; flex: none; }
  nav { display: flex; flex-direction: column; gap: 10px; }
  .label {
    margin: 0;
    padding: 0 12px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
  }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .chat {
    display: block;
    padding: 11px 12px;
    border-radius: 8px;
    border-left: 3px solid transparent;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.3;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat:hover { background: var(--tint); }
  .chat[aria-current="page"] {
    background: var(--tint);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
  <aside id="component" aria-label="Chat sidebar">
    <button class="new-chat" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>
      New chat
    </button>
    <nav aria-labelledby="recent-label">
      <h2 class="label" id="recent-label">Recent</h2>
      <ul>
        <li><a class="chat" href="#" aria-current="page">Portfolio case study outline</a></li>
        <li><a class="chat" href="#">Color palette feedback</a></li>
        <li><a class="chat" href="#">Rewrite my about page</a></li>
        <li><a class="chat" href="#">Typography pairing ideas</a></li>
        <li><a class="chat" href="#">Client proposal email</a></li>
      </ul>
    </nav>
  </aside>
</body>
</html>
