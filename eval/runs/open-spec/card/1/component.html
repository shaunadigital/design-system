<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working Session</title>
<style>
  * { box-sizing: border-box; margin: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component {
    width: 100%;
    max-width: 420px;
    padding: 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .header { display: flex; flex-direction: column; gap: 8px; }

  .label {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #0263AC;
  }

  .title {
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .price { display: flex; align-items: baseline; gap: 8px; }

  .amount {
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 48px;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .unit { font-size: 16px; color: #55656A; }

  .description { color: #55656A; }

  .items {
    list-style: none;
    padding: 24px 0 0;
    border-top: 1px solid #9CC3EA;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .items li { display: flex; align-items: center; gap: 12px; }

  .items svg { flex: none; width: 24px; height: 24px; color: #0263AC; }

  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 32px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .button:hover { background: #0263AC; }

  .button:focus-visible { outline: 2px solid #0263AC; outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .button { transition: none; }
  }
</style>
</head>
<body>
  <article id="component">
    <div class="header">
      <span class="label">One-on-One</span>
      <h2 class="title">Working Session</h2>
    </div>
    <div class="price">
      <span class="amount">$150</span>
      <span class="unit">per hour</span>
    </div>
    <p class="description">One focused hour on your project. Bring a problem or a rough idea and we move it forward together.</p>
    <ul class="items">
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span>60 minutes on a video call</span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span>Live design and build feedback</span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span>Written notes and next steps</span>
      </li>
    </ul>
    <a class="button" href="#book">Book a Session</a>
  </article>
</body>
</html>
