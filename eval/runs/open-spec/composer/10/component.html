<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 16px;
  }

  #component {
    width: 100%;
    max-width: 704px;
    margin: 0 64px;
    padding: 16px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    transition: border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component:focus-within { border-color: #0263AC; }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  textarea {
    display: block;
    width: 100%;
    min-height: 96px;
    margin: 0;
    padding: 12px;
    resize: none;
    background: #FFFFFF;
    color: #0B1416;
    font: inherit;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
    border: 0;
    border-radius: 12px;
    outline: none;
  }

  textarea::placeholder { color: #55656A; opacity: 1; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
  }

  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 999px;
    font: inherit;
    font-size: 16px;
    cursor: pointer;
    transition:
      background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
      color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  button svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .attach { background: transparent; color: #0B1416; }
  .attach:hover { background: #E6EFF7; color: #0263AC; }

  .send { background: #0B1416; color: #FFFFFF; }
  .send:hover { background: #0263AC; }

  button:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }

  @media (max-width: 600px) {
    #component { margin: 0 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div id="component">
    <form>
      <label class="visually-hidden" for="message">Message Claude</label>
      <textarea id="message" name="message" placeholder="Message Claude" rows="3"></textarea>
      <div class="toolbar">
        <button type="button" class="attach" aria-label="Attach File">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/>
          </svg>
        </button>
        <button type="submit" class="send" aria-label="Send Message">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>
    </form>
  </div>
</body>
</html>
