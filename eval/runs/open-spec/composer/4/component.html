<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
  }

  #component {
    width: 100%;
    max-width: 640px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 16px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component:focus-within {
    border-color: #0263AC;
  }

  textarea {
    display: block;
    width: 100%;
    min-height: 96px;
    margin: 0 0 12px;
    padding: 12px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: #EEF4FA;
    color: #0B1416;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
    resize: vertical;
  }

  textarea::placeholder {
    color: #55656A;
    opacity: 1;
  }

  textarea:focus {
    outline: none;
    border-color: #0263AC;
    background: #FFFFFF;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    font: inherit;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  button svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .quiet {
    background: transparent;
    color: #0B1416;
  }

  .quiet:hover {
    background: #E6EFF7;
    color: #0263AC;
  }

  .primary {
    background: #0B1416;
    color: #FFFFFF;
  }

  .primary:hover {
    background: #0263AC;
  }

  button:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media (max-width: 480px) {
    body { padding: 0 20px; }
  }
</style>
</head>
<body>
  <div id="component">
    <textarea placeholder="Message Claude" aria-label="Message Claude" rows="3"></textarea>
    <div class="toolbar">
      <button type="button" class="quiet" aria-label="Attach File">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8-8a3.3 3.3 0 0 1 4.7 4.7l-8 8a1.7 1.7 0 0 1-2.4-2.4l7.3-7.3"/>
        </svg>
      </button>
      <button type="button" class="primary" aria-label="Send Message">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>
</body>
</html>
