<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
  }

  #component {
    width: 100%;
    max-width: 720px;
    padding: 16px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    transition: background 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component:focus-within { background: #E6EFF7; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  textarea {
    display: block;
    width: 100%;
    min-height: 96px;
    padding: 12px 16px;
    resize: none;
    background: #FFFFFF;
    color: #0B1416;
    font: 400 16px/1.5 "Archivo", system-ui, sans-serif;
    border: 1px solid #9CC3EA;
    border-radius: 12px;
  }

  textarea::placeholder { color: #55656A; opacity: 1; }

  textarea:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
  }

  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    font: 500 16px "Archivo", system-ui, sans-serif;
    cursor: pointer;
    transition: background 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  button svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .attach { background: transparent; color: #0B1416; }
  .attach:hover { background: #E6EFF7; color: #0263AC; }

  .send { background: #0B1416; color: #FFFFFF; }
  .send:hover { background: #0263AC; }

  button:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <form id="component">
    <label class="sr-only" for="message">Message Claude</label>
    <textarea id="message" name="message" placeholder="Message Claude"></textarea>
    <div class="actions">
      <button type="button" class="attach" aria-label="Attach File">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>
      </button>
      <button type="submit" class="send" aria-label="Send Message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
</body>
</html>
