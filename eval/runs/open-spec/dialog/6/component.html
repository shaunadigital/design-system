<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
  }

  #component {
    width: 480px;
    max-width: calc(100% - 40px);
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.12);
  }

  #component h2 {
    margin: 0 0 12px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: #0B1416;
  }

  #component p {
    margin: 0 0 32px;
    font-size: 16px;
    line-height: 1.5;
    color: #55656A;
  }

  #component .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 12px;
  }

  #component button {
    min-height: 44px;
    min-width: 44px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  #component .quiet {
    background: transparent;
    color: #0B1416;
  }
  #component .quiet:hover { background: #E6EFF7; }

  #component .primary {
    background: #0B1416;
    color: #FFFFFF;
  }
  #component .primary:hover { background: #0263AC; }

  #component button:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    #component button { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <div role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
      <h2 id="dialog-title">Delete this chat?</h2>
      <p id="dialog-message">The chat and its messages will be removed. This can't be undone.</p>
      <div class="actions">
        <button type="button" class="quiet">Cancel</button>
        <button type="button" class="primary">Delete</button>
      </div>
    </div>
  </div>
</body>
</html>
