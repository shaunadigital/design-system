<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #component {
    width: 480px;
    max-width: calc(100% - 40px);
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.12);
  }
  #component h2 {
    margin: 0 0 12px;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: #0B1416;
  }
  #component p {
    margin: 0 0 32px;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0;
    color: #55656A;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 12px;
  }
  .btn {
    min-height: 44px;
    padding: 0 24px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }
  .quiet { background: transparent; color: #0B1416; }
  .quiet:hover { background: #E6EFF7; }
  .primary { background: #0B1416; color: #FFFFFF; }
  .primary:hover { background: #55656A; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <div id="component">
    <div role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc">
      <h2 id="dlg-title">Delete this chat?</h2>
      <p id="dlg-desc">The chat and its messages will be removed. This can't be undone.</p>
      <div class="actions">
        <button type="button" class="btn quiet">Cancel</button>
        <button type="button" class="btn primary">Delete</button>
      </div>
    </div>
  </div>
</body>
</html>
