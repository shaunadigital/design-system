<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options Menu</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #component {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    width: 224px;
  }

  .trigger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 24px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font: 500 16px/1 "Archivo", system-ui, sans-serif;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .trigger:hover { background: #0263AC; }

  .trigger svg {
    width: 24px;
    height: 24px;
    flex: none;
    transform: rotate(180deg);
  }

  .menu {
    width: 100%;
    margin: 0;
    padding: 8px;
    list-style: none;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.12);
  }

  .menu a {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 8px;
    color: #0B1416;
    font: 400 16px/1.5 "Archivo", system-ui, sans-serif;
    text-decoration: none;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .menu a:hover { background: #E6EFF7; }

  .menu a:focus-visible,
  .trigger:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .trigger, .menu a { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat Options
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><a role="menuitem" href="#rename">Rename</a></li>
      <li role="none"><a role="menuitem" href="#share">Share</a></li>
      <li role="none"><a role="menuitem" href="#archive">Archive</a></li>
      <li role="none"><a role="menuitem" href="#delete">Delete</a></li>
    </ul>
  </div>
</body>
</html>
