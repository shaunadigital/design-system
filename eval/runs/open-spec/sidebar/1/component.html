<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 16px;
  }

  #component {
    width: 320px;
    min-height: 560px;
    padding: 24px 16px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .new-chat {
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 12px 24px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font: 500 16px/1.25 "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .new-chat:hover { background: #0263AC; }

  .recent h2 {
    margin: 0 0 12px;
    padding: 0 12px;
    font: 500 12px/1.5 "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #55656A;
  }

  .recent ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .recent a {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: 8px 12px;
    border-radius: 12px;
    color: #0B1416;
    font-size: 16px;
    line-height: 1.25;
    text-decoration: none;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .recent a span {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .recent a:hover { background: #E6EFF7; }

  .recent a[aria-current="page"] {
    background: #E6EFF7;
    color: #0263AC;
    font-weight: 500;
    box-shadow: inset 0 0 0 1px #9CC3EA;
  }

  .new-chat:focus-visible,
  .recent a:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .new-chat, .recent a { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <nav aria-label="Chats" style="display:contents">
      <button type="button" class="new-chat">New Chat</button>
      <section class="recent" aria-labelledby="recent-label">
        <h2 id="recent-label">Recent</h2>
        <ul>
          <li><a href="#"><span>Trip planning for Maui</span></a></li>
          <li><a href="#" aria-current="page"><span>Q3 budget review</span></a></li>
          <li><a href="#"><span>Menu ideas for Saturday</span></a></li>
          <li><a href="#"><span>Reading list</span></a></li>
          <li><a href="#"><span>Garden plan</span></a></li>
        </ul>
      </section>
    </nav>
  </div>
</body>
</html>
