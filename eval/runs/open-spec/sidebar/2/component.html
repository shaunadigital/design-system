<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", sans-serif;
    font-size: 16px;
  }

  #component {
    width: 288px;
    height: 640px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 24px 16px;
    background: #EEF4FA;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  .new-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 24px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font: 400 16px "Archivo", sans-serif;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .new-chat:hover { background: #0263AC; }

  .new-chat:focus-visible,
  .chat:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  .label {
    margin: 0 12px;
    font: 500 12px "Archivo", sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0263AC;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .chat {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid transparent;
    border-radius: 12px;
    color: #0B1416;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .chat:hover { background: #E6EFF7; }

  .chat[aria-current="page"] {
    background: #E6EFF7;
    border-color: #9CC3EA;
    font-weight: 500;
  }

  @media (prefers-reduced-motion: reduce) {
    .new-chat, .chat { transition: none; }
  }
</style>
</head>
<body>
  <nav id="component" aria-label="Chats">
    <button class="new-chat" type="button">New Chat</button>
    <div>
      <h2 class="label" id="recent-label">Recent</h2>
      <ul class="list" aria-labelledby="recent-label" style="margin-top: 12px;">
        <li><a class="chat" href="#trip">Trip planning for Maui</a></li>
        <li><a class="chat" href="#budget" aria-current="page">Q3 budget review</a></li>
        <li><a class="chat" href="#menu">Menu ideas for Saturday</a></li>
        <li><a class="chat" href="#reading">Reading list</a></li>
        <li><a class="chat" href="#garden">Garden plan</a></li>
      </ul>
    </div>
  </nav>
</body>
</html>
