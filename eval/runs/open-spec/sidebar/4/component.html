<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
  }
  #component {
    width: 320px;
    height: 640px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 24px 16px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }
  .new-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 24px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font: 500 16px "Archivo", system-ui, sans-serif;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .new-chat:hover { background: #0263AC; }
  .new-chat svg { width: 24px; height: 24px; flex: none; }
  nav { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .label {
    margin: 0;
    padding: 0 12px;
    font: 500 12px "Archivo", system-ui, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #55656A;
  }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .chat {
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 0 12px;
    border: 1px solid transparent;
    border-radius: 12px;
    color: #0B1416;
    text-decoration: none;
    font: 400 16px "Archivo", system-ui, sans-serif;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .chat:hover { background: #E6EFF7; }
  .chat[aria-current="page"] {
    background: #E6EFF7;
    border-color: #9CC3EA;
    color: #0263AC;
    font-weight: 500;
  }
  .new-chat:focus-visible, .chat:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .new-chat, .chat { transition: none; }
  }
</style>
</head>
<body>
  <aside id="component" aria-label="Chat sidebar">
    <button class="new-chat" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New Chat
    </button>
    <nav aria-labelledby="recent-label">
      <h2 class="label" id="recent-label">Recent</h2>
      <ul>
        <li><a class="chat" href="#trip-planning">Trip planning for Maui</a></li>
        <li><a class="chat" href="#q3-budget" aria-current="page">Q3 budget review</a></li>
        <li><a class="chat" href="#menu-ideas">Menu ideas for Saturday</a></li>
        <li><a class="chat" href="#reading-list">Reading list</a></li>
        <li><a class="chat" href="#garden-plan">Garden plan</a></li>
      </ul>
    </nav>
  </aside>
</body>
</html>
