<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 16px;
  }
  #component {
    width: 288px;
    height: 640px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 24px 16px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }
  .new-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 24px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font: 500 16px/1 "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    letter-spacing: 0;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .new-chat:hover { background: #0263AC; }
  .new-chat:focus-visible,
  .chat:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }
  nav { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .label {
    margin: 0;
    padding: 0 12px;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #0263AC;
  }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .chat {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 8px;
    color: #0B1416;
    font-size: 16px;
    line-height: 24px;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .chat:hover { background: #EEF4FA; }
  .chat[aria-current="page"] {
    background: #E6EFF7;
    box-shadow: inset 2px 0 0 #0263AC;
    font-weight: 500;
  }
  @media (prefers-reduced-motion: reduce) {
    .new-chat, .chat { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <a class="new-chat" href="#new" role="button">New Chat</a>
    <nav aria-label="Chats">
      <h2 class="label">Recent</h2>
      <ul>
        <li><a class="chat" href="#maui">Trip planning for Maui</a></li>
        <li><a class="chat" href="#q3" aria-current="page">Q3 budget review</a></li>
        <li><a class="chat" href="#menu">Menu ideas for Saturday</a></li>
        <li><a class="chat" href="#reading">Reading list</a></li>
        <li><a class="chat" href="#garden">Garden plan</a></li>
      </ul>
    </nav>
  </div>
</body>
</html>
