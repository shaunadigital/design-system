<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
  }

  #component {
    width: 288px;
    min-height: 560px;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  .new-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-height: 44px;
    padding: 12px 24px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font: 500 16px/1 "Archivo", system-ui, sans-serif;
    letter-spacing: 0;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .new-chat:hover { background: #0263AC; }
  .new-chat svg { width: 24px; height: 24px; flex: none; }

  .section-label {
    margin: 0 0 8px;
    padding: 0 12px;
    color: #0263AC;
    font: 500 12px/1.5 "Archivo", system-ui, sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .chats {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .chat {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: 12px;
    border: 1px solid transparent;
    border-radius: 12px;
    color: #0B1416;
    font: 400 16px/1.25 "Archivo", system-ui, sans-serif;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .chat:hover { background: #EEF4FA; }
  .chat[aria-current="page"] {
    background: #E6EFF7;
    border-color: #9CC3EA;
    font-weight: 500;
  }

  .new-chat:focus-visible,
  .chat:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .new-chat, .chat { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <nav aria-label="Chats" style="display:contents">
      <a class="new-chat" href="#new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New Chat
      </a>
      <div>
        <h2 class="section-label">Recent</h2>
        <ul class="chats">
          <li><a class="chat" href="#maui">Trip planning for Maui</a></li>
          <li><a class="chat" href="#q3" aria-current="page">Q3 budget review</a></li>
          <li><a class="chat" href="#menu">Menu ideas for Saturday</a></li>
          <li><a class="chat" href="#reading">Reading list</a></li>
          <li><a class="chat" href="#garden">Garden plan</a></li>
        </ul>
      </div>
    </nav>
  </div>
</body>
</html>
