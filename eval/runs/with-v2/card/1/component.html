<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working Session</title>
<style>
  /* Tokens used here, copied from tokens.css (day theme) */
  :root {
    color-scheme: light;
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-tight: -0.02em;
    --tracking-label: 0.14em;
    --text-hero: clamp(1.5rem, 3.34vw, 3rem);
    --text-title: 1.75rem;
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    line-height: 1.5;
  }

  #component {
    width: 100%;
    max-width: 400px;
    padding: var(--space-6);
    background: var(--card);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-card);
    box-shadow: 0 12px 32px rgba(var(--shadow-rgb), 0.08);
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }

  .label {
    margin: 0;
    font-family: var(--font-label);
    font-weight: 500;
    font-size: var(--text-label);
    line-height: 1.4;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--accent-text);
  }

  .title {
    margin: var(--space-2) 0 0;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: var(--text-title);
    line-height: 1.2;
    letter-spacing: var(--tracking-tight);
    color: var(--ink);
  }

  .price {
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
  }

  .price-amount {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-hero);
    line-height: 1;
    letter-spacing: var(--tracking-tight);
    color: var(--ink);
  }

  .price-unit {
    font-size: var(--text-small);
    color: var(--muted);
  }

  .description {
    margin: 0;
    color: var(--muted);
  }

  .included {
    margin: 0;
    padding: var(--space-5) 0 0;
    border-top: 1px solid var(--accent-line);
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  .included li {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }

  .check {
    flex: none;
    width: 24px;
    height: 24px;
    padding: var(--space-1);
    border-radius: var(--radius-pill);
    background: var(--accent-tint);
    color: var(--accent);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: var(--space-3) var(--space-6);
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--ink);
    color: var(--on-ink);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: var(--text-body);
    cursor: pointer;
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-base) var(--ease);
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(var(--shadow-rgb), 0.2); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:hover { transform: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <header>
      <p class="label">One-on-One</p>
      <h2 class="title">Working Session</h2>
    </header>

    <p class="price"><span class="price-amount">$150</span> <span class="price-unit">per hour</span></p>

    <p class="description">One focused hour on your project. Bring a problem or a rough idea and we move it forward together.</p>

    <ul class="included">
      <li>
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span>60 minutes on a video call</span>
      </li>
      <li>
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span>Live design and build feedback</span>
      </li>
      <li>
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span>Written notes and next steps</span>
      </li>
    </ul>

    <button class="btn" type="button">Book a Session</button>
  </div>
</body>
</html>
