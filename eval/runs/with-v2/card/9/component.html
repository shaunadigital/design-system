<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working Session</title>
<style>
  /* Tokens from tokens.css (day values, dusk follows the system setting) */
  :root {
    color-scheme: light dark;
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --live-rgb: 226, 109, 126;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-tight: -0.02em;
    --tracking-label: 0.14em;
    --text-hero: clamp(1.5rem, 3.34vw, 3rem);
    --text-title: 1.75rem;
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0E1618;
      --card: #172327;
      --ink: #E9EFEF;
      --muted: #9DAEB1;
      --accent-text: #9CC3EA;
      --accent: #6FAAE6;
      --accent-tint: #13283A;
      --accent-line: #2D5B85;
      --on-ink: #0E1618;
      --shadow-rgb: 0, 0, 0;
      --live-rgb: 238, 141, 154;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--space-6);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    line-height: 1.5;
  }

  #component {
    width: 100%;
    max-width: 400px;
    padding: var(--space-6);
    background: var(--card);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-card);
    box-shadow:
      0 12px 32px rgba(var(--shadow-rgb), 0.12),
      8px 8px 0 rgba(var(--live-rgb), 0.35);
  }

  .label {
    margin: 0 0 var(--space-3);
    font-family: var(--font-label);
    font-weight: 500;
    font-size: var(--text-label);
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--accent-text);
  }

  .title {
    margin: 0 0 var(--space-4);
    font-family: var(--font-display);
    font-weight: 500;
    font-size: var(--text-title);
    line-height: 1.2;
    letter-spacing: var(--tracking-tight);
  }

  .price {
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
    margin: 0 0 var(--space-4);
  }
  .price-amount {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: var(--text-hero);
    line-height: 1.1;
    letter-spacing: var(--tracking-tight);
  }
  .price-unit {
    font-size: var(--text-small);
    color: var(--muted);
  }

  .description {
    margin: 0 0 var(--space-5);
    color: var(--muted);
  }

  .included {
    list-style: none;
    margin: 0 0 var(--space-6);
    padding: var(--space-5) 0 0;
    border-top: 1px solid var(--accent-line);
    display: grid;
    gap: var(--space-3);
  }
  .included li {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }
  .included svg {
    flex: none;
    width: 24px;
    height: 24px;
    color: var(--accent);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: var(--space-3) var(--space-6);
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--ink);
    color: var(--on-ink);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: var(--text-body);
    text-decoration: none;
    cursor: pointer;
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-base) var(--ease);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(var(--shadow-rgb), 0.25);
  }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:hover { transform: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <p class="label">One-on-One</p>
    <h2 class="title">Working Session</h2>
    <p class="price"><span class="price-amount">$150</span> <span class="price-unit">per hour</span></p>
    <p class="description">One focused hour on your project. Bring a problem or a rough idea and we move it forward together.</p>
    <ul class="included">
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        60 minutes on a video call
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Live design and build feedback
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Written notes and next steps
      </li>
    </ul>
    <a class="btn" href="#book">Book a Session</a>
  </div>
</body>
</html>
