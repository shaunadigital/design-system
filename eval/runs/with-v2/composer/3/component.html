<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
/* Tokens from tokens.css (day theme), only those used here */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-body-l: 1.125rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: min(720px, calc(100% - 128px));
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
  transition: border-color var(--dur-base) var(--ease);
}

#component:focus-within { border-color: var(--accent); }

#component textarea {
  display: block;
  width: 100%;
  min-height: 96px;
  padding: var(--space-2);
  border: 0;
  border-radius: var(--space-2);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body-l);
  line-height: 1.5;
  resize: none;
  outline: none;
}

#component textarea::placeholder { color: var(--muted); opacity: 1; }

#component .bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#component .icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  font: inherit;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}

#component .icon-btn svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#component .attach { background: transparent; color: var(--ink); }
#component .attach:hover { background: var(--accent-tint); }

#component .send { background: var(--ink); color: var(--on-ink); }
#component .send:hover { transform: translateY(-1px); }

#component .icon-btn:active { transform: scale(0.96); }

#component .icon-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  #component, #component .icon-btn { transition: none; }
}
</style>
</head>
<body>
<form id="component" action="#">
  <textarea name="message" rows="3" placeholder="Message Claude" aria-label="Message Claude"></textarea>
  <div class="bar">
    <button type="button" class="icon-btn attach" aria-label="Attach File">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.1-8.1a3.3 3.3 0 0 1 4.7 4.7l-8.2 8.2a1.7 1.7 0 0 1-2.4-2.4l7.5-7.5"/></svg>
    </button>
    <button type="submit" class="icon-btn send" aria-label="Send Message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</form>
</body>
</html>
