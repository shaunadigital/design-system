<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
/* Tokens from tokens.css (only the ones used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-rgb: 111, 170, 230;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --plate-hover: #1A2A36;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 100%;
  max-width: 640px;
  padding: var(--space-4);
}

.composer {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 2px 12px rgba(var(--shadow-rgb), 0.06);
  transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.composer:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18);
}

.composer__input {
  display: block;
  width: 100%;
  min-height: 72px;
  margin: 0;
  padding: var(--space-2) 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body-l);
  line-height: 1.5;
}
.composer__input::placeholder {
  color: var(--muted);
  opacity: 1;
}

.composer__actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  font: inherit;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:active { transform: scale(0.94); }
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

.btn--plain {
  background: transparent;
  color: var(--ink);
}
.btn--plain:hover { background: var(--plate-hover); }

.btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--fill:hover { background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  .composer, .btn { transition: none; }
  .btn:active { transform: none; }
}
</style>
</head>
<body>
<div id="component">
  <form class="composer" action="#">
    <textarea class="composer__input" name="message" rows="2" placeholder="Message Claude" aria-label="Message Claude"></textarea>
    <div class="composer__actions">
      <button class="btn btn--plain" type="button" aria-label="Attach File">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16.5 6.5v9.75a4.5 4.5 0 0 1-9 0V6.75a3 3 0 0 1 6 0v9.5a1.5 1.5 0 0 1-3 0V7.5h-1.75v8.75a3.25 3.25 0 0 0 6.5 0v-9.5a4.75 4.75 0 0 0-9.5 0v9.5a6.25 6.25 0 0 0 12.5 0V6.5z"/>
        </svg>
      </button>
      <button class="btn btn--fill" type="submit" aria-label="Send Message">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 20V8.4l-4.3 4.3a1 1 0 0 1-1.4-1.4l6-6a1 1 0 0 1 1.4 0l6 6a1 1 0 0 1-1.4 1.4L13 8.4V20a1 1 0 0 1-2 0z"/>
        </svg>
      </button>
    </div>
  </form>
</div>
</body>
</html>
