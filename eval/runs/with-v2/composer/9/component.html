<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
/* Tokens copied from tokens.css (day theme, only those used here) */
:root {
  color-scheme: light;
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --accent-rgb: 2, 99, 172;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-9: 96px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--space-5);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 100%;
  max-width: 720px;
  display: flex;
  align-items: flex-end;
  gap: var(--space-2);
  padding: var(--space-3);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.08);
  transition: box-shadow var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}

#component:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18), 0 4px 16px rgba(var(--shadow-rgb), 0.08);
}

.composer-input {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  max-height: 200px;
  margin: 0;
  padding: var(--space-3) var(--space-2);
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

.composer-input::placeholder {
  color: var(--muted);
  opacity: 1;
}

.icon-btn {
  flex: none;
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  cursor: pointer;
  font: inherit;
  transition: background-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}

.icon-btn svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.icon-btn:active { transform: scale(0.96); }

.btn-attach {
  background: transparent;
  color: var(--ink);
}

.btn-attach:hover { background: var(--plate-hover); }

.btn-send {
  background: var(--ink);
  color: var(--on-ink);
}

.btn-send:hover { background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  #component, .icon-btn { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <button type="button" class="icon-btn btn-attach" aria-label="Attach File">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.9 8.9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"/></svg>
  </button>
  <textarea class="composer-input" rows="1" placeholder="Message Claude" aria-label="Message Claude"></textarea>
  <button type="button" class="icon-btn btn-send" aria-label="Send Message">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
</div>
</body>
</html>
