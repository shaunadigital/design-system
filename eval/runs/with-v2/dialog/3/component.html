<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
  display: grid;
  place-items: center;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 100%;
  max-width: 440px;
  padding: var(--space-6);
  background: var(--card);
  border-radius: var(--radius-card);
  box-shadow: 0 1px 2px rgba(var(--shadow-rgb), 0.08), 0 16px 48px rgba(var(--shadow-rgb), 0.16);
}

.dialog-title {
  margin: 0 0 var(--space-4);
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.25;
  letter-spacing: var(--tracking-snug);
  color: var(--ink);
}

.dialog-message {
  margin: 0 0 var(--space-6);
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--muted);
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: var(--space-2);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  min-width: 44px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-small);
  line-height: 1;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.btn:active { transform: translateY(1px); }

.btn--plain { background: transparent; color: var(--ink); }
.btn--plain:hover { background: var(--accent-tint); }

.btn--fill { background: var(--ink); color: var(--on-ink); box-shadow: 4px 4px 0 var(--accent); }
.btn--fill:hover { box-shadow: 2px 2px 0 var(--accent); }
</style>
</head>
<body>
  <div id="component">
    <div role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
      <h2 class="dialog-title" id="dialog-title">Delete this chat?</h2>
      <p class="dialog-message" id="dialog-message">The chat and its messages will be removed. This can't be undone.</p>
      <div class="dialog-actions">
        <button type="button" class="btn btn--plain">Cancel</button>
        <button type="button" class="btn btn--fill">Delete</button>
      </div>
    </div>
  </div>
</body>
</html>
