<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options Menu</title>
<style>
  /* Tokens from tokens.css (day theme, only the ones used here) */
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --plate-hover: #E3ECF5;
    --shadow-rgb: 11, 20, 22;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-pill: 999px;
    --tracking-snug: -0.01em;
    --text-body: 1rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  #component {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    min-height: 44px;
    padding: 0 var(--space-5);
    border: 0;
    border-radius: var(--radius-pill);
    font: 500 var(--text-body)/1 var(--font-body);
    letter-spacing: var(--tracking-snug);
    cursor: pointer;
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-base) var(--ease);
  }
  .btn--fill {
    background: var(--ink);
    color: var(--on-ink);
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible,
  .menu-item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn .chev {
    width: 16px;
    height: 16px;
    transform: rotate(180deg);
  }

  .menu {
    min-width: 220px;
    margin: 0;
    padding: var(--space-2);
    list-style: none;
    background: var(--card);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-md);
    box-shadow: 0 12px 32px rgba(var(--shadow-rgb), 0.14);
  }
  .menu li { margin: 0; }
  .menu-item {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 44px;
    padding: 0 var(--space-4);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--ink);
    font: 400 var(--text-body)/1 var(--font-body);
    text-align: left;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
  }
  .menu-item:hover { background: var(--plate-hover); }
  .menu-divider {
    height: 1px;
    margin: var(--space-1) var(--space-2);
    background: var(--accent-line);
  }
</style>
</head>
<body>
  <div id="component">
    <button class="btn btn--fill" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat Options
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><button class="menu-item" type="button" role="menuitem">Rename</button></li>
      <li role="none"><button class="menu-item" type="button" role="menuitem">Share</button></li>
      <li role="none"><button class="menu-item" type="button" role="menuitem">Archive</button></li>
      <li class="menu-divider" role="separator"></li>
      <li role="none"><button class="menu-item" type="button" role="menuitem">Delete</button></li>
    </ul>
  </div>
</body>
</html>
