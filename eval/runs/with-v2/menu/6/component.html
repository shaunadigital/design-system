<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options</title>
<style>
  /* Tokens from tokens.css (day values, dusk override follows the system setting) */
  :root {
    color-scheme: light;
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --plate-hover: #E3ECF5;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --radius-sm: 8px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-snug: -0.01em;
    --text-body: 1rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #0E1618;
      --card: #172327;
      --ink: #E9EFEF;
      --muted: #9DAEB1;
      --accent: #6FAAE6;
      --accent-tint: #13283A;
      --accent-line: #2D5B85;
      --plate-hover: #1A2A36;
      --on-ink: #0E1618;
      --shadow-rgb: 0, 0, 0;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  #component {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    min-height: 44px;
    padding: 0 var(--space-4) 0 24px;
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--ink);
    color: var(--on-ink);
    font: 500 var(--text-body)/1 var(--font-body);
    letter-spacing: var(--tracking-snug);
    cursor: pointer;
    transition: box-shadow var(--dur-base) var(--ease);
  }
  .btn:hover { box-shadow: 0 0 0 3px var(--accent-line); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .btn svg {
    width: 20px;
    height: 20px;
    transform: rotate(180deg);
    transition: transform var(--dur-base) var(--ease);
  }

  .menu {
    list-style: none;
    margin: 0;
    padding: var(--space-2);
    min-width: 220px;
    background: var(--card);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-card);
    box-shadow: 0 12px 32px rgba(var(--shadow-rgb), 0.14);
  }

  .menu li { margin: 0; }
  .menu li + li { margin-top: 2px; }

  .item {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 44px;
    padding: 0 var(--space-4);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--ink);
    font: 400 var(--text-body)/1 var(--font-body);
    text-align: left;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
  }
  .item:hover { background: var(--plate-hover); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-tint); }

  .divider {
    height: 1px;
    margin: var(--space-2) var(--space-2) !important;
    background: var(--accent-line);
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .btn svg, .item { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat Options
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><button class="item" type="button" role="menuitem">Rename</button></li>
      <li role="none"><button class="item" type="button" role="menuitem">Share</button></li>
      <li role="none"><button class="item" type="button" role="menuitem">Archive</button></li>
      <li class="divider" role="separator"></li>
      <li role="none"><button class="item" type="button" role="menuitem">Delete</button></li>
    </ul>
  </div>
</body>
</html>
