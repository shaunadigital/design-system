<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options Menu</title>
<style>
  /* Tokens from tokens.css (day and dusk), only the roles this component uses */
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-pill: 999px;
    --tracking-snug: -0.01em;
    --text-body: 1rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0E1618;
      --card: #172327;
      --ink: #E9EFEF;
      --muted: #9DAEB1;
      --accent: #6FAAE6;
      --accent-tint: #13283A;
      --accent-line: #2D5B85;
      --on-ink: #0E1618;
      --shadow-rgb: 0, 0, 0;
      color-scheme: dark;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  #component {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    min-height: 44px;
    padding: 0 var(--space-4) 0 20px;
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--ink);
    color: var(--on-ink);
    font: 500 var(--text-body)/1 var(--font-body);
    letter-spacing: var(--tracking-snug);
    cursor: pointer;
    transition: box-shadow var(--dur-base) var(--ease);
  }
  .btn:hover { box-shadow: 0 0 0 3px var(--accent-line); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .btn svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transform: rotate(180deg);
  }

  .menu {
    list-style: none;
    margin: 0;
    padding: var(--space-2);
    width: 220px;
    background: var(--card);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-md);
    box-shadow: 0 12px 32px rgba(var(--shadow-rgb), 0.14);
  }

  .menu-item {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 44px;
    padding: 0 var(--space-3);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--ink);
    font: 400 var(--text-body)/1 var(--font-body);
    text-align: left;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
  }
  .menu-item:hover { background: var(--accent-tint); }
  .menu-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-tint); }

  .menu-divider {
    height: 1px;
    margin: var(--space-1) var(--space-2);
    background: var(--accent-line);
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .menu-item { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat Options
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><button class="menu-item" type="button" role="menuitem">Rename</button></li>
      <li role="none"><button class="menu-item" type="button" role="menuitem">Share</button></li>
      <li role="none"><button class="menu-item" type="button" role="menuitem">Archive</button></li>
      <li role="separator" class="menu-divider"></li>
      <li role="none"><button class="menu-item" type="button" role="menuitem">Delete</button></li>
    </ul>
  </div>
</body>
</html>
