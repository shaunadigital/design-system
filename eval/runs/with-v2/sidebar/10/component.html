<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat sidebar</title>
<style>
  /* Tokens used here, copied from tokens.css (day theme) */
  :root {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --plate-hover: #E3ECF5;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --radius-md: 12px;
    --radius-pill: 999px;
    --tracking-label: 0.14em;
    --text-body: 1rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
  }
  :root { color-scheme: light; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  #component {
    width: 288px;
    height: 640px;
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
    padding: var(--space-4);
    background: var(--sand);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-md);
    box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: 44px;
    padding: 0 var(--space-5);
    border: 0;
    border-radius: var(--radius-pill);
    font-family: var(--font-body);
    font-size: var(--text-body);
    font-weight: 500;
    cursor: pointer;
    transition: background-color var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
  }
  .btn--fill {
    background: var(--ink);
    color: var(--on-ink);
  }
  .btn--fill:hover { background: var(--accent); }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible,
  .chat:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn svg { width: 20px; height: 20px; flex: none; }

  .recent { display: flex; flex-direction: column; gap: var(--space-2); min-height: 0; }

  .label {
    margin: 0;
    padding: 0 var(--space-3);
    font-family: var(--font-label);
    font-size: var(--text-label);
    font-weight: 500;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--muted);
  }

  .chats {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .chat {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: 0 var(--space-3);
    border-radius: var(--radius-md);
    color: var(--ink);
    text-decoration: none;
    transition: background-color var(--dur-fast) var(--ease);
  }
  .chat span {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .chat:hover { background: var(--plate-hover); }
  .chat[aria-current="page"] {
    background: var(--accent-tint);
    color: var(--accent-text);
    font-weight: 600;
    box-shadow: inset 3px 0 0 var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .chat { transition: none; }
    .btn:active { transform: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <nav aria-label="Chats" style="display:contents">
      <button class="btn btn--fill" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New Chat
      </button>

      <section class="recent" aria-labelledby="recent-label">
        <h2 class="label" id="recent-label">Recent</h2>
        <ul class="chats">
          <li><a class="chat" href="#"><span data-user-content>Trip planning for Maui</span></a></li>
          <li><a class="chat" href="#" aria-current="page"><span data-user-content>Q3 budget review</span></a></li>
          <li><a class="chat" href="#"><span data-user-content>Menu ideas for Saturday</span></a></li>
          <li><a class="chat" href="#"><span data-user-content>Reading list</span></a></li>
          <li><a class="chat" href="#"><span data-user-content>Garden plan</span></a></li>
        </ul>
      </section>
    </nav>
  </div>
</body>
</html>
