<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --ink: #0B1416;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --white: #FFFFFF;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 288px;
  height: 640px;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding: var(--space-4);
  background: var(--sand);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  width: 100%;
  min-height: 44px;
  padding: var(--space-2) var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  letter-spacing: var(--tracking-snug);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn--fill { background: var(--ink); color: var(--on-ink); }
.btn--fill:hover { background: var(--accent-text); color: var(--white); }
.btn:active { transform: scale(0.98); }
.btn svg { width: 20px; height: 20px; flex: none; }

nav { display: flex; flex-direction: column; gap: var(--space-2); }

.section-label {
  padding: 0 var(--space-3);
  font-family: var(--font-label);
  font-size: var(--text-label);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: var(--tracking-label);
  color: var(--muted);
}

ul { list-style: none; display: flex; flex-direction: column; gap: var(--space-1); }

.chat {
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  color: var(--ink);
  text-decoration: none;
  font-size: var(--text-small);
  line-height: 1.3;
  transition: background var(--dur-fast) var(--ease);
}
.chat span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat:hover { background: var(--plate-hover); }
.chat[aria-current="page"] {
  background: var(--accent-tint);
  color: var(--accent-text);
  font-weight: 600;
  box-shadow: inset 0 0 0 1px var(--accent-line);
}

.btn:focus-visible, .chat:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
</style>
</head>
<body>
<aside id="component" aria-label="Chat sidebar">
  <button class="btn btn--fill" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    New Chat
  </button>
  <nav aria-labelledby="recent-label">
    <h2 class="section-label" id="recent-label">Recent</h2>
    <ul>
      <li><a class="chat" href="#" data-user-content><span>Trip planning for Maui</span></a></li>
      <li><a class="chat" href="#" aria-current="page" data-user-content><span>Q3 budget review</span></a></li>
      <li><a class="chat" href="#" data-user-content><span>Menu ideas for Saturday</span></a></li>
      <li><a class="chat" href="#" data-user-content><span>Reading list</span></a></li>
      <li><a class="chat" href="#" data-user-content><span>Garden plan</span></a></li>
    </ul>
  </nav>
</aside>
</body>
</html>
