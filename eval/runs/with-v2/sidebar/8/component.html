<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat sidebar</title>
<style>
/* Tokens used here, copied from tokens.css */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --ink: #0B1416;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --plate-hover: #E3ECF5;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 280px;
  min-height: 560px;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding: var(--space-4);
  background: var(--sand);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  letter-spacing: var(--tracking-snug);
  text-decoration: none;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.btn--fill {
  width: 100%;
  background: var(--ink);
  color: var(--on-ink);
}
.btn--fill:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(var(--shadow-rgb), 0.2); }
.btn--fill:active { transform: translateY(0); }
.btn svg { width: 20px; height: 20px; flex: none; }

.recent { display: flex; flex-direction: column; gap: var(--space-2); }

.label {
  margin: 0;
  padding: 0 var(--space-3);
  font-family: var(--font-label);
  font-size: var(--text-label);
  font-weight: 500;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.chats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); }

.chat {
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  color: var(--ink);
  font-size: var(--text-small);
  text-decoration: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background var(--dur-fast) var(--ease);
}
.chat:hover { background: var(--plate-hover); }
.chat[aria-current="page"] {
  background: var(--accent-tint);
  color: var(--accent-text);
  font-weight: 600;
  box-shadow: inset 3px 0 0 var(--accent);
}

.btn:focus-visible, .chat:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .btn, .chat { transition: none; }
  .btn--fill:hover { transform: none; }
}
</style>
</head>
<body>
<aside id="component" aria-label="Chats">
  <a class="btn btn--fill" href="#new">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    New Chat
  </a>
  <nav class="recent" aria-labelledby="recent-label">
    <h2 class="label" id="recent-label">Recent</h2>
    <ul class="chats">
      <li><a class="chat" href="#maui" data-user-content>Trip planning for Maui</a></li>
      <li><a class="chat" href="#q3" aria-current="page" data-user-content>Q3 budget review</a></li>
      <li><a class="chat" href="#menu" data-user-content>Menu ideas for Saturday</a></li>
      <li><a class="chat" href="#reading" data-user-content>Reading list</a></li>
      <li><a class="chat" href="#garden" data-user-content>Garden plan</a></li>
    </ul>
  </nav>
</aside>
</body>
</html>
