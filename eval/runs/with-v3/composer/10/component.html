<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Composer</title>
<style>
/* Tokens from tokens.css (day theme, plus dusk) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-text: #0263AC;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0E1618;
    --card: #172327;
    --ink: #E9EFEF;
    --ink-rgb: 233, 239, 239;
    --muted: #9DAEB1;
    --accent: #6FAAE6;
    --accent-text: #9CC3EA;
    --plate-hover: #1A2A36;
    --on-ink: #0E1618;
    --shadow-rgb: 0, 0, 0;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  width: 720px;
  max-width: 100%;
  min-height: 112px;
  padding: var(--space-4);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  transition: border-color var(--dur-base) var(--ease);
}
#component:focus-within {
  border-color: var(--accent);
}

.message {
  flex: 1;
  display: block;
  width: 100%;
  min-height: 48px;
  margin: 0;
  padding: 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body);
  line-height: 1.5;
}
.message::placeholder {
  color: var(--muted);
  opacity: 1;
}

.actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.icon-btn svg {
  width: 20px;
  height: 20px;
  display: block;
}
.icon-btn:hover { background: var(--plate-hover); }
.icon-btn:active { transform: scale(0.96); }
.icon-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.icon-btn--send {
  background: var(--ink);
  color: var(--on-ink);
}
.icon-btn--send:hover {
  background: var(--ink);
  transform: translateY(-1px);
}
.icon-btn--send:active { transform: scale(0.96); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
  <div id="component">
    <textarea class="message" rows="2" placeholder="Message Claude" aria-label="Message Claude"></textarea>
    <div class="actions">
      <button type="button" class="icon-btn" aria-label="Attach File">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.9 8.9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"/>
        </svg>
      </button>
      <button type="button" class="icon-btn icon-btn--send" aria-label="Send Message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5"/>
          <path d="M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>
</body>
</html>
