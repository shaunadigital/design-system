<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Composer</title>
<style>
  /* Tokens from tokens.css (day theme, only those this component uses) */
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent: #0263AC;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --space-4: 16px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --text-body: 1rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }

  #component {
    width: 720px;
    min-height: 112px;
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
  }

  #component:focus-within {
    border-color: rgba(var(--ink-rgb), 0.3);
  }

  .message {
    flex: 1;
    width: 100%;
    min-height: 40px;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    line-height: 1.5;
  }

  .message::placeholder {
    color: var(--muted);
    opacity: 1;
  }

  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .icon-btn {
    width: 44px;
    height: 44px;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: var(--radius-pill);
    cursor: pointer;
    font: inherit;
    transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
  }

  .icon-btn svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .icon-btn:active { transform: scale(0.96); }

  .icon-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .attach {
    background: transparent;
    color: var(--ink);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
  }

  .attach:hover { background: rgba(var(--ink-rgb), 0.06); }

  .send {
    background: var(--ink);
    color: var(--on-ink);
    border: 0;
  }

  .send:hover { background: rgba(var(--ink-rgb), 0.85); }

  @media (prefers-reduced-motion: reduce) {
    .icon-btn { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <textarea class="message" rows="1" placeholder="Message Claude" aria-label="Message Claude"></textarea>
    <div class="actions">
      <button type="button" class="icon-btn attach" aria-label="Attach File">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>
      </button>
      <button type="button" class="icon-btn send" aria-label="Send Message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
