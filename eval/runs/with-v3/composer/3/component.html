<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Composer</title>
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --space-4: 16px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --text-body: 1rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0E1618;
      --card: #172327;
      --ink: #E9EFEF;
      --ink-rgb: 233, 239, 239;
      --muted: #9DAEB1;
      --accent: #6FAAE6;
      --accent-tint: #13283A;
      --accent-line: #2D5B85;
      --on-ink: #0E1618;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }

  #component {
    width: 720px;
    min-height: 112px;
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
  }

  #component:focus-within {
    border-color: var(--accent);
  }

  .composer-input {
    flex: 1;
    width: 100%;
    min-height: 48px;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: var(--text-body);
    line-height: 1.5;
  }

  .composer-input::placeholder {
    color: var(--muted);
    opacity: 1;
  }

  .composer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: var(--space-4);
  }

  .icon-btn {
    width: 44px;
    height: 44px;
    padding: 0;
    display: inline-grid;
    place-items: center;
    border: 0;
    border-radius: var(--radius-pill);
    cursor: pointer;
    font: inherit;
    transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
  }

  .icon-btn svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .icon-btn:active { transform: scale(0.96); }

  .icon-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .attach {
    background: transparent;
    color: var(--ink);
  }
  .attach:hover { background: var(--accent-tint); }

  .send {
    background: var(--ink);
    color: var(--on-ink);
  }
  .send:hover { background: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .icon-btn { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <textarea class="composer-input" name="message" rows="2" placeholder="Message Claude" aria-label="Message Claude"></textarea>
    <div class="composer-row">
      <button type="button" class="icon-btn attach" aria-label="Attach File">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20 11.5 12.1 19.4a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/>
        </svg>
      </button>
      <button type="button" class="icon-btn send" aria-label="Send Message">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 19V5"/>
          <path d="m5 12 7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>
</body>
</html>
