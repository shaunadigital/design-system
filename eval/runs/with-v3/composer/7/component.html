<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Composer</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --plate-hover: #E3ECF5;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-4: 16px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0E1618;
    --card: #172327;
    --ink: #E9EFEF;
    --ink-rgb: 233, 239, 239;
    --muted: #9DAEB1;
    --accent: #6FAAE6;
    --on-ink: #0E1618;
    --plate-hover: #1A2A36;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 720px;
  min-height: 112px;
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.composer-input {
  flex: 1;
  width: 100%;
  min-height: 48px;
  margin: 0;
  padding: 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body);
  line-height: 1.5;
}
.composer-input::placeholder {
  color: var(--muted);
  opacity: 1;
}

.composer-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.icon-btn {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.icon-btn svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.icon-btn:hover { background: var(--plate-hover); }
.icon-btn:active { transform: scale(0.96); }
.icon-btn:focus-visible,
.composer-input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.icon-btn--send {
  background: var(--ink);
  color: var(--on-ink);
}
.icon-btn--send:hover { background: var(--ink); opacity: 0.85; }

@media (prefers-reduced-motion: reduce) {
  .icon-btn { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <textarea class="composer-input" placeholder="Message Claude" aria-label="Message Claude" rows="2"></textarea>
  <div class="composer-actions">
    <button type="button" class="icon-btn" aria-label="Attach File">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-8.3 8.3a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l8-8"/></svg>
    </button>
    <button type="button" class="icon-btn icon-btn--send" aria-label="Send Message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>
</body>
</html>
