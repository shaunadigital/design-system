<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Composer</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-4: 16px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --on-ink: #0E1618;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 720px;
  max-width: 100%;
  min-height: 112px;
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

#component textarea {
  display: block;
  width: 100%;
  min-height: 48px;
  margin: 0;
  padding: 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body);
  line-height: 1.5;
}
#component textarea::placeholder {
  color: var(--muted);
  opacity: 1;
}

#component .row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#component button {
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  font: inherit;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
#component button svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#component .attach {
  background: transparent;
  color: var(--ink);
}
#component .attach:hover { background: var(--accent-tint); }
#component .send {
  background: var(--ink);
  color: var(--on-ink);
}
#component .send:hover { transform: translateY(-1px); }
#component button:active { transform: scale(0.96); }
#component button:focus-visible,
#component textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
#component:focus-within { border-color: rgba(var(--ink-rgb), 0.25); }

@media (prefers-reduced-motion: reduce) {
  #component button { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <textarea placeholder="Message Claude" aria-label="Message Claude" rows="2"></textarea>
  <div class="row">
    <button type="button" class="attach" aria-label="Attach File">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-8.3 8.3a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.8 1.8 0 0 1-2.5-2.5l8-8"/></svg>
    </button>
    <button type="button" class="send" aria-label="Send Message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>
</body>
</html>
