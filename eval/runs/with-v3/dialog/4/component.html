<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
  /* Tokens from tokens.css (day theme, the ones this component uses) */
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --accent: #0263AC;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --space-3: 12px;
    --space-6: 32px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --text-lead: 1.375rem;
    --text-body: 1rem;
    --text-small: 0.875rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
  }
  :root { color-scheme: light; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  #component {
    width: 480px;
    padding: var(--space-6);
    border-radius: var(--radius-card);
    background: var(--card);
    box-shadow: 0 24px 48px -24px rgba(var(--shadow-rgb), 0.35);
  }

  .dialog-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: var(--text-lead);
    line-height: 1.3;
    color: var(--ink);
  }

  .dialog-message {
    margin: var(--space-3) 0 0;
    font-size: var(--text-body);
    line-height: 1.5;
    color: var(--muted);
  }

  .dialog-actions {
    margin-top: var(--space-6);
    display: flex;
    justify-content: flex-end;
    gap: var(--space-3);
  }

  .btn {
    min-height: 44px;
    min-width: 44px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    font-family: var(--font-body);
    font-size: var(--text-body);
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
  }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn--plain {
    background: transparent;
    color: var(--ink);
  }
  .btn--plain:hover { background: rgba(var(--ink-rgb), 0.06); }

  .btn--fill {
    background: var(--ink);
    color: var(--on-ink);
  }
  .btn--fill:hover { background: rgba(var(--ink-rgb), 0.88); }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <div id="component" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <h2 class="dialog-title" id="dialog-title">Delete this chat?</h2>
    <p class="dialog-message" id="dialog-message">The chat and its messages will be removed. This can't be undone.</p>
    <div class="dialog-actions">
      <button type="button" class="btn btn--plain">Cancel</button>
      <button type="button" class="btn btn--fill">Delete</button>
    </div>
  </div>
</body>
</html>
