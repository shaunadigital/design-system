<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
/* Tokens (subset of tokens.css, light theme) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-3: 12px;
  --space-6: 32px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --tracking-snug: -0.01em;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 480px;
  padding: var(--space-6);
  border-radius: var(--radius-card);
  background: var(--card);
  box-shadow: 0 24px 48px -24px rgba(var(--shadow-rgb), 0.35);
}

#component .dialog-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.3;
  letter-spacing: var(--tracking-snug);
  color: var(--ink);
}

#component .dialog-message {
  margin: var(--space-3) 0 0;
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--muted);
}

#component .dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
  margin-top: var(--space-6);
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-6);
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}

#component .btn:active { transform: scale(0.98); }

#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

#component .btn--plain {
  background: transparent;
  color: var(--ink);
}

#component .btn--plain:hover { background: rgba(var(--ink-rgb), 0.06); }

#component .btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}

#component .btn--fill:hover { background: rgba(var(--ink-rgb), 0.88); }
</style>
</head>
<body>
  <div id="component" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <h2 class="dialog-title" id="dialog-title">Delete this chat?</h2>
    <p class="dialog-message" id="dialog-message">The chat and its messages will be removed. This can't be undone.</p>
    <div class="dialog-actions">
      <button type="button" class="btn btn--plain">Cancel</button>
      <button type="button" class="btn btn--fill">Delete</button>
    </div>
  </div>
</body>
</html>
