<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options Menu</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-pill: 999px;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 240px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-4);
  border: 1px solid var(--ink);
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
.btn:hover { background: var(--accent-tint); }
.btn:active { transition-duration: var(--dur-fast); }

.menu {
  width: 240px;
  margin-top: var(--space-2);
  padding: var(--space-2);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-md);
  background: var(--card);
  box-shadow: 0 24px 48px -24px rgba(var(--shadow-rgb), 0.35);
}

.menu-item {
  display: flex;
  align-items: center;
  width: 100%;
  height: 44px;
  padding: 0 var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.menu-item:hover { background: var(--accent-tint); }
.menu-item:focus-visible,
.btn:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 2px;
}

.menu-divider {
  height: 1px;
  margin: var(--space-2) 0;
  border: 0;
  background: rgba(var(--ink-rgb), 0.1);
}

@media (prefers-reduced-motion: reduce) {
  .btn, .menu-item { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">Chat Options</button>
  <div class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
    <button class="menu-item" type="button" role="menuitem">Rename</button>
    <button class="menu-item" type="button" role="menuitem">Share</button>
    <button class="menu-item" type="button" role="menuitem">Archive</button>
    <hr class="menu-divider">
    <button class="menu-item" type="button" role="menuitem">Delete</button>
  </div>
</div>
</body>
</html>
