<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options Menu</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-pill: 999px;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 240px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-5);
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}

.btn--outline {
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--ink);
}

.btn--outline:hover,
.btn--outline[aria-expanded="true"] {
  background: var(--accent-tint);
}

.btn svg {
  width: 16px;
  height: 16px;
  flex: none;
  transform: rotate(180deg);
}

.menu {
  list-style: none;
  margin: var(--space-2) 0 0;
  padding: var(--space-2);
  width: 240px;
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-md);
  box-shadow: 0 24px 48px -24px rgba(var(--shadow-rgb), 0.35);
}

.menu li { margin: 0; padding: 0; }

.menu-item {
  display: flex;
  align-items: center;
  width: 100%;
  height: 44px;
  padding: 0 var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}

.menu-item:hover { background: var(--accent-tint); }

.menu-divider {
  height: 1px;
  margin: var(--space-2) 0;
  background: rgba(var(--ink-rgb), 0.1);
}

.btn:focus-visible,
.menu-item:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .btn, .menu-item { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <button class="btn btn--outline" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
    Chat Options
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
    <li role="none"><button class="menu-item" type="button" role="menuitem">Rename</button></li>
    <li role="none"><button class="menu-item" type="button" role="menuitem">Share</button></li>
    <li role="none"><button class="menu-item" type="button" role="menuitem">Archive</button></li>
    <li role="separator" class="menu-divider"></li>
    <li role="none"><button class="menu-item" type="button" role="menuitem">Delete</button></li>
  </ul>
</div>
</body>
</html>
