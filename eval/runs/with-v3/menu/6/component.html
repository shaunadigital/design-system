<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options Menu</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --on-ink: #FFFFFF;
  --accent-tint: #E6EFF7;
  --accent-text: #0263AC;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-5: 24px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-pill: 999px;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0E1618;
    --card: #172327;
    --ink: #E9EFEF;
    --ink-rgb: 233, 239, 239;
    --on-ink: #0E1618;
    --accent-tint: #13283A;
    --accent-text: #9CC3EA;
    --shadow-rgb: 0, 0, 0;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 240px;
}

.trigger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 1.5px solid var(--ink);
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink);
  font: 500 var(--text-body)/1 var(--font-body);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
.trigger:hover { background: var(--ink); color: var(--on-ink); }
.trigger:focus-visible,
.item:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.trigger svg { width: 16px; height: 16px; flex: none; }

.panel {
  list-style: none;
  margin: var(--space-2) 0 0;
  padding: var(--space-2);
  width: 240px;
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-md);
  box-shadow: 0 24px 48px -24px rgba(var(--shadow-rgb), 0.35);
}

.item {
  display: flex;
  align-items: center;
  width: 100%;
  height: 44px;
  padding: 0 var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  font: 400 var(--text-body)/1 var(--font-body);
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.item:hover { background: var(--accent-tint); }

.divider {
  height: 1px;
  margin: var(--space-2) 0;
  background: rgba(var(--ink-rgb), 0.1);
}

@media (prefers-reduced-motion: reduce) {
  .trigger, .item { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
    Chat Options
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <ul class="panel" id="chat-menu" role="menu" aria-label="Chat Options">
    <li role="none"><button class="item" type="button" role="menuitem">Rename</button></li>
    <li role="none"><button class="item" type="button" role="menuitem">Share</button></li>
    <li role="none"><button class="item" type="button" role="menuitem">Archive</button></li>
    <li role="separator" class="divider"></li>
    <li role="none"><button class="item" type="button" role="menuitem">Delete</button></li>
  </ul>
</div>
</body>
</html>
