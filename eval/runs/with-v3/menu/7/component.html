<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options Menu</title>
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --plate-hover: #E3ECF5;
    --shadow-rgb: 11, 20, 22;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-pill: 999px;
    --text-body: 1rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
    color-scheme: light;
  }
  :root[data-theme="dusk"] {
    --paper: #0E1618;
    --card: #172327;
    --ink: #E9EFEF;
    --ink-rgb: 233, 239, 239;
    --plate-hover: #1A2A36;
    --shadow-rgb: 0, 0, 0;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }

  #component {
    width: 240px;
    /* room for the open panel so the pair sits centered together */
    padding-block: var(--space-2);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 var(--space-5);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius-pill);
    background: transparent;
    color: var(--ink);
    font: 500 var(--text-body) / 1 var(--font-body);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .btn:hover { background: rgba(var(--ink-rgb), 0.06); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .menu {
    width: 240px;
    margin: var(--space-2) 0 0;
    padding: var(--space-2);
    list-style: none;
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-md);
    box-shadow: 0 24px 48px -24px rgba(var(--shadow-rgb), 0.35);
  }

  .menu li { margin: 0; padding: 0; }

  .menu-item {
    display: flex;
    align-items: center;
    width: 100%;
    height: 44px;
    padding: 0 var(--space-3);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--ink);
    font: 400 var(--text-body) / 1 var(--font-body);
    text-align: left;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
  }
  .menu-item:hover { background: var(--plate-hover); }
  .menu-item:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

  .menu-divider {
    height: 1px;
    margin: var(--space-2) 0;
    background: rgba(var(--ink-rgb), 0.1);
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .menu-item { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">Chat Options</button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><button class="menu-item" type="button" role="menuitem">Rename</button></li>
      <li role="none"><button class="menu-item" type="button" role="menuitem">Share</button></li>
      <li role="none"><button class="menu-item" type="button" role="menuitem">Archive</button></li>
      <li role="separator" class="menu-divider"></li>
      <li role="none"><button class="menu-item" type="button" role="menuitem">Delete</button></li>
    </ul>
  </div>
</body>
</html>
