<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options menu</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --accent-text: #9CC3EA;
  --accent-tint: #13283A;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 240px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-5, 24px);
  border: 1.5px solid var(--ink);
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.btn:hover { background: rgba(var(--ink-rgb), 0.06); }
.btn:focus-visible,
.menu__item:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 2px;
}
.btn svg {
  width: 16px;
  height: 16px;
  transition: transform var(--dur-base) var(--ease);
}
.btn[aria-expanded="true"] svg { transform: rotate(180deg); }

.menu {
  width: 240px;
  margin-top: var(--space-2);
  padding: var(--space-2);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-md);
  background: var(--card);
  box-shadow: 0 24px 48px -24px rgba(var(--shadow-rgb), 0.35);
}

.menu__item {
  display: flex;
  align-items: center;
  width: 100%;
  height: 44px;
  padding: 0 var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.menu__item:hover { background: var(--accent-tint); }

.menu__divider {
  height: 1px;
  margin: var(--space-2) 0;
  background: rgba(var(--ink-rgb), 0.1);
}
</style>
</head>
<body>
  <div id="component">
    <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat Options
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <button class="menu__item" type="button" role="menuitem">Rename</button>
      <button class="menu__item" type="button" role="menuitem">Share</button>
      <button class="menu__item" type="button" role="menuitem">Archive</button>
      <div class="menu__divider" role="separator"></div>
      <button class="menu__item" type="button" role="menuitem">Delete</button>
    </div>
  </div>
</body>
</html>
