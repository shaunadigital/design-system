<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  /* Tokens from tokens.css (only the ones used here) */
  :root {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent-tint: #E6EFF7;
    --on-ink: #FFFFFF;
    --plate-hover: #E3ECF5;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-1: 4px;
    --space-4: 16px;
    --space-5: 24px;
    --radius-sm: 8px;
    --radius-pill: 999px;
    --tracking-label: 0.14em;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
    color-scheme: light;
  }
  :root[data-theme="dusk"] {
    --paper: #0E1618;
    --sand: #131E21;
    --ink: #E9EFEF;
    --ink-rgb: 233, 239, 239;
    --muted: #9DAEB1;
    --accent-text: #9CC3EA;
    --accent-tint: #13283A;
    --on-ink: #0E1618;
    --plate-hover: #1A2A36;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }

  #component {
    width: 280px;
    height: 640px;
    padding: var(--space-4);
    background: var(--sand);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 44px;
    padding: 0 var(--space-5);
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--ink);
    color: var(--on-ink);
    font-family: var(--font-body);
    font-size: var(--text-small);
    font-weight: 600;
    cursor: pointer;
    transition: opacity var(--dur-fast) var(--ease);
  }
  .btn:hover { opacity: 0.88; }
  .btn:focus-visible,
  .chat:focus-visible {
    outline: 2px solid var(--accent-text);
    outline-offset: 2px;
  }

  .section-label {
    margin: var(--space-5) 0 var(--space-1);
    padding: 0 12px;
    font-family: var(--font-label);
    font-size: var(--text-label);
    font-weight: 500;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--muted);
  }

  .chats {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .chat {
    display: flex;
    align-items: center;
    height: 44px;
    padding: 0 12px;
    border-radius: var(--radius-sm);
    color: var(--ink);
    font-size: var(--text-small);
    font-weight: 400;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background var(--dur-fast) var(--ease);
  }
  .chat:hover { background: var(--plate-hover); }
  .chat[aria-current="page"] {
    background: var(--accent-tint);
    color: var(--accent-text);
    font-weight: 600;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .chat { transition: none; }
  }
</style>
</head>
<body>
  <aside id="component" aria-label="Chats">
    <button class="btn" type="button">New Chat</button>
    <nav aria-labelledby="recent-label">
      <h2 class="section-label" id="recent-label">Recent</h2>
      <ul class="chats">
        <li><a class="chat" href="#" data-user-content>Trip planning for Maui</a></li>
        <li><a class="chat" href="#" data-user-content aria-current="page">Q3 budget review</a></li>
        <li><a class="chat" href="#" data-user-content>Menu ideas for Saturday</a></li>
        <li><a class="chat" href="#" data-user-content>Reading list</a></li>
        <li><a class="chat" href="#" data-user-content>Garden plan</a></li>
      </ul>
    </nav>
  </aside>
</body>
</html>
