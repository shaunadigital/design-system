<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working Session</title>
<style>
/* Tokens from tokens.css (subset used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --live-rgb: 226, 109, 126;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-label: 0.14em;
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-title: 1.75rem;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
  --live-rgb: 238, 141, 154;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--space-7) var(--space-6);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow:
    0 12px 32px rgba(var(--shadow-rgb), 0.08),
    8px 8px 0 rgba(var(--live-rgb), 0.6);
}

.label {
  margin: 0;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}

.title {
  margin: var(--space-2) 0 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-title);
  line-height: 1.2;
  letter-spacing: var(--tracking-snug);
  color: var(--ink);
}

.price {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  margin: 0;
}
.price-amount {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-hero);
  line-height: 1;
  color: var(--ink);
}
.price-unit {
  font-size: var(--text-body);
  color: var(--muted);
}

.description {
  margin: 0;
  font-size: var(--text-body);
  line-height: 1.6;
  color: var(--muted);
}

.included {
  list-style: none;
  margin: 0;
  padding: var(--space-5) 0 0;
  border-top: 1px solid var(--accent-line);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.included li {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--text-body);
  line-height: 1.4;
  color: var(--ink);
}
.included svg {
  flex: none;
  width: 24px;
  height: 24px;
  padding: var(--space-1);
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: var(--space-3) var(--space-6);
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-body);
  cursor: pointer;
  transition: transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 16px rgba(var(--shadow-rgb), 0.2);
}
.btn:active {
  transform: translateY(0);
  transition-duration: var(--dur-fast);
}
.btn:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
  .btn:hover { transform: none; }
}
</style>
</head>
<body>
  <article id="component">
    <header>
      <p class="label">One-on-One</p>
      <h2 class="title">Working Session</h2>
    </header>

    <p class="price"><span class="price-amount">$150</span> <span class="price-unit">per hour</span></p>

    <p class="description">One focused hour on your project. Bring a problem or a rough idea and we move it forward together.</p>

    <ul class="included">
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        60 minutes on a video call
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Live design and build feedback
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Written notes and next steps
      </li>
    </ul>

    <button class="btn" type="button">Book a Session</button>
  </article>
</body>
</html>
