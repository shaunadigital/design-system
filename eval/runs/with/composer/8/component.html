<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
/* Tokens from tokens.css (subset used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-line: #9CC3EA;
  --plate-hover: #E3ECF5;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-body-l: 1.125rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="day"]) {
    color-scheme: dark;
    --paper: #0E1618;
    --card: #172327;
    --ink: #E9EFEF;
    --muted: #9DAEB1;
    --accent: #6FAAE6;
    --accent-line: #2D5B85;
    --plate-hover: #1A2A36;
    --on-ink: #0E1618;
    --shadow-rgb: 0, 0, 0;
  }
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: min(100% - 128px, 720px);
  display: flex;
  align-items: flex-end;
  gap: var(--space-2);
  padding: var(--space-3);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.08);
  transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
#component:focus-within {
  border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(var(--shadow-rgb), 0.12);
}

#component textarea {
  flex: 1;
  min-width: 0;
  height: 44px;
  margin: 0;
  padding: 10px var(--space-2);
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body-l);
  line-height: 24px;
}
#component textarea::placeholder {
  color: var(--muted);
  opacity: 1;
}

#component .icon-btn {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  font: inherit;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
#component .icon-btn svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#component .icon-btn:active { transform: scale(0.94); }
#component .icon-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

#component .attach {
  background: transparent;
  color: var(--ink);
}
#component .attach:hover { background: var(--plate-hover); }

#component .send {
  background: var(--ink);
  color: var(--on-ink);
}
#component .send:hover { background: var(--accent); color: var(--paper); }

@media (prefers-reduced-motion: reduce) {
  #component, #component .icon-btn { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <button type="button" class="icon-btn attach" aria-label="Attach File">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="m20 11-8.6 8.6a5 5 0 0 1-7.1-7.1l8.9-8.9a3.3 3.3 0 0 1 4.7 4.7l-8.9 8.9a1.7 1.7 0 0 1-2.4-2.4L15 6.5"/>
    </svg>
  </button>
  <textarea name="message" rows="1" placeholder="Message Claude" aria-label="Message Claude"></textarea>
  <button type="button" class="icon-btn send" aria-label="Send Message">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>
</div>
</body>
</html>
