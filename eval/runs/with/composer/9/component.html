<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Composer</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --plate-hover: #E3ECF5;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-8: 64px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --text-body-l: 1.125rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --muted: #9DAEB1;
  --accent: #6FAAE6;
  --accent-line: #2D5B85;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
  --plate-hover: #1A2A36;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--space-5);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4);
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
  transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
#component:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(var(--shadow-rgb), 0.08);
}

#component textarea {
  display: block;
  width: 100%;
  min-height: var(--space-8);
  margin: 0;
  padding: var(--space-2) var(--space-2) var(--space-2) 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body-l);
  line-height: 1.5;
}
#component textarea::placeholder {
  color: var(--muted);
  opacity: 1;
}

#component .actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  font: inherit;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
#component .btn:active { transform: scale(0.96); }

#component .btn--plain {
  background: transparent;
  color: var(--ink);
}
#component .btn--plain:hover { background: var(--plate-hover); }

#component .btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}
#component .btn--fill:hover { background: var(--accent); }

#component .btn svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

@media (prefers-reduced-motion: reduce) {
  #component, #component .btn { transition: none; }
  #component .btn:active { transform: none; }
}
</style>
</head>
<body>
<div id="component">
  <textarea placeholder="Message Claude" aria-label="Message Claude" rows="2"></textarea>
  <div class="actions">
    <button type="button" class="btn btn--plain" aria-label="Attach File">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
    </button>
    <button type="button" class="btn btn--fill" aria-label="Send Message">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>
</body>
</html>
