<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --accent-rgb: 2, 99, 172;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --tracking-wide: 0.06em;
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 100%;
  max-width: 440px;
  padding: var(--space-6);
  background: var(--card);
  color: var(--ink);
  border-radius: var(--radius-card);
  box-shadow:
    0 0 0 1px rgba(var(--shadow-rgb), 0.08),
    0 24px 48px rgba(var(--shadow-rgb), 0.16);
}

#component .title {
  margin: 0 0 var(--space-3);
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.25;
  letter-spacing: var(--tracking-snug);
  color: var(--ink);
}

#component .message {
  margin: 0 0 var(--space-6);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--muted);
}

#component .actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: var(--space-2);
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  min-width: 44px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-body);
  letter-spacing: var(--tracking-wide);
  line-height: 1;
  cursor: pointer;
  transition:
    background var(--dur-base) var(--ease),
    color var(--dur-base) var(--ease),
    box-shadow var(--dur-fast) var(--ease);
}

#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

#component .btn--plain {
  background: transparent;
  color: var(--ink);
}
#component .btn--plain:hover { background: var(--accent-tint); }

#component .btn--fill {
  background: var(--ink);
  color: var(--on-ink);
  box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.35);
}
#component .btn--fill:hover { box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.35); }
#component .btn--fill:active { box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.35); }

@media (prefers-reduced-motion: reduce) {
  #component .btn { transition: none; }
}
</style>
</head>
<body>
  <div id="component" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <h2 class="title" id="dialog-title">Delete this chat?</h2>
    <p class="message" id="dialog-message">The chat and its messages will be removed. This can't be undone.</p>
    <div class="actions">
      <button type="button" class="btn btn--plain">Cancel</button>
      <button type="button" class="btn btn--fill">Delete</button>
    </div>
  </div>
</body>
</html>
