<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
/* Tokens from tokens.css (day theme, subset used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-pill: 999px;
  --radius-card: 16px;
  --tracking-snug: -0.01em;
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

#component {
  width: 440px;
  max-width: calc(100vw - 40px);
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.12);
  border-radius: var(--radius-card);
  box-shadow: 0 24px 48px rgba(var(--shadow-rgb), 0.16), 0 2px 8px rgba(var(--shadow-rgb), 0.08);
}

.dialog__title {
  margin: 0 0 var(--space-3);
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.25;
  letter-spacing: var(--tracking-snug);
  color: var(--ink);
}

.dialog__message {
  margin: 0;
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--muted);
}

.dialog__actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
  margin-top: var(--space-6);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  min-width: 44px;
  padding: 0 var(--space-5);
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease),
    transform var(--dur-fast) var(--ease);
}

.btn:active { transform: scale(0.98); }

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn--plain {
  background: transparent;
  color: var(--ink);
}
.btn--plain:hover { background: rgba(var(--accent-rgb), 0.08); }

.btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--fill:hover { background: rgba(var(--ink-rgb), 0.86); }

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
  .btn:active { transform: none; }
}
</style>
</head>
<body>
  <div id="component">
    <div role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
      <h2 class="dialog__title" id="dialog-title">Delete this chat?</h2>
      <p class="dialog__message" id="dialog-message">The chat and its messages will be removed. This can't be undone.</p>
      <div class="dialog__actions">
        <button class="btn btn--plain" type="button">Cancel</button>
        <button class="btn btn--fill" type="button">Delete</button>
      </div>
    </div>
  </div>
</body>
</html>
