<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options Menu</title>
<style>
  /* Tokens used by this component, copied from tokens.css */
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --on-ink: #FFFFFF;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --shadow-rgb: 11, 20, 22;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --radius-sm: 8px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-snug: -0.01em;
    --text-body: 1rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }

  #component {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    min-height: 44px;
    padding: 0 var(--space-5);
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--ink);
    color: var(--on-ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    font-weight: 500;
    letter-spacing: var(--tracking-snug);
    cursor: pointer;
    transition: background var(--dur-base) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn:focus-visible,
  .menu__item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .menu {
    width: 220px;
    margin: 0;
    padding: var(--space-2);
    list-style: none;
    background: var(--card);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-card);
    box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.12);
  }

  .menu__item {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 44px;
    padding: 0 var(--space-4);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    font-weight: 400;
    text-align: left;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
  }
  .menu__item:hover { background: var(--accent-tint); }

  @media (prefers-reduced-motion: reduce) {
    .btn, .menu__item { transition: none; }
  }
</style>
</head>
<body>
  <div id="component">
    <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat Options
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><button class="menu__item" type="button" role="menuitem">Rename</button></li>
      <li role="none"><button class="menu__item" type="button" role="menuitem">Share</button></li>
      <li role="none"><button class="menu__item" type="button" role="menuitem">Archive</button></li>
      <li role="none"><button class="menu__item" type="button" role="menuitem">Delete</button></li>
    </ul>
  </div>
</body>
</html>
