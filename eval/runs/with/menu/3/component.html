<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options menu</title>
<style>
/* Tokens from tokens.css (day theme), only those used here */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --on-ink: #FFFFFF;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --accent: #0263AC;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-2);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 1px solid var(--ink);
  border-radius: var(--radius-pill);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  letter-spacing: var(--tracking-snug);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
.btn:hover { background: var(--accent-tint); }
.btn:focus-visible,
.menu a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn svg {
  width: 24px;
  height: 24px;
  flex: none;
  transform: rotate(180deg);
}

.menu {
  min-width: 220px;
  margin: 0;
  padding: var(--space-2);
  list-style: none;
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-md);
  box-shadow: 0 12px 32px rgba(var(--shadow-rgb), 0.14);
}
.menu li + li { margin-top: var(--space-1); }
.menu a {
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--space-4);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  text-decoration: none;
  transition: background var(--dur-fast) var(--ease);
}
.menu a:hover { background: var(--accent-tint); }
.menu .sep {
  height: 1px;
  margin: var(--space-2) var(--space-2);
  background: var(--accent-line);
}

@media (prefers-reduced-motion: reduce) {
  .btn, .menu a { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
    Chat Options
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14l5-5 5 5"/></svg>
  </button>
  <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
    <li role="none"><a href="#" role="menuitem">Rename</a></li>
    <li role="none"><a href="#" role="menuitem">Share</a></li>
    <li role="none"><a href="#" role="menuitem">Archive</a></li>
    <li role="separator" class="sep"></li>
    <li role="none"><a href="#" role="menuitem">Delete</a></li>
  </ul>
</div>
</body>
</html>
