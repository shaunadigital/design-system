<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options Menu</title>
<style>
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 240px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--on-ink);
  font: 500 var(--text-body)/1 var(--font-body);
  letter-spacing: var(--tracking-snug);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:active { transform: scale(0.98); }
.btn svg { width: 16px; height: 16px; flex: none; }

.menu {
  list-style: none;
  margin: var(--space-2) 0 0;
  padding: var(--space-2);
  width: 100%;
  background: var(--card);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.12);
}

.menu li + li { margin-top: var(--space-1); }
.menu li.sep {
  margin-top: var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--accent-tint);
}

.item {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: 44px;
  padding: 0 var(--space-4);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  font: 400 var(--text-body)/1 var(--font-body);
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.item:hover { background: var(--accent-tint); color: var(--accent-text); }

.btn:focus-visible,
.item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .btn, .item { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true">
    Chat Options
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <ul class="menu" role="menu" aria-label="Chat Options">
    <li role="none"><button class="item" type="button" role="menuitem">Rename</button></li>
    <li role="none"><button class="item" type="button" role="menuitem">Share</button></li>
    <li role="none"><button class="item" type="button" role="menuitem">Archive</button></li>
    <li role="none" class="sep"><button class="item" type="button" role="menuitem">Delete</button></li>
  </ul>
</div>
</body>
</html>
