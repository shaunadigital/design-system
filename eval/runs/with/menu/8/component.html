<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options Menu</title>
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --radius-sm: 8px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-snug: -0.01em;
    --text-body: 1rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  #component {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
    /* room for the open menu so the pair sits centered */
    padding-block: var(--space-6);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: 44px;
    padding: var(--space-2) var(--space-5);
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--ink);
    color: var(--on-ink);
    font: 500 var(--text-body)/1.2 var(--font-body);
    letter-spacing: var(--tracking-snug);
    cursor: pointer;
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-base) var(--ease);
  }
  .btn:active { transform: translateY(1px); }
  .btn svg {
    width: 20px;
    height: 20px;
    flex: none;
  }

  .menu {
    list-style: none;
    margin: 0;
    padding: var(--space-2);
    min-width: 220px;
    background: var(--card);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-card);
    box-shadow: 0 12px 32px rgba(var(--shadow-rgb), 0.14);
  }

  .menu li + li { margin-top: var(--space-1); }

  .menu__item {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 44px;
    padding: var(--space-2) var(--space-4);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--ink);
    font: 400 var(--text-body)/1.2 var(--font-body);
    text-align: left;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .menu__item:hover { background: var(--accent-tint); color: var(--accent-text); }

  .menu__sep {
    height: 1px;
    margin: var(--space-2) var(--space-2) var(--space-2);
    background: var(--accent-line);
  }
  .menu li.menu__sep + li { margin-top: 0; }

  .btn:focus-visible,
  .menu__item:focus-visible {
    outline: 2px solid var(--accent-text);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .menu__item { transition: none; }
  }

  :root[data-theme="dusk"] {
    --paper: #0E1618;
    --card: #172327;
    --ink: #E9EFEF;
    --muted: #9DAEB1;
    --accent-text: #9CC3EA;
    --accent-tint: #13283A;
    --accent-line: #2D5B85;
    --on-ink: #0E1618;
    --shadow-rgb: 0, 0, 0;
    color-scheme: dark;
  }
</style>
</head>
<body>
  <div id="component">
    <button class="btn" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      Chat Options
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><button class="menu__item" type="button" role="menuitem">Rename</button></li>
      <li role="none"><button class="menu__item" type="button" role="menuitem">Share</button></li>
      <li role="none"><button class="menu__item" type="button" role="menuitem">Archive</button></li>
      <li class="menu__sep" role="separator"></li>
      <li role="none"><button class="menu__item" type="button" role="menuitem">Delete</button></li>
    </ul>
  </div>
</body>
</html>
