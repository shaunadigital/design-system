<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Sidebar</title>
<style>
  /* Tokens copied from tokens.css (only the ones used here) */
  :root {
    --paper: #FFFFFF;
    --sand: #EEF4FA;
    --card: #FFFFFF;
    --ink: #0B1416;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent: #0263AC;
    --accent-tint: #E6EFF7;
    --accent-line: #9CC3EA;
    --plate-hover: #E3ECF5;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --radius-md: 12px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-label: 0.14em;
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-fast: 120ms;
    --dur-base: 180ms;
    color-scheme: light;
  }
  :root[data-theme="dusk"] {
    color-scheme: dark;
    --paper: #0E1618;
    --sand: #131E21;
    --card: #172327;
    --ink: #E9EFEF;
    --muted: #9DAEB1;
    --accent-text: #9CC3EA;
    --accent: #6FAAE6;
    --accent-tint: #13283A;
    --accent-line: #2D5B85;
    --plate-hover: #1A2A36;
    --on-ink: #0E1618;
    --shadow-rgb: 0, 0, 0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  #component {
    width: 288px;
    height: 560px;
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
    padding: var(--space-4);
    background: var(--card);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-card);
    box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.08);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: 44px;
    padding: 0 var(--space-5);
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--ink);
    color: var(--on-ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    font-weight: 500;
    cursor: pointer;
    transition: background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
  }
  .btn:hover { background: var(--accent); }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 20px; height: 20px; flex: none; }

  .label {
    margin: 0 0 var(--space-2);
    padding: 0 var(--space-3);
    color: var(--muted);
    font-family: var(--font-label);
    font-size: var(--text-label);
    font-weight: 500;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
  }

  .chats {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .chat {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: 0 var(--space-3);
    border-radius: var(--radius-md);
    color: var(--ink);
    font-size: var(--text-small);
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .chat:hover { background: var(--sand); }
  .chat[aria-current="page"] {
    background: var(--accent-tint);
    color: var(--accent-text);
    font-weight: 600;
  }
  .chat[aria-current="page"]:hover { background: var(--plate-hover); }

  .btn:focus-visible,
  .chat:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .chat { transition: none; }
  }
</style>
</head>
<body>
  <aside id="component" aria-label="Chats">
    <button class="btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New Chat
    </button>

    <nav aria-labelledby="recent-label">
      <h2 class="label" id="recent-label">Recent</h2>
      <ul class="chats">
        <li><a class="chat" href="#trip-planning">Trip planning for Maui</a></li>
        <li><a class="chat" href="#q3-budget" aria-current="page">Q3 budget review</a></li>
        <li><a class="chat" href="#menu-ideas">Menu ideas for Saturday</a></li>
        <li><a class="chat" href="#reading-list">Reading list</a></li>
        <li><a class="chat" href="#garden-plan">Garden plan</a></li>
      </ul>
    </nav>
  </aside>
</body>
</html>
