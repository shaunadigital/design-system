<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working Session</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #0B1416;
    font-family: "Archivo", Arial, Helvetica, sans-serif;
  }

  #component {
    width: 100%;
    max-width: 400px;
    padding: 40px;
    background: #ffffff;
    border: 1px solid #0B1416;
    border-radius: 4px;
  }

  .label {
    margin: 0 0 16px;
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #0263AC;
  }

  .title {
    margin: 0 0 20px;
    font-family: "Unbounded", "Arial Black", Arial, sans-serif;
    font-weight: 300;
    font-size: 1.75rem;
    line-height: 1.2;
    text-transform: uppercase;
    color: #0B1416;
  }

  .price {
    margin: 0 0 20px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .amount {
    font-size: 2.5rem;
    font-weight: 700;
    line-height: 1;
    color: #0B1416;
  }

  .unit {
    font-size: 1rem;
    color: #0B1416;
  }

  .description {
    margin: 0 0 24px;
    font-size: 1rem;
    line-height: 1.6;
  }

  .included {
    margin: 0 0 32px;
    padding: 24px 0 0;
    list-style: none;
    border-top: 1px solid #0B1416;
  }

  .included li {
    position: relative;
    padding-left: 28px;
    margin-bottom: 12px;
    font-size: 1rem;
    line-height: 1.5;
  }

  .included li:last-child { margin-bottom: 0; }

  .included li::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 0.3em;
    width: 6px;
    height: 11px;
    border: solid #0263AC;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .button {
    display: block;
    width: 100%;
    padding: 16px 24px;
    background: #0263AC;
    color: #ffffff;
    border: 2px solid #0263AC;
    border-radius: 4px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }

  .button:hover { background: #0B1416; border-color: #0B1416; }

  .button:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <article id="component">
    <p class="label">One-on-One</p>
    <h2 class="title">Working Session</h2>
    <p class="price"><span class="amount">$150</span> <span class="unit">per hour</span></p>
    <p class="description">One focused hour on your project. Bring a problem or a rough idea and we move it forward together.</p>
    <ul class="included">
      <li>60 minutes on a video call</li>
      <li>Live design and build feedback</li>
      <li>Written notes and next steps</li>
    </ul>
    <a class="button" href="#book">Book a Session</a>
  </article>
</body>
</html>
