<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working Session</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }

  #component {
    width: 100%;
    max-width: 400px;
    padding: 40px;
    background: #ffffff;
    border: 1px solid #0B1416;
    border-radius: 8px;
  }

  .label {
    margin: 0 0 16px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #0263AC;
  }

  .title {
    margin: 0 0 20px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.2;
    text-transform: uppercase;
  }

  .price {
    margin: 0 0 20px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .amount {
    font-size: 44px;
    font-weight: 700;
    line-height: 1;
  }

  .unit {
    font-size: 16px;
  }

  .description {
    margin: 0 0 24px;
    font-size: 16px;
    line-height: 1.6;
  }

  .included {
    margin: 0 0 32px;
    padding: 24px 0 0;
    list-style: none;
    border-top: 1px solid #0B1416;
  }

  .included li {
    position: relative;
    padding-left: 28px;
    font-size: 16px;
    line-height: 1.5;
  }

  .included li + li { margin-top: 12px; }

  .included li::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 4px;
    width: 6px;
    height: 12px;
    border: solid #0263AC;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .button {
    display: block;
    width: 100%;
    padding: 16px 24px;
    background: #0263AC;
    color: #ffffff;
    border: 2px solid #0263AC;
    border-radius: 6px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }

  .button:hover { background: #ffffff; color: #0263AC; }

  .button:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <div id="component">
    <p class="label">One-on-One</p>
    <h2 class="title">Working Session</h2>
    <p class="price"><span class="amount">$150</span> <span class="unit">per hour</span></p>
    <p class="description">One focused hour on your project. Bring a problem or a rough idea and we move it forward together.</p>
    <ul class="included">
      <li>60 minutes on a video call</li>
      <li>Live design and build feedback</li>
      <li>Written notes and next steps</li>
    </ul>
    <a class="button" href="#">Book a Session</a>
  </div>
</body>
</html>
