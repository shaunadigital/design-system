<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message composer</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
    --line: rgba(11, 20, 22, 0.25);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #component {
    width: 720px;
    max-width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  #component:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  #component textarea {
    flex: 1;
    min-width: 0;
    height: 44px;
    min-height: 44px;
    max-height: 200px;
    margin: 0;
    padding: 11px 8px;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--ink);
    font: 400 16px/22px "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #component textarea::placeholder {
    color: #4a5558;
    opacity: 1;
  }
  #component button {
    flex: none;
    width: 44px;
    height: 44px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    font: inherit;
  }
  #component button svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #component .attach {
    background: transparent;
    color: var(--ink);
  }
  #component .attach:hover { background: rgba(11, 20, 22, 0.08); }
  #component .send {
    background: var(--accent);
    color: #ffffff;
  }
  #component .send:hover { background: #02508b; }
  #component button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="component">
    <button type="button" class="attach" aria-label="Attach File" title="Attach File">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21.4 11.1 12.2 20.3a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>
      </svg>
    </button>
    <textarea rows="1" placeholder="Message Claude" aria-label="Message Claude"></textarea>
    <button type="submit" class="send" aria-label="Send Message" title="Send Message">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 19V5"/>
        <path d="m5 12 7-7 7 7"/>
      </svg>
    </button>
  </div>
</body>
</html>
