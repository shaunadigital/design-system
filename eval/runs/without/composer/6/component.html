<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message composer</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
    --line: rgba(11, 20, 22, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #component {
    width: 640px;
    max-width: 100%;
    padding: 12px 12px 12px 16px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  #component:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  #component textarea {
    flex: 1;
    min-width: 0;
    height: 72px;
    margin: 0;
    padding: 8px 0;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    line-height: 1.5;
  }
  #component textarea::placeholder {
    color: #4F5B5E;
    opacity: 1;
  }
  #component button {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    font: inherit;
  }
  #component button svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .attach {
    background: transparent;
    color: var(--ink);
  }
  .attach:hover { background: rgba(11, 20, 22, 0.08); }
  .send {
    background: var(--accent);
    color: #fff;
  }
  .send:hover { background: #014f8a; }
  #component button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="component">
    <button type="button" class="attach" aria-label="Attach File" title="Attach File">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.9 8.9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"/></svg>
    </button>
    <textarea placeholder="Message Claude" aria-label="Message Claude" rows="3"></textarea>
    <button type="submit" class="send" aria-label="Send Message" title="Send Message">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</body>
</html>
