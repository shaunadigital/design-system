<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #component {
    width: 100%;
    max-width: 440px;
    padding: 32px;
    background: var(--bg);
    border: 1px solid var(--ink);
    border-radius: 4px;
    box-shadow: 0 12px 40px rgba(11, 20, 22, 0.16);
  }
  #component h2 {
    margin: 0 0 12px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 20px;
    line-height: 1.3;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  #component p {
    margin: 0 0 28px;
    font-size: 16px;
    line-height: 1.5;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 16px;
    min-height: 44px;
    padding: 0 24px;
    border-radius: 4px;
    border: 2px solid var(--accent);
    cursor: pointer;
  }
  .cancel { background: var(--bg); color: var(--accent); }
  .delete { background: var(--accent); color: #fff; }
  button:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="component" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc">
    <h2 id="dlg-title">Delete this chat?</h2>
    <p id="dlg-desc">The chat and its messages will be removed. This can't be undone.</p>
    <div class="actions">
      <button type="button" class="cancel">Cancel</button>
      <button type="button" class="delete">Delete</button>
    </div>
  </div>
</body>
</html>
