<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #component {
    width: 440px;
    max-width: calc(100% - 48px);
    background: #fff;
    border: 1px solid var(--ink);
    border-radius: 4px;
    padding: 32px;
    box-shadow: 0 12px 32px rgba(11, 20, 22, 0.16);
  }
  #component h2 {
    margin: 0 0 12px;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 20px;
    line-height: 1.3;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  #component p {
    margin: 0 0 28px;
    font-size: 16px;
    line-height: 1.5;
  }
  #component .actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  #component button {
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    line-height: 1;
    min-height: 44px;
    padding: 0 24px;
    border-radius: 4px;
    border: 2px solid var(--accent);
    cursor: pointer;
  }
  #component .cancel {
    background: #fff;
    color: var(--accent);
  }
  #component .delete {
    background: var(--accent);
    color: #fff;
  }
  #component button:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="component" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc">
    <h2 id="dlg-title">Delete this chat?</h2>
    <p id="dlg-desc">The chat and its messages will be removed. This can't be undone.</p>
    <div class="actions">
      <button type="button" class="cancel">Cancel</button>
      <button type="button" class="delete">Delete</button>
    </div>
  </div>
</body>
</html>
