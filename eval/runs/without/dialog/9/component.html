<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete this chat?</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #component {
    width: 440px;
    max-width: calc(100% - 48px);
    background: #fff;
    border: 1px solid #0B1416;
    border-radius: 8px;
    padding: 32px;
  }
  #component h2 {
    margin: 0 0 12px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 20px;
    line-height: 1.3;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  #component p {
    margin: 0 0 28px;
    font-size: 16px;
    line-height: 1.5;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  button {
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    min-height: 44px;
    padding: 0 22px;
    border-radius: 6px;
    border: 2px solid #0263AC;
    cursor: pointer;
  }
  .cancel { background: #fff; color: #0263AC; }
  .delete { background: #0263AC; color: #fff; }
  button:hover { text-decoration: underline; }
  button:focus-visible { outline: 3px solid #0B1416; outline-offset: 2px; }
</style>
</head>
<body>
  <div id="component" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc">
    <h2 id="dlg-title">Delete this chat?</h2>
    <p id="dlg-desc">The chat and its messages will be removed. This can't be undone.</p>
    <div class="actions">
      <button type="button" class="cancel">Cancel</button>
      <button type="button" class="delete">Delete</button>
    </div>
  </div>
</body>
</html>
