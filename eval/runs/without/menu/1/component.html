<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #0B1416;
    font-family: "Archivo", Arial, Helvetica, sans-serif;
    font-size: 16px;
  }

  #component {
    width: 220px;
  }

  .trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 12px 16px;
    background: #ffffff;
    color: #0263AC;
    border: 1.5px solid #0263AC;
    border-radius: 8px;
    font: inherit;
    font-weight: 500;
    line-height: 1.25;
    cursor: pointer;
  }

  .trigger svg {
    width: 14px;
    height: 14px;
    flex: none;
  }

  .trigger:focus-visible,
  .item:focus-visible {
    outline: 3px solid #0263AC;
    outline-offset: 2px;
  }

  .menu {
    margin: 8px 0 0;
    padding: 6px;
    list-style: none;
    background: #ffffff;
    border: 1.5px solid #0B1416;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.14);
  }

  .item {
    display: block;
    width: 100%;
    padding: 10px 12px;
    background: transparent;
    color: #0B1416;
    border: 0;
    border-radius: 4px;
    font: inherit;
    line-height: 1.25;
    text-align: left;
    cursor: pointer;
  }

  .item:hover {
    background: #0263AC;
    color: #ffffff;
  }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      <span>Chat Options</span>
      <svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M2 4.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><button class="item" type="button" role="menuitem">Rename</button></li>
      <li role="none"><button class="item" type="button" role="menuitem">Share</button></li>
      <li role="none"><button class="item" type="button" role="menuitem">Archive</button></li>
      <li role="none"><button class="item" type="button" role="menuitem">Delete</button></li>
    </ul>
  </div>
</body>
</html>
