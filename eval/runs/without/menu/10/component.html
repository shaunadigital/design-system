<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }

  #component {
    position: relative;
    width: 220px;
    /* reserve room so the open menu stays centered with the button */
    padding-bottom: 0;
  }

  .trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 12px 16px;
    background: #fff;
    color: #0B1416;
    border: 1.5px solid #0B1416;
    border-radius: 6px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }

  .trigger:hover { border-color: #0263AC; color: #0263AC; }

  .trigger svg {
    width: 14px;
    height: 14px;
    flex: none;
    transform: rotate(180deg);
  }

  .menu {
    list-style: none;
    margin: 6px 0 0;
    padding: 6px;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: #fff;
    border: 1.5px solid #0B1416;
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.14);
  }

  .menu li + li.sep {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(11, 20, 22, 0.2);
  }

  .item {
    display: block;
    padding: 10px 12px;
    border-radius: 4px;
    color: #0B1416;
    text-decoration: none;
  }

  .item:hover { background: #0263AC; color: #fff; }
  .item.current { background: rgba(2, 99, 172, 0.1); }

  .trigger:focus-visible,
  .item:focus-visible {
    outline: 3px solid #0263AC;
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      <span>Chat Options</span>
      <svg viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5l5 5 5-5"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><a class="item" role="menuitem" href="#rename">Rename</a></li>
      <li role="none"><a class="item" role="menuitem" href="#share">Share</a></li>
      <li role="none"><a class="item" role="menuitem" href="#archive">Archive</a></li>
      <li role="none" class="sep"><a class="item" role="menuitem" href="#delete">Delete</a></li>
    </ul>
  </div>
</body>
</html>
