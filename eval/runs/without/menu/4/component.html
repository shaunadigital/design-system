<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }

  #component {
    position: relative;
    width: 220px;
    /* reserve room for the open menu so the group stays centered */
    padding-bottom: 0;
  }

  .trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 12px 16px;
    background: #fff;
    color: #0B1416;
    border: 1.5px solid #0B1416;
    border-radius: 8px;
    font: 500 16px/1.25 "Archivo", "Helvetica Neue", Arial, sans-serif;
    cursor: pointer;
  }

  .trigger:hover { border-color: #0263AC; color: #0263AC; }

  .trigger:focus-visible,
  .menu a:focus-visible {
    outline: 3px solid #0263AC;
    outline-offset: 2px;
  }

  .trigger svg {
    width: 16px;
    height: 16px;
    flex: none;
    transform: rotate(180deg);
  }

  .menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    width: 100%;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: #fff;
    border: 1.5px solid #0B1416;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.12);
  }

  .menu a {
    display: block;
    padding: 10px 12px;
    color: #0B1416;
    text-decoration: none;
    border-radius: 4px;
    font-size: 16px;
    line-height: 1.25;
  }

  .menu a:hover {
    background: #0263AC;
    color: #fff;
  }

  .menu li + li.divider {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(11, 20, 22, 0.2);
  }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      <span>Chat Options</span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><a role="menuitem" href="#rename">Rename</a></li>
      <li role="none"><a role="menuitem" href="#share">Share</a></li>
      <li role="none"><a role="menuitem" href="#archive">Archive</a></li>
      <li role="none" class="divider"><a role="menuitem" href="#delete">Delete</a></li>
    </ul>
  </div>
</body>
</html>
