<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options menu</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
    --line: rgba(11, 20, 22, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  #component {
    position: relative;
    width: 220px;
    /* room for the open menu so the button + menu group stays centered */
    padding-bottom: 0;
  }
  .trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 12px 16px;
    font: 500 16px/1.25 "Archivo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    cursor: pointer;
  }
  .trigger:hover { border-color: var(--accent); color: var(--accent); }
  .trigger:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .trigger svg { width: 16px; height: 16px; flex: none; transform: rotate(180deg); }
  .menu {
    list-style: none;
    margin: 8px 0 0;
    padding: 6px;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.12);
  }
  .menu a {
    display: block;
    padding: 10px 12px;
    font: 400 16px/1.25 "Archivo", system-ui, sans-serif;
    color: var(--ink);
    text-decoration: none;
    border-radius: 4px;
  }
  .menu a:hover { background: rgba(2, 99, 172, 0.08); color: var(--accent); }
  .menu a:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  .menu li + li.sep { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      <span>Chat Options</span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><a role="menuitem" href="#rename">Rename</a></li>
      <li role="none"><a role="menuitem" href="#share">Share</a></li>
      <li role="none"><a role="menuitem" href="#archive">Archive</a></li>
      <li role="none" class="sep"><a role="menuitem" href="#delete">Delete</a></li>
    </ul>
  </div>
</body>
</html>
