<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Options menu</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", Arial, Helvetica, sans-serif;
  }
  #component {
    position: relative;
    width: 220px;
    /* reserve room for the open menu so the group sits centered */
    padding-bottom: 188px;
    align-self: center;
  }
  .trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 12px 16px;
    font: 500 16px/1.25 "Archivo", Arial, Helvetica, sans-serif;
    color: #fff;
    background: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 8px;
    cursor: pointer;
  }
  .trigger:focus-visible,
  .menu a:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
  .trigger svg {
    width: 16px;
    height: 16px;
    flex: none;
    transform: rotate(180deg);
  }
  .menu {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    margin: 6px 0 0;
    padding: 6px;
    list-style: none;
    background: var(--bg);
    border: 1px solid var(--ink);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(11, 20, 22, 0.14);
    top: 56px;
  }
  .menu a {
    display: block;
    padding: 10px 12px;
    color: var(--ink);
    font-size: 16px;
    line-height: 1.25;
    text-decoration: none;
    border-radius: 4px;
  }
  .menu a:hover {
    background: var(--accent);
    color: #fff;
  }
  .menu li + li { margin-top: 2px; }
</style>
</head>
<body>
  <div id="component">
    <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="chat-menu">
      <span>Chat Options</span>
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 5l5 6 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <ul class="menu" id="chat-menu" role="menu" aria-label="Chat Options">
      <li role="none"><a role="menuitem" href="#rename">Rename</a></li>
      <li role="none"><a role="menuitem" href="#share">Share</a></li>
      <li role="none"><a role="menuitem" href="#archive">Archive</a></li>
      <li role="none"><a role="menuitem" href="#delete">Delete</a></li>
    </ul>
  </div>
</body>
</html>
