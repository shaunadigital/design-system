<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    width: 280px;
    height: 560px;
    padding: 20px 16px;
    background: #fff;
    border: 1px solid rgba(11, 20, 22, 0.15);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .new-chat {
    width: 100%;
    min-height: 44px;
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: #0263AC;
    color: #fff;
    font: 600 15px/1.2 "Archivo", "Helvetica Neue", Arial, sans-serif;
    cursor: pointer;
  }
  .new-chat:hover { background: #02548f; }
  .new-chat:focus-visible, .chat:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 2px;
  }
  .label {
    margin: 0 0 8px;
    padding: 0 12px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .chats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .chat {
    display: block;
    min-height: 44px;
    padding: 12px 12px 12px 9px;
    border-left: 3px solid transparent;
    border-radius: 8px;
    color: #0B1416;
    text-decoration: none;
    font-size: 15px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat:hover { background: rgba(2, 99, 172, 0.06); }
  .chat[aria-current="page"] {
    background: rgba(2, 99, 172, 0.1);
    border-left-color: #0263AC;
    color: #0263AC;
    font-weight: 600;
  }
</style>
</head>
<body>
  <nav id="component" aria-label="Chats">
    <button class="new-chat" type="button">New Chat</button>
    <div>
      <h2 class="label">Recent</h2>
      <ul class="chats">
        <li><a class="chat" href="#trip">Trip planning for Maui</a></li>
        <li><a class="chat" href="#budget" aria-current="page">Q3 budget review</a></li>
        <li><a class="chat" href="#menu">Menu ideas for Saturday</a></li>
        <li><a class="chat" href="#reading">Reading list</a></li>
        <li><a class="chat" href="#garden">Garden plan</a></li>
      </ul>
    </div>
  </nav>
</body>
</html>
