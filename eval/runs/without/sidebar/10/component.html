<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  :root {
    --ink: #0B1416;
    --accent: #0263AC;
    --bg: #fff;
    --line: #dde3e6;
    --muted: #4a5659;
    --tint: #e8f1f8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    width: 280px;
    height: 560px;
    padding: 20px 16px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .new-chat {
    appearance: none;
    width: 100%;
    padding: 12px 16px;
    background: var(--accent);
    color: #fff;
    border: 2px solid var(--accent);
    border-radius: 8px;
    font: 600 15px/1.2 "Archivo", "Helvetica Neue", Arial, sans-serif;
    cursor: pointer;
  }
  .new-chat:hover { background: #014f89; border-color: #014f89; }
  .new-chat:focus-visible, .chat:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
  .label {
    margin: 0 0 8px;
    padding: 0 12px;
    font: 300 12px/1.4 "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .chat {
    display: block;
    padding: 10px 12px;
    border-left: 3px solid transparent;
    border-radius: 6px;
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat:hover { background: #f1f4f5; }
  .chat[aria-current="page"] {
    background: var(--tint);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
  <aside id="component" aria-label="Chat sidebar">
    <button type="button" class="new-chat">New Chat</button>
    <nav aria-labelledby="recent-label">
      <h2 class="label" id="recent-label">Recent</h2>
      <ul>
        <li><a class="chat" href="#">Trip planning for Maui</a></li>
        <li><a class="chat" href="#" aria-current="page">Q3 budget review</a></li>
        <li><a class="chat" href="#">Menu ideas for Saturday</a></li>
        <li><a class="chat" href="#">Reading list</a></li>
        <li><a class="chat" href="#">Garden plan</a></li>
      </ul>
    </nav>
  </aside>
</body>
</html>
