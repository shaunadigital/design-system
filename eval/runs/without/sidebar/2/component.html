<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }

  #component {
    width: 280px;
    height: 560px;
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    background: #fff;
    border: 1px solid #0B1416;
    border-radius: 12px;
  }

  .new-chat {
    display: block;
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #0263AC;
    border-radius: 8px;
    background: #0263AC;
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
  }

  .new-chat:hover { background: #fff; color: #0263AC; }

  .section-label {
    margin: 28px 0 8px;
    padding: 0 12px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .chat-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .chat-list li + li { margin-top: 4px; }

  .chat-list a {
    display: block;
    padding: 10px 12px;
    border-left: 4px solid transparent;
    border-radius: 6px;
    color: #0B1416;
    font-size: 15px;
    line-height: 1.3;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-list a:hover { background: #EEF4F9; }

  .chat-list a[aria-current="page"] {
    background: #E3EEF7;
    border-left-color: #0263AC;
    font-weight: 600;
  }

  .new-chat:focus-visible,
  .chat-list a:focus-visible {
    outline: 3px solid #0263AC;
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <nav id="component" aria-label="Chats">
    <button class="new-chat" type="button">New Chat</button>
    <h2 class="section-label" id="recent-label">Recent</h2>
    <ul class="chat-list" aria-labelledby="recent-label">
      <li><a href="#">Trip planning for Maui</a></li>
      <li><a href="#" aria-current="page">Q3 budget review</a></li>
      <li><a href="#">Menu ideas for Saturday</a></li>
      <li><a href="#">Reading list</a></li>
      <li><a href="#">Garden plan</a></li>
    </ul>
  </nav>
</body>
</html>
