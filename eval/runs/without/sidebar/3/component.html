<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    width: 280px;
    height: 560px;
    padding: 20px 16px;
    background: #fff;
    border: 1px solid #0B1416;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .new-chat {
    display: block;
    width: 100%;
    padding: 12px 16px;
    background: #0263AC;
    color: #fff;
    border: 2px solid #0263AC;
    border-radius: 8px;
    font: 600 15px/1.2 "Archivo", "Helvetica Neue", Arial, sans-serif;
    text-align: center;
    cursor: pointer;
  }
  .new-chat:hover { background: #014f8a; border-color: #014f8a; }
  .new-chat:focus-visible, .chat a:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 2px;
  }
  h2 {
    margin: 0 0 8px;
    padding: 0 12px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #0B1416;
  }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .chat a {
    display: block;
    padding: 10px 12px;
    border-left: 4px solid transparent;
    border-radius: 6px;
    color: #0B1416;
    text-decoration: none;
    font-size: 15px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat a:hover { background: #eef4f9; }
  .chat a[aria-current="page"] {
    background: #e3eef7;
    border-left-color: #0263AC;
    font-weight: 600;
  }
</style>
</head>
<body>
  <nav id="component" aria-label="Chats">
    <button type="button" class="new-chat">New Chat</button>
    <section>
      <h2>Recent</h2>
      <ul>
        <li class="chat"><a href="#">Trip planning for Maui</a></li>
        <li class="chat"><a href="#" aria-current="page">Q3 budget review</a></li>
        <li class="chat"><a href="#">Menu ideas for Saturday</a></li>
        <li class="chat"><a href="#">Reading list</a></li>
        <li class="chat"><a href="#">Garden plan</a></li>
      </ul>
    </section>
  </nav>
</body>
</html>
