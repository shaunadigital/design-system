<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #0B1416;
    font-family: "Archivo", Arial, Helvetica, sans-serif;
  }
  #component {
    width: 280px;
    height: 560px;
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    background: #ffffff;
    border: 1px solid #0B1416;
    border-radius: 12px;
  }
  .new-chat {
    display: block;
    width: 100%;
    padding: 12px 16px;
    font: 600 15px/1.2 "Archivo", Arial, Helvetica, sans-serif;
    color: #ffffff;
    background: #0263AC;
    border: 2px solid #0263AC;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
  }
  .new-chat:hover { background: #0B1416; border-color: #0B1416; }
  .new-chat:focus-visible, .chat a:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 2px;
  }
  .label {
    margin: 28px 0 10px;
    padding: 0 12px;
    font-family: "Unbounded", "Archivo", Arial, sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #0B1416;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  .chat + .chat { margin-top: 4px; }
  .chat a {
    display: block;
    padding: 10px 12px;
    border-radius: 8px;
    color: #0B1416;
    font-size: 15px;
    line-height: 1.3;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat a:hover { background: #E8F1F8; }
  .chat a[aria-current="page"] {
    background: #0263AC;
    color: #ffffff;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="component">
    <nav aria-label="Chats" style="display:flex;flex-direction:column;min-height:0">
      <button class="new-chat" type="button">New Chat</button>
      <h2 class="label" id="recent-label">Recent</h2>
      <ul aria-labelledby="recent-label">
        <li class="chat"><a href="#">Trip planning for Maui</a></li>
        <li class="chat"><a href="#" aria-current="page">Q3 budget review</a></li>
        <li class="chat"><a href="#">Menu ideas for Saturday</a></li>
        <li class="chat"><a href="#">Reading list</a></li>
        <li class="chat"><a href="#">Garden plan</a></li>
      </ul>
    </nav>
  </div>
</body>
</html>
