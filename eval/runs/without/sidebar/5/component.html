<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  #component {
    width: 280px;
    height: 560px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 20px 16px;
    background: #fff;
    border: 1px solid #0B1416;
    border-radius: 12px;
  }
  .new-chat {
    width: 100%;
    padding: 12px 16px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: #0263AC;
    border: 2px solid #0263AC;
    border-radius: 8px;
    cursor: pointer;
  }
  .new-chat:hover { background: #0B1416; border-color: #0B1416; }
  .new-chat:focus-visible, .chat a:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 2px;
  }
  h2 {
    margin: 0 0 8px;
    padding: 0 12px;
    font-family: "Unbounded", "Archivo", Arial, sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #0B1416;
  }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .chat a {
    display: block;
    padding: 10px 12px;
    font-size: 15px;
    line-height: 1.3;
    color: #0B1416;
    text-decoration: none;
    border-radius: 8px;
    border-left: 4px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat a:hover { background: #E8F1F8; }
  .chat a[aria-current="page"] {
    background: #E8F1F8;
    border-left-color: #0263AC;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="component">
    <button class="new-chat" type="button">New Chat</button>
    <nav aria-labelledby="recent-label">
      <h2 id="recent-label">Recent</h2>
      <ul>
        <li class="chat"><a href="#">Trip planning for Maui</a></li>
        <li class="chat"><a href="#" aria-current="page">Q3 budget review</a></li>
        <li class="chat"><a href="#">Menu ideas for Saturday</a></li>
        <li class="chat"><a href="#">Reading list</a></li>
        <li class="chat"><a href="#">Garden plan</a></li>
      </ul>
    </nav>
  </div>
</body>
</html>
