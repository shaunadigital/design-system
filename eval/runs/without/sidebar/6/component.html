<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #component {
    width: 280px;
    height: 560px;
    padding: 20px 14px;
    background: #fff;
    border: 1px solid #0B1416;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .new-chat {
    appearance: none;
    width: 100%;
    padding: 12px 16px;
    background: #0263AC;
    color: #fff;
    border: 2px solid #0263AC;
    border-radius: 0;
    font: 600 16px/1.2 "Archivo", "Helvetica Neue", Arial, sans-serif;
    text-align: left;
    cursor: pointer;
  }
  .new-chat:hover { background: #fff; color: #0263AC; }
  .new-chat:focus-visible, .chat:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 2px;
  }
  .label {
    margin: 0 0 10px;
    padding: 0 16px;
    font-family: "Unbounded", "Arial Black", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 2px; }
  .chat {
    display: block;
    padding: 11px 16px 11px 13px;
    border-left: 3px solid transparent;
    color: #0B1416;
    font-size: 15px;
    line-height: 1.3;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat:hover { background: #EEF4F9; }
  .chat[aria-current="page"] {
    background: #E3EEF7;
    border-left-color: #0263AC;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="component">
    <nav aria-label="Chats" style="display:contents">
      <button class="new-chat" type="button">New Chat</button>
      <section aria-labelledby="recent-label">
        <h2 class="label" id="recent-label">Recent</h2>
        <ul>
          <li><a class="chat" href="#">Trip planning for Maui</a></li>
          <li><a class="chat" href="#" aria-current="page">Q3 budget review</a></li>
          <li><a class="chat" href="#">Menu ideas for Saturday</a></li>
          <li><a class="chat" href="#">Reading list</a></li>
          <li><a class="chat" href="#">Garden plan</a></li>
        </ul>
      </section>
    </nav>
  </div>
</body>
</html>
