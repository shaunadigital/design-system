<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }

  #component {
    width: 280px;
    padding: 20px 16px;
    background: #fff;
    border: 1px solid rgba(11, 20, 22, 0.15);
    border-radius: 12px;
  }

  .new-chat {
    display: block;
    width: 100%;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: #0263AC;
    color: #fff;
    font: 600 15px/1.2 "Archivo", "Helvetica Neue", Arial, sans-serif;
    text-align: center;
    cursor: pointer;
  }
  .new-chat:hover { background: #02508a; }
  .new-chat:focus-visible,
  .chat a:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 2px;
  }

  .label {
    margin: 28px 0 8px;
    padding: 0 12px;
    font: 300 12px/1.2 "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #0B1416;
  }

  .chats {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .chats li + li { margin-top: 2px; }

  .chat a {
    display: block;
    padding: 10px 12px;
    border-left: 3px solid transparent;
    border-radius: 6px;
    color: #0B1416;
    font-size: 15px;
    line-height: 1.3;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat a:hover { background: rgba(11, 20, 22, 0.06); }

  .chat a[aria-current="page"] {
    background: rgba(2, 99, 172, 0.1);
    border-left-color: #0263AC;
    color: #0263AC;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="component">
    <nav aria-label="Chats">
      <button class="new-chat" type="button">New Chat</button>
      <h2 class="label">Recent</h2>
      <ul class="chats">
        <li class="chat"><a href="#">Trip planning for Maui</a></li>
        <li class="chat"><a href="#" aria-current="page">Q3 budget review</a></li>
        <li class="chat"><a href="#">Menu ideas for Saturday</a></li>
        <li class="chat"><a href="#">Reading list</a></li>
        <li class="chat"><a href="#">Garden plan</a></li>
      </ul>
    </nav>
  </div>
</body>
</html>
