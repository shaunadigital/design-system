<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoices</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Tokens from tokens.css (day theme), inlined so the file is self-contained */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-small);
}
.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font: 600 var(--text-small) var(--font-body);
  color: var(--ink);
  background: none;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease);
}
.btn--primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn--secondary { border-color: var(--ink); }
.btn--secondary[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-text); border-color: var(--accent-text); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.filters { display: flex; gap: var(--space-2); }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.card > .filters { margin-bottom: var(--space-3); }

table { width: 100%; border-collapse: collapse; font-size: var(--text-small); font-variant-numeric: tabular-nums lining-nums; }
th {
  height: 52px;
  padding: 0 var(--space-3);
  text-align: left;
  font: 500 var(--text-label) var(--font-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
td {
  height: 52px;
  padding: 0 var(--space-3);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
  white-space: nowrap;
}
tbody tr:last-child td { border-bottom: 0; }
.num { text-align: right; }
td.inv { font-weight: 600; }
td.amt { font-weight: 600; }
.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  font-size: var(--text-label);
  font-weight: 600;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>Invoices</h1>
      <button class="btn btn--primary" type="button">New Invoice</button>
    </div>

    <section class="card" aria-label="Invoice list">
      <div class="filters" role="group" aria-label="Filter invoices">
        <button class="btn btn--secondary" type="button" aria-pressed="true">All</button>
        <button class="btn btn--secondary" type="button" aria-pressed="false">Unpaid</button>
        <button class="btn btn--secondary" type="button" aria-pressed="false">Paid</button>
      </div>
      <table>
        <thead>
          <tr>
            <th scope="col">Invoice</th>
            <th scope="col">Customer</th>
            <th scope="col" class="num">Amount</th>
            <th scope="col">Due</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="inv">INV-1042</td><td>Kona Coffee Co.</td><td class="num amt">$4,800.00</td><td>Nov 1</td><td><span class="pill">Unpaid</span></td></tr>
          <tr><td class="inv">INV-1041</td><td>Lanai Labs</td><td class="num amt">$3,250.00</td><td>Oct 28</td><td><span class="pill">Overdue</span></td></tr>
          <tr><td class="inv">INV-1040</td><td>Pali Health</td><td class="num amt">$12,000.00</td><td>Oct 15</td><td><span class="pill">Paid</span></td></tr>
          <tr><td class="inv">INV-1039</td><td>Mauka Freight</td><td class="num amt">$1,820.00</td><td>Oct 10</td><td><span class="pill">Paid</span></td></tr>
          <tr><td class="inv">INV-1038</td><td>Hale Studio</td><td class="num amt">$960.00</td><td>Oct 3</td><td><span class="pill">Paid</span></td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
