<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People</title>
<style>
/* Tokens from tokens.css (day theme) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  text-transform: uppercase;
  line-height: 1.1;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font: inherit;
  font-weight: 600;
  font-size: var(--text-small);
  cursor: pointer;
  text-decoration: none;
  transition: opacity var(--dur-base) var(--ease);
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}
.btn:focus-visible, .field input:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.field { width: 400px; }
.field label {
  display: block;
  margin-bottom: var(--space-2);
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
.field input {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
}
.field input::placeholder { color: var(--muted); }
.field input:focus { outline: 2px solid var(--accent); outline-offset: 0; }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-small);
  text-align: left;
}
th {
  height: 44px;
  padding: 0 var(--space-3);
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
td {
  height: 52px;
  padding: 0 var(--space-3);
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
  vertical-align: middle;
}
.person {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-weight: 600;
}
.avatar {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: var(--text-label);
  font-weight: 600;
}
.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  font-size: var(--text-label);
  font-weight: 600;
}
td a { color: var(--accent-text); text-decoration: none; }
td a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>People</h1>
      <button type="button" class="btn btn--primary">Add Person</button>
    </div>

    <div class="field">
      <label for="search">Search people</label>
      <input id="search" type="search" name="search" placeholder="Search people">
    </div>

    <section class="card" aria-label="Team directory">
      <table>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Job Title</th>
            <th scope="col">Department</th>
            <th scope="col">Email</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="person"><span class="avatar" aria-hidden="true">MC</span>Maya Chen</span></td>
            <td>Product Designer</td>
            <td><span class="pill">Design</span></td>
            <td><a href="mailto:maya@harbor.app">maya@harbor.app</a></td>
          </tr>
          <tr>
            <td><span class="person"><span class="avatar" aria-hidden="true">LP</span>Leo Park</span></td>
            <td>Account Executive</td>
            <td><span class="pill">Sales</span></td>
            <td><a href="mailto:leo@harbor.app">leo@harbor.app</a></td>
          </tr>
          <tr>
            <td><span class="person"><span class="avatar" aria-hidden="true">AR</span>Ana Ruiz</span></td>
            <td>Finance Lead</td>
            <td><span class="pill">Finance</span></td>
            <td><a href="mailto:ana@harbor.app">ana@harbor.app</a></td>
          </tr>
          <tr>
            <td><span class="person"><span class="avatar" aria-hidden="true">SI</span>Sam Ito</span></td>
            <td>Support Engineer</td>
            <td><span class="pill">Support</span></td>
            <td><a href="mailto:sam@harbor.app">sam@harbor.app</a></td>
          </tr>
          <tr>
            <td><span class="person"><span class="avatar" aria-hidden="true">KL</span>Kai Lee</span></td>
            <td>People Partner</td>
            <td><span class="pill">People</span></td>
            <td><a href="mailto:kai@harbor.app">kai@harbor.app</a></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
