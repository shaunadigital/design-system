<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoices</title>
<style>
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: 2.875rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

.band {
  background: var(--sand);
  padding: var(--space-7) 0;
}
.band__inner,
.content {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 var(--space-6);
}
.band__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  color: var(--ink);
  background: none;
  border: 1.5px solid var(--ink);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease);
}
.btn--primary { background: var(--ink); color: var(--on-ink); }
.btn--selected { background: var(--accent-tint); color: var(--accent-text); }

.content { padding-top: var(--space-6); padding-bottom: var(--space-7); }
.filters { display: flex; gap: 8px; margin-bottom: var(--space-5); }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-body);
}
th {
  height: 44px;
  padding: 0 16px;
  text-align: left;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
td {
  height: 60px;
  padding: 0 16px;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
td:first-child { font-weight: 600; }
.num { text-align: right; }
td.num {
  color: var(--accent-text);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
td.due { font-variant-numeric: tabular-nums; }

.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  font-size: var(--text-label);
  font-weight: 600;
  line-height: 1.5;
}
.pill--done { background: var(--accent); color: var(--on-ink); border: 1.5px solid var(--accent); }
.pill--attention { border: 1.5px solid var(--ink); color: var(--ink); }
</style>
</head>
<body>
<div id="component">
  <header class="band">
    <div class="band__inner">
      <h1>Invoices</h1>
      <button class="btn btn--primary" type="button">New Invoice</button>
    </div>
  </header>
  <main class="content">
    <div class="filters" role="group" aria-label="Filter invoices">
      <button class="btn btn--selected" type="button" aria-pressed="true">All</button>
      <button class="btn" type="button" aria-pressed="false">Unpaid</button>
      <button class="btn" type="button" aria-pressed="false">Paid</button>
    </div>
    <table>
      <thead>
        <tr>
          <th scope="col">Invoice</th>
          <th scope="col">Customer</th>
          <th scope="col" class="num">Amount</th>
          <th scope="col">Due</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>INV-1042</td>
          <td>Kona Coffee Co.</td>
          <td class="num">$4,800.00</td>
          <td class="due">Nov 1</td>
          <td><span class="pill pill--attention">Unpaid</span></td>
        </tr>
        <tr>
          <td>INV-1041</td>
          <td>Lanai Labs</td>
          <td class="num">$3,250.00</td>
          <td class="due">Oct 28</td>
          <td><span class="pill pill--attention">Overdue</span></td>
        </tr>
        <tr>
          <td>INV-1040</td>
          <td>Pali Health</td>
          <td class="num">$12,000.00</td>
          <td class="due">Oct 15</td>
          <td><span class="pill pill--done">Paid</span></td>
        </tr>
        <tr>
          <td>INV-1039</td>
          <td>Mauka Freight</td>
          <td class="num">$1,820.00</td>
          <td class="due">Oct 10</td>
          <td><span class="pill pill--done">Paid</span></td>
        </tr>
        <tr>
          <td>INV-1038</td>
          <td>Hale Studio</td>
          <td class="num">$960.00</td>
          <td class="due">Oct 3</td>
          <td><span class="pill pill--done">Paid</span></td>
        </tr>
      </tbody>
    </table>
  </main>
</div>
</body>
</html>
