<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --tracking-snug: -0.01em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--text-body); }

#component { width: 1280px; background: var(--paper); padding-bottom: var(--space-8); }

.band { background: var(--sand); padding: var(--space-7) 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--space-6); }

.top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  text-transform: uppercase;
  letter-spacing: var(--tracking-snug);
  line-height: 1.1;
  color: var(--ink);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 44px; padding: 0 20px;
  border-radius: var(--radius-pill);
  font: 600 var(--text-small)/1 var(--font-body);
  text-decoration: none; cursor: pointer;
  transition: opacity var(--dur-base) var(--ease);
}
.btn--primary { background: var(--ink); color: var(--on-ink); border: 0; }
.btn--primary:hover { opacity: 0.88; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.search { margin-top: var(--space-6); width: 400px; }
.search label {
  display: block; margin-bottom: var(--space-2);
  font: 500 var(--text-label)/1 var(--font-label);
  letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted);
}
.search input {
  width: 100%; height: 44px; padding: 0 12px;
  font: inherit; font-size: var(--text-body); color: var(--ink);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 0; }

.content { margin-top: var(--space-6); }
.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-6);
}

table { width: 100%; border-collapse: collapse; font-size: var(--text-body); }
th {
  text-align: left; height: 44px; padding: 0 var(--space-3) 0 0;
  font: 500 var(--text-label)/1 var(--font-label);
  letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
td { height: 60px; padding: 0 var(--space-3) 0 0; border-bottom: 1px solid rgba(var(--ink-rgb), 0.1); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
th:nth-child(1), td:nth-child(1) { width: 32%; }
th:nth-child(2), td:nth-child(2) { width: 26%; }
th:nth-child(3), td:nth-child(3) { width: 18%; }

.person { display: flex; align-items: center; gap: var(--space-3); font-weight: 600; }
.avatar {
  flex: none; width: 36px; height: 36px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent-tint); color: var(--accent-text);
  font-size: var(--text-small); font-weight: 600;
}
td a { color: var(--accent-text); text-decoration: none; }
td a:hover { text-decoration: underline; }
td a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
</style>
</head>
<body>
<div id="component">
  <header class="band">
    <div class="wrap">
      <div class="top">
        <h1>People</h1>
        <button class="btn btn--primary" type="button">Add Person</button>
      </div>
      <div class="search">
        <label for="search">Search people</label>
        <input id="search" type="search" name="search" placeholder="Search by name, title or department">
      </div>
    </div>
  </header>

  <main class="wrap content">
    <div class="card">
      <table>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Job title</th>
            <th scope="col">Department</th>
            <th scope="col">Email</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="person"><span class="avatar" aria-hidden="true">MC</span>Maya Chen</span></td>
            <td>Product Designer</td>
            <td>Design</td>
            <td><a href="mailto:maya@harbor.app">maya@harbor.app</a></td>
          </tr>
          <tr>
            <td><span class="person"><span class="avatar" aria-hidden="true">LP</span>Leo Park</span></td>
            <td>Account Executive</td>
            <td>Sales</td>
            <td><a href="mailto:leo@harbor.app">leo@harbor.app</a></td>
          </tr>
          <tr>
            <td><span class="person"><span class="avatar" aria-hidden="true">AR</span>Ana Ruiz</span></td>
            <td>Finance Lead</td>
            <td>Finance</td>
            <td><a href="mailto:ana@harbor.app">ana@harbor.app</a></td>
          </tr>
          <tr>
            <td><span class="person"><span class="avatar" aria-hidden="true">SI</span>Sam Ito</span></td>
            <td>Support Engineer</td>
            <td>Support</td>
            <td><a href="mailto:sam@harbor.app">sam@harbor.app</a></td>
          </tr>
          <tr>
            <td><span class="person"><span class="avatar" aria-hidden="true">KL</span>Kai Lee</span></td>
            <td>People Partner</td>
            <td>People</td>
            <td><a href="mailto:kai@harbor.app">kai@harbor.app</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
