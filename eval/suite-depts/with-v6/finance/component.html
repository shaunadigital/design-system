<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Invoices</title>
<style>
/* Tokens used by this screen, copied from tokens.css (day theme) */
:root {
  --paper: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-sm: 8px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --tracking-caps: 0.1em;
  --text-body: 1rem;
  --text-body-l: 1.125rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

.bar { height: 6px; background: var(--accent); }

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
}

.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: var(--space-5);
  border-bottom: 2px solid var(--ink);
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 64px;
  line-height: 1;
  text-transform: uppercase;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font: 600 var(--text-small) var(--font-body);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease);
}
.btn--primary { background: var(--ink); color: var(--on-ink); border: 0; }
.btn--secondary { background: none; color: var(--ink); border: 1.5px solid var(--ink); }
.btn--secondary[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-text); border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.filters {
  display: flex;
  gap: var(--space-3);
  margin-top: var(--space-6);
  margin-bottom: var(--space-6);
}

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
thead th {
  height: 44px;
  padding: 0 var(--space-4);
  background: var(--ink);
  color: var(--on-ink);
  font: 500 var(--text-label) var(--font-body);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  text-align: left;
}
tbody td {
  height: 64px;
  padding: 0 var(--space-4);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.15);
  font-size: var(--text-body);
}
th.num, td.num { text-align: right; }
td.inv { font-size: var(--text-body-l); font-weight: 600; }
td.num {
  color: var(--accent-text);
  font-size: var(--text-body-l);
  font-weight: 600;
}

.tag {
  display: inline-block;
  padding: 4px 12px;
  border: 1.5px solid var(--ink);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font: 500 var(--text-label) var(--font-body);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}
.tag--done { background: var(--accent); border-color: var(--accent); color: var(--on-ink); }
.tag--attention { background: var(--ink); color: var(--on-ink); }
</style>
</head>
<body>
<div id="component">
  <div class="bar"></div>
  <main class="page">
    <div class="title-row">
      <h1>Invoices</h1>
      <button class="btn btn--primary" type="button">New Invoice</button>
    </div>

    <div class="filters" role="group" aria-label="Filter invoices">
      <button class="btn btn--secondary" type="button" aria-pressed="true">All</button>
      <button class="btn btn--secondary" type="button" aria-pressed="false">Unpaid</button>
      <button class="btn btn--secondary" type="button" aria-pressed="false">Paid</button>
    </div>

    <table>
      <thead>
        <tr>
          <th scope="col">Invoice</th>
          <th scope="col">Customer</th>
          <th scope="col" class="num">Amount</th>
          <th scope="col">Due</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="inv">INV-1042</td>
          <td>Kona Coffee Co.</td>
          <td class="num">$4,800.00</td>
          <td>Nov 1</td>
          <td><span class="tag">Unpaid</span></td>
        </tr>
        <tr>
          <td class="inv">INV-1041</td>
          <td>Lanai Labs</td>
          <td class="num">$3,250.00</td>
          <td>Oct 28</td>
          <td><span class="tag tag--attention">Overdue</span></td>
        </tr>
        <tr>
          <td class="inv">INV-1040</td>
          <td>Pali Health</td>
          <td class="num">$12,000.00</td>
          <td>Oct 15</td>
          <td><span class="tag tag--done">Paid</span></td>
        </tr>
        <tr>
          <td class="inv">INV-1039</td>
          <td>Mauka Freight</td>
          <td class="num">$1,820.00</td>
          <td>Oct 10</td>
          <td><span class="tag tag--done">Paid</span></td>
        </tr>
        <tr>
          <td class="inv">INV-1038</td>
          <td>Hale Studio</td>
          <td class="num">$960.00</td>
          <td>Oct 3</td>
          <td><span class="tag tag--done">Paid</span></td>
        </tr>
      </tbody>
    </table>
  </main>
</div>
</body>
</html>
