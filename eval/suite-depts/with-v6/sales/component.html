<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Pipeline</title>
<style>
  /* Tokens from tokens.css (day theme), inlined so the file is self-contained. */
  :root {
    --paper: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent: #0263AC;
    --on-ink: #FFFFFF;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --radius-sm: 8px;
    --radius-pill: 999px;
    --tracking-tight: -0.02em;
    --tracking-label: 0.14em;
    --text-page: 4rem;
    --text-body-l: 1.125rem;
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-base: 180ms;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--text-body); }

  #component { width: 1280px; min-height: 100vh; background: var(--paper); }

  .bar { height: 6px; background: var(--accent); }

  .page { max-width: 1120px; margin: 0 auto; padding: var(--space-7) var(--space-6) var(--space-9, 96px); }

  .top { display: flex; align-items: center; justify-content: space-between; padding-bottom: var(--space-5); border-bottom: 2px solid var(--ink); }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 300; font-size: var(--text-page); line-height: 1; text-transform: uppercase; letter-spacing: var(--tracking-tight); }

  .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: var(--radius-pill); font: 600 var(--text-small) var(--font-body); cursor: pointer; transition: opacity var(--dur-base) var(--ease); }
  .btn--primary { background: var(--ink); color: var(--on-ink); border: 0; }
  .btn--primary:hover { opacity: 0.88; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .filters { display: flex; align-items: center; gap: var(--space-4); margin-top: var(--space-6); }
  .filters label { font: 500 var(--text-label) var(--font-label); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted); }
  .filters input { width: 320px; height: 44px; padding: 0 12px; border: 1.5px solid var(--ink); border-radius: var(--radius-sm); background: var(--paper); color: var(--ink); font: inherit; font-size: var(--text-body); }
  .filters input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

  table { width: 100%; margin-top: var(--space-5); border-collapse: collapse; font-size: var(--text-body); }
  thead th { height: 44px; padding: 0 var(--space-4); background: var(--ink); color: var(--on-ink); text-align: left; font: 500 var(--text-label) var(--font-label); letter-spacing: var(--tracking-label); text-transform: uppercase; }
  thead th.num, tbody td.num { text-align: right; }
  tbody td { height: 64px; padding: 0 var(--space-4); border-bottom: 1px solid rgba(var(--ink-rgb), 0.15); }
  tbody td.company { font-size: var(--text-body-l); font-weight: 600; }
  tbody td.num { color: var(--accent-text); font-size: var(--text-body-l); font-weight: 600; font-variant-numeric: tabular-nums; }

  .tag { display: inline-block; padding: 4px 12px; border: 1.5px solid var(--ink); border-radius: var(--radius-sm); color: var(--ink); font: 500 var(--text-label) var(--font-label); letter-spacing: var(--tracking-label); text-transform: uppercase; }
  .tag--won { background: var(--accent); border-color: var(--accent); color: var(--on-ink); }
</style>
</head>
<body>
<div id="component">
  <div class="bar"></div>
  <main class="page">
    <div class="top">
      <h1>Pipeline</h1>
      <button class="btn btn--primary" type="button">New Deal</button>
    </div>

    <div class="filters">
      <label for="search-deals">Search deals</label>
      <input id="search-deals" type="search" name="search-deals">
    </div>

    <table>
      <thead>
        <tr>
          <th scope="col">Company</th>
          <th scope="col" class="num">Value</th>
          <th scope="col">Stage</th>
          <th scope="col">Owner</th>
          <th scope="col">Close Date</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="company">Kona Coffee Co.</td>
          <td class="num">$48,000</td>
          <td><span class="tag">Proposal</span></td>
          <td>Maya Chen</td>
          <td>Nov 14</td>
        </tr>
        <tr>
          <td class="company">Lanai Labs</td>
          <td class="num">$32,500</td>
          <td><span class="tag">Negotiation</span></td>
          <td>Leo Park</td>
          <td>Nov 2</td>
        </tr>
        <tr>
          <td class="company">Pali Health</td>
          <td class="num">$120,000</td>
          <td><span class="tag">Discovery</span></td>
          <td>Ana Ruiz</td>
          <td>Dec 5</td>
        </tr>
        <tr>
          <td class="company">Mauka Freight</td>
          <td class="num">$18,200</td>
          <td><span class="tag tag--won">Won</span></td>
          <td>Sam Ito</td>
          <td>Oct 18</td>
        </tr>
        <tr>
          <td class="company">Hale Studio</td>
          <td class="num">$9,600</td>
          <td><span class="tag">Proposal</span></td>
          <td>Kai Lee</td>
          <td>Nov 21</td>
        </tr>
      </tbody>
    </table>
  </main>
</div>
</body>
</html>
