<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component {
    width: 1280px;
    min-height: 720px;
    padding: 64px 64px 96px;
    background: #FFFFFF;
  }
  h1 {
    font-family: "Unbounded", "Archivo", sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .count {
    margin-top: 16px;
    font-size: 22px;
    line-height: 1.4;
    color: #55656A;
  }
  .queue {
    list-style: none;
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .item {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    column-gap: 48px;
    padding: 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }
  .item h2 {
    font-family: "Unbounded", "Archivo", sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .requester {
    margin-top: 8px;
    font-size: 16px;
    color: #55656A;
  }
  .amount {
    font-size: 28px;
    font-weight: 500;
    line-height: 1.2;
    color: #0B1416;
    min-width: 128px;
    text-align: right;
  }
  .actions { display: flex; gap: 12px; }
  .btn {
    min-height: 44px;
    padding: 8px 24px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .btn-primary { background: #0B1416; color: #FFFFFF; }
  .btn-primary:hover { background: #0263AC; }
  .btn-quiet { background: transparent; color: #0B1416; }
  .btn-quiet:hover { background: #E6EFF7; }
  .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main id="component">
  <h1>Approvals</h1>
  <p class="count">3 waiting for you</p>
  <ul class="queue">
    <li class="item">
      <div>
        <h2>Q4 travel budget</h2>
        <p class="requester">Leo Park</p>
      </div>
      <p class="amount">$4,800</p>
      <div class="actions">
        <button class="btn btn-primary" type="button">Approve</button>
        <button class="btn btn-quiet" type="button">Decline</button>
      </div>
    </li>
    <li class="item">
      <div>
        <h2>Design conference tickets</h2>
        <p class="requester">Maya Chen</p>
      </div>
      <p class="amount">$1,250</p>
      <div class="actions">
        <button class="btn btn-primary" type="button">Approve</button>
        <button class="btn btn-quiet" type="button">Decline</button>
      </div>
    </li>
    <li class="item">
      <div>
        <h2>Standing desks for support</h2>
        <p class="requester">Ana Ruiz</p>
      </div>
      <p class="amount">$2,100</p>
      <div class="actions">
        <button class="btn btn-primary" type="button">Approve</button>
        <button class="btn btn-quiet" type="button">Decline</button>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
