<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approvals</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; }
  #component {
    width: 1280px;
    min-height: 720px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component header {
    padding-bottom: 32px;
    margin-bottom: 32px;
    border-bottom: 1px solid #9CC3EA;
  }
  #component h1 {
    margin: 0 0 16px;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  #component .count {
    margin: 0;
    font-size: 18px;
    color: #55656A;
  }
  #component ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #component .item {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    column-gap: 48px;
    padding: 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }
  #component h2 {
    margin: 0 0 4px;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: -0.01em;
  }
  #component .requester {
    margin: 0;
    font-size: 16px;
    color: #55656A;
  }
  #component .amount {
    margin: 0;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  #component .actions {
    display: flex;
    gap: 12px;
  }
  #component button {
    min-height: 44px;
    min-width: 44px;
    padding: 8px 24px;
    border-radius: 999px;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .approve {
    background: #0B1416;
    color: #FFFFFF;
    border: 1px solid #0B1416;
  }
  #component .approve:hover { background: #0263AC; border-color: #0263AC; }
  #component .decline {
    background: transparent;
    color: #0B1416;
    border: 1px solid #9CC3EA;
  }
  #component .decline:hover { background: #E6EFF7; }
  #component button:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    #component button { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <header>
    <h1>Approvals</h1>
    <p class="count">3 waiting for you</p>
  </header>
  <ul>
    <li class="item">
      <div>
        <h2>Q4 travel budget</h2>
        <p class="requester">Leo Park</p>
      </div>
      <p class="amount">$4,800</p>
      <div class="actions">
        <button type="button" class="approve">Approve</button>
        <button type="button" class="decline">Decline</button>
      </div>
    </li>
    <li class="item">
      <div>
        <h2>Design conference tickets</h2>
        <p class="requester">Maya Chen</p>
      </div>
      <p class="amount">$1,250</p>
      <div class="actions">
        <button type="button" class="approve">Approve</button>
        <button type="button" class="decline">Decline</button>
      </div>
    </li>
    <li class="item">
      <div>
        <h2>Standing desks for support</h2>
        <p class="requester">Ana Ruiz</p>
      </div>
      <p class="amount">$2,100</p>
      <div class="actions">
        <button type="button" class="approve">Approve</button>
        <button type="button" class="decline">Decline</button>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
