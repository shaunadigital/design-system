<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Billing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; }
  #component {
    width: 1280px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component h1 {
    margin: 0 0 48px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  #component h2 {
    margin: 0;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  #component .card {
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 32px;
  }
  #component .plan {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    margin-bottom: 48px;
  }
  #component .price {
    margin: 8px 0 0;
    font-size: 22px;
    line-height: 1.3;
  }
  #component .seats { margin: 24px 0 0; width: 480px; }
  #component .seats p { margin: 0 0 8px; color: #55656A; font-size: 16px; }
  #component .bar {
    height: 8px;
    border-radius: 999px;
    background: #E6EFF7;
    overflow: hidden;
  }
  #component .bar span {
    display: block;
    width: 72%;
    height: 100%;
    background: #0263AC;
    border-radius: 999px;
  }
  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 32px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:hover { background: #0263AC; }
  #component .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 4px; }
  #component .invoices h2 { margin-bottom: 24px; }
  #component table { width: 100%; border-collapse: collapse; }
  #component th {
    padding: 12px 16px;
    text-align: left;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #55656A;
    background: #EEF4FA;
  }
  #component th:first-child { border-radius: 8px 0 0 8px; }
  #component th:last-child { border-radius: 0 8px 8px 0; }
  #component td {
    padding: 16px;
    border-bottom: 1px solid #E6EFF7;
    font-size: 16px;
  }
  #component tbody tr:last-child td { border-bottom: 0; }
  #component .num { font-variant-numeric: tabular-nums; }
  #component .status { color: #0263AC; font-weight: 500; }
</style>
</head>
<body>
<div id="component">
  <h1>Billing</h1>

  <section class="card plan" aria-labelledby="plan-name">
    <div>
      <h2 id="plan-name">Team plan</h2>
      <p class="price">$24 per seat per month</p>
      <div class="seats">
        <p>18 of 25 seats used</p>
        <div class="bar" role="img" aria-label="18 of 25 seats used"><span></span></div>
      </div>
    </div>
    <button type="button" class="btn">Change Plan</button>
  </section>

  <section class="card invoices" aria-labelledby="invoices-title">
    <h2 id="invoices-title">Invoices</h2>
    <table>
      <thead>
        <tr><th scope="col">Date</th><th scope="col">Amount</th><th scope="col">Status</th></tr>
      </thead>
      <tbody>
        <tr><td>Oct 1, 2026</td><td class="num">$432.00</td><td class="status">Paid</td></tr>
        <tr><td>Sep 1, 2026</td><td class="num">$432.00</td><td class="status">Paid</td></tr>
        <tr><td>Aug 1, 2026</td><td class="num">$408.00</td><td class="status">Paid</td></tr>
        <tr><td>Jul 1, 2026</td><td class="num">$408.00</td><td class="status">Paid</td></tr>
      </tbody>
    </table>
  </section>
</div>
</body>
</html>
