<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requests | Harbor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 800px;
    padding: 64px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  #component .empty {
    margin: 64px auto 0;
    max-width: 640px;
    padding: 64px 48px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  #component .icon {
    width: 64px;
    height: 64px;
    border-radius: 999px;
    background: #E6EFF7;
    color: #0263AC;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  #component .icon svg { width: 24px; height: 24px; }

  #component h2 {
    margin: 0 0 12px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  #component p {
    margin: 0 0 32px;
    max-width: 400px;
    font-size: 18px;
    line-height: 1.5;
    color: #55656A;
  }

  #component .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 12px 32px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:hover { background: #0263AC; }

  #component .link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: #0263AC;
    font-size: 16px;
    text-decoration: underline;
    text-underline-offset: 4px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
    border-radius: 8px;
    padding: 0 8px;
  }
  #component .link:hover { background: #E6EFF7; }

  #component .btn:focus-visible,
  #component .link:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .btn, #component .link { transition: none; }
  }
</style>
</head>
<body>
<main id="component">
  <h1>Requests</h1>

  <section class="empty" aria-labelledby="empty-title">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 13l2.5-7h11L20 13v6H4z"/>
        <path d="M4 13h5l1 2h4l1-2h5"/>
      </svg>
    </div>
    <h2 id="empty-title">No requests yet</h2>
    <p>When your team asks for something, it shows up here.</p>
    <div class="actions">
      <button type="button" class="btn">Create a Request</button>
      <a class="link" href="#import">Import from a spreadsheet</a>
    </div>
  </section>
</main>
</body>
</html>
