<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requests | Harbor</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 64px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  #component .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin-top: 64px;
    padding: 96px 32px;
    background: #EEF4FA;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }

  #component .icon {
    width: 48px;
    height: 48px;
    margin-bottom: 24px;
    color: #0263AC;
  }

  #component h2 {
    margin: 0 0 12px;
    font-family: "Unbounded", "Archivo", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  #component .empty p {
    margin: 0 0 32px;
    max-width: 480px;
    font-size: 18px;
    line-height: 1.5;
    color: #55656A;
  }

  #component .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 32px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: "Archivo", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:hover { background: #55656A; }
  #component .btn:focus-visible,
  #component .link:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }

  #component .link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 999px;
    color: #0263AC;
    font-size: 16px;
    text-decoration: underline;
    text-underline-offset: 4px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .link:hover { background: #E6EFF7; }

  @media (prefers-reduced-motion: reduce) {
    #component .btn, #component .link { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <h1>Requests</h1>
  <section class="empty">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 13l2.5-7.5A2 2 0 0 1 8.4 4h7.2a2 2 0 0 1 1.9 1.5L20 13"/>
      <path d="M4 13v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5h-5l-1 2h-4l-1-2H4z"/>
    </svg>
    <h2>No requests yet</h2>
    <p>When your team asks for something, it shows up here.</p>
    <div class="actions">
      <a class="btn" href="#">Create a Request</a>
      <a class="link" href="#">Import from a spreadsheet</a>
    </div>
  </section>
</div>
</body>
</html>
