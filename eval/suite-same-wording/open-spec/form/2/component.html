<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New request</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; }
  #component {
    width: 1280px;
    min-height: 900px;
    margin: 0 auto;
    padding: 64px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component h1 {
    margin: 0 0 48px;
    font-family: "Unbounded", "Arial Black", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
  }
  #component .card {
    width: 720px;
    margin-left: 192px;
    padding: 48px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }
  #component .field { margin-bottom: 24px; }
  #component .row { display: flex; gap: 32px; }
  #component .row .field { flex: 1; }
  #component label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #0263AC;
  }
  #component input,
  #component select,
  #component textarea {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 12px 16px;
    font-family: "Archivo", Arial, sans-serif;
    font-size: 16px;
    line-height: 24px;
    color: #0B1416;
    background: #FFFFFF;
    border: 1px solid #55656A;
    border-radius: 12px;
    transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1), background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component textarea { min-height: 144px; resize: vertical; }
  #component input:hover,
  #component select:hover,
  #component textarea:hover { background: #E6EFF7; }
  #component input:focus-visible,
  #component select:focus-visible,
  #component textarea:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
    border-color: #0263AC;
  }
  #component .actions {
    display: flex;
    justify-content: flex-end;
    gap: 16px;
    margin-top: 48px;
  }
  #component .btn {
    min-height: 48px;
    padding: 12px 32px;
    font-family: "Archivo", Arial, sans-serif;
    font-size: 16px;
    line-height: 24px;
    font-weight: 500;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn-quiet { background: transparent; color: #0B1416; }
  #component .btn-quiet:hover { background: #E6EFF7; }
  #component .btn-primary { background: #0B1416; color: #FFFFFF; }
  #component .btn-primary:hover { background: #0263AC; }
  #component .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    #component * { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <h1>New request</h1>
  <form class="card" action="#">
    <div class="field">
      <label for="title">Title</label>
      <input id="title" name="title" type="text">
    </div>
    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description"></textarea>
    </div>
    <div class="row">
      <div class="field">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
      </div>
      <div class="field">
        <label for="assignee">Assignee</label>
        <select id="assignee" name="assignee">
          <option>Maya Chen</option>
          <option>Leo Park</option>
          <option>Ana Ruiz</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="due">Due date</label>
      <input id="due" name="due" type="date">
    </div>
    <div class="actions">
      <button class="btn btn-quiet" type="button">Cancel</button>
      <button class="btn btn-primary" type="submit">Create Request</button>
    </div>
  </form>
</div>
</body>
</html>
