<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor: Connect your tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 96px 64px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
  }

  #component .content {
    grid-column: 1 / 9;
    display: flex;
    flex-direction: column;
  }

  #component .label {
    font-weight: 500;
    font-size: 12px;
    line-height: 1.5;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #0263AC;
  }

  #component .bar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    list-style: none;
  }
  #component .bar li {
    width: 48px;
    height: 4px;
    border-radius: 999px;
    background: #9CC3EA;
  }
  #component .bar li.done { background: #0263AC; }

  #component h1 {
    margin-top: 32px;
    font-family: "Unbounded", "Archivo", sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.15;
    text-transform: uppercase;
    letter-spacing: -0.02em;
  }

  #component .lead {
    margin-top: 16px;
    font-size: 22px;
    line-height: 1.5;
    color: #55656A;
  }

  #component .options {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    list-style: none;
  }

  #component .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 24px 32px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }
  #component .card h2 {
    font-family: "Unbounded", "Archivo", sans-serif;
    font-weight: 500;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: 0;
  }
  #component .card p {
    margin-top: 4px;
    font-size: 16px;
    color: #55656A;
  }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 8px 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: #0B1416;
    font-family: inherit;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.5;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1),
                border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:hover { background: #E6EFF7; }
  #component .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }
  #component .btn.connect { border-color: #0B1416; flex-shrink: 0; }
  #component .btn.primary { background: #0B1416; color: #FFFFFF; }
  #component .btn.primary:hover { background: #0263AC; }

  #component .actions {
    margin-top: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  @media (prefers-reduced-motion: reduce) {
    #component .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="grid">
    <div class="content">
      <p class="label">Step 2 of 4</p>
      <ol class="bar" aria-hidden="true">
        <li class="done"></li>
        <li class="done"></li>
        <li></li>
        <li></li>
      </ol>

      <h1>Connect your tools</h1>
      <p class="lead">Harbor works best with the tools your team already uses.</p>

      <ul class="options">
        <li class="card">
          <div>
            <h2>Slack</h2>
            <p>Get request updates in your channels</p>
          </div>
          <button class="btn connect" type="button" aria-label="Connect Slack">Connect</button>
        </li>
        <li class="card">
          <div>
            <h2>Google Calendar</h2>
            <p>See due dates on your calendar</p>
          </div>
          <button class="btn connect" type="button" aria-label="Connect Google Calendar">Connect</button>
        </li>
        <li class="card">
          <div>
            <h2>Jira</h2>
            <p>Link requests to engineering tickets</p>
          </div>
          <button class="btn connect" type="button" aria-label="Connect Jira">Connect</button>
        </li>
      </ul>

      <div class="actions">
        <button class="btn" type="button">Skip for Now</button>
        <button class="btn primary" type="button">Continue</button>
      </div>
    </div>
  </main>
</div>
</body>
</html>
