<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace settings</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #FFFFFF; color: #0B1416; font-family: "Archivo", Arial, sans-serif; font-size: 16px; line-height: 1.5; }
  #component { width: 1280px; padding: 64px; background: #FFFFFF; }
  .page { width: 760px; }
  h1 { font-family: "Unbounded", Arial, sans-serif; font-weight: 300; font-size: 56px; line-height: 1.1; letter-spacing: -0.02em; text-transform: uppercase; margin-bottom: 48px; }
  .card { background: #FFFFFF; border: 1px solid #9CC3EA; border-radius: 16px; padding: 32px; margin-bottom: 32px; }
  h2 { font-family: "Unbounded", Arial, sans-serif; font-weight: 500; font-size: 28px; line-height: 1.2; letter-spacing: -0.01em; margin-bottom: 24px; }
  .field { margin-bottom: 24px; }
  label.lbl { display: block; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: #0263AC; margin-bottom: 8px; }
  input[type="text"] { width: 100%; height: 48px; padding: 0 16px; font-family: inherit; font-size: 16px; color: #0B1416; background: #FFFFFF; border: 1px solid #55656A; border-radius: 12px; transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1), background 120ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  input[type="text"]:hover { background: #E6EFF7; }
  input[type="text"]:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 24px; font-family: inherit; font-size: 16px; font-weight: 500; border-radius: 999px; cursor: pointer; transition: background 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .btn:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }
  .primary { background: #0B1416; color: #FFFFFF; border: 1px solid #0B1416; }
  .primary:hover { background: #0263AC; border-color: #0263AC; }
  .quiet { background: transparent; color: #0B1416; border: 1px solid #0B1416; }
  .quiet:hover { background: #E6EFF7; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 32px; min-height: 64px; border-top: 1px solid #E6EFF7; cursor: pointer; }
  .switch:first-of-type { border-top: 0; }
  .switch .text { font-size: 16px; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track { position: relative; flex: none; width: 48px; height: 28px; border-radius: 999px; background: #FFFFFF; border: 2px solid #55656A; transition: background 180ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #55656A; transition: transform 180ms cubic-bezier(0.2, 0.7, 0.2, 1), background 180ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .switch input:checked + .track { background: #0B1416; border-color: #0B1416; }
  .switch input:checked + .track::after { transform: translateX(20px); background: #FFFFFF; }
  .switch input:focus-visible + .track { outline: 2px solid #0263AC; outline-offset: 2px; }
  .danger { background: #EEF4FA; border-color: #0B1416; }
  .danger p { color: #55656A; font-size: 16px; margin-bottom: 24px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1>Workspace settings</h1>

    <section class="card" aria-labelledby="general">
      <h2 id="general">General</h2>
      <div class="field">
        <label class="lbl" for="name">Workspace name</label>
        <input type="text" id="name" value="Harbor Ops">
      </div>
      <div class="field">
        <label class="lbl" for="url">Workspace URL</label>
        <input type="text" id="url" value="harbor.app/ops">
      </div>
      <button type="button" class="btn primary">Save Changes</button>
    </section>

    <section class="card" aria-labelledby="notifications">
      <h2 id="notifications">Notifications</h2>
      <label class="switch">
        <span class="text">Email me when a request is assigned to me</span>
        <input type="checkbox" role="switch" checked>
        <span class="track" aria-hidden="true"></span>
      </label>
      <label class="switch">
        <span class="text">Weekly summary</span>
        <input type="checkbox" role="switch">
        <span class="track" aria-hidden="true"></span>
      </label>
      <label class="switch">
        <span class="text">Product updates</span>
        <input type="checkbox" role="switch">
        <span class="track" aria-hidden="true"></span>
      </label>
    </section>

    <section class="card danger" aria-labelledby="danger">
      <h2 id="danger">Danger zone</h2>
      <p>Deleting a workspace removes all of its requests for everyone.</p>
      <button type="button" class="btn quiet">Delete Workspace</button>
    </section>
  </main>
</div>
</body>
</html>
