<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Harbor</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #FFFFFF; color: #0B1416; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 16px; }

  #component {
    width: 1280px;
    min-height: 800px;
    padding: 96px 64px;
    background: #EEF4FA;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 32px;
    align-items: center;
  }

  .card {
    grid-column: 5 / span 4;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 48px 32px;
  }

  h1 {
    font-family: Unbounded, "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.25;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    color: #0B1416;
    margin-bottom: 32px;
  }

  .field { display: block; margin-bottom: 24px; }
  .field label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #0263AC;
  }
  .field input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font: 400 16px Archivo, "Helvetica Neue", Arial, sans-serif;
    color: #0B1416;
    background: #FFFFFF;
    border: 1px solid #55656A;
    border-radius: 12px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .field input:hover { background: #E6EFF7; }
  .field input:focus { outline: 2px solid #0263AC; outline-offset: 2px; border-color: #0263AC; background: #FFFFFF; }

  .keep {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    margin-bottom: 24px;
    font-size: 16px;
    color: #0B1416;
    cursor: pointer;
  }
  .keep input { width: 24px; height: 24px; accent-color: #0263AC; margin: 0; cursor: pointer; }
  .keep input:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 0 24px;
    border-radius: 999px;
    font: 500 16px Archivo, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .btn:focus-visible, .link:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }
  .btn-primary { background: #0B1416; color: #FFFFFF; border: 1px solid #0B1416; margin-bottom: 12px; }
  .btn-primary:hover { background: #0263AC; border-color: #0263AC; }
  .btn-quiet { background: transparent; color: #0B1416; border: 1px solid #9CC3EA; }
  .btn-quiet:hover { background: #E6EFF7; }

  .foot { margin-top: 24px; text-align: center; }
  .link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 8px;
    font-size: 16px;
    color: #0263AC;
    text-decoration: underline;
    text-underline-offset: 4px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
    border-radius: 8px;
  }
  .link:hover { background: #E6EFF7; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <h1>Sign in to Harbor</h1>
    <form action="#">
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" type="email" name="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password">
      </div>
      <label class="keep"><input type="checkbox" name="keep"> Keep me signed in</label>
      <button class="btn btn-primary" type="submit">Sign In</button>
      <button class="btn btn-quiet" type="button">Continue with SSO</button>
      <p class="foot"><a class="link" href="#">Forgot Password?</a></p>
    </form>
  </main>
</div>
</body>
</html>
