<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team | Harbor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    min-height: 720px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  #component .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 32px;
    padding-bottom: 32px;
    border-bottom: 1px solid #9CC3EA;
  }
  #component .label {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #0263AC;
  }
  #component h1 {
    margin: 0;
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  #component .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 24px;
    border: 1px solid #0B1416;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn:hover { background: #0263AC; border-color: #0263AC; }
  #component .btn:focus-visible,
  #component select:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }

  #component .list {
    list-style: none;
    margin: 32px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #component .member {
    display: grid;
    grid-template-columns: 48px 1fr 200px;
    align-items: center;
    column-gap: 24px;
    padding: 24px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }
  #component .avatar {
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: #E6EFF7;
    color: #0263AC;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  #component .name { margin: 0; font-size: 18px; font-weight: 500; line-height: 1.3; }
  #component .email { margin: 4px 0 0; font-size: 14px; color: #55656A; }

  #component .role { display: flex; flex-direction: column; gap: 4px; }
  #component .role label {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #55656A;
  }
  #component select {
    width: 100%;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid #9CC3EA;
    border-radius: 12px;
    background: #EEF4FA;
    color: #0B1416;
    font-family: inherit;
    font-size: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    #component * { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <header class="header">
    <div>
      <p class="label">Harbor workspace</p>
      <h1>Team</h1>
    </div>
    <button type="button" class="btn">Invite Member</button>
  </header>

  <ul class="list">
    <li class="member">
      <div class="avatar" aria-hidden="true">MC</div>
      <div>
        <p class="name">Maya Chen</p>
        <p class="email">maya@harbor.app</p>
      </div>
      <div class="role">
        <label for="role-maya">Role</label>
        <select id="role-maya">
          <option selected>Admin</option>
          <option>Editor</option>
          <option>Viewer</option>
        </select>
      </div>
    </li>
    <li class="member">
      <div class="avatar" aria-hidden="true">LP</div>
      <div>
        <p class="name">Leo Park</p>
        <p class="email">leo@harbor.app</p>
      </div>
      <div class="role">
        <label for="role-leo">Role</label>
        <select id="role-leo">
          <option>Admin</option>
          <option selected>Editor</option>
          <option>Viewer</option>
        </select>
      </div>
    </li>
    <li class="member">
      <div class="avatar" aria-hidden="true">AR</div>
      <div>
        <p class="name">Ana Ruiz</p>
        <p class="email">ana@harbor.app</p>
      </div>
      <div class="role">
        <label for="role-ana">Role</label>
        <select id="role-ana">
          <option>Admin</option>
          <option selected>Editor</option>
          <option>Viewer</option>
        </select>
      </div>
    </li>
    <li class="member">
      <div class="avatar" aria-hidden="true">SI</div>
      <div>
        <p class="name">Sam Ito</p>
        <p class="email">sam@harbor.app</p>
      </div>
      <div class="role">
        <label for="role-sam">Role</label>
        <select id="role-sam">
          <option>Admin</option>
          <option>Editor</option>
          <option selected>Viewer</option>
        </select>
      </div>
    </li>
    <li class="member">
      <div class="avatar" aria-hidden="true">KL</div>
      <div>
        <p class="name">Kai Lee</p>
        <p class="email">kai@harbor.app</p>
      </div>
      <div class="role">
        <label for="role-kai">Role</label>
        <select id="role-kai">
          <option>Admin</option>
          <option>Editor</option>
          <option selected>Viewer</option>
        </select>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
