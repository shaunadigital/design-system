<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team | Harbor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; }

  #component {
    width: 1280px;
    margin: 0 auto;
    padding: 64px 64px 96px;
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 32px;
    margin-bottom: 48px;
  }
  .label {
    margin: 0 0 12px;
    color: #0263AC;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }
  h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 24px;
    border: 1px solid #0B1416;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font: 500 16px/1 "Archivo", system-ui, sans-serif;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .btn:hover { background: #0263AC; border-color: #0263AC; }
  .btn:focus-visible, select:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }

  .card {
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
    padding: 0 32px;
  }
  .list { list-style: none; margin: 0; padding: 0; }
  .member {
    display: grid;
    grid-template-columns: 48px 1fr 200px;
    align-items: center;
    column-gap: 24px;
    padding: 24px 0;
    border-top: 1px solid #E6EFF7;
  }
  .member:first-child { border-top: 0; }

  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: #EEF4FA;
    color: #0263AC;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.04em;
  }
  .name { margin: 0; font-weight: 500; font-size: 18px; line-height: 1.3; }
  .email { margin: 4px 0 0; color: #55656A; font-size: 14px; line-height: 1.4; }

  .role { display: flex; flex-direction: column; gap: 4px; }
  .role label {
    color: #55656A;
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }
  select {
    width: 100%;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid #9CC3EA;
    border-radius: 12px;
    background: #FFFFFF;
    color: #0B1416;
    font: 400 16px/1.5 "Archivo", system-ui, sans-serif;
    cursor: pointer;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  select:hover { background: #E6EFF7; }
</style>
</head>
<body>
<div id="component">
  <header class="head">
    <div>
      <p class="label">Harbor Workspace</p>
      <h1>Team</h1>
    </div>
    <button class="btn" type="button">Invite Member</button>
  </header>

  <section class="card" aria-label="Team members">
    <ul class="list">
      <li class="member">
        <div class="avatar" aria-hidden="true">MC</div>
        <div>
          <p class="name">Maya Chen</p>
          <p class="email">maya@harbor.app</p>
        </div>
        <div class="role">
          <label for="role-maya">Role</label>
          <select id="role-maya">
            <option selected>Admin</option>
            <option>Editor</option>
            <option>Viewer</option>
          </select>
        </div>
      </li>
      <li class="member">
        <div class="avatar" aria-hidden="true">LP</div>
        <div>
          <p class="name">Leo Park</p>
          <p class="email">leo@harbor.app</p>
        </div>
        <div class="role">
          <label for="role-leo">Role</label>
          <select id="role-leo">
            <option>Admin</option>
            <option selected>Editor</option>
            <option>Viewer</option>
          </select>
        </div>
      </li>
      <li class="member">
        <div class="avatar" aria-hidden="true">AR</div>
        <div>
          <p class="name">Ana Ruiz</p>
          <p class="email">ana@harbor.app</p>
        </div>
        <div class="role">
          <label for="role-ana">Role</label>
          <select id="role-ana">
            <option>Admin</option>
            <option selected>Editor</option>
            <option>Viewer</option>
          </select>
        </div>
      </li>
      <li class="member">
        <div class="avatar" aria-hidden="true">SI</div>
        <div>
          <p class="name">Sam Ito</p>
          <p class="email">sam@harbor.app</p>
        </div>
        <div class="role">
          <label for="role-sam">Role</label>
          <select id="role-sam">
            <option>Admin</option>
            <option>Editor</option>
            <option selected>Viewer</option>
          </select>
        </div>
      </li>
      <li class="member">
        <div class="avatar" aria-hidden="true">KL</div>
        <div>
          <p class="name">Kai Lee</p>
          <p class="email">kai@harbor.app</p>
        </div>
        <div class="role">
          <label for="role-kai">Role</label>
          <select id="role-kai">
            <option>Admin</option>
            <option>Editor</option>
            <option selected>Viewer</option>
          </select>
        </div>
      </li>
    </ul>
  </section>
</div>
</body>
</html>
