<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Approvals</title>
<style>
/* Tokens used here, copied from tokens.css (generated from tokens/tokens.json) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-display-xl: clamp(2rem, 4vw, 3.5rem);
  --text-hero: clamp(1.5rem, 3.34vw, 3rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
  --dur-fast: 120ms;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 720px;
  padding: var(--space-8) var(--space-8) var(--space-9, 96px);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

.head { margin-bottom: var(--space-7); }
.head h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-display-xl);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}
.head p {
  margin: var(--space-3) 0 0;
  font-size: var(--text-body-l);
  color: var(--muted);
}

.queue {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.item {
  display: grid;
  grid-template-columns: 1fr 200px auto;
  align-items: center;
  column-gap: var(--space-6);
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}
.item h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.25;
  text-transform: uppercase;
}
.item .who {
  margin: var(--space-2) 0 0;
  color: var(--muted);
  font-size: var(--text-body);
}
.amount {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-hero);
  line-height: 1;
  text-align: right;
  white-space: nowrap;
}
.actions { display: flex; gap: var(--space-3); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease), background var(--dur-base) var(--ease);
}
.btn--fill { background: var(--ink); color: var(--on-ink); }
.btn--fill:hover { opacity: 0.85; }
.btn--plain { background: none; color: var(--ink); }
.btn--plain:hover { background: rgba(var(--ink-rgb), 0.06); }
.btn:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
</style>
</head>
<body>
<div id="component">
  <header class="head">
    <h1>Approvals</h1>
    <p>3 waiting for you</p>
  </header>

  <ul class="queue">
    <li class="item">
      <div>
        <h2 data-user-content>Q4 travel budget</h2>
        <p class="who">Leo Park</p>
      </div>
      <div class="amount">$4,800</div>
      <div class="actions">
        <button class="btn btn--plain" type="button">Decline</button>
        <button class="btn btn--fill" type="button">Approve</button>
      </div>
    </li>
    <li class="item">
      <div>
        <h2 data-user-content>Design conference tickets</h2>
        <p class="who">Maya Chen</p>
      </div>
      <div class="amount">$1,250</div>
      <div class="actions">
        <button class="btn btn--plain" type="button">Decline</button>
        <button class="btn btn--fill" type="button">Approve</button>
      </div>
    </li>
    <li class="item">
      <div>
        <h2 data-user-content>Standing desks for support</h2>
        <p class="who">Ana Ruiz</p>
      </div>
      <div class="amount">$2,100</div>
      <div class="actions">
        <button class="btn btn--plain" type="button">Decline</button>
        <button class="btn btn--fill" type="button">Approve</button>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
