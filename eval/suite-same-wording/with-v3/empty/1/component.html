<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests · Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Tokens from tokens.css (day theme), only the ones this screen uses. */
:root {
  --paper: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --text-display-xl: clamp(2rem, 4vw, 3.5rem);
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); }

#component {
  width: 1280px;
  min-height: 720px;
  padding: var(--space-8);
  display: flex;
  flex-direction: column;
  background: var(--paper);
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-display-xl);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-7) 0;
}

.empty__title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.3;
}

.empty__message {
  margin: var(--space-3) 0 0;
  max-width: 400px;
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--muted);
}

.empty__actions {
  margin-top: var(--space-6);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-body);
  text-decoration: none;
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease);
}
.btn:hover { opacity: 0.88; }
.btn:focus-visible, .link:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }

.link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  color: var(--accent-text);
  font-size: var(--text-body);
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
}
</style>
</head>
<body>
<div id="component">
  <h1 class="page-title">Requests</h1>
  <section class="empty">
    <h2 class="empty__title">No requests yet</h2>
    <p class="empty__message">When your team asks for something, it shows up here.</p>
    <div class="empty__actions">
      <a class="btn" href="#">Create a Request</a>
      <a class="link" href="#">Import from a spreadsheet</a>
    </div>
  </section>
</div>
</body>
</html>
