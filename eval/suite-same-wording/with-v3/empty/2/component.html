<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requests · Harbor</title>
<style>
/* Tokens copied from tokens.css (generated; day theme and the roles this screen uses) */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --text-display-xl: clamp(2rem, 4vw, 3.5rem);
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --sand: #131E21;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent-tint: #13283A;
  --on-ink: #0E1618;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 1280px;
  min-height: 800px;
  margin: 0 auto;
  padding: var(--space-8) var(--space-8) var(--space-9);
  background: var(--paper);
  display: flex;
  flex-direction: column;
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-display-xl);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-9) 0 var(--space-8);
}

.empty__title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.3;
}

.empty__message {
  margin: var(--space-3) 0 0;
  max-width: 400px;
  font-size: var(--text-body);
  color: var(--muted);
}

.empty__actions {
  margin-top: var(--space-6);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-6);
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 600;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:hover { opacity: 0.88; }
.btn:active { transform: translateY(1px); }

.link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--space-2);
  border-radius: var(--space-1);
  color: var(--accent-text);
  font-size: var(--text-body);
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
  transition: background var(--dur-fast) var(--ease);
}
.link:hover { background: var(--accent-tint); }

.btn:focus-visible,
.link:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  .btn, .link { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <h1 class="page-title">Requests</h1>
  <section class="empty" aria-labelledby="empty-title">
    <h2 class="empty__title" id="empty-title">No requests yet</h2>
    <p class="empty__message">When your team asks for something, it shows up here.</p>
    <div class="empty__actions">
      <a class="btn" href="#create">Create a Request</a>
      <a class="link" href="#import">Import from a spreadsheet</a>
    </div>
  </section>
</div>
</body>
</html>
