<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New request · Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Tokens from tokens.css (light theme), inlined so this file stands alone. */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-display-xl: clamp(2rem, 4vw, 3.5rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--text-body); }

#component {
  width: 1280px;
  min-height: 900px;
  padding: var(--space-8);
  background: var(--paper);
}

.page { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: var(--space-6); }
.page-head { grid-column: 1 / span 12; margin-bottom: var(--space-7); }
.page-head h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-display-xl);
  line-height: 1.1;
  text-transform: uppercase;
  color: var(--ink);
}

form {
  grid-column: 1 / span 8;
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.field { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-5); }
.row { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--space-5); }

label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

input, select, textarea {
  width: 100%;
  min-height: 48px;
  padding: 0 var(--space-4);
  font-family: var(--font-body);
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.4);
  border-radius: var(--radius-md);
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
textarea { display: block; min-height: 128px; padding: var(--space-3) var(--space-4); line-height: 1.5; resize: vertical; }
input:hover, select:hover, textarea:hover { border-color: var(--ink); }
input:focus-visible, select:focus-visible, textarea:focus-visible,
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }

.actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
  margin-top: var(--space-6);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-5);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
.btn--plain { background: transparent; color: var(--ink); }
.btn--plain:hover { background: var(--accent-tint); }
.btn--fill { background: var(--ink); color: var(--on-ink); }
.btn--fill:hover { background: var(--accent); }
</style>
</head>
<body>
<div id="component">
  <div class="page">
    <header class="page-head">
      <h1>New request</h1>
    </header>

    <form action="#" method="post">
      <div class="field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text">
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5"></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
        </div>
        <div class="field">
          <label for="assignee">Assignee</label>
          <select id="assignee" name="assignee">
            <option>Maya Chen</option>
            <option>Leo Park</option>
            <option>Ana Ruiz</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="due">Due date</label>
          <input id="due" name="due" type="date">
        </div>
      </div>

      <div class="actions">
        <button class="btn btn--plain" type="button">Cancel</button>
        <button class="btn btn--fill" type="submit">Create Request</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
