<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Harbor: Connect your tools</title>
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent-tint: #E6EFF7;
    --on-ink: #FFFFFF;
    --shadow-rgb: 11, 20, 22;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --space-8: 64px;
    --space-9: 96px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-label: 0.14em;
    --tracking-snug: -0.01em;
    --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
    --text-body-l: 1.125rem;
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-base: 180ms;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); }

  #component {
    width: 1280px;
    min-height: 800px;
    padding: var(--space-9) var(--space-8);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    line-height: 1.5;
    display: flex;
    justify-content: center;
  }

  .step {
    width: 640px;
  }

  .progress {
    margin: 0;
    font-family: var(--font-label);
    font-weight: 500;
    font-size: var(--text-label);
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--accent-text);
  }

  .bars {
    display: flex;
    gap: var(--space-2);
    margin-top: var(--space-3);
  }
  .bars span {
    flex: 1;
    height: 4px;
    border-radius: var(--radius-pill);
    background: rgba(var(--ink-rgb), 0.1);
  }
  .bars span.done { background: var(--accent-text); }

  h1 {
    margin: var(--space-6) 0 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-heading);
    line-height: 1.15;
    text-transform: uppercase;
  }

  .lead {
    margin: var(--space-4) 0 0;
    font-size: var(--text-body-l);
    color: var(--muted);
  }

  .tools {
    list-style: none;
    margin: var(--space-7) 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  .tool {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-5);
    padding: var(--space-5);
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
  }

  .tool h2 {
    margin: 0;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: var(--text-body-l);
    line-height: 1.3;
  }
  .tool p {
    margin: var(--space-1) 0 0;
    font-size: var(--text-body);
    color: var(--muted);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 var(--space-5);
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    background: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: var(--text-body);
    letter-spacing: var(--tracking-snug);
    white-space: nowrap;
    cursor: pointer;
    transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
  }
  .btn:focus-visible {
    outline: 2px solid var(--accent-text);
    outline-offset: 2px;
  }
  .btn--outline { border-color: var(--ink); }
  .btn--outline:hover { background: var(--accent-tint); }
  .btn--fill { background: var(--ink); color: var(--on-ink); }
  .btn--plain:hover { background: var(--accent-tint); }

  .actions {
    display: flex;
    justify-content: flex-end;
    gap: var(--space-3);
    margin-top: var(--space-7);
  }
</style>
</head>
<body>
<main id="component">
  <section class="step" aria-labelledby="step-title">
    <p class="progress">Step 2 of 4</p>
    <div class="bars" aria-hidden="true">
      <span class="done"></span><span class="done"></span><span></span><span></span>
    </div>

    <h1 id="step-title">Connect your tools</h1>
    <p class="lead">Harbor works best with the tools your team already uses.</p>

    <ul class="tools">
      <li class="tool">
        <div>
          <h2>Slack</h2>
          <p>Get request updates in your channels</p>
        </div>
        <button class="btn btn--outline" type="button" aria-label="Connect Slack">Connect</button>
      </li>
      <li class="tool">
        <div>
          <h2>Google Calendar</h2>
          <p>See due dates on your calendar</p>
        </div>
        <button class="btn btn--outline" type="button" aria-label="Connect Google Calendar">Connect</button>
      </li>
      <li class="tool">
        <div>
          <h2>Jira</h2>
          <p>Link requests to engineering tickets</p>
        </div>
        <button class="btn btn--outline" type="button" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button class="btn btn--plain" type="button">Skip for Now</button>
      <button class="btn btn--fill" type="button">Continue</button>
    </div>
  </section>
</main>
</body>
</html>
