<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor: Connect your tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Tokens from tokens.css (light theme, only the ones used here) */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-lead: 1.375rem;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; margin: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 1280px;
  min-height: 800px;
  margin: 0 auto;
  padding: var(--space-8);
  background: var(--paper);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.onboarding {
  width: 640px;
  padding-top: var(--space-7);
}

.progress-label {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}

.progress-bar {
  display: flex;
  gap: var(--space-2);
  margin-top: var(--space-3);
  list-style: none;
  padding: 0;
}

.progress-bar li {
  flex: 1;
  height: 4px;
  border-radius: var(--radius-pill);
  background: var(--sand);
}

.progress-bar li.done { background: var(--accent); }

h1 {
  margin-top: var(--space-6);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  text-transform: uppercase;
  line-height: 1.15;
}

.lead {
  margin-top: var(--space-3);
  font-size: var(--text-body-l);
  color: var(--muted);
}

.tools {
  list-style: none;
  padding: 0;
  margin-top: var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.tool {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.tool-icon {
  flex: none;
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  background: var(--accent-tint);
  color: var(--accent-text);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-body);
}

.tool-text { flex: 1; min-width: 0; }

.tool-name {
  font-size: var(--text-body-l);
  font-weight: 600;
}

.tool-desc {
  margin-top: var(--space-1);
  font-size: var(--text-small);
  color: var(--muted);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 600;
  line-height: 1;
  color: var(--ink);
  background: none;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn--outline { border-color: var(--ink); }
.btn--outline:hover { background: var(--ink); color: var(--on-ink); }

.btn--plain:hover { background: var(--accent-tint); }

.btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--fill:hover { background: var(--accent); }

.actions {
  margin-top: var(--space-7);
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
}
</style>
</head>
<body>
<div id="component">
  <main class="onboarding">
    <p class="progress-label">Step 2 of 4</p>
    <ol class="progress-bar" aria-hidden="true">
      <li class="done"></li>
      <li class="done"></li>
      <li></li>
      <li></li>
    </ol>

    <h1>Connect your tools</h1>
    <p class="lead">Harbor works best with the tools your team already uses.</p>

    <ul class="tools">
      <li class="tool">
        <span class="tool-icon" aria-hidden="true">S</span>
        <div class="tool-text">
          <p class="tool-name">Slack</p>
          <p class="tool-desc">Get request updates in your channels</p>
        </div>
        <button class="btn btn--outline" type="button">Connect</button>
      </li>
      <li class="tool">
        <span class="tool-icon" aria-hidden="true">G</span>
        <div class="tool-text">
          <p class="tool-name">Google Calendar</p>
          <p class="tool-desc">See due dates on your calendar</p>
        </div>
        <button class="btn btn--outline" type="button">Connect</button>
      </li>
      <li class="tool">
        <span class="tool-icon" aria-hidden="true">J</span>
        <div class="tool-text">
          <p class="tool-name">Jira</p>
          <p class="tool-desc">Link requests to engineering tickets</p>
        </div>
        <button class="btn btn--outline" type="button">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button class="btn btn--plain" type="button">Skip for Now</button>
      <button class="btn btn--fill" type="button">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
