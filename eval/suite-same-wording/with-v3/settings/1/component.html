<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Workspace settings · Harbor</title>
<style>
/* Tokens from tokens.css (day theme), inlined so this file stands alone */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-display-xl: 3.5rem;
  --text-step: 1.75rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 900px;
  padding: var(--space-8) var(--space-8) 96px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

.page { width: 720px; }

h1 {
  margin: 0 0 var(--space-7);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-display-xl);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

.section {
  margin: 0 0 var(--space-6);
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

h2 {
  margin: 0 0 var(--space-5);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

.field { display: block; margin: 0 0 var(--space-5); }
.field__label {
  display: block;
  margin: 0 0 var(--space-2);
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
.field__input {
  display: block;
  width: 100%;
  height: 48px;
  padding: 0 var(--space-4);
  font: inherit;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.3);
  border-radius: var(--radius-md);
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.field__input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-5);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-body);
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--ink);
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--fill { color: var(--on-ink); background: var(--ink); }
.btn--outline:hover { background: var(--accent-tint); }
.btn--fill:hover { background: rgba(var(--ink-rgb), 0.85); }

.switches { margin: 0; padding: 0; list-style: none; }
.switches li { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }
.switches li:first-child { border-top: 0; }

.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  min-height: 64px;
  cursor: pointer;
}
.switch__text { font-size: var(--text-body); }
.switch__input {
  position: relative;
  flex: none;
  width: 52px;
  height: 44px;
  margin: 0;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  cursor: pointer;
}
.switch__input::before {
  content: "";
  position: absolute;
  top: 10px;
  left: 0;
  width: 52px;
  height: 28px;
  border: 1px solid var(--ink);
  border-radius: var(--radius-pill);
  background: var(--paper);
  transition: background var(--dur-base) var(--ease);
}
.switch__input::after {
  content: "";
  position: absolute;
  top: 14px;
  left: 4px;
  width: 20px;
  height: 20px;
  border-radius: var(--radius-pill);
  background: var(--ink);
  transition: transform var(--dur-base) var(--ease), background var(--dur-base) var(--ease);
}
.switch__input:checked::before { background: var(--ink); }
.switch__input:checked::after { background: var(--on-ink); transform: translateX(24px); }
.switch__input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }

.danger__text { margin: 0 0 var(--space-5); color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1>Workspace settings</h1>

    <section class="section" aria-labelledby="general-title">
      <h2 id="general-title">General</h2>
      <label class="field">
        <span class="field__label">Workspace name</span>
        <input class="field__input" type="text" value="Harbor Ops">
      </label>
      <label class="field">
        <span class="field__label">Workspace URL</span>
        <input class="field__input" type="text" value="harbor.app/ops">
      </label>
      <button class="btn btn--fill" type="button">Save Changes</button>
    </section>

    <section class="section" aria-labelledby="notifications-title">
      <h2 id="notifications-title">Notifications</h2>
      <ul class="switches">
        <li>
          <label class="switch">
            <span class="switch__text">Email me when a request is assigned to me</span>
            <input class="switch__input" type="checkbox" role="switch" checked>
          </label>
        </li>
        <li>
          <label class="switch">
            <span class="switch__text">Weekly summary</span>
            <input class="switch__input" type="checkbox" role="switch" checked>
          </label>
        </li>
        <li>
          <label class="switch">
            <span class="switch__text">Product updates</span>
            <input class="switch__input" type="checkbox" role="switch">
          </label>
        </li>
      </ul>
    </section>

    <section class="section" aria-labelledby="danger-title">
      <h2 id="danger-title">Danger zone</h2>
      <p class="danger__text">Deleting a workspace removes all of its requests for everyone.</p>
      <button class="btn btn--outline" type="button">Delete Workspace</button>
    </section>
  </main>
</div>
</body>
</html>
