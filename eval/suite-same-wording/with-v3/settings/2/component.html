<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Tokens from tokens.css (day theme, only the roles used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --sand: #EEF4FA;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-display-xl: clamp(2rem, 4vw, 3.5rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--text-body); }

#component {
  width: 1280px;
  min-height: 100vh;
  padding: var(--space-8);
  background: var(--paper);
}
.page { width: 720px; }

h1, h2 { margin: 0; font-family: var(--font-display); font-weight: 300; text-transform: uppercase; }
h1 { font-size: var(--text-display-xl); letter-spacing: var(--tracking-tight); line-height: 1.1; }
h2 { font-size: var(--text-step); letter-spacing: var(--tracking-tight); line-height: 1.2; }

.section {
  margin-top: var(--space-7);
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}
.section > h2 + * { margin-top: var(--space-5); }

.field { display: block; }
.field + .field { margin-top: var(--space-5); }
.label {
  display: block;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
.input {
  display: block;
  width: 100%;
  height: 48px;
  margin-top: var(--space-2);
  padding: 0 var(--space-4);
  font: inherit;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--muted);
  border-radius: var(--radius-sm);
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.input:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-tint); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-5);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 600;
  border: 1px solid var(--ink);
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
.btn--fill { background: var(--ink); color: var(--on-ink); }
.btn--fill:hover { background: var(--accent-text); border-color: var(--accent-text); }
.btn--outline { background: transparent; color: var(--ink); }
.btn--outline:hover { background: var(--accent-tint); }
.btn:focus-visible, .switch input:focus-visible + .track { outline: 2px solid var(--accent-text); outline-offset: 3px; }
.actions { margin-top: var(--space-6); }

.switches { list-style: none; padding: 0; margin: 0; }
.switches li + li { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }
.switch {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  min-height: 64px;
  cursor: pointer;
}
.switch .text { font-size: var(--text-body); }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track {
  position: relative;
  flex: none;
  width: 52px;
  height: 32px;
  background: var(--paper);
  border: 2px solid var(--muted);
  border-radius: var(--radius-pill);
  transition: background var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.track::after {
  content: "";
  position: absolute;
  top: 4px;
  left: 4px;
  width: 20px;
  height: 20px;
  background: var(--muted);
  border-radius: 50%;
  transition: transform var(--dur-base) var(--ease), background var(--dur-base) var(--ease);
}
.switch input:checked + .track { background: var(--ink); border-color: var(--ink); }
.switch input:checked + .track::after { background: var(--on-ink); transform: translateX(20px); }

.danger p { margin: 0; color: var(--muted); font-size: var(--text-body); line-height: 1.5; }
.danger .actions { margin-top: var(--space-5); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1>Workspace settings</h1>

    <section class="section" aria-labelledby="general-title">
      <h2 id="general-title">General</h2>
      <div>
        <label class="field">
          <span class="label">Workspace name</span>
          <input class="input" type="text" value="Harbor Ops">
        </label>
        <label class="field">
          <span class="label">Workspace URL</span>
          <input class="input" type="text" value="harbor.app/ops">
        </label>
      </div>
      <div class="actions" style="margin-top: var(--space-6)">
        <button class="btn btn--fill" type="button">Save Changes</button>
      </div>
    </section>

    <section class="section" aria-labelledby="notifications-title">
      <h2 id="notifications-title">Notifications</h2>
      <ul class="switches">
        <li>
          <label class="switch">
            <span class="text">Email me when a request is assigned to me</span>
            <input type="checkbox" role="switch" checked>
            <span class="track" aria-hidden="true"></span>
          </label>
        </li>
        <li>
          <label class="switch">
            <span class="text">Weekly summary</span>
            <input type="checkbox" role="switch" checked>
            <span class="track" aria-hidden="true"></span>
          </label>
        </li>
        <li>
          <label class="switch">
            <span class="text">Product updates</span>
            <input type="checkbox" role="switch">
            <span class="track" aria-hidden="true"></span>
          </label>
        </li>
      </ul>
    </section>

    <section class="section danger" aria-labelledby="danger-title">
      <h2 id="danger-title">Danger zone</h2>
      <p>Deleting a workspace removes all of its requests for everyone.</p>
      <div class="actions">
        <button class="btn btn--outline" type="button">Delete Workspace</button>
      </div>
    </section>
  </main>
</div>
</body>
</html>
