<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approvals</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; }
  #component {
    width: 1280px;
    min-height: 720px;
    margin: 0 auto;
    padding: 64px 160px;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component h1 {
    margin: 0 0 8px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 40px;
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  #component .count {
    margin: 0 0 40px;
    font-size: 18px;
  }
  #component ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid #0B1416;
  }
  #component li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    padding: 28px 0;
    border-bottom: 1px solid #0B1416;
  }
  #component .info { flex: 1; }
  #component h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
  }
  #component .requester { margin: 0; }
  #component .amount {
    font-size: 22px;
    font-weight: 600;
    min-width: 100px;
    text-align: right;
  }
  #component .actions { display: flex; gap: 12px; }
  #component button {
    font: inherit;
    font-weight: 600;
    min-height: 44px;
    padding: 0 24px;
    border-radius: 4px;
    border: 2px solid #0263AC;
    cursor: pointer;
  }
  #component .approve { background: #0263AC; color: #fff; }
  #component .decline { background: #fff; color: #0263AC; }
  #component button:focus-visible { outline: 3px solid #0B1416; outline-offset: 2px; }
</style>
</head>
<body>
<div id="component">
  <h1>Approvals</h1>
  <p class="count">3 waiting for you</p>
  <ul>
    <li>
      <div class="info">
        <h2>Q4 travel budget</h2>
        <p class="requester">Leo Park</p>
      </div>
      <div class="amount">$4,800</div>
      <div class="actions">
        <button type="button" class="approve">Approve</button>
        <button type="button" class="decline">Decline</button>
      </div>
    </li>
    <li>
      <div class="info">
        <h2>Design conference tickets</h2>
        <p class="requester">Maya Chen</p>
      </div>
      <div class="amount">$1,250</div>
      <div class="actions">
        <button type="button" class="approve">Approve</button>
        <button type="button" class="decline">Decline</button>
      </div>
    </li>
    <li>
      <div class="info">
        <h2>Standing desks for support</h2>
        <p class="requester">Ana Ruiz</p>
      </div>
      <div class="amount">$2,100</div>
      <div class="actions">
        <button type="button" class="approve">Approve</button>
        <button type="button" class="decline">Decline</button>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
