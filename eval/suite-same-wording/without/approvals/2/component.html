<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approvals</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #0B1416; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; }
  #component { width: 1280px; min-height: 720px; margin: 0 auto; padding: 64px 80px; background: #fff; }
  h1 { margin: 0; font-family: Unbounded, "Helvetica Neue", Arial, sans-serif; font-weight: 300; font-size: 40px; line-height: 1.2; letter-spacing: 0.02em; text-transform: uppercase; }
  .count { margin: 12px 0 40px; font-size: 18px; line-height: 1.5; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid #0B1416; }
  li { display: flex; align-items: center; gap: 32px; padding: 28px 0; border-bottom: 1px solid #0B1416; }
  .info { flex: 1; min-width: 0; }
  .title { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.3; }
  .requester { margin: 6px 0 0; font-size: 16px; line-height: 1.5; }
  .amount { width: 140px; text-align: right; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 12px; }
  button { font: inherit; font-size: 16px; font-weight: 600; min-width: 112px; min-height: 44px; padding: 10px 24px; border-radius: 4px; border: 2px solid #0263AC; cursor: pointer; }
  .approve { background: #0263AC; color: #fff; }
  .decline { background: #fff; color: #0263AC; }
  button:focus-visible { outline: 3px solid #0B1416; outline-offset: 2px; }
</style>
</head>
<body>
<main id="component">
  <h1>Approvals</h1>
  <p class="count">3 waiting for you</p>
  <ul>
    <li>
      <div class="info">
        <p class="title">Q4 travel budget</p>
        <p class="requester">Leo Park</p>
      </div>
      <div class="amount">$4,800</div>
      <div class="actions">
        <button type="button" class="approve">Approve</button>
        <button type="button" class="decline">Decline</button>
      </div>
    </li>
    <li>
      <div class="info">
        <p class="title">Design conference tickets</p>
        <p class="requester">Maya Chen</p>
      </div>
      <div class="amount">$1,250</div>
      <div class="actions">
        <button type="button" class="approve">Approve</button>
        <button type="button" class="decline">Decline</button>
      </div>
    </li>
    <li>
      <div class="info">
        <p class="title">Standing desks for support</p>
        <p class="requester">Ana Ruiz</p>
      </div>
      <div class="amount">$2,100</div>
      <div class="actions">
        <button type="button" class="approve">Approve</button>
        <button type="button" class="decline">Decline</button>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
