<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; }
  #component {
    width: 1280px;
    margin: 0 auto;
    padding: 64px 80px;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component h1,
  #component h2 {
    font-family: "Unbounded", "Archivo", Arial, Helvetica, sans-serif;
    font-weight: 300;
    text-transform: uppercase;
    margin: 0;
    color: #0B1416;
  }
  #component h1 { font-size: 36px; line-height: 1.2; margin-bottom: 40px; }
  #component h2 { font-size: 20px; line-height: 1.3; margin-bottom: 20px; }
  .plan {
    border: 1px solid #0B1416;
    padding: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 56px;
  }
  .plan-name { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .plan-price { font-size: 18px; margin: 0 0 4px; }
  .plan-seats { margin: 0; }
  .btn {
    font: inherit;
    font-weight: 600;
    background: #0263AC;
    color: #fff;
    border: 2px solid #0263AC;
    padding: 12px 24px;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn:focus-visible { outline: 3px solid #0B1416; outline-offset: 2px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 16px; border-bottom: 1px solid #0B1416; }
  th { border-bottom-width: 2px; font-weight: 600; }
  .status { color: #0263AC; font-weight: 600; }
</style>
</head>
<body>
<div id="component">
  <h1>Billing</h1>

  <section class="plan" aria-label="Current plan">
    <div>
      <p class="plan-name">Team plan</p>
      <p class="plan-price">$24 per seat per month</p>
      <p class="plan-seats">18 of 25 seats used</p>
    </div>
    <button class="btn" type="button">Change Plan</button>
  </section>

  <section>
    <h2>Invoices</h2>
    <table>
      <thead>
        <tr><th scope="col">Date</th><th scope="col">Amount</th><th scope="col">Status</th></tr>
      </thead>
      <tbody>
        <tr><td>Oct 1, 2026</td><td>$432.00</td><td class="status">Paid</td></tr>
        <tr><td>Sep 1, 2026</td><td>$432.00</td><td class="status">Paid</td></tr>
        <tr><td>Aug 1, 2026</td><td>$408.00</td><td class="status">Paid</td></tr>
        <tr><td>Jul 1, 2026</td><td>$408.00</td><td class="status">Paid</td></tr>
      </tbody>
    </table>
  </section>
</div>
</body>
</html>
