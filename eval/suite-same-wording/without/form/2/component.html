<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New request – Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #0B1416; font-family: "Archivo", Arial, sans-serif; font-size: 16px; line-height: 1.5; }
  #component { width: 1280px; min-height: 800px; margin: 0 auto; padding: 80px 0; background: #fff; }
  .form { width: 640px; margin: 0 auto; }
  h1 { margin: 0 0 40px; font-family: "Unbounded", "Archivo", Arial, sans-serif; font-weight: 300; font-size: 32px; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.02em; color: #0B1416; }
  .field { margin-bottom: 24px; }
  label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #0B1416; }
  input, textarea, select { display: block; width: 100%; padding: 12px 14px; border: 1px solid #0B1416; border-radius: 4px; background: #fff; color: #0B1416; font-family: inherit; font-size: 16px; line-height: 1.5; }
  textarea { min-height: 140px; resize: vertical; }
  select { appearance: none; -webkit-appearance: none; padding-right: 44px; background-image: linear-gradient(45deg, transparent 50%, #0B1416 50%), linear-gradient(135deg, #0B1416 50%, transparent 50%); background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
  .row { display: flex; gap: 24px; }
  .row .field { flex: 1; }
  input:focus, textarea:focus, select:focus, button:focus { outline: 3px solid #0263AC; outline-offset: 2px; }
  .actions { display: flex; justify-content: flex-end; gap: 16px; margin-top: 40px; padding-top: 24px; border-top: 1px solid #0B1416; }
  button { padding: 12px 24px; border-radius: 4px; border: 2px solid #0263AC; font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.5; cursor: pointer; }
  .cancel { background: #fff; color: #0263AC; }
  .create { background: #0263AC; color: #fff; }
</style>
</head>
<body>
<div id="component">
  <form class="form" action="#" method="post">
    <h1>New request</h1>

    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" name="title">
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description"></textarea>
    </div>

    <div class="row">
      <div class="field">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
      </div>
      <div class="field">
        <label for="assignee">Assignee</label>
        <select id="assignee" name="assignee">
          <option>Maya Chen</option>
          <option>Leo Park</option>
          <option>Ana Ruiz</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="due">Due date</label>
      <input type="date" id="due" name="due">
    </div>

    <div class="actions">
      <button type="button" class="cancel">Cancel</button>
      <button type="submit" class="create">Create Request</button>
    </div>
  </form>
</div>
</body>
</html>
