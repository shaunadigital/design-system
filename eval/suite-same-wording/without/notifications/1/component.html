<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications – Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component {
    width: 1280px;
    min-height: 720px;
    margin: 0 auto;
    padding: 64px 40px;
    background: #fff;
  }
  .inner { max-width: 760px; margin: 0 auto; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 24px;
    border-bottom: 2px solid #0B1416;
  }
  h1 {
    margin: 0;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 32px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .mark-all {
    font: inherit;
    font-weight: 600;
    color: #0263AC;
    background: #fff;
    border: 2px solid #0263AC;
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
  }
  .mark-all:hover { background: #0263AC; color: #fff; }
  .mark-all:focus-visible, a:focus-visible { outline: 3px solid #0B1416; outline-offset: 3px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid;
    grid-template-columns: 12px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 20px 16px;
    border-bottom: 1px solid #C9D1D3;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .unread { background: #EEF5FB; box-shadow: inset 4px 0 0 #0263AC; }
  .unread .dot { background: #0263AC; }
  .unread .text { font-weight: 700; }
  .text { font-weight: 400; }
  time { font-size: 14px; color: #4A5558; white-space: nowrap; }
</style>
</head>
<body>
<div id="component">
  <div class="inner">
    <header>
      <h1>Notifications</h1>
      <button class="mark-all" type="button">Mark All as Read</button>
    </header>
    <ul>
      <li class="unread"><span class="dot"></span><span class="text">Leo Park approved Q4 travel budget</span><time>2h ago</time></li>
      <li class="unread"><span class="dot"></span><span class="text">Maya Chen assigned you Laptop refresh for design</span><time>3h ago</time></li>
      <li class="unread"><span class="dot"></span><span class="text">Your weekly summary is ready</span><time>1d ago</time></li>
      <li><span class="dot"></span><span class="text">Ana Ruiz commented on VPN access for contractors</span><time>1d ago</time></li>
      <li><span class="dot"></span><span class="text">Sam Ito joined Harbor Ops</span><time>2d ago</time></li>
      <li><span class="dot"></span><span class="text">Billing details were updated</span><time>3d ago</time></li>
    </ul>
  </div>
</div>
</body>
</html>
