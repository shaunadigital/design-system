<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor – Connect your tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", Arial, Helvetica, sans-serif;
  }
  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 96px 0 80px;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .inner { width: 640px; }
  .progress {
    margin: 0 0 20px;
    font-size: 16px;
    font-weight: 600;
    color: #0263AC;
    letter-spacing: 0.02em;
  }
  .bar {
    display: flex;
    gap: 8px;
    margin: 0 0 40px;
    padding: 0;
    list-style: none;
  }
  .bar li {
    flex: 1;
    height: 4px;
    background: #D5DCDF;
  }
  .bar li.done { background: #0263AC; }
  h1 {
    margin: 0 0 16px;
    font-family: "Unbounded", "Arial Black", Arial, sans-serif;
    font-weight: 300;
    font-size: 36px;
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }
  .lead {
    margin: 0 0 40px;
    font-size: 18px;
    line-height: 1.5;
  }
  .options {
    margin: 0;
    padding: 0;
    list-style: none;
    border-top: 1px solid #0B1416;
  }
  .option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 24px 0;
    border-bottom: 1px solid #C3CBCE;
  }
  .option h2 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
  }
  .option p {
    margin: 0;
    font-size: 16px;
    line-height: 1.4;
  }
  .btn {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    line-height: 1;
    padding: 14px 24px;
    border-radius: 4px;
    border: 2px solid #0263AC;
    cursor: pointer;
  }
  .btn:focus-visible { outline: 3px solid #0B1416; outline-offset: 3px; }
  .btn-secondary { background: #fff; color: #0263AC; min-width: 112px; }
  .btn-primary { background: #0263AC; color: #fff; }
  .btn-text { background: #fff; color: #0B1416; border-color: transparent; text-decoration: underline; text-underline-offset: 4px; }
  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 48px;
  }
  .btn-primary.wide { min-width: 140px; }
</style>
</head>
<body>
<main id="component">
  <div class="inner">
    <p class="progress">Step 2 of 4</p>
    <ol class="bar" aria-hidden="true">
      <li class="done"></li><li class="done"></li><li></li><li></li>
    </ol>
    <h1>Connect your tools</h1>
    <p class="lead">Harbor works best with the tools your team already uses.</p>

    <ul class="options">
      <li class="option">
        <div>
          <h2>Slack</h2>
          <p>Get request updates in your channels</p>
        </div>
        <button type="button" class="btn btn-secondary" aria-label="Connect Slack">Connect</button>
      </li>
      <li class="option">
        <div>
          <h2>Google Calendar</h2>
          <p>See due dates on your calendar</p>
        </div>
        <button type="button" class="btn btn-secondary" aria-label="Connect Google Calendar">Connect</button>
      </li>
      <li class="option">
        <div>
          <h2>Jira</h2>
          <p>Link requests to engineering tickets</p>
        </div>
        <button type="button" class="btn btn-secondary" aria-label="Connect Jira">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button type="button" class="btn btn-text">Skip for Now</button>
      <button type="button" class="btn btn-primary wide">Continue</button>
    </div>
  </div>
</main>
</body>
</html>
