<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; }
  #component {
    width: 1280px;
    min-height: 800px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component .card { width: 420px; }
  #component h1 {
    margin: 0 0 40px;
    font-family: "Unbounded", "Archivo", Arial, Helvetica, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.25;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  #component .field { margin-bottom: 20px; }
  #component label { display: block; margin-bottom: 6px; font-weight: 500; }
  #component input[type="email"],
  #component input[type="password"] {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid #0B1416;
    border-radius: 4px;
    background: #fff;
    color: #0B1416;
    font: inherit;
  }
  #component .check {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 28px;
  }
  #component .check input {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: #0263AC;
  }
  #component .check label { margin: 0; font-weight: 400; }
  #component button {
    width: 100%;
    height: 48px;
    border-radius: 4px;
    border: 2px solid #0263AC;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #component .primary { background: #0263AC; color: #fff; }
  #component .secondary { background: #fff; color: #0263AC; margin-top: 12px; }
  #component .forgot { margin: 24px 0 0; text-align: center; }
  #component a { color: #0263AC; text-decoration: underline; }
  #component input:focus-visible,
  #component button:focus-visible,
  #component a:focus-visible {
    outline: 3px solid #0B1416;
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <h1>Sign in to Harbor</h1>
    <form action="#" onsubmit="return false">
      <div class="field">
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <div class="check">
        <input type="checkbox" id="keep" name="keep">
        <label for="keep">Keep me signed in</label>
      </div>
      <button type="submit" class="primary">Sign In</button>
      <button type="button" class="secondary">Continue with SSO</button>
    </form>
    <p class="forgot"><a href="#">Forgot Password?</a></p>
  </main>
</div>
</body>
</html>
