<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #FFFFFF;
    color: #0B1416;
    font-family: "Archivo", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component {
    width: 1280px;
    min-height: 800px;
    padding: 48px 64px 64px;
    background: #FFFFFF;
  }
  h1 {
    font-family: "Unbounded", "Archivo", Arial, sans-serif;
    font-weight: 300;
    font-size: 56px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #0B1416;
    padding-bottom: 24px;
    border-bottom: 1px solid #9CC3EA;
  }
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin: 96px auto 0;
    max-width: 480px;
    padding: 48px 32px;
    background: #EEF4FA;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }
  h2 {
    font-family: "Unbounded", "Archivo", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: #0B1416;
  }
  .empty p {
    margin-top: 12px;
    font-size: 16px;
    color: #55656A;
  }
  .actions {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 8px 24px;
    border: 0;
    border-radius: 999px;
    background: #0B1416;
    color: #FFFFFF;
    font-family: "Archivo", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .btn:hover { background: #0263AC; }
  .link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 12px;
    color: #0263AC;
    font-size: 16px;
    text-decoration: underline;
    text-underline-offset: 4px;
    border-radius: 8px;
    transition: background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .link:hover { background: #E6EFF7; }
  .btn:focus-visible, .link:focus-visible { outline: 2px solid #0263AC; outline-offset: 2px; }
</style>
</head>
<body>
<div id="component">
  <h1>Requests</h1>
  <section class="empty">
    <h2>No requests yet</h2>
    <p>When your team asks for something, it shows up here.</p>
    <div class="actions">
      <a class="btn" href="#">Create a Request</a>
      <a class="link" href="#">Import from a spreadsheet</a>
    </div>
  </section>
</div>
</body>
</html>
