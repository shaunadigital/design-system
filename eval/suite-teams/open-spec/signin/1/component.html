<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Harbor</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  #component {
    width: 1280px;
    min-height: 800px;
    padding: 96px 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #EEF4FA;
    color: #0B1416;
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px;
  }
  #component .card {
    width: 480px;
    padding: 48px;
    background: #FFFFFF;
    border: 1px solid #9CC3EA;
    border-radius: 16px;
  }
  #component h1 {
    margin: 0 0 32px;
    font-family: "Unbounded", "Archivo", system-ui, sans-serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }
  #component .field { margin-bottom: 24px; }
  #component label.label {
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #55656A;
  }
  #component input[type="email"],
  #component input[type="password"] {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    font: inherit;
    font-size: 16px;
    color: #0B1416;
    background: #FFFFFF;
    border: 1px solid #55656A;
    border-radius: 12px;
    transition: border-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1), background-color 120ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component input[type="email"]:hover,
  #component input[type="password"]:hover { background: #E6EFF7; }
  #component input:focus-visible,
  #component .check input:focus-visible,
  #component .btn:focus-visible,
  #component a:focus-visible {
    outline: 2px solid #0263AC;
    outline-offset: 2px;
  }
  #component .check {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    margin-bottom: 24px;
    font-size: 16px;
    cursor: pointer;
  }
  #component .check input {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: #0263AC;
  }
  #component .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 48px;
    padding: 0 24px;
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.2, 0.7, 0.2, 1), color 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  #component .btn-primary {
    color: #FFFFFF;
    background: #0B1416;
    border: 1px solid #0B1416;
  }
  #component .btn-primary:hover { background: #0263AC; border-color: #0263AC; }
  #component .btn-quiet {
    margin-top: 12px;
    color: #0B1416;
    background: transparent;
    border: 1px solid #9CC3EA;
  }
  #component .btn-quiet:hover { background: #E6EFF7; }
  #component .forgot {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin-top: 16px;
    font-size: 16px;
    color: #0263AC;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    #component * { transition: none; }
  }
</style>
</head>
<body>
<div id="component">
  <form class="card" action="#">
    <h1>Sign in to Harbor</h1>
    <div class="field">
      <label class="label" for="email">Work email</label>
      <input type="email" id="email" name="email" autocomplete="username">
    </div>
    <div class="field">
      <label class="label" for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
    </div>
    <label class="check"><input type="checkbox" name="remember"> Keep me signed in</label>
    <button type="submit" class="btn btn-primary">Sign In</button>
    <button type="button" class="btn btn-quiet">Continue with SSO</button>
    <a class="forgot" href="#">Forgot Password?</a>
  </form>
</div>
</body>
</html>
