<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Approvals</title>
<style>
/* Tokens from tokens.css (the subset this screen uses) */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-display-xl: clamp(2rem, 4vw, 3.5rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root[data-theme="dusk"] {
  --paper: #0E1618;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent-tint: #13283A;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); }

#component {
  width: 1280px;
  min-height: 720px;
  padding: var(--space-7) var(--space-8) var(--space-8);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

.head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-5); padding-bottom: var(--space-5); }
.head h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-display-xl);
  letter-spacing: var(--tracking-tight);
  line-height: 1.1;
  text-transform: uppercase;
}
.head p {
  margin: 0;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}

.queue { margin: 0; padding: 0; list-style: none; background: var(--card); border: 1px solid rgba(var(--ink-rgb), 0.1); border-radius: var(--radius-card); overflow: hidden; }
.item {
  display: grid;
  grid-template-columns: 1fr 200px 140px 232px;
  align-items: center;
  column-gap: var(--space-5);
  padding: var(--space-4) var(--space-5);
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
}
.item:first-child { border-top: 0; }
.title { font-size: var(--text-body-l); font-weight: 600; line-height: 1.3; }
.requester { font-size: var(--text-body); color: var(--muted); }
.amount { font-size: var(--text-body-l); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.actions { display: flex; justify-content: flex-end; gap: var(--space-3); }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 0 var(--space-5);
  border: 1px solid transparent; border-radius: var(--radius-pill);
  font-family: var(--font-body); font-size: var(--text-body); font-weight: 600; line-height: 1;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
.btn--fill { background: var(--ink); color: var(--on-ink); }
.btn--plain { background: transparent; color: var(--ink); }
.btn--plain:hover { background: var(--accent-tint); color: var(--accent-text); }
.btn:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
</style>
</head>
<body>
<div id="component">
  <header class="head">
    <h1>Approvals</h1>
    <p>3 waiting for you</p>
  </header>

  <ul class="queue">
    <li class="item">
      <span class="title" data-user-content>Q4 travel budget</span>
      <span class="requester">Leo Park</span>
      <span class="amount">$4,800</span>
      <div class="actions">
        <button class="btn btn--plain" type="button" aria-label="Decline Q4 travel budget">Decline</button>
        <button class="btn btn--fill" type="button" aria-label="Approve Q4 travel budget">Approve</button>
      </div>
    </li>
    <li class="item">
      <span class="title" data-user-content>Design conference tickets</span>
      <span class="requester">Maya Chen</span>
      <span class="amount">$1,250</span>
      <div class="actions">
        <button class="btn btn--plain" type="button" aria-label="Decline Design conference tickets">Decline</button>
        <button class="btn btn--fill" type="button" aria-label="Approve Design conference tickets">Approve</button>
      </div>
    </li>
    <li class="item">
      <span class="title" data-user-content>Standing desks for support</span>
      <span class="requester">Ana Ruiz</span>
      <span class="amount">$2,100</span>
      <div class="actions">
        <button class="btn btn--plain" type="button" aria-label="Decline Standing desks for support">Decline</button>
        <button class="btn btn--fill" type="button" aria-label="Approve Standing desks for support">Approve</button>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
