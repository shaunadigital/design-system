<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Requests · Harbor</title>
<style>
/* Tokens from tokens.css (day theme), the subset this screen uses */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-snug: -0.01em;
  --text-display-xl: 3.5rem;
  --text-lead: 1.375rem;
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); }

#component {
  width: 1280px;
  min-height: 800px;
  padding: var(--space-9) var(--space-8) var(--space-8);
  background: var(--paper);
  display: flex;
  flex-direction: column;
}

.page-title {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-display-xl);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
  color: var(--ink);
}

.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-8) 0 var(--space-9);
}

.mark {
  width: 96px;
  height: 96px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: var(--space-6);
}

.empty-title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.3;
  letter-spacing: var(--tracking-snug);
  color: var(--ink);
}

.empty-text {
  margin-top: var(--space-3);
  max-width: 360px;
  font-size: var(--text-body-l);
  line-height: 1.55;
  color: var(--muted);
}

.actions {
  margin-top: var(--space-7);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 var(--space-6);
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.btn--ink {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
  box-shadow: 0 12px 24px -12px rgba(var(--shadow-rgb), 0.35);
}
.btn--ink:hover { opacity: 0.88; }
.btn:focus-visible, .link:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }

.link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--space-3);
  font-size: var(--text-body);
  font-weight: 500;
  color: var(--accent-text);
  text-decoration: underline;
  text-decoration-color: var(--accent-line);
  text-underline-offset: 4px;
  transition: text-decoration-color var(--dur-base) var(--ease);
}
.link:hover { text-decoration-color: var(--accent-text); }
</style>
</head>
<body>
<div id="component">
  <h1 class="page-title">Requests</h1>

  <main class="empty">
    <div class="mark" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13l2.6-7.2A2 2 0 0 1 7.5 4.5h9a2 2 0 0 1 1.9 1.3L21 13"/>
        <path d="M3 13v4.5A2 2 0 0 0 5 19.5h14a2 2 0 0 0 2-2V13h-5.5a3.5 3.5 0 0 1-7 0H3z"/>
      </svg>
    </div>
    <h2 class="empty-title">No requests yet</h2>
    <p class="empty-text">When your team asks for something, it shows up here.</p>
    <div class="actions">
      <a class="btn btn--ink" href="#">Create a Request</a>
      <a class="link" href="#">Import from a spreadsheet</a>
    </div>
  </main>
</div>
</body>
</html>
