<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Harbor · Requests (empty)</title>
<style>
/* Subset of tokens.css (generated from tokens/tokens.json), day theme */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --text-display-xl: clamp(2rem, 4vw, 3.5rem);
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}
:root { color-scheme: light; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 720px;
  display: flex;
  flex-direction: column;
  padding: var(--space-8) var(--space-8);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component .page-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-display-xl);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

#component .empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-7) 0;
}

#component .empty-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.3;
}

#component .empty-text {
  margin: var(--space-3) 0 0;
  max-width: 400px;
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--muted);
}

#component .actions {
  margin-top: var(--space-5);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
}

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease);
}
#component .btn:hover { opacity: 0.88; }

#component .link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--space-2);
  border-radius: var(--radius-sm);
  color: var(--accent-text);
  font-size: var(--text-body);
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
}
#component .link:hover { background: var(--accent-tint); }

#component .btn:focus-visible,
#component .link:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  #component .btn { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <h1 class="page-title">Requests</h1>
  <main class="empty">
    <h2 class="empty-title">No requests yet</h2>
    <p class="empty-text">When your team asks for something, it shows up here.</p>
    <div class="actions">
      <a class="btn" href="#">Create a Request</a>
      <a class="link" href="#">Import from a spreadsheet</a>
    </div>
  </main>
</div>
</body>
</html>
