<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New request</title>
<style>
/* Tokens copied from tokens.css (only the ones used here) */
:root {
  color-scheme: light;
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 720px;
  padding: var(--space-7) var(--space-8);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}
#component .form {
  width: 720px;
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}
#component h1 {
  margin: 0 0 var(--space-5);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}
#component .grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-4);
}
#component .field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  min-width: 0;
}
#component .wide { grid-column: 1 / -1; }
#component label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
#component input,
#component select,
#component textarea {
  width: 100%;
  min-height: 44px;
  padding: 0 var(--space-3);
  border: 1px solid rgba(var(--ink-rgb), 0.45);
  border-radius: var(--radius-sm);
  background: var(--card);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}
#component textarea {
  min-height: 112px;
  padding: var(--space-3);
  line-height: 1.4;
  resize: vertical;
}
#component input:focus-visible,
#component select:focus-visible,
#component textarea:focus-visible,
#component .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
#component .actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-3);
  margin-top: var(--space-5);
}
#component .btn {
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--text-body);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease);
}
#component .btn--plain { background: none; color: var(--ink); }
#component .btn--plain:hover { background: var(--accent-tint); }
#component .btn--main { background: var(--ink); color: var(--on-ink); }
</style>
</head>
<body>
<div id="component">
  <form class="form" action="#">
    <h1>New request</h1>
    <div class="grid">
      <div class="field wide">
        <label for="title">Title</label>
        <input id="title" type="text">
      </div>
      <div class="field wide">
        <label for="description">Description</label>
        <textarea id="description" rows="4"></textarea>
      </div>
      <div class="field">
        <label for="priority">Priority</label>
        <select id="priority">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
      </div>
      <div class="field">
        <label for="assignee">Assignee</label>
        <select id="assignee">
          <option>Maya Chen</option>
          <option>Leo Park</option>
          <option>Ana Ruiz</option>
        </select>
      </div>
      <div class="field">
        <label for="due">Due date</label>
        <input id="due" type="date">
      </div>
    </div>
    <div class="actions">
      <button class="btn btn--plain" type="button">Cancel</button>
      <button class="btn btn--main" type="button">Create Request</button>
    </div>
  </form>
</div>
</body>
</html>
