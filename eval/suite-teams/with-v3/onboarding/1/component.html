<!DOCTYPE html>
<html lang="en">
<head>

<title>Harbor: Connect your tools</title>

:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;

  --accent-tint: #13283A;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

#component {
  width: 1280px;
  min-height: 800px;
  padding: var(--space-9) var(--space-8);
  background: var(--paper);
}

.step {
  width: 720px;
  margin: 0 auto;
}

.progress-label {
  margin: 0;
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}
.progress-bar {
  display: flex;
  gap: var(--space-2);
  margin: var(--space-3) 0 0;
  padding: 0;
  list-style: none;
}
.progress-bar li {
  flex: 1;
  height: 4px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
}
.progress-bar li.done { background: var(--accent); }

h1 {
  margin: var(--space-7) 0 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-display-xl);
  line-height: 1.1;
  text-transform: uppercase;
  color: var(--ink);
}
.intro {
  margin: var(--space-4) 0 0;
  font-size: var(--text-body-l);
  color: var(--muted);
}

.options {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin: var(--space-7) 0 0;
  padding: 0;
  list-style: none;
}
.option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  padding: var(--space-5);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}
.option-name {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.3;
  color: var(--ink);
}
.option-desc {
  margin: var(--space-1) 0 0;
  font-size: var(--text-body);
  color: var(--muted);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-body);
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.btn:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 2px;
}
.btn--outline {
  background: transparent;
  color: var(--ink);
  border-color: var(--ink);
}
.btn--outline:hover { background: var(--accent-tint); }
.btn--fill {
  background: var(--ink);
  color: var(--on-ink);
}
.btn--fill:hover { background: var(--accent-text); }
.btn--plain {
  background: transparent;
  color: var(--ink);
}
.btn--plain:hover { background: var(--accent-tint); }

  display: flex;
  justify-content: flex-end;

  margin: var(--space-6) 0 0;

<body>
<div id="component">
  <main class="step">
    <p class="progress-label">Step 2 of 4</p>
    <ol class="progress-bar" aria-hidden="true">
      <li class="done"></li>
      <li class="done"></li>
      <li></li>
      <li></li>
    </ol>

    <h1>Connect your tools</h1>
    <p class="intro">Harbor works best with the tools your team already uses.</p>

    <ul class="options">
      <li class="option">
        <div>
          <h2 class="option-name">Slack</h2>
          <p class="option-desc">Get request updates in your channels</p>
        </div>
        <button class="btn btn--outline" type="button">Connect</button>
      </li>
      <li class="option">
        <div>
          <h2 class="option-name">Google Calendar</h2>
          <p class="option-desc">See due dates on your calendar</p>
        </div>
        <button class="btn btn--outline" type="button">Connect</button>
      </li>
      <li class="option">
        <div>
          <h2 class="option-name">Jira</h2>
          <p class="option-desc">Link requests to engineering tickets</p>
        </div>
        <button class="btn btn--outline" type="button">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button class="btn btn--plain" type="button">Skip for Now</button>
      <button class="btn btn--fill" type="button">Continue</button>
    </div>
  </main>
</div>
