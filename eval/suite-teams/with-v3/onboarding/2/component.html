<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect your tools</title>
<style>
/* Tokens (subset of tokens.css, day theme) */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; margin: 0; }

body { background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  padding: var(--space-9) var(--space-8);
  background:
    linear-gradient(to bottom, var(--sand) 0, var(--paper) 360px);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.step {
  width: 640px;
}

/* Progress */
.progress {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.progress__label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}
.progress__bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-2);
  list-style: none;
  padding: 0;
}
.progress__bar li {
  height: 4px;
  border-radius: var(--radius-pill);
  background: rgba(var(--ink-rgb), 0.1);
}
.progress__bar li.is-done { background: var(--accent); }

/* Heading */
.head { margin-top: var(--space-7); }
h1 {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.15;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}
.head p {
  margin-top: var(--space-3);
  font-size: var(--text-body-l);
  color: var(--muted);
}

/* Options */
.options {
  list-style: none;
  padding: 0;
  margin-top: var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  box-shadow: 0 24px 48px -24px rgba(var(--shadow-rgb), 0.35);
}
.option {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-5);
}
.option + .option { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }

.option__icon {
  flex: none;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-md);
  background: var(--accent-tint);
  color: var(--accent-text);
}
.option__icon svg { width: 24px; height: 24px; }

.option__text { flex: 1; min-width: 0; }
.option__name {
  font-weight: 600;
  font-size: var(--text-body-l);
  line-height: 1.3;
}
.option__desc {
  margin-top: var(--space-1);
  font-size: var(--text-small);
  color: var(--muted);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-5);
  border: 1px solid var(--ink);
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 600;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:hover { background: var(--accent-tint); }
.btn:active { transform: scale(0.98); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--fill { background: var(--ink); color: var(--on-ink); }
.btn--fill:hover { background: var(--accent); border-color: var(--accent); color: var(--on-ink); }
.btn--plain { border-color: transparent; }

/* Footer actions */
.actions {
  margin-top: var(--space-6);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.actions .btn--fill { padding: 0 var(--space-6); }
</style>
</head>
<body>
<div id="component">
  <main class="step">
    <div class="progress">
      <p class="progress__label">Step 2 of 4</p>
      <ol class="progress__bar" aria-hidden="true">
        <li class="is-done"></li>
        <li class="is-done"></li>
        <li></li>
        <li></li>
      </ol>
    </div>

    <div class="head">
      <h1>Connect your tools</h1>
      <p>Harbor works best with the tools your team already uses.</p>
    </div>

    <ul class="options">
      <li class="option">
        <span class="option__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9.5 4 7.5 20M16.5 4l-2 16M4 9h16M3.5 15h16"/></svg>
        </span>
        <div class="option__text">
          <h2 class="option__name">Slack</h2>
          <p class="option__desc">Get request updates in your channels</p>
        </div>
        <button class="btn" type="button">Connect</button>
      </li>
      <li class="option">
        <span class="option__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        </span>
        <div class="option__text">
          <h2 class="option__name">Google Calendar</h2>
          <p class="option__desc">See due dates on your calendar</p>
        </div>
        <button class="btn" type="button">Connect</button>
      </li>
      <li class="option">
        <span class="option__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 20 11l-4 4-4-4-4 4-4-4z" transform="translate(0 0)"/><path d="m12 11 4 4-4 6-4-6z"/></svg>
        </span>
        <div class="option__text">
          <h2 class="option__name">Jira</h2>
          <p class="option__desc">Link requests to engineering tickets</p>
        </div>
        <button class="btn" type="button">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button class="btn btn--plain" type="button">Skip for Now</button>
      <button class="btn btn--fill" type="button">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
