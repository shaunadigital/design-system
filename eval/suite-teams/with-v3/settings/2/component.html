<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace settings</title>
<meta name="viewport" content="width=1280">
<style>
/* Tokens from tokens.css, inlined so the file is self-contained */
:root {
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --white: #FFFFFF;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-caps: 0.1em;
  --tracking-label: 0.14em;
  --text-display-xl: clamp(2rem, 4vw, 3.5rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
  --dur-slow: 320ms;
}
:root { color-scheme: light; }
:root[data-theme="dusk"] {
  color-scheme: dark;
  --paper: #0E1618;
  --sand: #131E21;
  --card: #172327;
  --ink: #E9EFEF;
  --ink-rgb: 233, 239, 239;
  --muted: #9DAEB1;
  --accent-text: #9CC3EA;
  --accent: #6FAAE6;
  --accent-tint: #13283A;
  --accent-line: #2D5B85;
  --on-ink: #0E1618;
  --shadow-rgb: 0, 0, 0;
}

* { box-sizing: border-box; margin: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#component {
  width: 1280px;
  min-height: 960px;
  padding: var(--space-8) var(--space-8) var(--space-9);
  background: var(--sand);
}

.page {
  width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

h1, h2 {
  font-family: var(--font-display);
  font-weight: 300;
  text-transform: uppercase;
  letter-spacing: var(--tracking-tight);
  line-height: 1.15;
}
h1 {
  font-size: var(--text-display-xl);
  padding-bottom: var(--space-3);
}
h2 { font-size: var(--text-step); }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-6);
  box-shadow: 0 24px 48px -32px rgba(var(--shadow-rgb), 0.25);
}
.card > h2 { margin-bottom: var(--space-5); }

/* General */
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-5);
}
.field { display: flex; flex-direction: column; gap: var(--space-2); }
.field label {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
.field input {
  height: 48px;
  padding: 0 var(--space-4);
  font: inherit;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.field input:hover { border-color: rgba(var(--ink-rgb), 0.4); }
.field input:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-line);
}
.actions { margin-top: var(--space-5); display: flex; justify-content: flex-end; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-5);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 600;
  border: 1px solid var(--ink);
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.btn--fill { background: var(--ink); color: var(--on-ink); }
.btn--fill:hover { background: var(--accent-text); border-color: var(--accent-text); color: var(--white); }
.btn--outline { background: transparent; color: var(--ink); }
.btn--outline:hover { background: var(--ink); color: var(--on-ink); }

/* Notifications */
.switches { list-style: none; padding: 0; }
.switches li + li { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }
.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  min-height: 64px;
  cursor: pointer;
}
.switch span { font-size: var(--text-body); }
.switch input {
  position: absolute;
  opacity: 0;
  width: 44px;
  height: 44px;
  margin: 0;
  cursor: pointer;
}
.track {
  position: relative;
  flex: none;
  width: 44px;
  height: 24px;
  border-radius: var(--radius-pill);
  background: rgba(var(--ink-rgb), 0.35);
  transition: background var(--dur-base) var(--ease);
}
.track::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: var(--radius-pill);
  background: var(--white);
  box-shadow: 0 1px 3px rgba(var(--shadow-rgb), 0.3);
  transition: transform var(--dur-base) var(--ease);
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(20px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 3px; }
.switch-end { position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; }
.switch-end input { inset: 0; }

/* Danger zone */
.danger { border-color: rgba(var(--ink-rgb), 0.4); }
.danger-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}
.danger-row p { color: var(--muted); max-width: 400px; }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1>Workspace settings</h1>

    <section class="card" aria-labelledby="general">
      <h2 id="general">General</h2>
      <div class="fields">
        <div class="field">
          <label for="ws-name">Workspace name</label>
          <input id="ws-name" type="text" value="Harbor Ops">
        </div>
        <div class="field">
          <label for="ws-url">Workspace URL</label>
          <input id="ws-url" type="text" value="harbor.app/ops">
        </div>
      </div>
      <div class="actions">
        <button class="btn btn--fill" type="button">Save Changes</button>
      </div>
    </section>

    <section class="card" aria-labelledby="notifications">
      <h2 id="notifications">Notifications</h2>
      <ul class="switches">
        <li>
          <label class="switch">
            <span>Email me when a request is assigned to me</span>
            <span class="switch-end"><input type="checkbox" role="switch" checked><span class="track" aria-hidden="true"></span></span>
          </label>
        </li>
        <li>
          <label class="switch">
            <span>Weekly summary</span>
            <span class="switch-end"><input type="checkbox" role="switch" checked><span class="track" aria-hidden="true"></span></span>
          </label>
        </li>
        <li>
          <label class="switch">
            <span>Product updates</span>
            <span class="switch-end"><input type="checkbox" role="switch"><span class="track" aria-hidden="true"></span></span>
          </label>
        </li>
      </ul>
    </section>

    <section class="card danger" aria-labelledby="danger">
      <h2 id="danger">Danger zone</h2>
      <div class="danger-row">
        <p>Deleting a workspace removes all of its requests for everyone.</p>
        <button class="btn btn--outline" type="button">Delete Workspace</button>
      </div>
    </section>
  </main>
</div>
</body>
</html>
