<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Harbor</title>
<meta name="viewport" content="width=1280">
<style>
/* Tokens copied from tokens.css (day theme) so this file stays self-contained. */
:root {
  color-scheme: light;
  --paper: #FFFFFF;
  --sand: #EEF4FA;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-8: 64px;
  --radius-sm: 8px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-step: 1.75rem;
  --text-body: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  padding: var(--space-8);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--sand);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component .card {
  width: 400px;
  padding: var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  box-shadow: 0 24px 48px -24px rgba(var(--shadow-rgb), 0.35);
}

#component h1 {
  margin: 0 0 var(--space-5);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  line-height: 1.2;
  letter-spacing: var(--tracking-snug);
  text-transform: uppercase;
}

#component form { display: flex; flex-direction: column; gap: var(--space-5); }

#component .field { display: flex; flex-direction: column; gap: var(--space-2); }
#component .field label { font-weight: 500; }
#component .field input {
  height: 44px;
  padding: 0 var(--space-3);
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--muted);
  border-radius: var(--radius-sm);
  transition: border-color var(--dur-fast) var(--ease);
}
#component .field input:focus { border-color: var(--accent); }

#component .check {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 44px;
  cursor: pointer;
}
#component .check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }

#component .actions { display: flex; flex-direction: column; gap: var(--space-3); }

#component .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 44px;
  padding: 0 var(--space-5);
  font: inherit;
  font-weight: 500;
  color: var(--ink);
  background: none;
  border: 1px solid var(--ink);
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: background-color var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
#component .btn--fill { color: var(--on-ink); background: var(--ink); }
#component .btn:not(.btn--fill):hover { background: var(--accent-tint); }
#component .btn--fill:hover { background: var(--accent); border-color: var(--accent); }

#component .forgot {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  margin-top: var(--space-1);
  color: var(--accent-text);
  text-decoration: underline;
}

#component :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  #component * { transition: none; }
}
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <h1>Sign in to Harbor</h1>
    <form action="#">
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <label class="check">
        <input type="checkbox" name="remember">
        <span>Keep me signed in</span>
      </label>
      <div class="actions">
        <button class="btn btn--fill" type="submit">Sign In</button>
        <button class="btn" type="button">Continue with SSO</button>
      </div>
    </form>
    <a class="forgot" href="#">Forgot Password?</a>
  </main>
</div>
</body>
</html>
