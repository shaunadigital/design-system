<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team</title>
<meta name="viewport" content="width=1280">
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --accent-line: #9CC3EA;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-snug: -0.01em;
  --tracking-caps: 0.1em;
  --text-display-xl: clamp(2rem, 4vw, 3.5rem);
  --text-body-l: 1.125rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; margin: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  -webkit-font-smoothing: antialiased;
}

#component {
  width: 1280px;
  min-height: 800px;
  padding: var(--space-9) var(--space-8);
  background: var(--paper);
}

.page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-8);
}

h1 {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-display-xl);
  line-height: 1.1;
  letter-spacing: var(--tracking-tight);
  text-transform: uppercase;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 var(--space-6);
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  font-weight: 500;
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.btn:hover { opacity: 0.88; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible,
.role select:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 2px;
}

.members {
  list-style: none;
  padding: 0 var(--space-6);
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
}

.member {
  display: flex;
  align-items: center;
  gap: var(--space-5);
  padding: var(--space-5) 0;
}
.member + .member { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }

.avatar {
  flex: none;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  font-family: var(--font-label);
  font-size: var(--text-small);
  font-weight: 600;
  letter-spacing: var(--tracking-caps);
}

.who { flex: 1; min-width: 0; }
.name {
  font-size: var(--text-body-l);
  font-weight: 600;
  letter-spacing: var(--tracking-snug);
  line-height: 1.3;
}
.email {
  margin-top: var(--space-1);
  font-size: var(--text-small);
  color: var(--muted);
}

.role {
  position: relative;
  flex: none;
  width: 160px;
}
.role select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 44px;
  padding: 0 var(--space-6) 0 var(--space-4);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-md);
  background: var(--card);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  cursor: pointer;
  transition: border-color var(--dur-base) var(--ease);
}
.role select:hover { border-color: var(--accent-line); }
.role::after {
  content: "";
  position: absolute;
  right: var(--space-4);
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
</style>
</head>
<body>
<div id="component">
  <header class="page-head">
    <h1>Team</h1>
    <button class="btn" type="button">Invite Member</button>
  </header>

  <ul class="members">
    <li class="member">
      <span class="avatar" aria-hidden="true">MC</span>
      <div class="who">
        <p class="name">Maya Chen</p>
        <p class="email">maya@harbor.app</p>
      </div>
      <div class="role">
        <select aria-label="Role for Maya Chen">
          <option selected>Admin</option>
          <option>Editor</option>
          <option>Viewer</option>
        </select>
      </div>
    </li>
    <li class="member">
      <span class="avatar" aria-hidden="true">LP</span>
      <div class="who">
        <p class="name">Leo Park</p>
        <p class="email">leo@harbor.app</p>
      </div>
      <div class="role">
        <select aria-label="Role for Leo Park">
          <option>Admin</option>
          <option selected>Editor</option>
          <option>Viewer</option>
        </select>
      </div>
    </li>
    <li class="member">
      <span class="avatar" aria-hidden="true">AR</span>
      <div class="who">
        <p class="name">Ana Ruiz</p>
        <p class="email">ana@harbor.app</p>
      </div>
      <div class="role">
        <select aria-label="Role for Ana Ruiz">
          <option>Admin</option>
          <option selected>Editor</option>
          <option>Viewer</option>
        </select>
      </div>
    </li>
    <li class="member">
      <span class="avatar" aria-hidden="true">SI</span>
      <div class="who">
        <p class="name">Sam Ito</p>
        <p class="email">sam@harbor.app</p>
      </div>
      <div class="role">
        <select aria-label="Role for Sam Ito">
          <option>Admin</option>
          <option>Editor</option>
          <option selected>Viewer</option>
        </select>
      </div>
    </li>
    <li class="member">
      <span class="avatar" aria-hidden="true">KL</span>
      <div class="who">
        <p class="name">Kai Lee</p>
        <p class="email">kai@harbor.app</p>
      </div>
      <div class="role">
        <select aria-label="Role for Kai Lee">
          <option>Admin</option>
          <option>Editor</option>
          <option selected>Viewer</option>
        </select>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
