<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing</title>
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-pill: 999px;
  --radius-card: 16px;
  --tracking-label: 0.14em;
  --tracking-tight: -0.02em;
  --text-heading: 2.875rem;
  --text-step: 1.75rem;
  --text-hero: 3rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

h1, h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  text-transform: uppercase;
  line-height: 1.1;
}
h1 { font-size: var(--text-heading); letter-spacing: var(--tracking-tight); }
h2 { font-size: var(--text-step); letter-spacing: var(--tracking-tight); }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

.plan {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-6);
}
.plan-main { display: flex; flex-direction: column; gap: var(--space-5); flex: 1; }
.plan-head { display: flex; flex-direction: column; gap: var(--space-2); }
.label {
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-text);
}
.price { font-size: var(--text-small); color: var(--muted); margin: 0; }

.seats { display: flex; flex-direction: column; gap: var(--space-2); max-width: 480px; }
.seats p { margin: 0; font-size: var(--text-small); font-weight: 500; }
.bar {
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  overflow: hidden;
}
.bar span {
  display: block;
  width: 72%;
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--accent);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font: inherit;
  font-weight: 600;
  font-size: var(--text-small);
  background: var(--ink);
  color: var(--on-ink);
  border: 1.5px solid var(--ink);
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease);
}
.btn:hover { opacity: 0.86; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.invoices { display: flex; flex-direction: column; gap: var(--space-4); }
table { width: 100%; border-collapse: collapse; font-size: var(--text-small); }
th {
  text-align: left;
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
  height: 44px;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
td {
  height: 52px;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
tbody tr:last-child td { border-bottom: 0; }
td.amount { font-variant-numeric: tabular-nums; font-weight: 500; }
.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  font-size: var(--text-label);
  font-weight: 600;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>Billing</h1>
    </div>

    <section class="card plan" aria-labelledby="plan-title">
      <div class="plan-main">
        <div class="plan-head">
          <span class="label">Current plan</span>
          <h2 id="plan-title">Team plan</h2>
          <p class="price">$24 per seat per month</p>
        </div>
        <div class="seats">
          <p>18 of 25 seats used</p>
          <div class="bar" role="img" aria-label="18 of 25 seats used"><span></span></div>
        </div>
      </div>
      <button class="btn" type="button">Change Plan</button>
    </section>

    <section class="card invoices" aria-labelledby="inv-title">
      <h2 id="inv-title">Invoices</h2>
      <table>
        <thead>
          <tr><th scope="col">Date</th><th scope="col">Amount</th><th scope="col">Status</th></tr>
        </thead>
        <tbody>
          <tr><td>Oct 1, 2026</td><td class="amount">$432.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Sep 1, 2026</td><td class="amount">$432.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Aug 1, 2026</td><td class="amount">$408.00</td><td><span class="pill">Paid</span></td></tr>
          <tr><td>Jul 1, 2026</td><td class="amount">$408.00</td><td><span class="pill">Paid</span></td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
