<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests · Harbor</title>
<meta name="viewport" content="width=1280">
<style>
/* Tokens, copied from tokens.css (day theme) so this file stands alone. */
:root {
  --paper: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent-text: #0263AC;
  --accent: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-lead: 1.375rem;
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  display: flex;
  flex-direction: column;
}

.page {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6) 0;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.page__title {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  letter-spacing: var(--tracking-tight);
  line-height: 1.1;
  text-transform: uppercase;
}

.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-bottom: var(--space-9);
}

.empty__icon {
  width: 72px;
  height: 72px;
  border-radius: var(--radius-pill);
  background: var(--accent-tint);
  color: var(--accent-text);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: var(--space-5);
}

.empty__title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-lead);
  line-height: 1.3;
}

.empty__text {
  font-size: var(--text-body);
  line-height: 1.5;
  color: var(--muted);
  max-width: 360px;
  margin-top: var(--space-3);
}

.empty__actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
  margin-top: var(--space-6);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  text-decoration: none;
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease);
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}
.btn--primary:hover { opacity: 0.88; }

.link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font-weight: 500;
  font-size: var(--text-small);
  color: var(--accent-text);
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
}
.link:hover { text-decoration-thickness: 2px; }

.btn:focus-visible,
.link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1 class="page__title">Requests</h1>

    <section class="empty">
      <div class="empty__icon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 13l2.7-7.1A2 2 0 0 1 7.6 4.6h8.8a2 2 0 0 1 1.9 1.3L21 13"/>
          <path d="M3 13v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5h-5.2a1 1 0 0 0-.9.6 3 3 0 0 1-5.8 0 1 1 0 0 0-.9-.6H3z"/>
        </svg>
      </div>
      <h2 class="empty__title">No requests yet</h2>
      <p class="empty__text">When your team asks for something, it shows up here.</p>
      <div class="empty__actions">
        <a class="btn btn--primary" href="#">Create a Request</a>
        <a class="link" href="#">Import from a spreadsheet</a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
