<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests · Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Tokens used here, copied from tokens.css */
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent: #0263AC;
    --on-ink: #FFFFFF;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --space-9: 96px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
    --text-lead: 1.375rem;
    --text-body: 1rem;
    --text-small: 0.875rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-base: 180ms;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  #component {
    width: 1280px;
    min-height: 720px;
    background: var(--paper);
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: var(--space-7) var(--space-6) 0;
  }

  .page-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .page-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-heading);
    text-transform: uppercase;
    line-height: 1.1;
  }

  .empty {
    margin-top: var(--space-6);
    padding: var(--space-9) var(--space-5);
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .empty-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: var(--text-lead);
  }
  .empty-text {
    margin: var(--space-3) 0 0;
    font-size: var(--text-body);
    color: var(--muted);
  }
  .empty-actions {
    margin-top: var(--space-5);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 20px;
    border-radius: var(--radius-pill);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: var(--text-small);
    text-decoration: none;
    cursor: pointer;
  }
  .btn--primary {
    background: var(--ink);
    color: var(--on-ink);
    border: 0;
  }

  .link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 var(--space-2);
    font-size: var(--text-small);
    font-weight: 500;
    color: var(--accent-text);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .btn:focus-visible, .link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="page-top">
      <h1 class="page-title">Requests</h1>
    </div>

    <section class="empty">
      <h2 class="empty-title">No requests yet</h2>
      <p class="empty-text">When your team asks for something, it shows up here.</p>
      <div class="empty-actions">
        <button class="btn btn--primary" type="button">Create a Request</button>
        <a class="link" href="#import">Import from a spreadsheet</a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
