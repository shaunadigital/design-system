<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New request · Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Tokens from tokens.css, inlined so the file is self-contained. */
:root {
  --paper: #FFFFFF;
  --paper-rgb: 255, 255, 255;
  --sand: #EEF4FA;
  --sand-rgb: 238, 244, 250;
  --card: #FFFFFF;
  --card-rgb: 255, 255, 255;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --muted-rgb: 85, 101, 106;
  --accent-text: #0263AC;
  --accent-text-rgb: 2, 99, 172;
  --accent: #0263AC;
  --accent-rgb: 2, 99, 172;
  --white: #FFFFFF;
  --white-rgb: 255, 255, 255;
  --accent-tint: #E6EFF7;
  --accent-tint-rgb: 230, 239, 247;
  --on-ink: #FFFFFF;
  --on-ink-rgb: 255, 255, 255;
  --shadow-rgb: 11, 20, 22;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--text-body); }

#component { width: 1280px; min-height: 800px; background: var(--paper); }
.page { max-width: 1120px; margin: 0 auto; padding: var(--space-7) var(--space-6) var(--space-9); }

.top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 300; font-size: var(--text-heading); text-transform: uppercase; letter-spacing: var(--tracking-tight); line-height: 1.1; }
.actions { display: flex; align-items: center; gap: var(--space-3); }

.btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: var(--radius-pill); font: 600 var(--text-small) var(--font-body); color: var(--ink); background: none; border: 0; cursor: pointer; transition: background var(--dur-fast) var(--ease); }
.btn--primary { background: var(--ink); color: var(--on-ink); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card { margin-top: var(--space-6); background: var(--card); border: 1px solid rgba(var(--ink-rgb), 0.1); border-radius: var(--radius-card); padding: var(--space-5); }
.card-inner { max-width: 720px; padding: var(--space-5) var(--space-4); }

.field { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.field + .field, .field + .row { margin-top: var(--space-5); }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); }
.row .field + .field { margin-top: 0; }

label { font-family: var(--font-label); font-weight: 500; font-size: var(--text-label); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted); }

input, select, textarea { width: 100%; font: inherit; font-size: var(--text-body); color: var(--ink); background: var(--white); border: 1px solid rgba(var(--ink-rgb), 0.2); border-radius: var(--radius-md); height: 44px; padding: 0 12px; margin: 0; }
textarea { height: 112px; padding: 10px 12px; resize: none; line-height: 1.5; }
::placeholder { color: var(--muted); opacity: 1; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }

.select { position: relative; }
.select select { appearance: none; -webkit-appearance: none; padding-right: 40px; }
.select::after { content: ""; position: absolute; right: 16px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>New request</h1>
      <div class="actions">
        <button class="btn" type="button">Cancel</button>
        <button class="btn btn--primary" type="submit" form="new-request">Create Request</button>
      </div>
    </div>

    <section class="card">
      <form class="card-inner" id="new-request" action="#">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" placeholder="Short summary of the request">
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Add the details a teammate needs"></textarea>
        </div>

        <div class="row">
          <div class="field">
            <label for="priority">Priority</label>
            <div class="select">
              <select id="priority" name="priority">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="assignee">Assignee</label>
            <div class="select">
              <select id="assignee" name="assignee">
                <option>Maya Chen</option>
                <option>Leo Park</option>
                <option>Ana Ruiz</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="due">Due date</label>
            <input id="due" name="due" type="date">
          </div>
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
