<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New request · Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Tokens from tokens.css (day theme) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--text-body); }

#component { width: 1280px; min-height: 100vh; background: var(--paper); padding: var(--space-7) var(--space-6); }
.page { max-width: 1120px; margin: 0 auto; }

.top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 300; font-size: var(--text-heading); text-transform: uppercase; line-height: 1.1; }
.actions { display: flex; align-items: center; gap: var(--space-3); }

.btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: var(--radius-pill); font-family: var(--font-body); font-weight: 600; font-size: var(--text-small); color: var(--ink); cursor: pointer; transition: opacity var(--dur-base) var(--ease); }
.btn--primary { background: var(--ink); color: var(--on-ink); border: 0; }
.btn--quiet { background: none; border: 0; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card { margin-top: var(--space-6); background: var(--card); border: 1px solid rgba(var(--ink-rgb), 0.1); border-radius: var(--radius-card); padding: var(--space-5); }
form { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); }
.field { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.field--wide { grid-column: 1 / -1; }
label { font-family: var(--font-label); font-weight: 500; font-size: var(--text-label); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted); }

input, select, textarea { width: 100%; font: inherit; font-size: var(--text-body); color: var(--ink); background: var(--paper); height: 44px; padding: 0 12px; border: 1px solid rgba(var(--ink-rgb), 0.2); border-radius: var(--radius-md); }
textarea { height: 112px; padding: 10px 12px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
</style>
</head>
<body>
<div id="component">
  <div class="page">
    <div class="top">
      <h1>New request</h1>
      <div class="actions">
        <button type="button" class="btn btn--quiet">Cancel</button>
        <button type="button" class="btn btn--primary">Create Request</button>
      </div>
    </div>

    <div class="card">
      <form>
        <div class="field field--wide">
          <label for="title">Title</label>
          <input id="title" type="text">
        </div>
        <div class="field field--wide">
          <label for="description">Description</label>
          <textarea id="description"></textarea>
        </div>
        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
        </div>
        <div class="field">
          <label for="assignee">Assignee</label>
          <select id="assignee">
            <option>Maya Chen</option>
            <option>Leo Park</option>
            <option>Ana Ruiz</option>
          </select>
        </div>
        <div class="field">
          <label for="due">Due date</label>
          <input id="due" type="date">
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
