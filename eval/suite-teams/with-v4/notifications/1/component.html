<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications · Harbor</title>
<meta name="viewport" content="width=1280">
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-snug: -0.01em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  padding: var(--space-7) var(--space-6) var(--space-9, 96px);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  padding-bottom: var(--space-4);
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
  letter-spacing: var(--tracking-snug);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--radius-pill);
  font: 600 var(--text-small)/1 var(--font-body);
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease);
}
.btn--primary { background: var(--ink); color: var(--on-ink); }
.btn--primary:hover { opacity: 0.88; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-3) var(--space-5);
}

.list { list-style: none; margin: 0; padding: 0; }

.item {
  display: grid;
  grid-template-columns: 12px 1fr auto;
  align-items: center;
  column-gap: var(--space-5);
  min-height: 72px;
  padding: var(--space-3) 0;
  font-size: var(--text-body);
  line-height: 1.4;
}
.item + .item { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }

.dot { width: 8px; height: 8px; border-radius: 50%; }
.item--unread .dot { background: var(--accent); }

.text { color: var(--muted); font-weight: 400; }
.item--unread .text { color: var(--ink); font-weight: 600; }

.time { font-size: var(--text-small); color: var(--muted); white-space: nowrap; }
.item--unread .time { color: var(--accent-text); font-weight: 600; }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>Notifications</h1>
      <button class="btn btn--primary" type="button">Mark All as Read</button>
    </div>

    <section class="card">
      <ul class="list">
        <li class="item item--unread">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Leo Park approved Q4 travel budget</span>
          <span class="time">2h ago</span>
        </li>
        <li class="item item--unread">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Maya Chen assigned you Laptop refresh for design</span>
          <span class="time">3h ago</span>
        </li>
        <li class="item item--unread">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Your weekly summary is ready</span>
          <span class="time">1d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Ana Ruiz commented on VPN access for contractors</span>
          <span class="time">1d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Sam Ito joined Harbor Ops</span>
          <span class="time">2d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Billing details were updated</span>
          <span class="time">3d ago</span>
        </li>
      </ul>
    </section>
  </main>
</div>
</body>
</html>
