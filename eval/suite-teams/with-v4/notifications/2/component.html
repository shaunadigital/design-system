<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor Notifications</title>
<style>
/* Tokens from tokens.css (day theme, only the ones used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-small: 0.875rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  line-height: 1.1;
  text-transform: uppercase;
}

.btn {
  display: inline-flex;
  align-items: center;
  height: 44px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--radius-pill);
  font: inherit;
  font-weight: 600;
  font-size: var(--text-small);
  background: var(--ink);
  color: var(--on-ink);
  cursor: pointer;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: 0 var(--space-5);
}

.list { list-style: none; margin: 0; padding: 0; }

.item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  height: 52px;
  font-size: var(--text-small);
  border-top: 1px solid rgba(var(--ink-rgb), 0.1);
}
.item:first-child { border-top: 0; }

.dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: transparent;
}
.unread .dot { background: var(--accent); }
.unread .text { font-weight: 600; }

.text { flex: 1; color: var(--ink); }
.time { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>Notifications</h1>
      <button class="btn" type="button">Mark All as Read</button>
    </div>

    <div class="card">
      <ul class="list">
        <li class="item unread">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Leo Park approved Q4 travel budget</span>
          <span class="time">2h ago</span>
        </li>
        <li class="item unread">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Maya Chen assigned you Laptop refresh for design</span>
          <span class="time">3h ago</span>
        </li>
        <li class="item unread">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Your weekly summary is ready</span>
          <span class="time">1d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Ana Ruiz commented on VPN access for contractors</span>
          <span class="time">1d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Sam Ito joined Harbor Ops</span>
          <span class="time">2d ago</span>
        </li>
        <li class="item">
          <span class="dot" aria-hidden="true"></span>
          <span class="text">Billing details were updated</span>
          <span class="time">3d ago</span>
        </li>
      </ul>
    </div>
  </main>
</div>
</body>
</html>
