<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor: Connect your tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Tokens copied from tokens.css (day theme), only the ones this screen uses */
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent: #0263AC;
    --on-ink: #FFFFFF;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-label: 0.14em;
    --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-base: 180ms;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); }

  #component {
    width: 1280px;
    min-height: 720px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: var(--space-7) var(--space-6);
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .step {
    margin: 0;
    font-weight: 500;
    font-size: var(--text-label);
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--muted);
  }

  .intro { display: flex; flex-direction: column; gap: var(--space-3); }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-heading);
    text-transform: uppercase;
    line-height: 1.15;
  }

  .lead { margin: 0; color: var(--muted); font-size: var(--text-body); }

  .options { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-4); }

  .option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-5);
    padding: var(--space-5);
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
  }

  .option h2 { margin: 0; font-size: var(--text-body); font-weight: 600; }
  .option p { margin: var(--space-2) 0 0; font-size: var(--text-small); color: var(--muted); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 20px;
    border-radius: var(--radius-pill);
    border: 1.5px solid transparent;
    background: none;
    color: var(--ink);
    font: 600 var(--text-small) var(--font-body);
    cursor: pointer;
    transition: opacity var(--dur-base) var(--ease);
  }
  .btn:hover { opacity: 0.8; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn--primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .btn--secondary { border-color: var(--ink); }
  .btn--quiet { border-color: transparent; }

  .actions { display: flex; justify-content: flex-end; gap: var(--space-3); }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="intro">
      <p class="step">Step 2 of 4</p>
      <h1>Connect your tools</h1>
      <p class="lead">Harbor works best with the tools your team already uses.</p>
    </div>

    <ul class="options">
      <li class="option">
        <div>
          <h2>Slack</h2>
          <p>Get request updates in your channels</p>
        </div>
        <button type="button" class="btn btn--secondary">Connect</button>
      </li>
      <li class="option">
        <div>
          <h2>Google Calendar</h2>
          <p>See due dates on your calendar</p>
        </div>
        <button type="button" class="btn btn--secondary">Connect</button>
      </li>
      <li class="option">
        <div>
          <h2>Jira</h2>
          <p>Link requests to engineering tickets</p>
        </div>
        <button type="button" class="btn btn--secondary">Connect</button>
      </li>
    </ul>

    <div class="actions">
      <button type="button" class="btn btn--quiet">Skip for Now</button>
      <button type="button" class="btn btn--primary">Continue</button>
    </div>
  </main>
</div>
</body>
</html>
