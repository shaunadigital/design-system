<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace settings</title>
<meta name="viewport" content="width=1280">
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --tracking-snug: -0.01em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  padding: var(--space-7) var(--space-6);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
}

.page-title {
  margin: 0 0 var(--space-6);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  text-transform: uppercase;
  letter-spacing: var(--tracking-snug);
  line-height: 1.1;
}

.sections {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

.card h2 {
  margin: 0 0 var(--space-5);
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-step);
  text-transform: uppercase;
  line-height: 1.2;
}

.field + .field { margin-top: var(--space-5); }

.field label {
  display: block;
  margin-bottom: var(--space-2);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}

.field input {
  display: block;
  width: 100%;
  max-width: 480px;
  height: 44px;
  padding: 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
}
.field input::placeholder { color: var(--muted); }
.field input:focus { outline: 2px solid var(--accent); outline-offset: 0; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-small);
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}
.btn--secondary {
  background: none;
  color: var(--ink);
  border: 1.5px solid var(--ink);
}
.card .btn--primary { margin-top: var(--space-5); }

.switches { list-style: none; margin: 0; padding: 0; }
.switches li + li { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  min-height: 52px;
  cursor: pointer;
  font-size: var(--text-body);
}

.switch {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  flex: none;
  width: 44px;
  height: 44px;
  margin: 0;
  background: none;
  border: 0;
  cursor: pointer;
}
.switch::before {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  width: 44px;
  height: 24px;
  border-radius: var(--radius-pill);
  border: 1.5px solid var(--muted);
  background: var(--paper);
  transition: background var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.switch::after {
  content: "";
  position: absolute;
  left: 5px;
  top: 15px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform var(--dur-base) var(--ease), background var(--dur-base) var(--ease);
}
.switch:checked::before { background: var(--ink); border-color: var(--ink); }
.switch:checked::after { background: var(--on-ink); transform: translateX(20px); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-radius: var(--radius-md); }

.danger-text {
  margin: 0 0 var(--space-5);
  font-size: var(--text-body);
  color: var(--muted);
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <h1 class="page-title">Workspace settings</h1>

    <div class="sections">
      <section class="card" aria-labelledby="general-title">
        <h2 id="general-title">General</h2>
        <div class="field">
          <label for="workspace-name">Workspace name</label>
          <input id="workspace-name" type="text" value="Harbor Ops">
        </div>
        <div class="field">
          <label for="workspace-url">Workspace URL</label>
          <input id="workspace-url" type="text" value="harbor.app/ops">
        </div>
        <button class="btn btn--primary" type="button">Save Changes</button>
      </section>

      <section class="card" aria-labelledby="notifications-title">
        <h2 id="notifications-title">Notifications</h2>
        <ul class="switches">
          <li>
            <label class="switch-row">
              <span>Email me when a request is assigned to me</span>
              <input class="switch" type="checkbox" role="switch" checked>
            </label>
          </li>
          <li>
            <label class="switch-row">
              <span>Weekly summary</span>
              <input class="switch" type="checkbox" role="switch">
            </label>
          </li>
          <li>
            <label class="switch-row">
              <span>Product updates</span>
              <input class="switch" type="checkbox" role="switch">
            </label>
          </li>
        </ul>
      </section>

      <section class="card" aria-labelledby="danger-title">
        <h2 id="danger-title">Danger zone</h2>
        <p class="danger-text">Deleting a workspace removes all of its requests for everyone.</p>
        <button class="btn btn--secondary" type="button">Delete Workspace</button>
      </section>
    </div>
  </main>
</div>
</body>
</html>
