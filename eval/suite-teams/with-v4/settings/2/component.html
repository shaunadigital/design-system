<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Tokens from tokens.css (day theme), inlined so the file is self-contained */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-2: 8px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-tight: -0.02em;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--text-body); -webkit-font-smoothing: antialiased; }

#component { width: 1280px; min-height: 100vh; margin: 0 auto; background: var(--paper); }
.page { max-width: 1120px; margin: 0 auto; padding: var(--space-7) var(--space-6); }

.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-6); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 300; font-size: var(--text-heading); line-height: 1.1; letter-spacing: var(--tracking-tight); text-transform: uppercase; }

.stack { display: flex; flex-direction: column; gap: var(--space-6); }
.card { background: var(--card); border: 1px solid rgba(var(--ink-rgb), 0.1); border-radius: var(--radius-card); padding: var(--space-5); }
h2 { margin: 0 0 var(--space-5); font-family: var(--font-display); font-weight: 300; font-size: var(--text-step); line-height: 1.2; letter-spacing: var(--tracking-tight); text-transform: uppercase; }

/* Fields */
.fields { display: flex; flex-direction: column; gap: var(--space-5); max-width: 560px; }
.field label { display: block; margin-bottom: var(--space-2); font-family: var(--font-body); font-weight: 500; font-size: var(--text-label); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted); }
.field input { display: block; width: 100%; height: 44px; padding: 0 12px; font: inherit; font-size: var(--text-body); color: var(--ink); background: var(--paper); border: 1px solid rgba(var(--ink-rgb), 0.2); border-radius: var(--radius-md); transition: border-color var(--dur-fast) var(--ease); }
.field input::placeholder { color: var(--muted); }
.field input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }

.actions { margin-top: var(--space-5); display: flex; }

/* Buttons: one size, 44px pills */
.btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: var(--radius-pill); font-family: var(--font-body); font-weight: 600; font-size: var(--text-small); line-height: 1; cursor: pointer; transition: opacity var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
.btn--primary { background: var(--ink); color: var(--on-ink); border: 1.5px solid var(--ink); }
.btn--primary:hover { opacity: 0.88; }
.btn--secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.btn--secondary:hover { background: rgba(var(--ink-rgb), 0.06); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Switches */
.rows { margin: 0; padding: 0; list-style: none; }
.rows li + li { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); min-height: 64px; cursor: pointer; }
.row-text { font-size: var(--text-body); color: var(--ink); }
.switch { position: relative; flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.track { position: relative; width: 44px; height: 24px; border-radius: var(--radius-pill); background: rgba(var(--ink-rgb), 0.25); transition: background var(--dur-base) var(--ease); pointer-events: none; }
.track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px rgba(var(--ink-rgb), 0.3); transition: transform var(--dur-base) var(--ease); }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(20px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Danger zone */
.danger { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); }
.danger p { margin: 0; font-size: var(--text-body); color: var(--muted); }
.danger-card h2 { margin-bottom: var(--space-4); }
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>Workspace settings</h1>
    </div>

    <div class="stack">
      <section class="card" aria-labelledby="general-title">
        <h2 id="general-title">General</h2>
        <form>
          <div class="fields">
            <div class="field">
              <label for="ws-name">Workspace name</label>
              <input id="ws-name" type="text" value="Harbor Ops">
            </div>
            <div class="field">
              <label for="ws-url">Workspace URL</label>
              <input id="ws-url" type="text" value="harbor.app/ops">
            </div>
          </div>
          <div class="actions">
            <button class="btn btn--primary" type="button">Save Changes</button>
          </div>
        </form>
      </section>

      <section class="card" aria-labelledby="notif-title">
        <h2 id="notif-title">Notifications</h2>
        <ul class="rows">
          <li>
            <label class="row">
              <span class="row-text">Email me when a request is assigned to me</span>
              <span class="switch"><input type="checkbox" role="switch" checked><span class="track"></span></span>
            </label>
          </li>
          <li>
            <label class="row">
              <span class="row-text">Weekly summary</span>
              <span class="switch"><input type="checkbox" role="switch" checked><span class="track"></span></span>
            </label>
          </li>
          <li>
            <label class="row">
              <span class="row-text">Product updates</span>
              <span class="switch"><input type="checkbox" role="switch"><span class="track"></span></span>
            </label>
          </li>
        </ul>
      </section>

      <section class="card danger-card" aria-labelledby="danger-title">
        <h2 id="danger-title">Danger zone</h2>
        <div class="danger">
          <p>Deleting a workspace removes all of its requests for everyone.</p>
          <button class="btn btn--secondary" type="button">Delete Workspace</button>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
