<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Tokens copied from tokens.css (light theme), only the ones this screen uses */
  :root {
    color-scheme: light;
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #0B1416;
    --ink-rgb: 11, 20, 22;
    --muted: #55656A;
    --accent-text: #0263AC;
    --accent: #0263AC;
    --on-ink: #FFFFFF;
    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
    --font-label: 'Archivo', system-ui, sans-serif;
    --space-2: 8px;
    --space-3: 12px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --radius-md: 12px;
    --radius-card: 16px;
    --radius-pill: 999px;
    --tracking-label: 0.14em;
    --text-step: clamp(1.375rem, 1.9vw, 1.75rem);
    --text-body: 1rem;
    --text-small: 0.875rem;
    --text-label: 0.75rem;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur-base: 180ms;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: var(--space-7) var(--space-6);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .card {
    width: 400px;
    padding: var(--space-6);
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.1);
    border-radius: var(--radius-card);
  }

  h1 {
    margin: 0 0 var(--space-5);
    font-family: var(--font-display);
    font-weight: 300;
    font-size: var(--text-step);
    text-transform: uppercase;
    line-height: 1.2;
  }

  form { display: flex; flex-direction: column; gap: var(--space-5); }

  .field { display: flex; flex-direction: column; gap: var(--space-2); }

  label.lbl {
    font-family: var(--font-label);
    font-weight: 500;
    font-size: var(--text-label);
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--muted);
  }

  input[type="email"],
  input[type="password"] {
    height: 44px;
    padding: 0 12px;
    font: inherit;
    font-size: var(--text-body);
    color: var(--ink);
    background: var(--card);
    border: 1px solid rgba(var(--ink-rgb), 0.2);
    border-radius: var(--radius-md);
  }
  input::placeholder { color: var(--muted); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; }

  .keep {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-height: 44px;
    font-size: var(--text-body);
    cursor: pointer;
  }
  .keep input { width: 20px; height: 20px; margin: 0; accent-color: var(--ink); }
  .keep input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 44px;
    padding: 0 20px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: var(--text-small);
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: opacity var(--dur-base) var(--ease);
  }
  .btn:hover { opacity: 0.88; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn--primary { background: var(--ink); color: var(--on-ink); border: 0; }
  .btn--secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }

  .buttons { display: flex; flex-direction: column; gap: var(--space-3); }

  .forgot {
    align-self: center;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-size: var(--text-small);
    font-weight: 500;
    color: var(--accent-text);
    text-decoration: underline;
  }
  .forgot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>
<div id="component">
  <main class="card">
    <h1>Sign in to Harbor</h1>
    <form action="#">
      <div class="field">
        <label class="lbl" for="email">Work email</label>
        <input id="email" type="email" name="email" autocomplete="username">
      </div>
      <div class="field">
        <label class="lbl" for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password">
      </div>
      <label class="keep"><input type="checkbox" name="remember"> Keep me signed in</label>
      <div class="buttons">
        <button class="btn btn--primary" type="submit">Sign In</button>
        <button class="btn btn--secondary" type="button">Continue with SSO</button>
      </div>
      <a class="forgot" href="#">Forgot Password?</a>
    </form>
  </main>
</div>
</body>
</html>
