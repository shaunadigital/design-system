<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team · Harbor</title>
<meta name="viewport" content="width=1280">
<style>
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --accent-text: #0263AC;
  --accent-tint: #E6EFF7;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-label: 'Archivo', system-ui, sans-serif;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }

#component {
  width: 1280px;
  min-height: 800px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  padding: var(--space-7) 0;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  text-transform: uppercase;
  line-height: 1.1;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font: inherit;
  font-weight: 600;
  font-size: var(--text-small);
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease);
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}
.btn--primary:hover { opacity: 0.88; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

.list { list-style: none; margin: 0; padding: 0; }

.row {
  display: grid;
  grid-template-columns: 1.1fr 1.4fr 200px;
  column-gap: var(--space-5);
  align-items: center;
  min-height: 52px;
  font-size: var(--text-small);
}
.row + .row { border-top: 1px solid rgba(var(--ink-rgb), 0.1); }
.row--head {
  font-family: var(--font-label);
  font-weight: 500;
  font-size: var(--text-label);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
}
.name { font-weight: 600; color: var(--ink); }
.email { color: var(--muted); }

.select {
  position: relative;
  width: 200px;
  justify-self: start;
  margin: var(--space-2) 0;
}
.select select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 44px;
  padding: 0 40px 0 12px;
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
  cursor: pointer;
}
.select select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.select::after {
  content: "";
  position: absolute;
  right: 16px;
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--ink);
  border-bottom: 1.5px solid var(--ink);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>Team</h1>
      <button class="btn btn--primary" type="button">Invite Member</button>
    </div>

    <section class="card" aria-label="Team members">
      <div class="row row--head" aria-hidden="true">
        <span>Name</span>
        <span>Email</span>
        <span>Role</span>
      </div>
      <ul class="list">
        <li class="row">
          <span class="name" data-user-content>Maya Chen</span>
          <span class="email">maya@harbor.app</span>
          <label class="select">
            <select aria-label="Role for Maya Chen">
              <option selected>Admin</option>
              <option>Editor</option>
              <option>Viewer</option>
            </select>
          </label>
        </li>
        <li class="row">
          <span class="name" data-user-content>Leo Park</span>
          <span class="email">leo@harbor.app</span>
          <label class="select">
            <select aria-label="Role for Leo Park">
              <option>Admin</option>
              <option selected>Editor</option>
              <option>Viewer</option>
            </select>
          </label>
        </li>
        <li class="row">
          <span class="name" data-user-content>Ana Ruiz</span>
          <span class="email">ana@harbor.app</span>
          <label class="select">
            <select aria-label="Role for Ana Ruiz">
              <option>Admin</option>
              <option selected>Editor</option>
              <option>Viewer</option>
            </select>
          </label>
        </li>
        <li class="row">
          <span class="name" data-user-content>Sam Ito</span>
          <span class="email">sam@harbor.app</span>
          <label class="select">
            <select aria-label="Role for Sam Ito">
              <option>Admin</option>
              <option>Editor</option>
              <option selected>Viewer</option>
            </select>
          </label>
        </li>
        <li class="row">
          <span class="name" data-user-content>Kai Lee</span>
          <span class="email">kai@harbor.app</span>
          <label class="select">
            <select aria-label="Role for Kai Lee">
              <option>Admin</option>
              <option>Editor</option>
              <option selected>Viewer</option>
            </select>
          </label>
        </li>
      </ul>
    </section>
  </main>
</div>
</body>
</html>
