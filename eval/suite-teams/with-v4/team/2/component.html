<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor Team</title>
<meta name="viewport" content="width=1280">
<style>
/* tokens.css (light theme, subset used here) */
:root {
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0B1416;
  --ink-rgb: 11, 20, 22;
  --muted: #55656A;
  --accent: #0263AC;
  --on-ink: #FFFFFF;
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-md: 12px;
  --radius-card: 16px;
  --radius-pill: 999px;
  --tracking-label: 0.14em;
  --text-heading: clamp(1.75rem, 3.2vw, 2.875rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-label: 0.75rem;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-base: 180ms;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
}

#component {
  width: 1280px;
  min-height: 720px;
  background: var(--paper);
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.top h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-heading);
  text-transform: uppercase;
  line-height: 1.1;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  font: 600 var(--text-small) var(--font-body);
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease);
}
.btn--primary {
  background: var(--ink);
  color: var(--on-ink);
  border: 0;
}

.card {
  background: var(--card);
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-small);
}
th {
  height: 52px;
  padding: 0 var(--space-3);
  text-align: left;
  font: 500 var(--text-label) var(--font-body);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
td {
  height: 52px;
  padding: 0 var(--space-3);
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1);
}
tr:last-child td { border-bottom: 0; }
td.name { font-weight: 600; width: 30%; }
td.email { color: var(--muted); }
th.role, td.role { width: 200px; }

select {
  font: inherit;
  font-size: var(--text-body);
  color: var(--ink);
  background: var(--paper);
  width: 100%;
  height: 44px;
  padding: 0 var(--space-3);
  border: 1px solid rgba(var(--ink-rgb), 0.2);
  border-radius: var(--radius-md);
}
select:focus-visible, .btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
</style>
</head>
<body>
<div id="component">
  <main class="page">
    <div class="top">
      <h1>Team</h1>
      <button class="btn btn--primary" type="button">Invite Member</button>
    </div>

    <section class="card" aria-label="Members">
      <table>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col" class="role">Role</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="name">Maya Chen</td>
            <td class="email">maya@harbor.app</td>
            <td class="role">
              <select aria-label="Role for Maya Chen">
                <option selected>Admin</option>
                <option>Editor</option>
                <option>Viewer</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="name">Leo Park</td>
            <td class="email">leo@harbor.app</td>
            <td class="role">
              <select aria-label="Role for Leo Park">
                <option>Admin</option>
                <option selected>Editor</option>
                <option>Viewer</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="name">Ana Ruiz</td>
            <td class="email">ana@harbor.app</td>
            <td class="role">
              <select aria-label="Role for Ana Ruiz">
                <option>Admin</option>
                <option selected>Editor</option>
                <option>Viewer</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="name">Sam Ito</td>
            <td class="email">sam@harbor.app</td>
            <td class="role">
              <select aria-label="Role for Sam Ito">
                <option>Admin</option>
                <option>Editor</option>
                <option selected>Viewer</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="name">Kai Lee</td>
            <td class="email">kai@harbor.app</td>
            <td class="role">
              <select aria-label="Role for Kai Lee">
                <option>Admin</option>
                <option>Editor</option>
                <option selected>Viewer</option>
              </select>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
