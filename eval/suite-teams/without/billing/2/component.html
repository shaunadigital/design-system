<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Billing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; }
  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 72px 120px 96px;
    background: #fff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #component h1,
  #component h2 {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    text-transform: uppercase;
    margin: 0;
    color: #0B1416;
  }
  #component h1 {
    font-size: 36px;
    line-height: 1.2;
    letter-spacing: 0.04em;
    padding-bottom: 32px;
    margin-bottom: 40px;
    border-bottom: 1px solid rgba(11, 20, 22, 0.12);
  }
  #component h2 {
    font-size: 16px;
    letter-spacing: 0.08em;
    margin-bottom: 24px;
  }

  .plan {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 48px;
    padding: 36px 40px;
    margin-bottom: 56px;
    background: #fff;
    border: 1px solid rgba(11, 20, 22, 0.14);
    border-left: 4px solid #0263AC;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(11, 20, 22, 0.04), 0 8px 24px rgba(11, 20, 22, 0.06);
  }
  .plan-info { flex: 1; }
  .plan-name {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.2;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .plan-price {
    margin: 0 0 24px;
    font-size: 17px;
    color: #0B1416;
  }
  .seats { max-width: 420px; }
  .seats-label {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 500;
  }
  .bar {
    height: 8px;
    border-radius: 999px;
    background: rgba(2, 99, 172, 0.14);
    overflow: hidden;
  }
  .bar span {
    display: block;
    width: 72%;
    height: 100%;
    border-radius: 999px;
    background: #0263AC;
  }
  .btn {
    appearance: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #0263AC;
    border: 2px solid #0263AC;
    border-radius: 8px;
    padding: 12px 24px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(11, 20, 22, 0.15);
  }
  .btn:hover { background: #024f89; border-color: #024f89; }
  .btn:focus-visible { outline: 3px solid #0B1416; outline-offset: 3px; }

  .invoices {
    border: 1px solid rgba(11, 20, 22, 0.14);
    border-radius: 12px;
    padding: 32px 40px 16px;
    box-shadow: 0 1px 2px rgba(11, 20, 22, 0.04);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 16px 0; text-align: left; }
  th {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #0B1416;
    border-bottom: 2px solid #0B1416;
  }
  td { border-bottom: 1px solid rgba(11, 20, 22, 0.1); font-size: 16px; }
  tr:last-child td { border-bottom: 0; }
  th:nth-child(2), td:nth-child(2) { text-align: right; padding-right: 96px; width: 30%; font-variant-numeric: tabular-nums; }
  th:nth-child(3), td:nth-child(3) { width: 25%; }
  .status {
    display: inline-block;
    padding: 2px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: #0263AC;
    background: rgba(2, 99, 172, 0.1);
    border: 1px solid rgba(2, 99, 172, 0.35);
  }
</style>
</head>
<body>
<div id="component">
  <h1>Billing</h1>

  <section class="plan" aria-label="Current plan">
    <div class="plan-info">
      <p class="plan-name">Team plan</p>
      <p class="plan-price">$24 per seat per month</p>
      <div class="seats">
        <p class="seats-label">18 of 25 seats used</p>
        <div class="bar" role="presentation"><span></span></div>
      </div>
    </div>
    <button class="btn" type="button">Change Plan</button>
  </section>

  <section class="invoices" aria-labelledby="invoices-title">
    <h2 id="invoices-title">Invoices</h2>
    <table>
      <thead>
        <tr><th scope="col">Date</th><th scope="col">Amount</th><th scope="col">Status</th></tr>
      </thead>
      <tbody>
        <tr><td>Oct 1, 2026</td><td>$432.00</td><td><span class="status">Paid</span></td></tr>
        <tr><td>Sep 1, 2026</td><td>$432.00</td><td><span class="status">Paid</span></td></tr>
        <tr><td>Aug 1, 2026</td><td>$408.00</td><td><span class="status">Paid</span></td></tr>
        <tr><td>Jul 1, 2026</td><td>$408.00</td><td><span class="status">Paid</span></td></tr>
      </tbody>
    </table>
  </section>
</div>
</body>
</html>
