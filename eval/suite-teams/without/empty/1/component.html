<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests · Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    color: #0B1416;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #component {
    width: 1280px;
    min-height: 800px;
    margin: 0 auto;
    padding: 96px 96px 120px;
    background: #ffffff;
    display: flex;
    flex-direction: column;
  }

  .page-heading {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 32px;
    line-height: 1.2;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding-bottom: 32px;
    border-bottom: 1px solid rgba(11, 20, 22, 0.12);
  }

  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-top: 112px;
  }

  .mark {
    width: 72px;
    height: 72px;
    margin-bottom: 40px;
  }

  .empty-title {
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 24px;
    line-height: 1.3;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .empty-text {
    margin-top: 16px;
    max-width: 360px;
    font-size: 17px;
    line-height: 1.6;
    color: #3d4a4d;
  }

  .actions {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .button {
    display: inline-block;
    padding: 16px 32px;
    background: #0263AC;
    color: #ffffff;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.01em;
    text-decoration: none;
    border-radius: 999px;
  }
  .button:hover { background: #02548f; }
  .button:focus-visible,
  .link:focus-visible {
    outline: 3px solid #0263AC;
    outline-offset: 4px;
  }

  .link {
    color: #0263AC;
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 5px;
  }
  .link:hover { text-decoration-thickness: 2px; }
</style>
</head>
<body>
  <div id="component">
    <h1 class="page-heading">Requests</h1>

    <main class="empty">
      <svg class="mark" viewBox="0 0 72 72" fill="none" aria-hidden="true">
        <circle cx="36" cy="36" r="35" stroke="#0B1416" stroke-opacity="0.12"/>
        <path d="M20 38h9l3 5h8l3-5h9" stroke="#0263AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 38l5-12h22l5 12v10a2 2 0 0 1-2 2H22a2 2 0 0 1-2-2V38z" stroke="#0263AC" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>

      <h2 class="empty-title">No requests yet</h2>
      <p class="empty-text">When your team asks for something, it shows up here.</p>

      <div class="actions">
        <a class="button" href="#">Create a Request</a>
        <a class="link" href="#">Import from a spreadsheet</a>
      </div>
    </main>
  </div>
</body>
</html>
