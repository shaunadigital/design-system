<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect your tools</title>
<meta name="viewport" content="width=1280">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }

  #component {
    --ink: #0B1416;
    --accent: #0263AC;
    --muted: #4B5A5E;
    --line: #DDE3E5;
    --tint: #EEF5FB;
    width: 1280px;
    min-height: 800px;
    background: #fff;
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 96px 0 72px;
  }

  #component .progress {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  #component .progress-label {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  #component .progress-bar {
    display: flex;
    gap: 8px;
    list-style: none;
  }
  #component .progress-bar li {
    width: 56px;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
  }
  #component .progress-bar li.done { background: var(--accent); }

  #component h1 {
    margin-top: 40px;
    font-family: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 36px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    text-align: center;
  }
  #component .lead {
    margin-top: 16px;
    font-size: 18px;
    color: var(--muted);
    text-align: center;
  }

  #component .options {
    margin-top: 48px;
    width: 640px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #component .option {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 24px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 1px 2px rgba(11, 20, 22, 0.04), 0 4px 16px rgba(11, 20, 22, 0.04);
  }
  #component .icon {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--tint);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #component .icon svg { width: 24px; height: 24px; }
  #component .text { flex: 1; }
  #component .name {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
  }
  #component .desc {
    margin-top: 2px;
    font-size: 15px;
    color: var(--muted);
  }

  #component button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    line-height: 1;
    height: 44px;
    padding: 0 22px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  #component button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  #component .btn-connect {
    flex: none;
    height: 40px;
    padding: 0 18px;
    background: #fff;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  #component .btn-connect:hover { background: var(--tint); }

  #component .actions {
    margin-top: 40px;
    width: 640px;
    padding-top: 28px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #component .btn-skip {
    background: transparent;
    color: var(--ink);
    border: 1px solid transparent;
    padding: 0 12px;
    margin-left: -12px;
  }
  #component .btn-skip:hover { background: #F2F5F6; }
  #component .btn-continue {
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    padding: 0 32px;
    box-shadow: 0 1px 2px rgba(2, 99, 172, 0.3);
  }
  #component .btn-continue:hover { background: #02548F; border-color: #02548F; }
</style>
</head>
<body>
<main id="component">
  <div class="progress">
    <p class="progress-label">Step 2 of 4</p>
    <ol class="progress-bar" aria-hidden="true">
      <li class="done"></li>
      <li class="done"></li>
      <li></li>
      <li></li>
    </ol>
  </div>

  <h1>Connect your tools</h1>
  <p class="lead">Harbor works best with the tools your team already uses.</p>

  <ul class="options">
    <li class="option">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 3 7 21M17 3l-2 18M4 8.5h17M3 15.5h17"/></svg>
      </span>
      <div class="text">
        <p class="name">Slack</p>
        <p class="desc">Get request updates in your channels</p>
      </div>
      <button type="button" class="btn-connect">Connect</button>
    </li>
    <li class="option">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </span>
      <div class="text">
        <p class="name">Google Calendar</p>
        <p class="desc">See due dates on your calendar</p>
      </div>
      <button type="button" class="btn-connect">Connect</button>
    </li>
    <li class="option">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 11.5 12 20 4 11.5Z"/><path d="M12 8.5l3 3-3 3-3-3Z"/></svg>
      </span>
      <div class="text">
        <p class="name">Jira</p>
        <p class="desc">Link requests to engineering tickets</p>
      </div>
      <button type="button" class="btn-connect">Connect</button>
    </li>
  </ul>

  <div class="actions">
    <button type="button" class="btn-skip">Skip for Now</button>
    <button type="button" class="btn-continue">Continue</button>
  </div>
</main>
</body>
</html>
